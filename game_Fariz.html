                       leftTx: 580, rightTx: 656, ceilRow: 62, hoverRow: 80 };

function startBoss(kind) {
  game.bossActive = true;
  if (kind === 'seraph') {
    const A = SERAPH_ARENA;
    boss = {
      kind: 'seraph',
      x: A.spawnTx * TILE, y: A.floorRow * TILE - 420, w: 56, h: 64,
      vx: 0, vy: 0, face: -1,
      hp: 150, maxhp: 150,             // v1.6: a harder, longer duel
      phase: 1,
      state: 'intro', stateT: 0, t: 0,
      flash: 0, hitSwing: -1, vulnT: 2,
      hitWall: 0, hitFloor: 0, dropThru: 0,
      dead: false, deadT: 0,
      summoned: false, rainN: 0, volley: 1, swoopY: 0, taught: false,
      // v1.6 — the stage cycle
      cycle: 'air',                    // 'air' (sky spam) <-> 'ground' (twin blades)
      airLeft: 5, groundLeft: 5,       // attacks left before the stage turns
      stunT: 0,                        // set by the player's PARRY
      beamN: 0, featherN: 0, combo: 0, parrySuccess: false,
      plungeX: 0, vyP: 0,
    };
    solid(A.gateTx, 96, 2, 9);
    game.gateRect = { x: A.gateTx, y: 96, w: 2, h: 9 };
    showMsg('THE ASHEN SERAPH');
  } else {
    const A = WARDEN_ARENA;
    boss = {
      kind: 'warden',
      x: A.spawnTx * TILE, y: A.floorRow * TILE - 110, w: 48, h: 110,
      vx: 0, vy: 0, face: -1,
      hp: 100, maxhp: 100,
      phase: 1,
      state: 'intro', stateT: 0, t: 0,
      flash: 0, hitSwing: -1, vulnT: 0,
      hitWall: 0, hitFloor: 0, dropThru: 0,
      dead: false, deadT: 0,
      summoned: false,
      stunT: 0,                        // v1.6: set by the player's PARRY
    };
    solid(A.gateTx, 96, 2, 9);
    game.gateRect = { x: A.gateTx, y: 96, w: 2, h: 9 };
    showMsg('THE PALE WARDEN');
  }
  game.gateClosed = true;
  SND.gate();
  SND.setBoss(true);
  SND.roar();
  cam.shake = 10;
}

/* -- v1.6: PARRY STUN — the boss reels, cloak wide open --------------------- */
function stunBoss(frames) {
  if (!boss || boss.dead) return false;
  boss.stunT = frames;
  boss.state = 'stunned';
  boss.stateT = 0;
  boss.vy = -3;
  boss.vulnT = 0;
  boss.flash = 10;
  boss.parrySuccess = false;
  SND.stunRing();
  addP({ x: boss.x + boss.w / 2, y: boss.y + boss.h / 2, life: 24, size: 10, col: 'rgba(255,232,150,0.9)', type: 'ring' });
  return true;
}

/* -- v1.6: BOSS SLASH EFFECTS — world-space pixel arcs for the lords -------- */
const bossFx = [];
function addBossFx(x, y, dir, flip, set, big) {
  bossFx.push({ x, y, dir: dir || 0, flip: !!flip, set, big: big || 1, t: 0, life: 14 });
  if (bossFx.length > 12) bossFx.shift();
}
function updateBossFx() {
  for (let i = bossFx.length - 1; i >= 0; i--) {
    bossFx[i].t++;
    if (bossFx[i].t > bossFx[i].life) bossFx.splice(i, 1);
  }
}
function renderBossFx() {
  for (const f of bossFx) {
    const prog = f.t / f.life;
    drawSlashSet(f.set, f.x, f.y, f.dir, prog, f.flip, f.big, Math.min(1, 1.5 - prog));
  }
}

function hurtBoss(dmg) {
  if (!boss || boss.dead) return;
  // v1.6: the Seraph's blade-parry stance — every strike skitters away
  if (boss.kind === 'seraph' && boss.state === 'gParry') {
    boss.parrySuccess = true;
    SND.clank();
    const pcx2 = player.x + player.w / 2;
    player.vx = (sign(pcx2 - (boss.x + boss.w / 2)) || player.face) * 4.5;
    player.vy = Math.min(player.vy, -2);
    game.hitstop = Math.max(game.hitstop, 5);
    cam.shake = Math.max(cam.shake, 5);
    for (let i = 0; i < 14; i++) {
      const a = rndr(0, Math.PI * 2), s = rndr(1.5, 4.5);
      addP({
        x: boss.x + boss.w / 2, y: boss.y + boss.h * 0.5,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rndr(10, 24), size: 2, type: 'px',
        col: rndr(0, 1) > 0.5 ? '#fff4c0' : '#ffd870', drag: 0.9, grav: 0.06,
      });
    }
    return;
  }
  boss.hp -= dmg;
  boss.flash = 6;
  SND.bossHit();
  burstHit(boss.x + boss.w / 2, boss.y + boss.h * 0.4);
  if (boss.kind === 'seraph') {
    if (boss.hp <= 65 && boss.phase === 1 && boss.state !== 'stunned') {
      boss.phase = 2;
      boss.state = 'summon';
      boss.stateT = 0;
      boss.vulnT = 2;
      SND.roar();
      cam.shake = 12;
      addP({ x: boss.x + boss.w / 2, y: boss.y + boss.h / 2, life: 30, size: 16, col: 'rgba(255,190,120,0.85)', type: 'ring' });
      showMsg('The Seraph burns brighter — its blades grow restless.');
    }
  } else if (boss.hp <= 40 && boss.phase === 1 && boss.state !== 'stunned') {
    boss.phase = 2;
    boss.state = 'roar';
    boss.stateT = 0;
    boss.vulnT = 70;
    SND.roar();
    cam.shake = 12;
    addP({ x: boss.x + boss.w / 2, y: boss.y + boss.h / 2, life: 30, size: 16, col: 'rgba(235,230,210,0.8)', type: 'ring' });
  }
  if (boss.hp <= 0) {
    boss.hp = 0;
    boss.dead = true;
    boss.deadT = 0;
    game.slowmo = 90;
    SND.shatter();
    SND.roar();
    cam.shake = 14;
  }
}

function endBoss() {
  const kind = boss.kind;
  game.bossActive = false;
  SND.setBoss(false);
  if (game.gateRect) {
    carve(game.gateRect.x, game.gateRect.y, game.gateRect.w, game.gateRect.h);
    game.gateRect = null;
  }
  game.gateClosed = false;
  dropGeo(boss.x + boss.w / 2, boss.y + boss.h / 2, 60);
  burstVoid(boss.x + boss.w / 2, boss.y + boss.h / 2, 40);
  boss = null;
  if (kind === 'seraph') {
    game.boss2Dead = true;
    // v1.6: the Seraph's trophy — SERAPH'S OATH hovers above the sand
    pickups.push({
      type: 'seraph',
      x: SERAPH_ARENA.spawnTx * TILE,
      y: SERAPH_ARENA.floorRow * TILE - 60,
      w: 30, h: 30, bob: 0, taken: false,
    });
    showMsg('The Seraph gutters out. An OATH remains, burning above the sand.');
    SND.confirmS();
  } else {
    game.bossDead = true;
    carve(316, 94, 2, 11);           // v1.5: the way east opens past the court
    showMsg('The pale light dims — the way east opens.');
  }
  saveGame();
}

function updateBoss() {
  if (!boss) return;
  const b = boss;
  b.t++;
  if (b.flash > 0) b.flash--;
  if (b.vulnT > 0) b.vulnT--;

  if (b.dead) {
    b.deadT++;
    if (b.deadT === 120) endBoss();
    return;
  }

  if (b.kind === 'seraph') {
    updateSeraph(b);
    return;
  }

  // ---------------- THE PALE WARDEN (grounded duellist) ----------------
  const pcx = player.x + player.w / 2;
  const bcx = b.x + b.w / 2;
  const speedMul = b.phase === 2 ? 1.3 : 1;

  b.stateT++;
  b.vy += 0.42;
  if (b.vy > 10) b.vy = 10;

  // v1.6: PARRY STUN — the warden reels, blade low, wide open
  if (b.stunT > 0) {
    b.stunT--;
    b.vx *= 0.8;
    moveX(b, b.vx);
    moveY(b, b.vy);
    if (b.hitFloor) b.vy = 0;
    if (b.t % 6 === 0) {
      addP({
        x: bcx + rndr(-22, 22), y: b.y + rndr(6, 44),
        vx: 0, vy: -0.6, life: 20, size: 2, type: 'px',
        col: 'rgba(255,232,150,0.9)', drag: 0.95,
      });
    }
    if (b.stunT === 0) { b.state = 'idle'; b.stateT = 0; }
    if (rectsOverlap(player, b)) hurtPlayer(1, bcx);
    return;
  }

  switch (b.state) {
    case 'intro':
      b.vx = 0;
      if (b.stateT > 90) { b.state = 'idle'; b.stateT = 0; }
      break;

    case 'idle': {
      b.face = sign(pcx - bcx) || b.face;
      b.vx = b.face * 1.1 * speedMul;
      moveX(b, b.vx);
      if (b.stateT > (b.phase === 2 ? 46 : 70)) {
        b.stateT = 0;
        const roll = Math.random();
        const d = Math.abs(pcx - bcx);
        if (d > 200) b.state = roll < 0.55 ? 'leapTele' : 'dashTele';
        else b.state = roll < 0.45 ? 'dashTele' : (b.phase === 2 && roll < 0.7 ? 'burst' : 'leapTele');
      }
      break;
    }

    case 'leapTele':
      b.vx = 0;
      if (b.stateT > 26 / speedMul) {
        b.state = 'leap'; b.stateT = 0;
        b.vy = -11;
        b.vx = sign(pcx - bcx) * 4.4 * speedMul;
        b.face = sign(b.vx) || b.face;
        SND.dash();
        // v1.6: the blade flashes up as he springs
        addBossFx(bcx + b.face * 30, b.y + 40, 0, b.face < 0, 'wardenUp', 1.0);
      }
      break;

    case 'leap':
      moveX(b, b.vx);
      if (b.hitFloor && b.stateT > 8) {
        b.state = 'land'; b.stateT = 0;
        cam.shake = 8;
        SND.clank();
        burstDust(bcx, b.y + b.h, 14, 20);
        // v1.6: a huge pale slash rakes the ground where he lands
        addBossFx(bcx + b.face * 48, b.y + b.h * 0.55, 0, b.face < 0, 'wardenSide', 1.35);
        for (const dir of [-1, 1]) {
          projectiles.push({
            x: bcx + dir * 20 - 8, y: b.y + b.h - 26, w: 16, h: 26,
            vx: dir * 5 * speedMul, vy: 0, grav: 0, t: 0, life: 80,
            kind: 'shock', ground: true,
          });
        }
      }
      break;

    case 'land':
      b.vx = 0;
      if (b.stateT > 30) { b.state = 'idle'; b.stateT = 0; }
      break;

    case 'dashTele':
      b.vx = 0;
      b.face = sign(pcx - bcx) || b.face;
      // v1.6: the raised blade glints before the charge
      if (b.t % 5 === 0) {
        addP({
          x: bcx + b.face * 26, y: b.y + 6,
          vx: rndr(-0.3, 0.3), vy: rndr(-0.8, -0.2),
          life: 16, size: 2, type: 'px', col: 'rgba(244,238,221,0.9)', drag: 0.95,
        });
      }
      if (b.stateT > 30 / speedMul) {
        b.state = 'dash'; b.stateT = 0;
        SND.dash(); SND.roar();
      }
      break;

    case 'dash':
      b.vx = b.face * 8.5 * speedMul;
      moveX(b, b.vx);
      if (b.t % 3 === 0) {
        addP({
          x: bcx, y: b.y + rndr(10, b.h - 10),
          vx: -b.face * 2, vy: 0, life: 14, size: 4,
          col: 'rgba(210,205,190,0.4)', drag: 0.9,
        });
      }
      // v1.6: the Warden finally SWINGS — a pale arc rides the charge
      if (b.stateT === 6 || b.stateT === 20) {
        addBossFx(bcx + b.face * 44, b.y + b.h * 0.45, 0, b.face < 0, 'wardenSide', 1.15);
        SND.swing();
      }
      if (b.hitWall || b.stateT > 40) {
        b.state = 'rest'; b.stateT = 0;
        cam.shake = 6;
        SND.clank();
        // v1.6: finisher slash as the charge ends
        addBossFx(bcx + b.face * 46, b.y + b.h * 0.5, 0, b.face < 0, 'wardenSide', 1.25);
      }
      break;

    case 'burst':
      b.vx = 0;
      if (b.stateT === 1) SND.roar();
      if (b.stateT === 40) {
        const n = 9;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + rndr(-0.1, 0.1);
          projectiles.push({
            x: bcx - 8, y: b.y + b.h * 0.45 - 8, w: 16, h: 16,
            vx: Math.cos(a) * 3.4, vy: Math.sin(a) * 3.4,
            grav: 0, t: 0, life: 130, kind: 'pale',
          });
        }
        SND.swing();
        cam.shake = 5;
      }
      if (b.stateT > 70) { b.state = 'idle'; b.stateT = 0; }
      break;

    case 'roar':
      b.vx = 0;
      if (b.t % 5 === 0) {
        burstVoid(bcx + rndr(-30, 30), b.y + rndr(0, b.h), 3);
      }
      if (b.stateT > 70) {
        b.state = 'idle'; b.stateT = 0;
        if (!b.summoned) {
          b.summoned = true;
          enemies.push(makeEnemy('mite', b.x - 60, WARDEN_ARENA.floorRow * TILE));
          enemies.push(makeEnemy('mite', b.x + b.w + 60, WARDEN_ARENA.floorRow * TILE));
        }
      }
      break;

    case 'rest':
      b.vx *= 0.85;
      moveX(b, b.vx);
      if (b.stateT > 34) { b.state = 'idle'; b.stateT = 0; }
      break;
  }

  moveY(b, b.vy);
  if (b.hitFloor) b.vy = 0;

  // v1.6: his charging body is a blade — dash and leap blows can be PARRIED
  const wMelee = (b.state === 'dash' || b.state === 'leap');
  if (rectsOverlap(player, b)) {
    hurtPlayer(1, bcx, wMelee ? {
      parryable: true,
      onParry: function () {
        stunBoss(160);
        hurtBoss(Math.max(1, Math.round(player.nailDmg / 4)));
      },
    } : null);
  }
}

/* -- THE ASHEN SERAPH (v1.6 rework) -----------------------------------------
   A cycling two-stage duel, and it never relents:
     AIR STAGE  — the ember cloak burns; every blow is turned.  It spams
                  ember rings, cinder rain, random HOLY BEAMS (each with a
                  burning ground warning), homing FEATHER VOLLEYS and
                  cross-arena swoops.  Endure it.
     GROUND STAGE — it lands and the cloak parts: TWIN BLADES bare.  Slash
                  combos, slash waves, dash slashes, a blade-PARRY stance of
                  its own that punishes careless strikes, ember novas and
                  plunging crashes.  Dangerous — but this is when it can be
                  hurt.
   A well-timed player PARRY stuns it out of any stage for a long, punishable
   moment (it crashes out of the sky, cloak wide open).
   -------------------------------------------------------------------------- */
function updateSeraph(b) {
  const A = SERAPH_ARENA;
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
  const ARENA_L = A.leftTx * TILE, ARENA_R = A.rightTx * TILE;
  const FLOOR = A.floorRow * TILE, CEIL = A.ceilRow * TILE;
  // hover low enough to stay inside the camera frame while the vessel stands
  const HOVER_Y = FLOOR - 380;
  const phaseMul = b.phase === 2 ? 1.3 : 1;

  // the ember cloak: while it hunts the sky, the seraph cannot be harmed.
  // Ground-stage states (and 'stunned') leave it bare.
  const CLOAKED = ['intro', 'hover', 'ringTele', 'ring', 'rainTele', 'rain',
                   'swoopTele', 'swoop', 'rise', 'beamTele', 'beamSpam',
                   'featherTele', 'feather', 'descendTele', 'ascend', 'summon',
                   'gPlungeTele'];
  if (CLOAKED.indexOf(b.state) >= 0) b.vulnT = 2;

  b.stateT++;

  switch (b.state) {

    case 'intro':
      b.y = lerp(b.y, HOVER_Y, 0.03);
      if (b.t % 9 === 0) {
        addP({ x: bcx + rndr(-30, 30), y: b.y + rndr(0, b.h), vx: 0, vy: rndr(-1, -0.2),
               life: rndr(14, 26), size: rndr(2, 4), type: 'px',
               col: rndr(0, 1) > 0.5 ? 'rgba(255,170,80,0.8)' : 'rgba(255,230,160,0.7)', drag: 0.95 });
      }
      if (b.stateT > 80) { b.state = 'hover'; b.stateT = 0; }
      break;

    /* =================== THE AIR STAGE — endure the sky =================== */
    case 'hover': {
      // drift, keeping a half-gap from the vessel, then spam something
      const want = pcx + (bcx > pcx ? 130 : -130);
      b.x += clamp(want - bcx, -1.5, 1.5) * phaseMul;
      b.y = HOVER_Y + Math.sin(b.t * 0.05) * 14;
      if (b.stateT > (b.airLeft <= 0 ? 34 : 60 / phaseMul)) {
        b.stateT = 0;
        if (b.airLeft <= 0) { b.state = 'descendTele'; break; }   // stage turns
        b.airLeft--;
        const roll = Math.random();
        if (roll < 0.22)      b.state = 'ringTele';
        else if (roll < 0.42) b.state = 'rainTele';
        else if (roll < 0.62) b.state = 'beamTele';               // v1.6
        else if (roll < 0.80) b.state = 'featherTele';            // v1.6
        else                  b.state = 'swoopTele';
      }
      break;
    }

    case 'ringTele':
      if (b.stateT === 1) SND.roar();
      if (b.stateT > 36) { b.state = 'ring'; b.stateT = 0; b.volley = b.phase === 2 ? 2 : 1; }
      break;

    case 'ring': {
      if (b.stateT === 10 || (b.volley === 2 && b.stateT === 52)) {
        const n = b.phase === 2 ? 14 : 10;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + b.stateT * 0.013;
          projectiles.push({
            x: bcx - 8, y: bcy - 8, w: 16, h: 16,
            vx: Math.cos(a) * 3.1 * phaseMul, vy: Math.sin(a) * 3.1 * phaseMul,
            grav: 0, t: 0, life: 150, kind: 'ember',
          });
        }
        SND.swing();
        cam.shake = 5;
      }
      if (b.stateT > (b.volley === 2 ? 80 : 40)) { b.state = 'hover'; b.stateT = 0; }
      break;
    }

    case 'rainTele':
      if (b.stateT === 1) SND.roar();
      if (b.stateT > 30) { b.state = 'rain'; b.stateT = 0; b.rainN = b.phase === 2 ? 12 : 8; }
      break;

    case 'rain':
      if (b.stateT % 9 === 0 && b.rainN > 0) {
        b.rainN--;
        const rx = rndr(ARENA_L + 60, ARENA_R - 60);
        addP({ x: rx, y: FLOOR - 8, life: 42, size: 12, col: 'rgba(255,170,90,0.55)', type: 'ring' });
        projectiles.push({
          x: rx - 8, y: CEIL - 40, w: 16, h: 16,
          vx: rndr(-0.4, 0.4), vy: 3.6, grav: 0.06, t: 0, life: 240, kind: 'emberFall',
        });
        SND.tick(0.06);
      }
      if (b.rainN <= 0 && b.stateT > 60) { b.state = 'hover'; b.stateT = 0; }
      break;

    /* v1.6: HOLY BEAMS — Illumina-like pillars, random, always warned ------ */
    case 'beamTele':
      if (b.stateT === 1) SND.roar();
      if (b.stateT > 34) { b.state = 'beamSpam'; b.stateT = 0; b.beamN = b.phase === 2 ? 9 : 6; }
      break;

    case 'beamSpam':
      b.y = HOVER_Y + Math.sin(b.t * 0.05) * 10;
      if (b.beamN > 0 && b.stateT % (b.phase === 2 ? 13 : 17) === 0) {
        b.beamN--;
        const rx = (Math.random() < 0.62)
          ? clamp(pcx + rndr(-150, 150), ARENA_L + 30, ARENA_R - 30)
          : rndr(ARENA_L + 30, ARENA_R - 30);
        projectiles.push({
          kind: 'sBeam', cx: rx, groundY: FLOOR,
          x: rx - 15, y: CEIL - 40, w: 30, h: 900,
          vx: 0, vy: 0, grav: 0, t: 0, life: 96, warn: 46,
        });
        SND.tick(0.08);
      }
      if (b.beamN <= 0 && b.stateT > 50) { b.state = 'hover'; b.stateT = 0; }
      break;

    /* v1.6: FEATHER VOLLEYS — fans of homing white-gold blades ------------- */
    case 'featherTele':
      if (b.stateT === 1) SND.feather();
      if (b.stateT > 24) { b.state = 'feather'; b.stateT = 0; b.featherN = b.phase === 2 ? 4 : 3; }
      break;

    case 'feather':
      b.y = HOVER_Y + Math.sin(b.t * 0.06) * 10;
      if (b.featherN > 0 && b.stateT % 15 === 1) {
        b.featherN--;
        const n = b.phase === 2 ? 6 : 5;
        const baseA = Math.atan2(pcy - bcy - 10, pcx - bcx);
        for (let i = 0; i < n; i++) {
          const a = baseA + (i - (n - 1) / 2) * 0.16;
          projectiles.push({
            x: bcx - 5, y: bcy - 5, w: 10, h: 10,
            vx: Math.cos(a) * 4.4, vy: Math.sin(a) * 4.4,
            grav: 0, t: 0, life: 150, kind: 'feather', homing: 0.035,
          });
        }
        SND.feather();
      }
      if (b.featherN <= 0 && b.stateT > 40) { b.state = 'hover'; b.stateT = 0; }
      break;

    case 'swoopTele':
      b.face = sign(pcx - bcx) || b.face;
      if (b.stateT > 26) {
        b.state = 'swoop'; b.stateT = 0;
        SND.dash(); SND.roar();
        b.swoopY = clamp(pcy - b.h / 2, FLOOR - 210, FLOOR - 70);
      }
      break;

    case 'swoop':
      b.y = lerp(b.y, b.swoopY, 0.2);
      b.x += b.face * 8 * phaseMul;
      if (b.t % 2 === 0) {
        addP({ x: bcx - b.face * 20, y: bcy + rndr(-16, 16), vx: -b.face * 1.5, vy: rndr(-0.6, 0.6),
               life: 16, size: 3, type: 'px', col: 'rgba(255,170,90,0.75)', drag: 0.94 });
      }
      // v1.6: the twin blades trail burning arcs through the air
      if (b.stateT % 9 === 4) {
        addBossFx(bcx - b.face * 10, bcy + 14, 0, b.face < 0, 'seraphSide', 1.1);
      }
      // v1.6: and it flings slash-waves from mid-flight (air slash wave)
      if (b.stateT === 18 || (b.phase === 2 && b.stateT === 38)) {
        projectiles.push({
          x: bcx + b.face * 20 - 12, y: bcy - 14, w: 24, h: 28,
          vx: b.face * 6.2, vy: clamp((pcy - bcy) * 0.02, -1.4, 1.4),
          grav: 0, t: 0, life: 60,
          kind: 'slashWave', face: b.face, dmg: 1, hits: {}, fire: true,
        });
        SND.swing();
      }
      if (b.x < ARENA_L || b.x + b.w > ARENA_R || b.stateT > 70) {
        b.state = 'rise'; b.stateT = 0;
        cam.shake = 4;
      }
      break;

    case 'rise':
      b.y = lerp(b.y, HOVER_Y, 0.06);
      if (b.stateT > 36) {
        b.stateT = 0;
        b.state = (b.airLeft <= 0) ? 'descendTele' : 'hover';
      }
      break;

    /* ============ the turn — sky stage gives way to the ground ============ */
    case 'descendTele':
      b.face = sign(pcx - bcx) || b.face;
      b.y = lerp(b.y, HOVER_Y - 30, 0.08);           // rears back before the drop
      if (b.stateT === 1) SND.roar();
      if (b.stateT > 34) { b.state = 'descend'; b.stateT = 0; }
      break;

    case 'descend':
      b.y += 13;
      b.x += clamp(pcx - bcx, -1.2, 1.2);
      if (b.t % 2 === 0) {
        addP({ x: bcx + rndr(-16, 16), y: b.y + b.h, vx: rndr(-0.5, 0.5), vy: rndr(-2, -0.5),
               life: 14, size: 3, type: 'px', col: 'rgba(255,170,80,0.8)', drag: 0.94 });
      }
      if (b.y >= FLOOR - b.h - 4) {
        b.y = FLOOR - b.h;
        b.cycle = 'ground';
        b.state = 'land'; b.stateT = 0;
        cam.shake = 9; SND.clank(); SND.roar();
        burstDust(bcx, FLOOR, 16, 22);
        // v1.6: landing shockwaves rake the sand
        addBossFx(bcx - 44, FLOOR - 30, 0, true,  'seraphSide', 1.2);
        addBossFx(bcx + 44, FLOOR - 30, 0, false, 'seraphSide', 1.2);
        for (const dir of [-1, 1]) {
          projectiles.push({
            x: bcx + dir * 24 - 8, y: FLOOR - 30, w: 16, h: 26,
            vx: dir * 5.5 * phaseMul, vy: 0, grav: 0, t: 0, life: 80,
            kind: 'shock', ground: true, fire: true,
          });
        }
        if (!b.taught) { b.taught = true; showMsg('The cloak parts — its twin blades are bare. STRIKE!'); }
      }
      break;

    case 'land':
      if (b.stateT > 26) { b.state = 'gIdle'; b.stateT = 0; }
      break;

    /* ================ THE GROUND STAGE — twin blades bare ================= */
    case 'gIdle':
      // vulnerable recovery — the damage window, but it never idles long
      b.x += clamp(pcx - bcx, -0.9, 0.9);
      if (b.stateT > (b.phase === 2 ? 30 : 44)) {
        b.stateT = 0;
        if (b.groundLeft <= 0) { b.state = 'ascend'; b.groundLeft = b.phase === 2 ? 6 : 5; break; }
        b.groundLeft--;
        const roll = Math.random();
        if (b.phase === 2 && roll < 0.14) b.state = 'gParry';       // v1.6: it parries too
        else if (roll < 0.36) { b.state = 'gSlashTele'; b.combo = (b.phase === 2 ? (Math.random() < 0.5 ? 3 : 2) : 2); }
        else if (roll < 0.54) b.state = 'gWaveTele';
        else if (roll < 0.70) b.state = 'gDashTele';
        else if (roll < 0.85) b.state = 'gNova';
        else                  b.state = 'gPlungeTele';
      }
      break;

    case 'gSlashTele':
      b.face = sign(pcx - bcx) || b.face;
      b.vx = 0;
      if (b.stateT > 20 / phaseMul) {
        b.state = 'gSlash'; b.stateT = 0;
        SND.swing();
        // v1.6: burning twin-blade arc
        addBossFx(bcx + b.face * 46, b.y + b.h * 0.55, 0, b.face < 0, 'seraphSide', 1.25);
      }
      break;

    case 'gSlash':
      // lunging cut — the body itself is parryable
      b.x += b.face * 5.2;
      if (b.t % 2 === 0) {
        addP({ x: bcx - b.face * 18, y: b.y + b.h * 0.5 + rndr(-10, 10),
               vx: -b.face * 1, vy: rndr(-0.4, 0.4), life: 12, size: 3,
               type: 'px', col: 'rgba(255,170,80,0.7)', drag: 0.94 });
      }
      if (b.stateT > 14) {
        b.combo--;
        if (b.combo > 0) { b.state = 'gSlashTele'; b.stateT = 0; }
        else { b.state = 'gIdle'; b.stateT = 0; }
      }
      break;

    case 'gWaveTele':
      b.face = sign(pcx - bcx) || b.face;
      if (b.stateT > 16) {
        b.state = 'gIdle'; b.stateT = 0;
        SND.swing();
        // a ground slash-wave (and a rising one in phase 2)
        projectiles.push({
          x: bcx + b.face * 26 - 12, y: FLOOR - 46, w: 24, h: 28,
          vx: b.face * 6.5, vy: 0, grav: 0, t: 0, life: 60,
          kind: 'slashWave', face: b.face, dmg: 1, hits: {}, fire: true,
        });
        if (b.phase === 2) {
          projectiles.push({
            x: bcx + b.face * 26 - 12, y: FLOOR - 66, w: 24, h: 28,
            vx: b.face * 6, vy: -1.7, grav: 0, t: 0, life: 60,
            kind: 'slashWave', face: b.face, dmg: 1, hits: {}, fire: true,
          });
        }
        addBossFx(bcx + b.face * 40, FLOOR - 40, 0, b.face < 0, 'seraphSide', 1.1);
      }
      break;

    case 'gDashTele':
      b.face = sign(pcx - bcx) || b.face;
      if (b.stateT === 1) SND.dash();
      if (b.stateT > 22 / phaseMul) { b.state = 'gDash'; b.stateT = 0; SND.roar(); }
      break;

    case 'gDash':
      // cross-arena blade-rush, parryable
      b.x += b.face * 9 * phaseMul;
      if (b.t % 3 === 0) {
        addP({ x: bcx - b.face * 20, y: b.y + rndr(6, b.h - 6),
               vx: -b.face * 2, vy: 0, life: 14, size: 3,
               type: 'px', col: 'rgba(255,170,80,0.65)', drag: 0.92 });
      }
      if (b.stateT === 10) {
        addBossFx(bcx + b.face * 44, b.y + b.h * 0.5, 0, b.face < 0, 'seraphSide', 1.2);
        SND.swing();
      }
      if (b.x <= ARENA_L || b.x + b.w >= ARENA_R || b.stateT > 42) {
        b.state = 'gIdle'; b.stateT = 0;
        cam.shake = 4;
        SND.clank();
        addBossFx(bcx + b.face * 42, b.y + b.h * 0.5, 0, b.face < 0, 'seraphSide', 1.2);
      }
      break;

    case 'gParry':
      // blades crossed — it will punish the next careless strike (see hurtBoss)
      if (b.stateT === 1) SND.clank();
      if (b.t % 4 === 0) {
        addP({ x: bcx + b.face * 26 + rndr(-6, 6), y: b.y + b.h * 0.5 + rndr(-12, 12),
               vx: rndr(-0.3, 0.3), vy: rndr(-0.8, -0.2), life: 14, size: 2,
               type: 'px', col: rndr(0, 1) > 0.5 ? '#fff4c0' : '#ffd870', drag: 0.95 });
      }
      if ((b.parrySuccess && b.stateT > 8) || b.stateT > 46) {
        b.parrySuccess = false;
        b.state = 'gCounter'; b.stateT = 0;
        b.face = sign(pcx - bcx) || b.face;
        SND.dash();
      }
      break;

    case 'gCounter':
      // the riposte — a lightning dash-cut, parryable
      b.x += b.face * 10;
      if (b.stateT === 3) {
        addBossFx(bcx + b.face * 48, b.y + b.h * 0.55, 0, b.face < 0, 'seraphSide', 1.3);
        SND.swing();
      }
      if (b.stateT > 16) { b.state = 'gIdle'; b.stateT = 0; }
      break;

    case 'gNova':
      // an ember nova bursts outward along the sand
      if (b.stateT === 1) SND.roar();
      if (b.stateT === 30) {
        const n = b.phase === 2 ? 14 : 11;
        for (let i = 0; i < n; i++) {
          const a = -Math.PI * (i / (n - 1));         // upward fan
          projectiles.push({
            x: bcx - 8, y: FLOOR - 30, w: 16, h: 16,
            vx: Math.cos(a) * 4.2, vy: Math.sin(a) * 4.6 - 1.5,
            grav: 0.09, t: 0, life: 120, kind: 'ember',
          });
        }
        SND.swing();
        cam.shake = 5;
        addBossFx(bcx, FLOOR - 36, 0, false, 'seraphSide', 1.4);
      }
      if (b.stateT > 52) { b.state = 'gIdle'; b.stateT = 0; }
      break;

    case 'gPlungeTele':
      // leaps high and crashes down on the vessel's mark
      if (b.stateT === 1) { b.plungeX = clamp(pcx, ARENA_L + 20, ARENA_R - 20); SND.dash(); }
      if (b.stateT === 14) { b.vyP = -13; SND.flap(); }
      if (b.stateT > 14) {
        b.y += b.vyP;
        b.vyP += 0.55;
        if (b.vyP > 0) b.x += clamp(b.plungeX - bcx, -6, 6);
        if (b.vyP > 0 && b.y >= FLOOR - b.h) {
          b.y = FLOOR - b.h;
          b.state = 'gIdle'; b.stateT = 0;
          cam.shake = 11; SND.clank(); SND.roar();
          burstDust(bcx, FLOOR, 18, 24);
          for (const dir of [-1, 1]) {
            projectiles.push({
              x: bcx + dir * 24 - 8, y: FLOOR - 30, w: 16, h: 26,
              vx: dir * 6 * phaseMul, vy: 0, grav: 0, t: 0, life: 80,
              kind: 'shock', ground: true, fire: true,
            });
          }
          for (let i = 0; i < 8; i++) {
            const a = rndr(-Math.PI, 0);
            projectiles.push({
              x: bcx - 8, y: FLOOR - 24, w: 16, h: 16,
              vx: Math.cos(a) * rndr(2.5, 4.5), vy: Math.sin(a) * rndr(3, 6),
              grav: 0.12, t: 0, life: 90, kind: 'ember',
            });
          }
          addBossFx(bcx - 40, FLOOR - 30, 0, true,  'seraphSide', 1.25);
          addBossFx(bcx + 40, FLOOR - 30, 0, false, 'seraphSide', 1.25);
        }
      }
      break;

    /* ============ the turn — back into the burning sky ==================== */
    case 'ascend':
      b.cycle = 'air';
      b.y = lerp(b.y, HOVER_Y, 0.055);
      if (b.t % 6 === 0) {
        addP({ x: bcx + rndr(-20, 20), y: b.y + rndr(0, b.h), vx: 0, vy: rndr(-1.4, -0.4),
               life: rndr(12, 22), size: 3, type: 'px', col: 'rgba(255,180,90,0.8)', drag: 0.95 });
      }
      if (b.stateT > 46) {
        b.state = 'hover'; b.stateT = 0;
        b.airLeft = b.phase === 2 ? 4 : 5;
      }
      break;

    case 'summon':
      b.vx = 0;
      if (b.t % 5 === 0) burstVoid(bcx + rndr(-30, 30), b.y + rndr(0, b.h), 3);
      if (b.stateT === 40 && !b.summoned) {
        b.summoned = true;
        enemies.push(makeEnemy('wisp', b.x - 70, b.y + 40));
        enemies.push(makeEnemy('wisp', b.x + b.w + 70, b.y + 40));
        SND.roar();
      }
      if (b.stateT > 70) {
        b.stateT = 0;
        if (b.cycle === 'air') { b.state = 'hover'; b.airLeft = 2; }
        else { b.state = 'gIdle'; b.groundLeft = 3; }
      }
      break;

    /* ================== PARRY REWARD — the long stun ====================== */
    case 'stunned':
      // struck from the sky or mid-combo: it crashes down, cloak wide open
      b.vulnT = 0;
      b.vy = Math.min(b.vy + 0.42, 9);
      b.y += b.vy;
      if (b.y >= FLOOR - b.h) { b.y = FLOOR - b.h; b.vy = 0; }
      b.x += rndr(-0.4, 0.4);
      if (b.t % 5 === 0) {
        addP({ x: bcx + rndr(-24, 24), y: b.y + rndr(4, 40), vx: rndr(-0.4, 0.4), vy: -0.7,
               life: 22, size: 2, type: 'px',
               col: rndr(0, 1) > 0.5 ? '#ffe8a0' : 'rgba(255,170,80,0.8)', drag: 0.96 });
      }
      b.stunT--;
      if (b.stunT <= 0) {
        SND.stunRing();
        b.stateT = 0;
        if (b.cycle === 'air') { b.state = 'ascend'; b.airLeft = b.phase === 2 ? 3 : 4; }
        else { b.state = 'gIdle'; }
      }
      break;
  }

  // keep the seraph inside its hall
  b.x = clamp(b.x, ARENA_L, ARENA_R - b.w);
  b.y = clamp(b.y, CEIL, FLOOR - b.h);

  // v1.6: its blade work is parryable — swoops, dives, slashes, rushes
  const sMelee = (b.state === 'swoop' || b.state === 'descend' ||
                  b.state === 'gSlash' || b.state === 'gCounter' || b.state === 'gDash');
  if (rectsOverlap(player, b)) {
    hurtPlayer(1, bcx, sMelee ? {
      parryable: true,
      onParry: function () {
        stunBoss(150);
        hurtBoss(Math.max(1, Math.round(player.nailDmg / 4)));
      },
    } : null);
  }
}

function renderBoss() {
  if (!boss) return;
  if (boss.kind === 'seraph') { renderSeraph(); return; }
  const b = boss;
  const bcx = b.x + b.w / 2, bottom = b.y + b.h;
  let idx = 0;
  switch (b.state) {
    case 'leapTele': idx = 4; break;
    case 'leap': idx = 5; break;
    case 'land': idx = 6; break;
    case 'dash': idx = 7; break;
    case 'dashTele': idx = 8; break;
    case 'burst': case 'roar': idx = 9; break;
    default: idx = Math.floor(b.t / 8) % 4;
  }
  if (b.dead) {
    const a = Math.max(0, 1 - b.deadT / 120);
    drawSpr(SPR.warden, idx, bcx, bottom, b.face < 0, a);
    if (b.deadT % 12 < 6) drawSprWhite(SPR.warden, idx, bcx, bottom, b.face < 0);
    return;
  }
  drawSpr(SPR.warden, idx, bcx, bottom, b.face < 0);
  if (b.flash > 0) drawSprWhite(SPR.warden, idx, bcx, bottom, b.face < 0);
}

// v1.5: scaled sprite blit — lets the seraph loom larger than its 60×60 art
function drawSprScaled(spr, idx, cx, by, flip, alpha, s) {
  const img = spr.f[idx % spr.f.length];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(Math.round(cx), Math.round(by));
  ctx.scale(s, s);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -img.width / 2, -img.height);
  ctx.restore();
}

function renderSeraph() {
  const b = boss;
  const bcx = b.x + b.w / 2, bottom = b.y + b.h + 6;
  const SC = 1.5;                     // the seraph looms — hitbox stays honest
  const flip = b.face < 0;            // v1.6: ground frames face right by default
  let idx;
  switch (b.state) {
    case 'ringTele':  idx = 4; break;
    case 'rainTele':
    case 'swoopTele':
    case 'beamTele':
    case 'featherTele':
    case 'feather':   idx = 5; break;
    case 'beamSpam':  idx = 4; break;
    case 'swoop':
    case 'descend':   idx = 6; break;
    case 'rise':
    case 'ascend':    idx = Math.floor(b.t / 7) % 4; break;
    case 'stunned':   idx = 15; break;
    case 'land':
    case 'gIdle':     idx = 8 + Math.floor(b.t / 16) % 2; break;
    case 'gSlashTele':
    case 'gWaveTele': idx = 10; break;
    case 'gPlungeTele': idx = (b.stateT > 14) ? 14 : 10; break;
    case 'gSlash':
    case 'gCounter':  idx = 11; break;
    case 'gParry':    idx = 12; break;
    case 'gDashTele':
    case 'gDash':     idx = 13; break;
    case 'summon':    idx = 4; break;
    default:          idx = Math.floor(b.t / 7) % 4;
  }
  if (b.dead) {
    const a = Math.max(0, 1 - b.deadT / 120);
    drawSprScaled(SPR.seraph, idx, bcx, bottom, flip, a, SC);
    if (b.deadT % 12 < 6) {
      const frames = (SPR.seraph.w && SPR.seraph.w.length) ? SPR.seraph.w : SPR.seraph.f;
      const img = frames[idx % frames.length];
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(Math.round(bcx), Math.round(bottom));
      ctx.scale(SC, SC);
      if (flip) ctx.scale(-1, 1);
      ctx.drawImage(img, -img.width / 2, -img.height);
      ctx.restore();
    }
    return;
  }
  // ember cloak — a burning halo while the cloak holds (invulnerable)
  if (b.vulnT > 0 && b.state !== 'intro') {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const flick = 0.5 + Math.sin(b.t * 0.35) * 0.2;
    const gr = ctx.createRadialGradient(bcx, b.y + b.h * 0.5, 10, bcx, b.y + b.h * 0.5, 62);
    gr.addColorStop(0, 'rgba(255,170,80,' + (0.22 * flick) + ')');
    gr.addColorStop(0.7, 'rgba(255,120,40,' + (0.12 * flick) + ')');
    gr.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(bcx, b.y + b.h * 0.5, 62, 0, Math.PI * 2); ctx.fill();
    // orbiting cloak embers
    for (let k = 0; k < 5; k++) {
      const a = b.t * 0.09 + k * (Math.PI * 2 / 5);
      const ex = bcx + Math.cos(a) * 46;
      const ey = b.y + b.h * 0.5 + Math.sin(a) * 38;
      ctx.fillStyle = k % 2 ? 'rgba(255,200,110,0.9)' : 'rgba(255,140,60,0.9)';
      ctx.fillRect(Math.round(ex) - 2, Math.round(ey) - 2, 4, 4);
    }
    ctx.restore();
  } else if (!b.dead && (b.cycle === 'ground' || b.state === 'stunned')) {
    // v1.6: blades bare — a pale-gold pulse marks the vulnerability window
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const pulse = 0.10 + Math.sin(b.t * 0.2) * 0.05;
    const gr = ctx.createRadialGradient(bcx, b.y + b.h * 0.5, 6, bcx, b.y + b.h * 0.5, 54);
    gr.addColorStop(0, 'rgba(255,240,190,' + pulse + ')');
    gr.addColorStop(1, 'rgba(255,240,190,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(bcx, b.y + b.h * 0.5, 54, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  drawSprScaled(SPR.seraph, idx, bcx, bottom, flip, 1, SC);
  if (b.flash > 0) {
    const frames = (SPR.seraph.w && SPR.seraph.w.length) ? SPR.seraph.w : SPR.seraph.f;
    const img = frames[idx % frames.length];
    ctx.save();
    ctx.translate(Math.round(bcx), Math.round(bottom));
    ctx.scale(SC, SC);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(img, -img.width / 2, -img.height);
    ctx.restore();
  }
}

/* ==========================================================================
   SECTION 10 — PROJECTILES & GEO
   ========================================================================== */

function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.t++;
    // Vengeful Shade bolts have their own homing + piercing logic and do not
    // damage the player — skip the shared physics / collision below for them.
    if (p.kind === 'shadeBolt') {
      updateShadeBolt(p);
      p.x += p.vx;
      p.y += p.vy;
      let kill = p.t > p.life;
      if (isSolidTile(Math.floor((p.x + 10) / TILE), Math.floor((p.y + 10) / TILE))) {
        kill = true;
        burstHit(p.x + 10, p.y + 10);
        SND.shadeHit();
      }
      if (kill) { projectiles.splice(i, 1); }
      continue;
    }
    // Illumina Light Beam — stationary sky-to-ground pillar; widens over time
    if (p.kind === 'lightBeam') {
      updateLightBeam(p);
      // beam does not move horizontally — it's locked to the cast position
      let kill = p.t > p.life;
      if (kill) { projectiles.splice(i, 1); }
      continue;
    }
    // Illumina Slash Wave — forward-moving crescent (v1.6: can rise at an angle;
    // the Seraph's own fire waves burn the vessel too)
    if (p.kind === 'slashWave') {
      updateSlashWave(p);
      p.x += p.vx;
      p.y += p.vy || 0;
      if (p.fire && !p.hitPlayer) {
        const hr = { x: p.x + 2, y: p.y + 2, w: p.w - 4, h: p.h - 4 };
        if (rectsOverlap(hr, player)) {
          p.hitPlayer = true;
          hurtPlayer(1, p.x + p.w / 2);
          projectiles.splice(i, 1);
          continue;
        }
      }
      let kill = p.t > p.life;
      if (isSolidTile(Math.floor((p.x + p.w / 2) / TILE), Math.floor((p.y + p.h / 2) / TILE))) {
        kill = true;
      }
      if (kill) { projectiles.splice(i, 1); }
      continue;
    }
    // v1.6: SERAPH'S HOLY BEAM — warned telegraph, then a burning pillar strike
    if (p.kind === 'sBeam') {
      if (p.t === p.warn) {
        SND.holyBeam();
        cam.shake = Math.max(cam.shake, 4);
        for (let k = 0; k < 18; k++) {
          const a = rndr(-Math.PI, 0), s = rndr(2, 6);
          addP({
            x: p.cx + rndr(-8, 8), y: p.groundY,
            vx: Math.cos(a) * s, vy: Math.sin(a) * s,
            life: rndr(12, 26), size: rndr(2, 4), type: 'px',
            col: rndr(0, 1) > 0.5 ? '#fff4c0' : '#ffd870', drag: 0.92, grav: 0.1,
          });
        }
      }
      if (p.t >= p.warn) {
        const col = { x: p.cx - 13, y: p.groundY - 900, w: 26, h: 940 };
        if (rectsOverlap(col, player)) hurtPlayer(1, p.cx);
      }
      if (p.t > p.life) { projectiles.splice(i, 1); }
      continue;
    }
    // v1.6: JUDGE BEAM — instant Seraph's Oath blast, purely visual here
    if (p.kind === 'judgeBeam') {
      if (p.t > p.life) { projectiles.splice(i, 1); }
      continue;
    }
    // v2.0: BOUND — the player's thrown blade; out, hang, howling return
    if (p.kind === 'boundFly') { updateBoundFly(p, i); continue; }
    // v1.6: FEATHER — a homing white-gold sliver
    if (p.kind === 'feather') {
      const dx2 = (player.x + 9) - (p.x + 5), dy2 = (player.y + 17) - (p.y + 5);
      const dd2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) || 1;
      p.vx += (dx2 / dd2) * (p.homing || 0.03);
      p.vy += (dy2 / dd2) * (p.homing || 0.03);
      const sp2 = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      const maxSp = 4.8;
      if (sp2 > maxSp) { p.vx = p.vx / sp2 * maxSp; p.vy = p.vy / sp2 * maxSp; }
      if (p.t % 4 === 0) {
        addP({
          x: p.x + 5 + rndr(-2, 2), y: p.y + 5 + rndr(-2, 2),
          vx: rndr(-0.2, 0.2), vy: rndr(-0.3, 0.1),
          life: rndr(8, 16), size: 2, type: 'px',
          col: rndr(0, 1) > 0.5 ? 'rgba(255,244,214,0.85)' : 'rgba(232,192,96,0.8)', drag: 0.94,
        });
      }
    }
    p.vy += p.grav || 0;
    p.x += p.vx;
    p.y += p.vy;
    if (p.kind === 'shock' && p.ground) {
      const below = tileGet(Math.floor((p.x + 8) / TILE), Math.floor((p.y + p.h + 6) / TILE));
      if (below !== 1) p.y += 4;
    }
    let kill = p.t > p.life;
    if (isSolidTile(Math.floor((p.x + 8) / TILE), Math.floor((p.y + 8) / TILE))) kill = true;
    if (kill) {
      burstHit(p.x + 8, p.y + 8);
      projectiles.splice(i, 1);
      continue;
    }
    const pr = { x: p.x + 3, y: p.y + 3, w: 10, h: 10 };
    if (rectsOverlap(pr, player)) {
      hurtPlayer(1, p.x + 8);
      projectiles.splice(i, 1);
    }
  }
}

function renderProjectiles() {
  for (const p of projectiles) {
    if (p.kind === 'spore') {
      drawSpr(SPR.sporeBall, Math.floor(p.t / 4), p.x + 8, p.y + 16, false);
    } else if (p.kind === 'shock') {
      ctx.save();
      ctx.globalAlpha = 0.85;
      // v1.6: the Seraph's shockwaves burn fire-gold; the Warden's stay pale
      if (p.fire) {
        ctx.fillStyle = '#ffb050';
        ctx.beginPath();
        ctx.moveTo(p.x + 8, p.y + p.h);
        ctx.lineTo(p.x + 14, p.y + p.h - 18 - Math.sin(p.t * 0.4) * 4);
        ctx.lineTo(p.x + 20, p.y + p.h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#fff4d0';
        ctx.beginPath();
        ctx.moveTo(p.x + 9, p.y + p.h);
        ctx.lineTo(p.x + 12, p.y + p.h - 10);
        ctx.lineTo(p.x + 15, p.y + p.h);
        ctx.closePath();
        ctx.fill();
        if (p.t % 3 === 0) {
          addP({
            x: p.x + 14 + rndr(-4, 4), y: p.y + p.h - rndr(2, 14),
            vx: rndr(-0.4, 0.4), vy: rndr(-1.2, -0.3),
            life: rndr(8, 16), size: 2, type: 'px',
            col: 'rgba(255,180,90,0.85)', drag: 0.95,
          });
        }
      } else {
        ctx.fillStyle = '#d8d2be';
        ctx.beginPath();
        ctx.moveTo(p.x + 8, p.y + p.h);
        ctx.lineTo(p.x + 14, p.y + p.h - 18 - Math.sin(p.t * 0.4) * 4);
        ctx.lineTo(p.x + 20, p.y + p.h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath();
        ctx.moveTo(p.x + 8, p.y + p.h);
        ctx.lineTo(p.x + 11, p.y + p.h - 10);
        ctx.lineTo(p.x + 14, p.y + p.h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    } else if (p.kind === 'pale') {
      ctx.save();
      ctx.fillStyle = 'rgba(235,230,210,0.9)';
      ctx.beginPath();
      ctx.arc(p.x + 8, p.y + 8, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.arc(p.x + 6, p.y + 6, 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (p.kind === 'sBeam') {
      // v1.6: the Seraph's holy beam — a warned telegraph, then the strike
      const strike = p.t >= p.warn;
      if (!strike) {
        // ground warning: pulsing pixel rune + a shimmering gold column
        const k = p.t / p.warn;
        const a = 0.35 + Math.sin(p.t * 0.5) * 0.25;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(255,214,120,' + a + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(p.cx, p.groundY, 20, 6, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(p.cx, p.groundY, 10 + k * 14, 3 + k * 4, 0, 0, Math.PI * 2);
        ctx.stroke();
        // rising warning ticks up the column
        ctx.fillStyle = 'rgba(255,224,140,' + (0.25 + k * 0.45) + ')';
        for (let y = 12; y < 560; y += 22) {
          const yy = p.groundY - ((p.t * 3 + y) % 560);
          ctx.fillRect(Math.floor(p.cx) - 1, Math.floor(yy), 2, 8);
        }
        ctx.restore();
      } else {
        // the strike — a burning white-gold pillar
        const ft = 1 - (p.t - p.warn) / (p.life - p.warn);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const top = p.groundY - 900;
        const flick = 0.75 + Math.sin(p.t * 1.3) * 0.25;
        const w = 30 * (0.7 + 0.3 * ft);
        ctx.fillStyle = 'rgba(255,236,170,' + (0.5 * ft * flick) + ')';
        ctx.fillRect(p.cx - w / 2, top, w, 900);
        ctx.fillStyle = 'rgba(255,250,220,' + (0.75 * ft * flick) + ')';
        ctx.fillRect(p.cx - w / 4, top, w / 2, 900);
        ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * ft) + ')';
        ctx.fillRect(p.cx - 2, top, 4, 900);
        // falling pixel streaks inside the beam
        ctx.fillStyle = 'rgba(255,255,255,' + (0.5 * ft) + ')';
        for (let s = 0; s < 6; s++) {
          const sx = p.cx + (((p.t * 5 + s * 41) % 22) - 11);
          const sy = top + ((p.t * 14 + s * 97) % 900);
          ctx.fillRect(Math.floor(sx), Math.floor(sy), 2, 7);
        }
        // ground flare
        const gr = ctx.createRadialGradient(p.cx, p.groundY, 2, p.cx, p.groundY, 44);
        gr.addColorStop(0, 'rgba(255,255,240,' + (0.8 * ft) + ')');
        gr.addColorStop(1, 'rgba(255,240,190,0)');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(p.cx, p.groundY, 44, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    } else if (p.kind === 'judgeBeam') {
      // v1.6: Seraph's Oath JUDGEMENT — a fast, holy white-gold blast column
      const ft = 1 - p.t / p.life;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const top = p.groundY - 900;
      const w = (p.wCur || 28) * (0.5 + 0.5 * ft);
      const flick = 0.8 + Math.sin(p.t * 1.6) * 0.2;
      ctx.fillStyle = 'rgba(255,244,196,' + (0.5 * ft * flick) + ')';
      ctx.fillRect(p.cx - w / 2, top, w, 900);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.85 * ft) + ')';
      ctx.fillRect(p.cx - w / 5, top, w * 0.4, 900);
      const gr = ctx.createRadialGradient(p.cx, p.groundY, 2, p.cx, p.groundY, 40);
      gr.addColorStop(0, 'rgba(255,255,255,' + (0.9 * ft) + ')');
      gr.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(p.cx, p.groundY, 40, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (p.kind === 'feather') {
      // v1.6: a homing white-gold sliver, drawn along its flight angle
      ctx.save();
      ctx.translate(p.x + 5, p.y + 5);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-4, -1, 7, 2);
      ctx.fillStyle = '#e8c060';
      ctx.fillRect(-1, -2, 4, 1);
      ctx.fillRect(3, 0, 2, 1);
      ctx.fillStyle = 'rgba(255,236,170,0.7)';
      ctx.fillRect(-6, 0, 2, 1);
      ctx.restore();
    } else if (p.kind === 'ember' || p.kind === 'emberFall') {
      // v1.5: seraph cinders — burning orbs with pixel-flame trails
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(p.x + 8, p.y + 8, 1, p.x + 8, p.y + 8, 12);
      gr.addColorStop(0, 'rgba(255,240,190,0.85)');
      gr.addColorStop(0.5, 'rgba(255,150,60,0.4)');
      gr.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(p.x + 8, p.y + 8, 12, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,170,70,0.95)';
      ctx.fillRect(p.x + 5, p.y + 5, 6, 6);
      ctx.fillStyle = '#fff4d0';
      ctx.fillRect(p.x + 7, p.y + 7, 3, 3);
      if (p.t % 3 === 0) {
        addP({
          x: p.x + 8 + rndr(-3, 3), y: p.y + 8 + rndr(-3, 3),
          vx: rndr(-0.4, 0.4), vy: rndr(-0.8, -0.1),
          life: rndr(8, 16), size: 2, type: 'px',
          col: rndr(0, 1) > 0.5 ? 'rgba(255,180,90,0.8)' : 'rgba(255,235,180,0.8)',
          drag: 0.95,
        });
      }
    } else if (p.kind === 'shadeBolt') {
      // pixelated shade bolt — keep the sprite crunchy
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      const cx = p.x + 10, cy = p.y + 10;
      // additive glow halo behind the bolt
      ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22);
      gr.addColorStop(0, 'rgba(180,170,210,0.28)');
      gr.addColorStop(1, 'rgba(180,170,210,0)');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      // the bolt sprite itself, scaled up for chunky pixels
      const img = SPR.shadeBolt.f[Math.floor(p.t / 3) % 4];
      const s = 1.6;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(s, s);
      if (p.face < 0) ctx.scale(-1, 1);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      ctx.restore();
      ctx.restore();
    } else if (p.kind === 'lightBeam') {
      // sky-to-ground pillar — tall, stationary, widens over time
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const bx = p.cx, groundY = p.groundY;
      const w = p.curW;
      const top = groundY - BEAM_HEIGHT;
      // outer wide glow
      const gr = ctx.createRadialGradient(bx, groundY, 4, bx, groundY, w * 2.5);
      gr.addColorStop(0, 'rgba(255,250,210,0.45)');
      gr.addColorStop(0.4, 'rgba(255,240,180,0.2)');
      gr.addColorStop(1, 'rgba(255,240,180,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(bx - w * 2, top, w * 4, BEAM_HEIGHT);
      // main beam body (tall rectangle)
      const flick = 0.8 + Math.sin(p.t * 1.2) * 0.2;
      ctx.fillStyle = 'rgba(255,250,210,' + (0.55 * flick) + ')';
      ctx.fillRect(bx - w / 2, top, w, BEAM_HEIGHT);
      // bright inner core
      ctx.fillStyle = 'rgba(255,255,240,' + flick + ')';
      ctx.fillRect(bx - w / 4, top, w / 2, BEAM_HEIGHT);
      // white-hot center line
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx - 2, top, 4, BEAM_HEIGHT);
      // pixel streaks falling inside the beam
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      for (let s = 0; s < 8; s++) {
        const sx = bx + (((p.t * 3 + s * 37) % (w | 0)) - w / 2);
        const sy = top + ((p.t * 12 + s * 80) % BEAM_HEIGHT);
        ctx.fillRect(Math.floor(sx), Math.floor(sy), 2, 6);
      }
      // ground impact flare — bright burst where the beam meets the ground
      const gr2 = ctx.createRadialGradient(bx, groundY, 2, bx, groundY, w * 1.8);
      gr2.addColorStop(0, 'rgba(255,255,255,0.9)');
      gr2.addColorStop(0.3, 'rgba(255,250,210,0.6)');
      gr2.addColorStop(1, 'rgba(255,250,210,0)');
      ctx.fillStyle = gr2;
      ctx.beginPath();
      ctx.arc(bx, groundY, w * 1.8, 0, Math.PI * 2);
      ctx.fill();
      // pixel impact ring on the ground
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 2;
      const ringR = w * (0.6 + Math.sin(p.t * 0.3) * 0.2);
      ctx.beginPath();
      ctx.ellipse(bx, groundY, ringR, ringR * 0.3, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    } else if (p.kind === 'slashWave') {
      // a forward-moving crescent arc
      ctx.save();
      const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
      ctx.translate(cx, cy);
      if (p.face < 0) ctx.scale(-1, 1);
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = a;
      // outer crescent
      ctx.fillStyle = 'rgba(220,235,255,0.5)';
      ctx.beginPath();
      ctx.arc(0, 0, 16, -1.2, 1.2);
      ctx.arc(6, 0, 12, 1.2, -1.2, true);
      ctx.closePath();
      ctx.fill();
      // bright inner
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(0, 0, 12, -0.9, 0.9);
      ctx.arc(4, 0, 8, 0.9, -0.9, true);
      ctx.closePath();
      ctx.fill();
      // core streak
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-2, -8, 8, 16);
      ctx.restore();
    } else if (p.kind === 'boundFly') {
      // v2.0: BOUND — the thrown void blade, spinning through the dark
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const bgr = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 34);
      bgr.addColorStop(0, 'rgba(170,140,250,0.30)');
      bgr.addColorStop(1, 'rgba(90,70,160,0)');
      ctx.fillStyle = bgr;
      ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.imageSmoothingEnabled = false;
      const bfr = SPR.boundFly.f[Math.floor(p.t / 2) % SPR.boundFly.f.length];
      ctx.drawImage(bfr, Math.round(p.x - bfr.width / 2), Math.round(p.y - bfr.height / 2));
      ctx.restore();
    }
  }
}

function updateGeos() {
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  for (let i = geos.length - 1; i >= 0; i--) {
    const g = geos[i];
    g.t++;
    if (g.t > 24) {
      const d2 = dist2(pcx, pcy, g.x, g.y);
      if (d2 < 110 * 110) {
        const d = Math.sqrt(d2) || 1;
        g.vx += ((pcx - g.x) / d) * 0.9;
        g.vy += ((pcy - g.y) / d) * 0.9;
        g.x += g.vx; g.y += g.vy;
      } else {
        g.vy += 0.3;
        g.x += g.vx; g.y += g.vy;
        if (isSolidTile(Math.floor(g.x / TILE), Math.floor((g.y + 5) / TILE))) {
          g.y -= g.vy;
          g.vy *= -0.45;
          g.vx *= 0.8;
          if (Math.abs(g.vy) < 0.8) g.vy = 0;
        }
        if (isSolidTile(Math.floor((g.x + sign(g.vx) * 5) / TILE), Math.floor(g.y / TILE))) {
          g.vx *= -0.6;
        }
      }
    } else {
      g.vy += 0.3;
      g.x += g.vx; g.y += g.vy;
    }
    if (dist2(pcx, pcy, g.x, g.y) < 22 * 22) {
      player.geo++;
      SND.geo();
      geos.splice(i, 1);
    }
  }
}

function renderGeos() {
  for (const g of geos) {
    const sq = Math.abs(Math.sin(g.t * 0.15));
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.scale(0.4 + sq * 0.6, 1);
    ctx.drawImage(SPR.geo.f[0], -9, -9);
    ctx.restore();
  }
}

/* ==========================================================================
   SECTION 10.5 — ZONE HAZARDS (v1.5): EMBER GEYSERS & PHASE CURTAINS
   Pure functions of game.frame — no per-instance state to persist.
   ========================================================================== */

function updateHazards() {
  const p = player;
  for (const g of hazardDefs.geysers) {
    const st = geyserState(g);
    const vx = g.tx * TILE + 16;
    if (st.on) {
      // erupting — scorch anything standing on the vent
      const rect = { x: g.tx * TILE + 4, y: (g.ty - 4) * TILE, w: 24, h: 4 * TILE };
      if (rectsOverlap(p, rect)) hurtPlayer(1, vx);
      if (game.frame % 2 === 0) {
        addP({
          x: vx + rndr(-8, 8), y: g.ty * TILE - rndr(4, 110),
          vx: rndr(-0.8, 0.8), vy: rndr(-4.5, -2),
          life: rndr(10, 22), size: rndr(2, 4), type: 'px',
          col: rndr(0, 1) > 0.5 ? 'rgba(255,190,90,0.9)' : 'rgba(255,240,200,0.9)',
          drag: 0.96, grav: 0.06,
        });
      }
    } else if (st.tele && game.frame % 7 === 0) {
      // pre-eruption rumble — heat shimmer at the mouth
      addP({
        x: vx + rndr(-9, 9), y: g.ty * TILE - rndr(0, 8),
        vx: rndr(-0.2, 0.2), vy: rndr(-1.4, -0.6),
        life: rndr(12, 20), size: 2, type: 'px',
        col: 'rgba(255,150,70,0.55)', drag: 0.97,
      });
    }
  }
  for (const cu of hazardDefs.curtains) {
    if (curtainOn(cu)) {
      const rect = { x: cu.tx * TILE + 10, y: cu.ty0 * TILE, w: 12, h: (cu.ty1 - cu.ty0 + 1) * TILE };
      if (rectsOverlap(p, rect)) hurtPlayer(1, cu.tx * TILE + 16);
      if (game.frame % 5 === 0) {
        addP({
          x: cu.tx * TILE + 16 + rndr(-5, 5), y: rndr(cu.ty0, cu.ty1) * TILE,
          vx: rndr(-0.3, 0.3), vy: rndr(-0.5, 0.5),
          life: rndr(10, 18), size: 2, type: 'px',
          col: rndr(0, 1) > 0.5 ? 'rgba(200,184,255,0.85)' : 'rgba(240,235,255,0.85)',
          drag: 0.96,
        });
      }
    }
  }
}

function renderHazards() {
  // ---- ember geysers (Kiln) ----
  for (const g of hazardDefs.geysers) {
    const st = geyserState(g);
    const px0 = g.tx * TILE, py = g.ty * TILE;
    // iron grate mouth (always drawn)
    ctx.fillStyle = '#1c130d';
    ctx.fillRect(px0 + 2, py - 6, 28, 6);
    ctx.fillStyle = '#3a281c';
    for (let i = 0; i < 4; i++) ctx.fillRect(px0 + 4 + i * 7, py - 5, 4, 4);
    if (st.on) {
      // erupting fire column
      const h = 4 * TILE;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const flick = 0.75 + Math.sin(game.frame * 0.7 + g.off) * 0.25;
      const gr = ctx.createLinearGradient(0, py - h, 0, py);
      gr.addColorStop(0, 'rgba(255,150,60,0)');
      gr.addColorStop(0.55, 'rgba(255,150,60,' + (0.4 * flick) + ')');
      gr.addColorStop(1, 'rgba(255,240,190,' + (0.75 * flick) + ')');
      ctx.fillStyle = gr;
      ctx.fillRect(px0 + 6, py - h, 20, h);
      // white-hot core
      ctx.fillStyle = 'rgba(255,255,235,' + (0.5 * flick) + ')';
      ctx.fillRect(px0 + 12, py - h * 0.8, 8, h * 0.8);
      ctx.restore();
    } else if (st.tele) {
      // glowing warning inside the grate
      const a = 0.35 + Math.sin(game.frame * 0.4) * 0.25;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(255,150,70,' + a + ')';
      ctx.fillRect(px0 + 4, py - 5, 24, 5);
      ctx.restore();
    }
  }
  // ---- phase curtains (Sanctum) ----
  for (const cu of hazardDefs.curtains) {
    const px0 = cu.tx * TILE;
    const top = cu.ty0 * TILE, bot = (cu.ty1 + 1) * TILE;
    // emitter nodes top & bottom (always)
    ctx.fillStyle = '#241f3c';
    ctx.fillRect(px0 + 8, top - 8, 16, 10);
    ctx.fillRect(px0 + 8, bot - 2, 16, 10);
    ctx.fillStyle = '#4c4376';
    ctx.fillRect(px0 + 10, top - 6, 12, 4);
    ctx.fillRect(px0 + 10, bot, 12, 4);
    const on = curtainOn(cu);
    const tele = curtainTele(cu);
    if (on) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const flick = 0.7 + Math.sin(game.frame * 0.5 + cu.off) * 0.3;
      const gr = ctx.createLinearGradient(px0 + 4, 0, px0 + 28, 0);
      gr.addColorStop(0, 'rgba(170,150,230,0)');
      gr.addColorStop(0.5, 'rgba(190,170,255,' + (0.5 * flick) + ')');
      gr.addColorStop(1, 'rgba(170,150,230,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(px0 + 4, top, 24, bot - top);
      ctx.fillStyle = 'rgba(245,240,255,' + (0.55 * flick) + ')';
      ctx.fillRect(px0 + 14, top, 4, bot - top);
      // rune ticks crawling along the beam
      ctx.fillStyle = 'rgba(220,200,255,0.8)';
      for (let y = top + ((game.frame * 2) % 40); y < bot; y += 40) {
        ctx.fillRect(px0 + 12, y, 8, 2);
      }
      ctx.restore();
    } else {
      // dormant — a faint violet seam marks the seal
      const a = tele ? 0.5 + Math.sin(game.frame * 0.6) * 0.3 : 0.12;
      ctx.fillStyle = 'rgba(170,150,230,' + a + ')';
      ctx.fillRect(px0 + 15, top, 2, bot - top);
    }
  }
}

/* ==========================================================================
   SECTION 11 — CAMERA & RENDERING
   ========================================================================== */

function updateCamera() {
  const p = player;
  const tx = p.x + p.w / 2 + p.face * 44 - VIEW_W / 2;
  const ty = p.y + p.h / 2 - VIEW_H / 2 - 20;
  cam.x = lerp(cam.x, tx, 0.1);
  cam.y = lerp(cam.y, ty, 0.12);
  cam.x = clamp(cam.x, 0, GW * TILE - VIEW_W);
  cam.y = clamp(cam.y, 0, GH * TILE - VIEW_H);
  if (cam.shake > 0) {
    cam.shake *= 0.86;
    if (cam.shake < 0.3) cam.shake = 0;
    cam.sx = rndr(-cam.shake, cam.shake);
    cam.sy = rndr(-cam.shake, cam.shake);
  } else { cam.sx = 0; cam.sy = 0; }
}

function renderWorld() {
  // reset canvas state each frame so leaked transforms can never smear the screen
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;

  const z = zoneIndexAtPx(player.x + player.w / 2);
  const Z = ZONES[z];
  const cx = cam.x + cam.sx, cy = cam.y + cam.sy;

  ctx.fillStyle = Z.bg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  for (let L = 0; L < SPR.bg[z].length; L++) {
    const layer = SPR.bg[z][L];
    const ox = -Math.floor((cx * layer.depth) % 1024);          // v1.4: integer offsets keep pixels crisp
    const oy = -90 - Math.floor((cy - 3200) * layer.depth * 0.3);
    ctx.drawImage(layer.c, ox, oy);
    ctx.drawImage(layer.c, ox + 1024, oy);
    if (ox + 2048 < VIEW_W) ctx.drawImage(layer.c, ox + 2048, oy);
  }

  ctx.fillStyle = Z.fog;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  ctx.save();
  ctx.translate(-cx, -cy);

  const vx0 = cx - 100, vx1 = cx + VIEW_W + 100, vy0 = cy - 120, vy1 = cy + VIEW_H + 120;

  // ------ decor (anchored: vines hang from d.y, floor props stand on d.y) --
  for (const d of decor) {
    if (d.x < vx0 - 100 || d.x > vx1 + 100 || d.y < vy0 - 200 || d.y > vy1 + 200) continue;
    if (d.type === 'vine') {
      const img = getVine(d.len, d.z);
      ctx.drawImage(img, d.x + 1, d.y - 2);
    } else if (d.type === 'mushroom') {
      const img = getMush(d.scale, d.z);
      ctx.save();
      ctx.translate(d.x + 16, d.y);
      if (d.flip) ctx.scale(-1, 1);
      ctx.drawImage(img, -32, -54);
      ctx.restore();
    } else if (d.type === 'bones') {
      ctx.drawImage(SPR.bones, d.x - 14, d.y - 21);
    } else if (d.type === 'lamp') {
      ctx.drawImage(SPR.lamp, d.x - 4, d.y - 82);
    }
  }

  // ------ tiles ------
  const tx0 = Math.max(0, Math.floor(cx / TILE));
  const ty0 = Math.max(0, Math.floor(cy / TILE));
  const tx1 = Math.min(GW - 1, Math.floor((cx + VIEW_W) / TILE));
  const ty1 = Math.min(GH - 1, Math.floor((cy + VIEW_H) / TILE));
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const v = grid[T(tx, ty)];
      if (v === 0) continue;
      const px = tx * TILE, py = ty * TILE;
      if (v === 2) {
        ctx.drawImage(SPR.spike, px, py);
        continue;
      }
      if (v === 3) {
        ctx.drawImage(SPR.plank, px, py - 6);
        continue;
      }
      const vars = SPR.tiles[z][(tx * 7 + ty * 13) % 4];
      const openTop = tileGet(tx, ty - 1) === 0 || tileGet(tx, ty - 1) === 2;
      const openBottom = tileGet(tx, ty + 1) === 0;
      if (openTop) ctx.drawImage(vars.top, px, py);
      else if (openBottom) ctx.drawImage(vars.bott, px, py);
      else ctx.drawImage(vars.innr, px, py);
    }
  }

  // ------ v1.5 zone hazards (geysers / curtains) ------
  renderHazards();

  // ------ furniture (bottom-center anchored to the ground line) ------
  for (const b of benches) {
    ctx.drawImage(SPR.bench, b.ax - 60, b.ay - 58);
  }
  for (const t of tablets) {
    ctx.drawImage(SPR.tablet, t.ax - 26, t.ay - 64);
  }
  for (const t of totems) {
    ctx.drawImage(SPR.totem, t.ax - 28, t.ay - 86);
    if (!t.used) {
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(game.frame * 0.05) * 0.2;
      ctx.fillStyle = 'rgba(210,235,235,0.5)';
      ctx.beginPath();
      ctx.arc(t.ax, t.ay - 46, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ------ chests ------
  for (const c of chests) {
    if (c.opened) {
      // open chest: draw with lid swung back, show the Illumina floating out
      ctx.save();
      ctx.translate(c.x + c.w / 2, c.y + c.h);
      // base box (lid drawn open)
      ctx.drawImage(SPR.chest, -24, -38);
      // floating Illumina sword rising from the open chest
      const rise = Math.min(40, c.openT * 40);
      const bob = Math.sin(game.frame * 0.08) * 3;
      ctx.save();
      ctx.translate(0, -38 - rise + bob);
      ctx.globalAlpha = Math.min(1, c.openT);
      ctx.drawImage(SPR.relicIllumina, -28, -54);
      ctx.restore();
      // light rays
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.4 * Math.min(1, c.openT);
      const gr = ctx.createRadialGradient(0, -38, 4, 0, -38, 50);
      gr.addColorStop(0, 'rgba(255,250,210,0.5)');
      gr.addColorStop(1, 'rgba(255,250,210,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(0, -38, 50, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.restore();
      // animate the open timer
      if (c.openT < 1) c.openT = Math.min(1, c.openT + 0.04);
    } else {
      // closed chest
      ctx.drawImage(SPR.chest, c.x, c.y);
      // subtle glint on the lock
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(game.frame * 0.05) * 0.3;
      ctx.fillStyle = 'rgba(255,245,200,0.4)';
      ctx.beginPath();
      ctx.arc(c.x + c.w / 2, c.y + 28, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ------ relics ------
  for (const pk of pickups) {
    if (pk.taken) continue;
    pk.bob += 0.04;
    const by = pk.y + Math.sin(pk.bob) * 5;
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(pk.bob * 1.4) * 0.12;
    const img = pk.type === 'wings' ? SPR.relicWings :
                pk.type === 'claws' ? SPR.relicClaws :
                pk.type === 'mask' ? SPR.relicMask :
                pk.type === 'illumina' ? SPR.relicIllumina :
                pk.type === 'seraph' ? SPR.seraphRelic : SPR.relicVessel;
    ctx.fillStyle = 'rgba(230,235,240,0.25)';
    ctx.beginPath();
    ctx.arc(pk.x, by, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.drawImage(img, pk.x - img.width / 2, by - img.height / 2);
    ctx.restore();
  }

  // ------ ending door (v1.5: awakens only after the SERAPH falls) ------
  if (endingDoor && game.boss2Dead) {
    ctx.save();
    ctx.globalAlpha = 0.7 + Math.sin(game.frame * 0.03) * 0.2;
    ctx.drawImage(SPR.door, endingDoor.x - 15, endingDoor.y - 32);
    ctx.restore();
  }

  // ------ actors ------
  for (const e of enemies) renderEnemy(e);
  renderBoss();
  renderBossFx();                      // v1.6: the lords' pixel blade arcs
  if (shade) {
    shade.t++;
    drawSpr(SPR.shade, Math.floor(shade.t / 9), shade.x + 17, shade.y + 50, false,
      0.75 + Math.sin(shade.t * 0.08) * 0.15);
  }
  renderGeos();
  renderProjectiles();

  renderPlayer();

  renderParticles();

  // ambient motes
  ctx.save();
  for (const m of motes) {
    m.x += Math.sin(game.frame * 0.008 * m.sp + m.ph) * 0.3;
    m.y -= m.sp * 0.4;
    if (m.y < cy - 50) m.y = cy + VIEW_H + 40;
    if (m.x < cx - 50) m.x = cx + VIEW_W + 40;
    if (m.x > cx + VIEW_W + 50) m.x = cx - 40;
    if (m.y > cy + VIEW_H + 60) m.y = cy - 40;
    if (m.x < vx0 || m.x > vx1 || m.y < vy0 || m.y > vy1) continue;
    ctx.globalAlpha = 0.14 + Math.sin(game.frame * 0.03 + m.ph) * 0.08;
    ctx.fillStyle = Z.glow;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // light halos — lamps aligned to their lanterns, benches get a warm pool
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const d of decor) {
    if (d.type !== 'lamp') continue;
    if (d.x < vx0 || d.x > vx1 || d.y < vy0 - 100 || d.y > vy1) continue;
    const lx = d.x + 16, ly = d.y - 48;   // lantern position on the post
    const gr = ctx.createRadialGradient(lx, ly, 4, lx, ly, 90);
    gr.addColorStop(0, 'rgba(240,232,200,0.14)');
    gr.addColorStop(1, 'rgba(240,232,200,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(lx, ly, 90, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const b of benches) {
    if (b.ax < vx0 || b.ax > vx1 || b.ay < vy0 || b.ay > vy1) continue;
    const gr = ctx.createRadialGradient(b.ax, b.ay - 30, 4, b.ax, b.ay - 30, 70);
    gr.addColorStop(0, 'rgba(240,225,190,0.10)');
    gr.addColorStop(1, 'rgba(240,225,190,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(b.ax, b.ay - 30, 70, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.restore();

  // vignette
  const vg = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.36, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

function renderPlayer() {
  const p = player;
  if (p.dead) return;
  if (p.invT > 0 && p.hazardFade === 0 && Math.floor(game.frame / 4) % 2 === 0 && p.hurtT <= 0) {
    if (p.invT > 20) return;
  }
  const cx = p.x + p.w / 2;
  const bottom = p.y + p.h + 2;
  const spr = SPR.knight[p.state] || SPR.knight.idle;
  // Pick the animation frame based on state:
  //  - jump: 4 frames mapped to velocity (crouch→launch→apex→hang)
  //  - dash: 4 frames mapped to the dash timer (wind-up→extend→sustain→recover)
  //  - run:  fast cycle
  //  - others: slow breathe cycle
  let idx;
  if (p.state === 'jump') {
    // choose frame from vertical velocity: rising fast = launch, slow = apex, falling = hang
    if (p.vy < -6)      idx = 1;   // launch (springing up)
    else if (p.vy < -1) idx = 2;   // apex tuck
    else                idx = 3;   // hang / starting to fall
    // idx 0 (crouch) only shows very briefly at jump start — handled by jbuf
  } else if (p.state === 'dash') {
    // dashT counts down from 9. Map: 9-7 = wind-up, 6-4 = extend, 3-1 = sustain, 0 = recover
    if (p.dashT >= 7)      idx = 0;   // wind-up
    else if (p.dashT >= 4) idx = 1;   // extend
    else if (p.dashT >= 1) idx = 2;   // sustain
    else                   idx = 3;   // recover
  } else if (p.state === 'run') {
    idx = Math.floor(p.anim / 3);
  } else {
    idx = Math.floor(p.anim / 8);
  }
  drawSpr(spr, idx, cx, bottom, p.face < 0);

  // v1.6: SERAPH'S OATH idle — the knight holds the winged blade out to the
  // side while its wings flap and its aura shines.
  if (p.weapon === 'seraph' && p.state === 'idle' && p.attackT <= 0) {
    drawSeraphIdleBlade(p);
  }
  // v1.6: OATH DASH — blade points along the dash vector
  if (p.oathT > 0) {
    const ang = Math.atan2(p.oathDirY, p.oathDirX);
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    ctx.rotate(ang);
    ctx.imageSmoothingEnabled = false;
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(34, 0, 4, 34, 0, 58);
    gr.addColorStop(0, 'rgba(255,240,180,0.4)');
    gr.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(34, 0, 58, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    const fr = SPR.seraphHand.f[Math.floor(game.frame / 3) % 4];
    ctx.drawImage(fr, -24, -34);   // pivot = guard hub at grid (12,17) @2×
    ctx.restore();
  }

  // pixel nail slash — per-direction anchors, varied by combo step
  if (p.attackT > 0) {
    const prog = 1 - p.attackT / 11;
    if (p.weapon === 'bound') {
      // v2.0: BOUND — only the thrower's flick; the blade itself is in the air
      drawSlash(cx + p.face * 10, p.y + p.h * 0.45,
        p.attackDir === 1 ? 1 : (p.attackDir === 2 ? 2 : 0), prog, p.face < 0);
    } else {
    // combo step shifts the slash anchor so each hit reads as a different swing
    const step = p.comboStep || 1;
    if (p.attackDir === 1) {
      drawSlash(cx + p.face * 3, p.y - 4, 1, prog, p.face < 0);
    } else if (p.attackDir === 2) {
      drawSlash(cx, p.y + p.h + 2, 2, prog, p.face < 0);
    } else {
      // side attacks: step 1 = overhead chop (higher), step 2 = backhand (lower),
      // step 3 = power thrust (centered, bigger)
      if (step === 1)      drawSlash(cx + p.face * 6, p.y + p.h * 0.25, 0, prog, p.face < 0);
      else if (step === 2) drawSlash(cx + p.face * 10, p.y + p.h * 0.65, 0, prog, p.face < 0);
      else                 drawSlash(cx + p.face * 8, p.y + p.h * 0.45, 0, prog, p.face < 0);
    }
    // draw the nail itself, sweeping along the same arc
    drawNail(p);
    }
  }
}

/* -- v1.6: the knight at rest, blade held out to the side ------------------- */
function drawSeraphIdleBlade(p) {
  const cx = p.x + p.w / 2;
  const hy = p.y + p.h * 0.52 + Math.sin(game.frame * 0.05) * 1.2;
  const fr = SPR.seraphHand.f[Math.floor(game.frame / 6) % 4];
  if (!fr) return;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(cx + p.face * 32, hy);   // v1.8: held well clear of the knight
  if (p.face < 0) ctx.scale(-1, 1);
  ctx.rotate(-0.12 + Math.sin(game.frame * 0.05) * 0.05);
  // shining aura (the sword breathes light)
  ctx.globalCompositeOperation = 'lighter';
  const gr = ctx.createRadialGradient(32, 0, 3, 32, 0, 58);
  gr.addColorStop(0, 'rgba(255,244,190,' + (0.28 + Math.sin(game.frame * 0.07) * 0.08) + ')');
  gr.addColorStop(0.6, 'rgba(255,224,140,0.10)');
  gr.addColorStop(1, 'rgba(255,224,140,0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(32, 0, 58, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(fr, -24, -34);   // pivot = guard hub at grid (12,17) @2×
  ctx.restore();
}

/* -- nail (sword) renderer --------------------------------------------------
   Draws the cached pixel nail sprite rotated to match the current swing
   angle.  The nail's pivot is at the grip (just behind the guard), and the
   blade sweeps through the same arc as the slash effect.
   -------------------------------------------------------------------------- */
function drawNail(p) {
  // hand position — roughly at the knight's mid-chest, offset toward facing
  const hx = p.x + p.w / 2 + p.face * 4;
  const hy = p.y + p.h * 0.45;

  // swing angle: match drawSlash's sweep (-SWEEP_HALF .. +SWEEP_HALF)
  const prog = 1 - p.attackT / 11;
  const SWEEP_HALF = 1.30;
  const swingAng = -SWEEP_HALF + prog * SWEEP_HALF * 2;

  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.translate(hx, hy);
  if (p.face < 0) ctx.scale(-1, 1);

  // base rotation for the attack direction
  let dirRot = 0;
  if (p.attackDir === 1) dirRot = -Math.PI / 2;   // up
  if (p.attackDir === 2) dirRot = Math.PI / 2;    // down
  ctx.rotate(dirRot);

  // apply the swing
  ctx.rotate(swingAng);

  if (p.weapon === 'illumina') {
    // ILLUMINA (v1.4) — the pixel-art winged light blade, rotated to the
    // swing.  A soft additive halo breathes behind the crisp pixels.
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(18, 0, 2, 18, 0, 34);
    gr.addColorStop(0, 'rgba(255,250,210,0.35)');
    gr.addColorStop(0.6, 'rgba(200,230,255,0.12)');
    gr.addColorStop(1, 'rgba(200,230,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(18, 0, 34, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    const img = SPR.illuminaHand;
    if (img) {
      ctx.drawImage(img, -8, -14);   // pivot = grip at grid (4,7) @2×
    } else {
      // fallback (should never hit): simple bright sliver
      ctx.fillStyle = '#eaf6ff';
      ctx.fillRect(6, -1, 26, 2);
    }
  } else if (p.weapon === 'seraph') {
    // v1.6: SERAPH'S OATH — the long winged blade, wings fluttering as it
    // sweeps, a holy halo trailing the arc.
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(32, 0, 3, 32, 0, 58);
    gr.addColorStop(0, 'rgba(255,244,190,0.34)');
    gr.addColorStop(0.6, 'rgba(255,224,140,0.12)');
    gr.addColorStop(1, 'rgba(255,224,140,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(32, 0, 58, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    const fr = SPR.seraphHand && SPR.seraphHand.f[Math.floor(game.frame / 4) % 4];
    if (fr) {
      ctx.drawImage(fr, -24, -34);   // pivot = guard hub at grid (12,17) @2×
    } else {
      ctx.fillStyle = '#fff0b0';
      ctx.fillRect(6, -1, 34, 2);
    }
  } else {
    // default nail — cached pixel sprite
    const img = SPR.nail && SPR.nail.side;
    if (!img) { ctx.restore(); return; }
    // draw the nail with the grip at origin, blade extending right
    // img is 48x20, grip is at x≈6 (just past the pommel)
    const gripX = 6;
    const gripY = 10;
    ctx.drawImage(img, -gripX, -gripY);
  }

  ctx.restore();
}

/* ==========================================================================
   SECTION 12 — HUD, MAP, MENUS, OVERLAYS
   ========================================================================== */

function drawMaskIcon(x, y, filled, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = filled ? '#e9e6da' : 'rgba(233,230,218,0.14)';
  ctx.beginPath();
  ctx.moveTo(-8, 2);
  ctx.bezierCurveTo(-9, -9, -5, -13, 0, -13);
  ctx.bezierCurveTo(5, -13, 9, -9, 8, 2);
  ctx.bezierCurveTo(6, 8, 3, 10, 0, 10);
  ctx.bezierCurveTo(-3, 10, -6, 8, -8, 2);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-4, -11); ctx.quadraticCurveTo(-8, -17, -6, -21);
  ctx.quadraticCurveTo(-4, -16, -1, -13);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(4, -11); ctx.quadraticCurveTo(8, -17, 6, -21);
  ctx.quadraticCurveTo(4, -16, 1, -13);
  ctx.closePath(); ctx.fill();
  if (filled) {
    ctx.fillStyle = '#101014';
    ctx.beginPath(); ctx.ellipse(-3.4, 0, 1.7, 2.8, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3.4, 0, 1.7, 2.8, -0.1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// Skill icon: a small medallion with cooldown sweep + soul cost.
// v1.6: mode picks the rite — 'shade' | 'beam' | 'judge' | 'oath'
function drawSkillIcon(x, y, p, mode) {
  ctx.save();
  ctx.translate(x, y);

  const r = 22;
  const isOath = mode === 'oath';
  const cost  = (mode === 'beam' || mode === 'judge') ? BEAM_COST : (isOath ? OATH_COST : SKILL_COST);
  const cdMax = (mode === 'beam' || mode === 'judge') ? BEAM_CD   : (isOath ? OATH_CD   : SKILL_CD);
  const cd    = isOath ? p.skillBCD : p.skillCD;
  const onCD = cd > 0;
  const enoughSoul = p.soul >= cost;
  const ready = !onCD && enoughSoul;
  const label = mode === 'judge' ? 'JUDGEMENT'
              : mode === 'oath'  ? 'OATH DASH'
              : mode === 'beam'  ? 'LIGHT BEAM' : 'SHADE';
  const keyHint = isOath ? 'B' : 'V';

  // backdrop
  ctx.fillStyle = 'rgba(10,12,14,0.75)';
  ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, Math.PI * 2); ctx.fill();

  // ring — bright when ready, dim when not
  const ringCol = ready
    ? (mode === 'shade' ? 'rgba(180,170,210,0.95)' : 'rgba(255,236,150,0.95)')
    : 'rgba(233,228,216,0.3)';
  ctx.strokeStyle = ringCol;
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(0, 0, r + 5, 0, Math.PI * 2); ctx.stroke();

  // cooldown sweep — dark arc covering the fraction remaining
  if (onCD) {
    const frac = cd / cdMax;
    ctx.fillStyle = 'rgba(8,8,12,0.8)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r + 5, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
    ctx.closePath();
    ctx.fill();
  }

  // inner field
  const fieldCol = enoughSoul
    ? (mode === 'shade' ? 'rgba(180,170,210,0.18)' : 'rgba(255,236,150,0.2)')
    : 'rgba(60,55,70,0.4)';
  ctx.fillStyle = fieldCol;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

  // glyph
  if (mode === 'shade' && SPR.shadeBolt) {
    ctx.imageSmoothingEnabled = false;
    const img = SPR.shadeBolt.f[0];
    ctx.globalAlpha = ready ? 1 : (onCD ? 0.35 : 0.55);
    const s = 1.1;
    ctx.save();
    ctx.scale(s, s);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    ctx.restore();
    ctx.globalAlpha = 1;
  } else if (mode === 'judge') {
    // three tiny golden pillars
    ctx.globalAlpha = ready ? 1 : (onCD ? 0.35 : 0.55);
    const flick = 0.8 + Math.sin(game.frame * 0.3) * 0.2;
    for (const bx of [-9, 0, 9]) {
      ctx.fillStyle = 'rgba(255,244,180,' + flick + ')';
      ctx.fillRect(bx - 1, -11, 3, 22);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx, -9, 1, 18);
    }
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
    gr.addColorStop(0, 'rgba(255,244,180,0.4)');
    gr.addColorStop(1, 'rgba(255,244,180,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  } else if (mode === 'oath') {
    // a golden blade spearing up-right with motion dashes
    ctx.globalAlpha = ready ? 1 : (onCD ? 0.35 : 0.55);
    ctx.strokeStyle = 'rgba(255,232,150,0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-9, 9); ctx.lineTo(9, -9); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(7, -11, 4, 4);
    ctx.strokeStyle = 'rgba(255,232,150,0.45)';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-6, 13); ctx.lineTo(2, 5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-13, 6); ctx.lineTo(-5, -2); ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    // light beam glyph (Illumina)
    ctx.globalAlpha = ready ? 1 : (onCD ? 0.35 : 0.55);
    const flick = 0.8 + Math.sin(game.frame * 0.3) * 0.2;
    ctx.fillStyle = 'rgba(255,250,210,' + flick + ')';
    ctx.fillRect(-2, -12, 4, 24);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-1, -10, 2, 20);
    ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(0, 0, 2, 0, 0, 14);
    gr.addColorStop(0, 'rgba(255,250,210,0.4)');
    gr.addColorStop(1, 'rgba(255,250,210,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  // skill name label
  ctx.fillStyle = enoughSoul
    ? (mode === 'shade' ? 'rgba(180,170,210,0.9)' : 'rgba(255,236,150,0.9)')
    : 'rgba(233,228,216,0.35)';
  ctx.font = '600 11px Cinzel, serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, 0, r + 20);
