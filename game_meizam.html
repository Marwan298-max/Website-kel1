<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puing Pesawat - Hutan Belantara</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0806;--card:#1a1410;--accent:#e8943a;--green:#4a7a3a;--text:#e0d8c8;--muted:#7a6a5a;--danger:#c94040;--border:#2a2018}
body{background:var(--bg);font-family:'Press Start 2P',monospace;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;user-select:none}
#wrap{position:relative;border:4px solid var(--border);box-shadow:0 0 60px rgba(232,148,58,.12),inset 0 0 40px rgba(0,0,0,.6);image-rendering:pixelated;image-rendering:crisp-edges}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;top:0;left:0;right:0;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,transparent 100%);pointer-events:none;font-size:9px;z-index:5;gap:6px}
.hi{display:flex;align-items:center;gap:5px}
.hi .lb{color:var(--muted);font-size:7px}
.hi .vl{color:var(--accent);font-size:9px}
.ht{color:var(--accent);font-size:9px;text-shadow:0 0 8px rgba(232,148,58,.4);letter-spacing:1px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:rgba(10,8,6,.95);transition:opacity .4s;padding:20px;text-align:center}
#ov.hid{opacity:0;pointer-events:none}
.ov-t{font-size:16px;color:var(--accent);text-shadow:3px 3px 0 #3a2000,0 0 20px rgba(232,148,58,.3);margin-bottom:8px;letter-spacing:2px;line-height:1.6}
.ov-sub{font-size:7px;color:var(--muted);margin-bottom:16px;text-align:center;line-height:2.2;max-width:650px}
.mission-box{background:rgba(232,148,58,.08);border:2px solid rgba(232,148,58,.25);padding:12px 16px;margin-bottom:16px;max-width:560px;text-align:left}
.mission-box .mt{font-size:8px;color:var(--accent);margin-bottom:8px;letter-spacing:1px}
.mission-box .mi{font-size:7px;color:var(--text);line-height:2.2;padding-left:8px;border-left:2px solid var(--muted);margin:4px 0}
.mission-box .mi.done{border-left-color:var(--green);color:var(--green)}
.mission-box .mi.active{border-left-color:var(--accent);color:var(--accent)}
.btn{font-family:'Press Start 2P',monospace;font-size:9px;padding:12px 24px;background:var(--accent);color:#1a0e00;border:none;cursor:pointer;transition:all .15s;box-shadow:0 4px 0 #8a5a18,0 6px 12px rgba(0,0,0,.4);letter-spacing:1px;margin:5px}
.btn:hover{background:#f0a44a;transform:translateY(-2px);box-shadow:0 6px 0 #8a5a18,0 8px 16px rgba(0,0,0,.5)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a5a18}
.btn.danger{background:var(--danger);box-shadow:0 4px 0 #8a2020,0 6px 12px rgba(0,0,0,.4)}
.btn.green{background:var(--green);box-shadow:0 4px 0 #2a5a1a,0 6px 12px rgba(0,0,0,.4)}
.st{font-size:7px;color:var(--muted);margin:12px 0 5px;text-align:center;line-height:2.2}
.sr{display:flex;justify-content:space-between;gap:20px;margin:2px 0;font-size:7px}
.sr .sk{color:var(--muted)}.sr .sv{color:var(--accent)}
#tc{position:absolute;bottom:8px;left:8px;display:none;z-index:6}
.tb{width:48px;height:48px;background:rgba(232,148,58,.2);border:2px solid rgba(232,148,58,.4);border-radius:10px;color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.tb:active{background:rgba(232,148,58,.5)}
.tr{display:flex;gap:5px}
.tc-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.tc-right{margin-left:16px}
.ch1-end{font-size:12px;color:#f0c060;text-shadow:0 0 20px rgba(240,192,96,.5),2px 2px 0 #3a2000;margin-top:14px;letter-spacing:2px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.npc-choice{font-family:'Press Start 2P',monospace;font-size:7px;padding:8px 14px;background:rgba(232,148,58,.15);color:var(--text);border:1px solid rgba(232,148,58,.3);cursor:pointer;text-align:left;width:100%;margin:3px 0;transition:all .1s}
.npc-choice:hover{background:rgba(232,148,58,.3);color:var(--accent)}
@media(max-width:700px){#tc{display:flex;align-items:flex-end;gap:10px}}
@media(hover:none)and (pointer:coarse){#tc{display:flex;align-items:flex-end;gap:10px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="gc"></canvas>
<div id="hud" class="hid">
<span class="ht" id="hLoc">HUTAN BELANTARA</span>
<div class="hi"><span class="lb">NYAWA</span><span class="vl" id="hHp">5</span></div>
<div class="hi"><span class="lb">BARANG</span><span class="vl" id="hInv">0</span></div>
</div>
<div id="ov"></div>
<div id="tc">
<div class="tc-col">
<div class="tb" data-k="ArrowUp">▲</div>
<div class="tr"><div class="tb" data-k="ArrowLeft">◄</div><div class="tb" data-k="ArrowRight">►</div></div>
<div class="tb" data-k="ArrowDown">▼</div>
</div>
<div class="tc-col tc-right">
<div class="tb" data-k="e" style="font-size:8px;letter-spacing:0">TALK</div>
</div>
</div>
</div>
<script>
/* ============================================
   PUING PESAWAT - Hutan Belantara
   RPG Top-Down ala Stardew Valley
   ============================================ */
const cvs=document.getElementById('gc'),ctx=cvs.getContext('2d');
const GW=800,GH=600,T=32;
cvs.width=GW;cvs.height=GH;

const hud=document.getElementById('hud'),ov=document.getElementById('ov');
const hLoc=document.getElementById('hLoc'),hHp=document.getElementById('hHp'),hInv=document.getElementById('hInv');

// Tile types
const AIR=0,GRASS=1,TALLGRASS=2,DIRT=3,TREE=4,TREE2=5,BUSH=6,WATER=7,ROCK=8,
PLANE_BODY=10,PLANE_WING=11,PLANE_TAIL=12,PLANE_NOSE=13,DEBRIS=14,FIRE=15,
PATH=16,FLOWER_R=17,FLOWER_Y=18,FLOWER_B=19,LOG=20,TENT=21,CAMPFIRE=22,
SIGN=23,HOUSE=24,DOOR=25,CLIFF=26,RIVER_EDGE=28,BRIDGE=29;

// Tile solid/interact properties
const SOLID=new Set([TREE,TREE2,ROCK,PLANE_BODY,PLANE_WING,PLANE_TAIL,PLANE_NOSE,DEBRIS,
CLIFF,LOG,HOUSE,WATER,RIVER_EDGE]);
const INTERACT_TILES=new Set([TENT,CAMPFIRE,SIGN,DOOR,PLANE_BODY]);

let state='menu',frameCount=0;
let map=[],mW=0,mH=0;
let camX=0,camY=0;
let player={x:0,y:0,speed:2.8,facing:'down',frame:0,hp:5,maxHp:5,inv:0,moveCD:0};
let inventory=[],questItems={};
let particles=[],floatTexts=[],smokeP=[];
let npcs=[],items_on_ground=[];
let dialogBox=null,dialogChoices=null,dialogCallback=null;
let notifications=[];
let questProgress={talkedPakBudi:false,gotSurvivalKit:false,gotFirstAid:false,
  gotBlackBox:false,gotRadio:false,talkedRina:false,foundPath:false,
  talkedSurya:false,gotCompass:false,foundExit:false,talkedAnisa:false,hasAllItems:false};

const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;
if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});
window.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('.tb').forEach(b=>{
const k=b.dataset.k;
b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true},{passive:false});
b.addEventListener('touchend',e=>{e.preventDefault();keys[k]=false},{passive:false});
b.addEventListener('mousedown',()=>keys[k]=true);
b.addEventListener('mouseup',()=>keys[k]=false);
b.addEventListener('mouseleave',()=>keys[k]=false);
});

// === MAP GENERATION ===
function generateMap(){
mW=50;mH=50;map=[];
// Inisialisasi semua grass
for(let y=0;y<mH;y++){map[y]=[];for(let x=0;x<mW;x++)map[y][x]=GRASS;}

// Hutan lebat - pohon-pohon besar
const treePositions=[];
for(let i=0;i<180;i++){
let tx=Math.floor(Math.random()*mW),ty=Math.floor(Math.random()*mH);
// Jangan taruh pohon di area spawn dan bangkai pesawat
if(tx>=20&&tx<=32&&ty>=20&&ty<=28)continue;
if(tx>=2&&tx<=6&&ty>=2&&ty<=5)continue;
if(tx>=44&&tx<=47&&ty>=2&&ty<=5)continue;
if(treePositions.some(t=>Math.abs(t[0]-tx)<2&&Math.abs(t[1]-ty)<2))continue;
map[ty][tx]=Math.random()>0.4?TREE:TREE2;
treePositions.push([tx,ty]);
}

// Semak-semak
for(let i=0;i<60;i++){
let tx=Math.floor(Math.random()*mW),ty=Math.floor(Math.random()*mH);
if(SOLID.has(map[ty][tx]))continue;
if(tx>=20&&tx<=32&&ty>=20&&ty<=28)continue;
if(tx>=2&&tx<=6&&ty>=2&&ty<=5)continue;
map[ty][tx]=BUSH;
}

// Rumput tinggi
for(let i=0;i<100;i++){
let tx=Math.floor(Math.random()*mW),ty=Math.floor(Math.random()*mH);
if(SOLID.has(map[ty][tx]))continue;
if(tx>=20&&tx<=32&&ty>=20&&ty<=28)continue;
map[ty][tx]=TALLGRASS;
}

// Bunga-bunga
for(let i=0;i<40;i++){
let tx=Math.floor(Math.random()*mW),ty=Math.floor(Math.random()*mH);
if(SOLID.has(map[ty][tx])||map[ty][tx]===TALLGRASS)continue;
map[ty][tx]=[FLOWER_R,FLOWER_Y,FLOWER_B][Math.floor(Math.random()*3)];
}

// === BANGKAI PESAWAT (pusat map) ===
// Badan utama
for(let x=22;x<=30;x++)map[22][x]=PLANE_BODY;
for(let x=22;x<=30;x++)map[23][x]=PLANE_BODY;
for(let x=22;x<=30;x++)map[24][x]=PLANE_BODY;
// Sayap kiri (patah)
for(let y=21;y<=25;y++)map[y][20]=PLANE_WING;
for(let y=21;y<=25;y++)map[y][19]=PLANE_WING;
// Sayap kanan (patah, miring)
for(let y=20;y<=22;y++)map[y][32]=PLANE_WING;
for(let y=20;y<=22;y++)map[y][33]=PLANE_WING;
// Ekor
map[21][21]=PLANE_TAIL;map[20][21]=PLANE_TAIL;map[20][22]=PLANE_TAIL;
// Hidung
map[23][31]=PLANE_NOSE;map[22][31]=PLANE_NOSE;
// Puing-puing di sekitar
const debrisCoords=[[18,23],[18,24],[19,22],[33,22],[33,23],[34,21],[34,22],[25,26],[27,26],[28,26],[24,20],[26,20]];
debrisCoords.forEach(d=>{if(d[0]>=0&&d[0]<mW&&d[1]>=0&&d[1]<mH)map[d[1]][d[0]]=DEBRIS;});
// Api kecil
map[21][24]=FIRE;map[21][25]=FIRE;

// === SUNGAI (dari utara ke selatan, sedikit berkelok) ===
for(let y=0;y<mH;y++){
let rx=10+Math.floor(Math.sin(y*0.15)*2);
for(let dx=-1;dx<=1;dx++){
let x=rx+dx;
if(x>=0&&x<mW&&!(y>=18&&y<=26&&x>=8&&x<=12)){
if(dx===0)map[y][x]=WATER;
else if(!SOLID.has(map[y][x]))map[y][x]=RIVER_EDGE;
}
}
}
// Jembatan menyeberangi sungai
for(let x=8;x<=13;x++){map[20][x]=BRIDGE;map[21][x]=BRIDGE;}

// === JALUR SETAPAK dari pesawat ke selatan ===
for(let y=26;y<=35;y++){
let px=25+Math.floor(Math.sin(y*0.2)*1);
for(let dx=-1;dx<=1;dx++){
let x=px+dx;
if(x>=0&&x<mW&&!SOLID.has(map[y][x]))map[y][x]=PATH;
}
}
// Percabangan ke barat (ke tenda Pak Budi)
for(let x=15;x<=24;x++){if(!SOLID.has(map[28][x]))map[28][x]=PATH;}
// Percabangan ke timur (ke Rina)
for(let x=26;x<=35;x++){if(!SOLID.has(map[30][x]))map[30][x]=PATH;}
// Jalur utama terus ke selatan
for(let y=35;y<=45;y++){
let px=25;
if(!SOLID.has(map[y][px]))map[y][px]=PATH;
if(px+1<mW&&!SOLID.has(map[y][px+1]))map[y][px+1]=PATH;
}

// === AREA PAK BUDI (barat laut) ===
// Tenda
map[26][13]=TENT;map[26][14]=TENT;
// Api unggun
map[27][15]=CAMPFIRE;
// Tanda
map[28][16]=SIGN;
// Bersihkan area sekitar tenda
for(let y=25;y<=30;y++)for(let x=11;x<=18;x++){
if(!SOLID.has(map[y][x])&&map[y][x]!==TENT&&map[y][x]!==CAMPFIRE&&map[y][x]!==SIGN)
map[y][x]=GRASS;
}

// === AREA RINA (timur) ===
// Tenda kecil
map[29][36]=TENT;map[29][37]=TENT;
// Bersihkan area
for(let y=28;y<=33;y++)for(let x=34;x<=40;x++){
if(!SOLID.has(map[y][x])&&map[y][x]!==TENT)map[y][x]=GRASS;
}

// === AREA SURYA (selatan) ===
map[40][24]=TENT;map[40][25]=TENT;
map[41][26]=CAMPFIRE;
for(let y=38;y<=44;y++)for(let x=22;x<=30;x++){
if(!SOLID.has(map[y][x])&&map[y][x]!==TENT&&map[y][x]!==CAMPFIRE)map[y][x]=GRASS;
}

// === AREA ANISA & PULANG (ujung selatan) ===
// Rumah kecil
map[46][23]=HOUSE;map[46][24]=HOUSE;map[46][25]=HOUSE;
map[47][23]=HOUSE;map[47][24]=DOOR;map[47][25]=HOUSE;
map[48][23]=HOUSE;map[48][24]=HOUSE;map[48][25]=HOUSE;
// Bersihkan area rumah
for(let y=43;y<=49;y++)for(let x=20;x<=28;x++){
if(!SOLID.has(map[y][x])&&map[y][x]!==HOUSE&&map[y][x]!==DOOR)map[y][x]=GRASS;
}
// Jalan ke rumah
for(let y=43;y<=46;y++){if(!SOLID.has(map[y][24]))map[y][24]=PATH;if(!SOLID.has(map[y][25]))map[y][25]=PATH;}

// Batu-batu dekoratif
for(let i=0;i<20;i++){
let rx=Math.floor(Math.random()*mW),ry=Math.floor(Math.random()*mH);
if(SOLID.has(map[ry][rx])||map[ry][rx]===PATH)continue;
if(rx>=20&&rx<=32&&ry>=20&&ry<=28)continue;
map[ry][rx]=ROCK;
}

// Kayu gelondongan
for(let i=0;i<8;i++){
let rx=Math.floor(Math.random()*mW),ry=Math.floor(Math.random()*mH);
if(SOLID.has(map[ry][rx]))continue;
if(rx>=20&&rx<=32&&ry>=20&&ry<=28)continue;
map[ry][rx]=LOG;
}
}

// === NPC DATA ===
function initNPCs(){
npcs=[
{id:'pakbudi',name:'Pak Budi',x:15*32,y:27*32,
color:'#8B4513',hair:'#666',skin:'#D2956A',shirt:'#4a7a3a',
dialogues:{
default:[

{text:'Apa yang terjadi?',next:'crash'},

],
intro:[

{text:'Bisakah Bapak bantu saya?',next:'help'},
{text:'Terima kasih informasinya.',action:'close'}
]}],
crash:[
{text:'Pesawat GA-217... jatuh sekitar jam 2 malam. Saya dengar suara ledakan dari pondok saya. Saya yakin kamu satu-satunya yang selamat.',choices:[
{text:'Saya harus pulang ke rumah.',next:'help'},

]}],
survivors:[
{text:'Saya sudah memeriksa seluruh area pesawat... tidak ada yang lain. Kamu sangat beruntung, Nak.',choices:[
{text:'Saya harus mencari cara pulang.',next:'help'},

]}],

]}]
}
},
{id:'rina',name:'Rina',x:37*32,y:31*32,
color:'#CD853F',hair:'#2a1a0a',skin:'#DEB887',shirt:'#C44430',
dialogues:{
default:[
{text:'Kamu pasti penumpang pesawat itu ya? Aku Rina, peneliti yang sedang di hutan ini.',choices:[

]}],
research:[
{text:'Aku sedang meneliti flora hutan Kalimantan. Tapi sekarang fokusku berubah - aku mencoba memperbaiki radio untuk menghubungi tim penyelamat.',choices:[
{text:'Apakah radionya sudah bisa?',next:'radiostatus'},
{text:'Bagaimana caranya pulang dari sini?',next:'help'},
]}],
radiostatus:[
{text:'Belum sempurna... tapi aku punya radio portabel yang masih bisa menangkap sinyal lemah. Kalau kamu bawa ke tempat yang tinggi, mungkin bisa.',choices:[
{text:'[Ambil Radio Portabel]',action:'getitem',item:'radio',next:'afterradio'},
{text:'Aku pikir dulu ya.',action:'close'}
]}],
help:[
{text:'Dari pesawat, ke selatan ada jalur setapak. Di ujung selatan katanya ada gubuk tua. Mungkin bisa dipakai untuk shelter sementara. Oh ya, ke timur sungai ada Surya, penduduk setempat.',choices:[
{text:'[Ambil Radio Portabel]',action:'getitem',item:'radio',next:'afterradio'},
{text:'Terima kasih infonya!',action:'close'}
]}],
afterradio:[
{text:'Bawa radio itu ke tempat tinggi - bukit di selatan. Nyalakan dan putar frekuensi 121.5 MHz, itu frekuensi darurat. Semoga berhasil!',choices:[

}
},
{id:'surya',name:'Surya',x:26*32,y:42*32,

default:[

]}],

// === DRAW CHARACTER (Stardew style) ===
function drawCharacter(px,py,facing,frameNum,colors,flash){
const sx=Math.round(px-camX),sy=Math.round(py-camY);
if(sx<-T*2||sx>GW+T*2||sy<-T*2||sy>GH+T*2)return;
if(flash&&Math.floor(frameCount/4)%2===0)ctx.globalAlpha=0.3;

const bob=facing==='up'||facing==='down'?Math.sin(frameNum*0.3)*1.5:0;
const legSwing=Math.sin(frameNum*0.3)*2;

// Bayangan
ctx.globalAlpha=(flash&&Math.floor(frameCount/4)%2===0)?0.1:0.2;
ctx.fillStyle='#000';
ctx.beginPath();ctx.ellipse(sx+T/2,sy+T-2,10,4,0,0,Math.PI*2);ctx.fill();
ctx.globalAlpha=flash&&Math.floor(frameCount/4)%2===0?0.3:1;

// Kaki
const legOff=facing==='left'||facing==='right'?legSwing:0;
ctx.fillStyle=colors.legs||'#2a3a5a';
ctx.fillRect(sx+9,sy+22+legOff,5,8);
ctx.fillRect(sx+18,sy+22-legOff,5,8);

// Badan
ctx.fillStyle=colors.shirt;
ctx.fillRect(sx+7,sy+12+bob,T-14,12);

// Lengan
const armOff=facing==='left'||facing==='right'?legSwing*0.7:0;
ctx.fillStyle=colors.shirt;
ctx.fillRect(sx+3,sy+13+bob-armOff,5,8);
ctx.fillRect(sx+24,sy+13+bob+armOff,5,8);

// Tangan
ctx.fillStyle=colors.skin;
ctx.fillRect(sx+3,sy+20+bob-armOff,4,3);
ctx.fillRect(sx+25,sy+20+bob+armOff,4,3);

// Kepala
ctx.fillStyle=colors.skin;
ctx.fillRect(sx+8,sy+2+bob,16,12);

// Rambut
ctx.fillStyle=colors.hair;
if(facing==='down'){
ctx.fillRect(sx+7,sy+bob,18,5);
ctx.fillRect(sx+7,sy+bob,3,8);
ctx.fillRect(sx+22,sy+bob,3,8);
}else if(facing==='up'){
ctx.fillRect(sx+7,sy+bob,18,12);
}else if(facing==='left'){
ctx.fillRect(sx+7,sy+bob,18,5);
ctx.fillRect(sx+7,sy+bob,3,10);
}else{
ctx.fillRect(sx+7,sy+bob,18,5);
ctx.fillRect(sx+22,sy+bob,3,10);
}

// Mata
if(facing==='down'){
ctx.fillStyle='#222';
ctx.fillRect(sx+11,sy+7+bob,3,3);
ctx.fillRect(sx+18,sy+7+bob,3,3);
ctx.fillStyle='#fff';
ctx.fillRect(sx+12,sy+7+bob,1,1);
ctx.fillRect(sx+19,sy+7+bob,1,1);
}else if(facing==='left'){
ctx.fillStyle='#222';ctx.fillRect(sx+9,sy+7+bob,3,3);
ctx.fillStyle='#fff';ctx.fillRect(sx+9,sy+7+bob,1,1);
}else if(facing==='right'){
ctx.fillStyle='#222';ctx.fillRect(sx+20,sy+7+bob,3,3);
ctx.fillStyle='#fff';ctx.fillRect(sx+22,sy+7+bob,1,1);
}
ctx.globalAlpha=1;
}

// === DRAW GROUND ITEMS ===
function drawGroundItems(){
for(const it of items_on_ground){
if(it.picked)continue;
const sx=Math.round(it.x-camX),sy=Math.round(it.y-camY);
if(sx<-T||sx>GW+T||sy<-T||sy>GH+T)continue;
const bob=Math.sin(frameCount*0.06+it.x)*3;
ctx.fillStyle=it.color;
ctx.fillRect(sx+10,sy+8+bob,12,12);
ctx.fillStyle='rgba(255,255,255,0.3)';
ctx.fillRect(sx+12,sy+10+bob,4,4);
// Indikator interaksi
const dx=player.x+T/2-it.x-T/2,dy=player.y+T/2-it.y-T/2;
if(Math.sqrt(dx*dx+dy*dy)<T*1.8){
ctx.fillStyle='rgba(232,148,58,0.7)';

}
}
}

// Fireflies
const fireflies=[];
function initFireflies(){
fireflies.length=0;
for(let i=0;i<25;i++){
fireflies.push({x:Math.random()*mW*T,y:Math.random()*mH*T,
phase:Math.random()*Math.PI*2,speed:0.2+Math.random()*0.4,size:1+Math.random()*2});
}
}
function drawFireflies(){
for(const f of fireflies){
f.phase+=0.015;
const fx=f.x+Math.sin(f.phase*f.speed)*25-camX;
const fy=f.y+Math.cos(f.phase*0.7*f.speed)*15-camY;
if(fx<-20||fx>GW+20||fy<-20||fy>GH+20)continue;
const alpha=(Math.sin(f.phase*2)+1)*0.25+0.1;
ctx.globalAlpha=alpha*0.3;ctx.fillStyle='#ffcc88';
ctx.fillRect(fx-f.size*2,fy-f.size*2,f.size*4,f.size*4);
ctx.globalAlpha=alpha+0.15;ctx.fillStyle='#ffddaa';
ctx.fillRect(fx-f.size/2,fy-f.size/2,f.size,f.size);
}
ctx.globalAlpha=1;
}

// === PARTICLES ===
function updateParticles(){
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.life--;
if(p.life<=0)particles.splice(i,1);
}
for(let i=smokeP.length-1;i>=0;i--){
const s=smokeP[i];s.x+=s.vx;s.y+=s.vy;s.vx+=(Math.random()-0.5)*0.04;s.life--;
if(s.life<=0)smokeP.splice(i,1);
}
for(let i=floatTexts.length-1;i>=0;i--){
const ft=floatTexts[i];ft.y+=ft.vy;ft.vy*=0.97;ft.life--;
if(ft.life<=0)floatTexts.splice(i,1);
}
for(let i=notifications.length-1;i>=0;i--){
notifications[i].life--;
if(notifications[i].life<=0)notifications.splice(i,1);
}
}
function drawParticles(){
for(const p of particles){
ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;
const s=Math.max(1,p.size*(p.life/p.maxLife));
ctx.fillRect(Math.round(p.x-camX-s/2),Math.round(p.y-camY-s/2),s,s);
}
for(const s of smokeP){
const alpha=Math.max(0,s.life/s.maxLife)*0.3;
const sz=s.size*(2-s.life/s.maxLife);
ctx.globalAlpha=alpha;ctx.fillStyle='#555';
ctx.fillRect(Math.round(s.x-camX-sz/2),Math.round(s.y-camY-sz/2),sz,sz);
}
ctx.globalAlpha=1;
}
function drawFloatTexts(){
ctx.font='8px "Press Start 2P"';ctx.textAlign='center';
for(const ft of floatTexts){
ctx.globalAlpha=Math.max(0,ft.life/ft.maxLife);ctx.fillStyle=ft.color;
ctx.fillText(ft.text,Math.round(ft.x-camX),Math.round(ft.y-camY));
}
ctx.globalAlpha=1;ctx.textAlign='left';
}
function drawNotifications(){
ctx.textAlign='center';
for(let i=0;i<notifications.length;i++){
const n=notifications[i];
const alpha=Math.min(1,n.life/20,n.maxLife-n.life>20?1:(n.maxLife-n.life)/20);
ctx.globalAlpha=alpha;
ctx.fillStyle='rgba(26,20,16,0.85)';
const tw=ctx.measureText(n.text).width;
ctx.fillRect(GW/2-tw/2-10,60+i*22,tw+20,18);
ctx.fillStyle=n.color||'#e8943a';
ctx.font='7px "Press Start 2P"';
ctx.fillText(n.text,GW/2,74+i*22);
}
ctx.globalAlpha=1;ctx.textAlign='left';
}
function addNotification(text,color){
notifications.push({text,color:color||'#e8943a',life:120,maxLife:120});
}
function spawnBurst(x,y,color,count,speed,life){
for(let i=0;i<count;i++){
const a=Math.random()*Math.PI*2,s=Math.random()*speed;
particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:life+Math.random()*life*0.5,maxLife:life*1.5,size:2+Math.random()*2});
}
}

// === DIALOG SYSTEM ===
function showDialogue(npcId,dialogueKey){
const npc=npcs.find(n=>n.id===npcId);
if(!npc)return;
let dKey=dialogueKey||'default';
let dlg=npc.dialogues[dKey];
if(!dlg)dlg=npc.dialogues['default'];
if(!dlg)return;
// Quest tracking
if(npcId==='pakbudi')questProgress.talkedPakBudi=true;
if(npcId==='rina')questProgress.talkedRina=true;
if(npcId==='surya')questProgress.talkedSurya=true;
if(npcId==='anisa')questProgress.talkedAnisa=true;
checkAllItems();

dialogBox={npc,text:dlg[0].text};
dialogChoices=dlg[0].choices;
dialogCallback=dlg[0];
}

function advanceDialogue(choice){
if(!dialogBox||!choice)return;
if(choice.action==='close'){
closeDialogue();return;
}
if(choice.action==='getitem'){
if(!inventory.includes(choice.item)){
inventory.push(choice.item);
questItems[choice.item]=true;
addNotification('Mendapatkan: '+getItemName(choice.item),'#4a9a3a');
spawnBurst(player.x+T/2,player.y+T/2,'#4a9a3a',8,2,25);
if(choice.item==='survival_kit')questProgress.gotSurvivalKit=true;
if(choice.item==='radio')questProgress.gotRadio=true;
if(choice.item==='compass')questProgress.gotCompass=true;
checkAllItems();
updateHUD();
}
}
if(choice.action==='win'){
closeDialogue();state='win';showWinScreen();return;
}
if(choice.next){
const npc=npcs.find(n=>n.id===dialogBox.npc.id);
if(npc){
let dlg=npc.dialogues[choice.next];
if(!dlg)dlg=npc.dialogues['default'];
if(dlg){
dialogBox={npc,text:dlg[0].text};
dialogChoices=dlg[0].choices;
dialogCallback=dlg[0];
return;
}
}
}
closeDialogue();
}

function closeDialogue(){dialogBox=null;dialogChoices=null;dialogCallback=null;}

function getItemName(key){
const names={survival_kit:'Survival Kit',radio:'Radio Portabel',compass:'Kompas',
blackbox:'Black Box',firstaid:'Kotak P3K',necklace:'Kalung Penumpang',docs:'Dokumen Pesawat'};
return names[key]||key;
}

function checkAllItems(){
questProgress.hasAllItems=inventory.includes('survival_kit')&&inventory.includes('radio')&&inventory.includes('compass');
}

function drawDialogueBox(){
if(!dialogBox)return;
const bx=40,by=GH-160,bw=GW-80,bh=140;
// Background
ctx.fillStyle='rgba(10,8,6,0.92)';ctx.fillRect(bx,by,bw,bh);
ctx.strokeStyle='#e8943a';ctx.lineWidth=3;ctx.strokeRect(bx,by,bw,bh);
ctx.lineWidth=1;
// Nama NPC
ctx.fillStyle='#e8943a';ctx.font='9px "Press Start 2P"';
ctx.fillText(dialogBox.npc.name,bx+16,by+22);
ctx.fillStyle='#e8943a';ctx.fillRect(bx+16,by+28,80,2);
// Teks dialog - word wrap manual
ctx.fillStyle='#e0d8c8';ctx.font='8px "Press Start 2P"';
const words=dialogBox.text.split(' ');
let line='',ly=by+48;
for(const w of words){
const test=line+w+' ';
if(ctx.measureText(test).width>bw-40){
ctx.fillText(line.trim(),bx+16,ly);ly+=16;line=w+' ';
}else line=test;
}
if(line.trim())ctx.fillText(line.trim(),bx+16,ly);
// Pilihan
if(dialogChoices){
const cy=by+bh-16-dialogChoices.length*20;
for(let i=0;i<dialogChoices.length;i++){
const c=dialogChoices[i];
const cyi=cy+i*20;
const hover=false;// Tidak bisa hover di canvas, tapi bisa diklik
ctx.fillStyle='rgba(232,148,58,0.1)';ctx.fillRect(bx+12,cyi-10,bw-24,18);
ctx.strokeStyle='rgba(232,148,58,0.3)';ctx.strokeRect(bx+12,cyi-10,bw-24,18);
ctx.fillStyle='#e0d8c8';ctx.font='7px "Press Start 2P"';
ctx.fillText((i+1)+'. '+c.text,bx+20,cyi+2);
}
}
}

// === QUEST TRACKER ===
function drawQuestTracker(){
const quests=[];
if(!questProgress.talkedPakBudi)quests.push({text:'Temukan seseorang di hutan',active:true,done:false});
if(questProgress.talkedPakBudi&&!questProgress.gotSurvivalKit)quests.push({text:'Ambil Survival Kit dari Pak Budi',active:true,done:false});
if(!questProgress.gotBlackBox)quests.push({text:'Cari Black Box pesawat',active:!questProgress.gotSurvivalKit,done:false});
if(!questProgress.gotFirstAid)quests.push({text:'Kumpulkan P3K dari pesawat',active:false,done:false});
if(questProgress.talkedPakBudi&&!questProgress.talkedRina)quests.push({text:'Temukan Rina di timur',active:questProgress.gotSurvivalKit,done:false});
if(questProgress.talkedRina&&!questProgress.gotRadio)quests.push({text:'Ambil Radio dari Rina',active:true,done:false});
if(questProgress.gotSurvivalKit&&!questProgress.talkedSurya)quests.push({text:'Temukan Surya di selatan',active:true,done:false});
if(questProgress.talkedSurya&&!questProgress.gotCompass)quests.push({text:'Ambil Kompas dari Surya',active:true,done:false});
if(questProgress.hasAllItems&&!questProgress.talkedAnisa)quests.push({text:'Pergi ke rumah di ujung selatan',active:true,done:false});
if(questProgress.talkedAnisa)quests.push({text:'Masuk rumah untuk meminta tolong',active:true,done:false});

const mx=GW-12,my=38;
ctx.font='6px "Press Start 2P"';ctx.textAlign='right';
ctx.fillStyle='rgba(232,148,58,0.6)';ctx.fillText('-- MISI --',mx,my);
for(let i=0;i<Math.min(quests.length,5);i++){
const q=quests[i];
ctx.fillStyle=q.done?'rgba(74,122,58,0.7)':q.active?'rgba(232,148,58,0.8)':'rgba(122,106,90,0.4)';
const prefix=q.done?'[V] ':q.active?'[>] ':'[ ] ';
ctx.fillText(prefix+q.text,mx,my+14+i*12);
}
ctx.textAlign='left';
}

// === INVENTORY DISPLAY ===
function drawInventoryBar(){
const items=[...inventory];
if(items.length===0)return;
const bw=items.length*40+16,bx=GW/2-bw/2,by=GH-36;
ctx.fillStyle='rgba(10,8,6,0.8)';ctx.fillRect(bx,by,bw,30);
ctx.strokeStyle='rgba(232,148,58,0.3)';ctx.strokeRect(bx,by,bw,30);
ctx.font='6px "Press Start 2P"';ctx.textAlign='center';
for(let i=0;i<items.length;i++){
const ix=bx+8+i*40;
ctx.fillStyle='#333';ctx.fillRect(ix,by+3,32,24);
ctx.strokeStyle='rgba(232,148,58,0.4)';ctx.strokeRect(ix,by+3,32,24);
const itemColor={survival_kit:'#4a9a3a',radio:'#5555cc',compass:'#cc8833',
blackbox:'#555',firstaid:'#fff',necklace:'#f5c842',docs:'#ddd'}[items[i]]||'#888';
ctx.fillStyle=itemColor;ctx.fillRect(ix+10,by+7,12,10);
ctx.fillStyle='#e0d8c8';
ctx.fillText(getItemName(items[i]).substring(0,5),ix+16,by+26);
}
ctx.textAlign='left';
}

// === PLAYER LOGIC ===
function updatePlayer(){
if(dialogBox)return;
if(player.inv>0)player.inv--;

let dx=0,dy=0;
if(keys['ArrowLeft']||keys['a']||keys['A']){dx=-1;player.facing='left';}
if(keys['ArrowRight']||keys['d']||keys['D']){dx=1;player.facing='right';}
if(keys['ArrowUp']||keys['w']||keys['W']){dy=-1;player.facing='up';}
if(keys['ArrowDown']||keys['s']||keys['S']){dy=1;player.facing='down';}

// Normalisasi diagonal
if(dx!==0&&dy!==0){dx*=0.707;dy*=0.707;}

if(dx!==0||dy!==0){
player.frame++;
// Cek kolisi
const nx=player.x+dx*player.speed;
const ny=player.y+dy*player.speed;
const pw=T*0.6,ph=T*0.4;
const px1=nx+(T-pw)/2,py1=ny+T*0.5;

// Cek tile di posisi baru
let canX=true,canY=true;
const tilesToCheck=[
{x:Math.floor(px1/T),y:Math.floor(py1/T)},
{x:Math.floor((px1+pw-1)/T),y:Math.floor(py1/T)},
{x:Math.floor(px1/T),y:Math.floor((py1+ph-1)/T)},
{x:Math.floor((px1+pw-1)/T),y:Math.floor((py1+ph-1)/T)}
];
for(const tc of tilesToCheck){
if(tc.x<0||tc.x>=mW||tc.y<0||tc.y>=mH){canX=false;canY=false;break;}
if(SOLID.has(map[tc.y][tc.x])){
// Pohon: bisa lewat dari bawah
if(map[tc.y][tc.x]===TREE||map[tc.y][tc.x]===TREE2){
if(dy<0&&player.y+T*0.5>tc.y*T+T*0.6)canY=false;
else if(dy>0)canY=false;
if(dx!==0)canX=false;
}else{
canX=false;canY=false;
}
}
}

if(canX)player.x=nx;
if(canY)player.y=ny;

// Batas map
player.x=Math.max(0,Math.min((mW-1)*T,player.x));
player.y=Math.max(0,Math.min((mH-1)*T,player.y));

// Efek rumput
if(frameCount%12===0){
const tx=Math.floor((player.x+T/2)/T),ty=Math.floor((player.y+T/2)/T);
if(ty>=0&&ty<mH&&tx>=0&&tx<mW&&(map[ty][tx]===TALLGRASS||map[ty][tx]===GRASS)){
spawnBurst(player.x+T/2,player.y+T*0.7,'#4a9a3a',2,1,10);
}
}
}else{
player.frame=0;
}

// Interaksi (tombol E)
if(keys['e']||keys['E']){
if(player.moveCD<=0){
player.moveCD=20;
// Cek NPC terdekat
for(const npc of npcs){
const ndx=player.x+T/2-npc.x-T/2,ndy=player.y+T/2-npc.y-T/2;
if(Math.sqrt(ndx*ndx+ndy*ndy)<T*2){
showDialogue(npc.id);return;
}
}
// Cek ground items
for(const it of items_on_ground){
if(it.picked)continue;
const idx=player.x+T/2-it.x-T/2,idy=player.y+T/2-it.y-T/2;
if(Math.sqrt(idx*idx+idy*idy)<T*1.8){
it.picked=true;inventory.push(it.key);
addNotification('Mendapatkan: '+it.name,'#f5c842');
spawnBurst(it.x+T/2,it.y+T/2,it.color,10,2.5,25);
if(it.key==='blackbox')questProgress.gotBlackBox=true;
if(it.key==='firstaid')questProgress.gotFirstAid=true;
updateHUD();return;
}
}
// Cek tile interaksi (pintu)
const ptx=Math.floor((player.x+T/2)/T),pty=Math.floor((player.y+T/2)/T);
if(ptx>=0&&ptx<mW&&pty>=0&&pty<mH&&map[pty][ptx]===DOOR){
if(questProgress.hasAllItems){
state='win';showWinScreen();
}else{
addNotification('Kamu belum cukup kuat untuk pergi sendiri. Kumpulkan perlengkapan dulu.','#ff6b6b');
}
}
}
}
if(player.moveCD>0)player.moveCD--;

// Damage dari api
const ptx2=Math.floor((player.x+T/2)/T),pty2=Math.floor((player.y+T/2)/T);
for(let dy2=-1;dy2<=1;dy2++)for(let dx2=-1;dx2<=1;dx2++){
const cx=ptx2+dx2,cy=pty2+dy2;
if(cx>=0&&cx<mW&&cy>=0&&cy<mH&&map[cy][cx]===FIRE){
const fdx=player.x+T/2-cx*T-T/2,fdy=player.y+T/2-cy*T-T/2;
if(Math.sqrt(fdx*fdx+fdy*fdy)<T*0.8&&player.inv<=0){
player.hp--;player.inv=60;
spawnBurst(player.x+T/2,player.y+T/2,'#ff4400',8,3,20);
addNotification('Tersiram api! -1 Nyawa','#ff4444');
updateHUD();
if(player.hp<=0){state='dead';showDeadScreen();}
}
}
}
}

// === KAMERA ===
function updateCamera(){
const tx=player.x+T/2-GW/2;
const ty=player.y+T/2-GH/2;
camX+=(tx-camX)*0.08;camY+=(ty-camY)*0.08;
camX=Math.max(0,Math.min(mW*T-GW,camX));
camY=Math.max(0,Math.min(mH*T-GH,camY));
}

// === UPDATE HUD ===
function updateHUD(){
hHp.textContent=player.hp;
hInv.textContent=inventory.length;
if(player.hp<=2)hHp.style.color='#ff4444';
else if(player.hp<=3)hHp.style.color='#ffaa44';
else hHp.style.color='var(--accent)';

// Lokasi
const px=Math.floor(player.x/T),py=Math.floor(player.y/T);
let loc='HUTAN BELANTARA';
if(px>=20&&px<=32&&py>=20&&py<=28)loc='PUING PESAWAT';
else if(px>=10&&px<=18&&py>=25&&py<=30)loc='KEMAH PAK BUDI';
else if(px>=34&&px<=40&&py>=28&&py<=33)loc='KEMAH RINA';
else if(px>=22&&px<=30&&py>=38&&py<=44)loc='KEMAH SURYA';
else if(px>=20&&px<=28&&py>=43&&py<=49)loc='POS JAGA HUTAN';
else if(py<10)loc='HUTAN UTARA';
else if(py>40)loc='HUTAN SELATAN';
hLoc.textContent=loc;
}

// === OVERLAYS ===
function showOverlayHTML(html){ov.classList.remove('hid');ov.innerHTML=html;}
function hideOverlay(){ov.classList.add('hid');}

function showMenu(){
state='menu';hud.classList.add('hid');
showOverlayHTML(`
<div class="ov-t">PUING PESAWAT</div>
<div class="ov-sub">Penerbangan GA-217 dari Jakarta menuju Manado<br>terhempas di hutan belantara Kalimantan.<br>Kamu adalah satu-satunya yang selamat...</div>
<div class="mission-box">
<div class="mt">MISI UTAMA: PULANG KE RUMAH</div>
<div class="mi active">Jelajahi hutan dan temukan penyintas lain</div>
<div class="mi active">Kumpulkan perlengkapan: Survival Kit, Radio, Kompas</div>
<div class="mi active">Cari black box dan barang dari pesawat</div>
<div class="mi active">Temukan rumah penjaga hutan di ujung selatan</div>
<div class="mi active">Minta tolong untuk pulang ke rumah</div>
</div>
<div class="st">KONTROL<br>Arah / WASD : Bergerak<br>E : Bicara / Ambil barang<br>Jelajahi hutan dan cari NPC untuk bercerita</div>
<button class="btn" id="bStart">MULAI PETUALANGAN</button>
`);
document.getElementById('bStart').addEventListener('click',startGame);
}

function startGame(){
lvl=0;score=0;inventory=[];questItems={};
questProgress={talkedPakBudi:false,gotSurvivalKit:false,gotFirstAid:false,
gotBlackBox:false,gotRadio:false,talkedRina:false,foundPath:false,
talkedSurya:false,gotCompass:false,foundExit:false,talkedAnisa:false,hasAllItems:false};
player={x:4*32,y:3*32,speed:2.8,facing:'down',frame:0,hp:5,maxHp:5,inv:0,moveCD:0};
particles=[];floatTexts=[];smokeP=[];notifications=[];
generateMap();initNPCs();initGroundItems();initFireflies();
hideOverlay();hud.classList.remove('hid');state='play';updateHUD();
addNotification('Kamu terbangun di hutan belantara... Cari seseorang!','#e8943a');
}

function showDeadScreen(){
showOverlayHTML(`
<div class="ov-t" style="color:#ff4444">GAME OVER</div>
<div class="ov-sub">Kamu tak bisa bertahan di hutan belantara...</div>
<div class="st">
<div class="sr"><span class="sk">BARANG DIKUMPULKAN</span><span class="sv">${inventory.length}</span></div>
</div>
<button class="btn danger" id="bRetry" style="margin-top:14px">COBA LAGI</button>
<button class="btn" id="bMenu" style="margin-top:8px;font-size:7px;padding:10px 18px">MENU UTAMA</button>
`);
document.getElementById('bRetry').addEventListener('click',startGame);
document.getElementById('bMenu').addEventListener('click',showMenu);
}

function showWinScreen(){
showOverlayHTML(`
<div class="ov-t">KAMU BERHASIL PULANG!</div>
<div class="ov-sub">Dengan bantuan Anisa di pos jaga hutan,<br>tim penyelamat akhirnya menjemputmu.<br>Kamu selamat dari hutan belantara Kalimantan.</div>
<div class="mission-box">
<div class="mt">HASIL PETUALANGAN:</div>
<div class="mi ${questProgress.gotBlackBox?'done':''}">Black Box pesawat ${questProgress.gotBlackBox?'[V]':'[ ]'}</div>
<div class="mi ${questProgress.gotSurvivalKit?'done':''}">Survival Kit ${questProgress.gotSurvivalKit?'[V]':'[ ]'}</div>
<div class="mi ${questProgress.gotRadio?'done':''}">Radio Portabel ${questProgress.gotRadio?'[V]':'[ ]'}</div>
<div class="mi ${questProgress.gotCompass?'done':''}">Kompas ${questProgress.gotCompass?'[V]':'[ ]'}</div>
<div class="mi ${questProgress.gotFirstAid?'done':''}">Kotak P3K ${questProgress.gotFirstAid?'[V]':'[ ]'}</div>
</div>
<div class="st">
<div class="sr"><span class="sk">TOTAL BARANG</span><span class="sv">${inventory.length}</span></div>
<div class="sr"><span class="sk">SISA NYAWA</span><span class="sv">${player.hp} / ${player.maxHp}</span></div>
</div>
<div class="ch1-end">SELAMAT KAMU PULANG KE RUMAH!</div>
<button class="btn green" id="bMenu" style="margin-top:16px">MAIN LAGI</button>
`);
document.getElementById('bMenu').addEventListener('click',showMenu);
}

// === MAIN LOOP ===
function update(){
frameCount++;
if(state==='play'){
updatePlayer();updateCamera();updateParticles();
// Update lokasi HUD setiap 30 frame
if(frameCount%30===0)updateHUD();
}
}

function render(){
ctx.clearRect(0,0,GW,GH);
if(state==='menu'){
// Background menu
const grad=ctx.createLinearGradient(0,0,0,GH);
grad.addColorStop(0,'#1a2a1a');grad.addColorStop(1,'#0a140a');
ctx.fillStyle=grad;ctx.fillRect(0,0,GW,GH);
// Pohon siluet
ctx.fillStyle='rgba(6,18,8,0.9)';
for(let i=0;i<8;i++){
const tx=i*110+20;
ctx.fillRect(tx+20,GH-90,14,90);
ctx.beginPath();ctx.arc(tx+27,GH-100,38,0,Math.PI*2);ctx.fill();
}
// Fireflies menu
for(let i=0;i<20;i++){
const fx=(i*137+frameCount*0.2)%GW;
const fy=(i*89+Math.sin(frameCount*0.015+i)*30)%(GH*0.6)+30;
ctx.globalAlpha=(Math.sin(frameCount*0.03+i*2)+1)*0.2+0.1;
ctx.fillStyle='#ffcc88';ctx.fillRect(fx,fy,2,2);
}
ctx.globalAlpha=1;drawScanlines();return;
}

drawBackground();

// Gambar tile
const sx=Math.max(0,Math.floor(camX/T)),ex=Math.min(mW,Math.ceil((camX+GW)/T)+1);
const sy=Math.max(0,Math.floor(camY/T)),ey=Math.min(mH,Math.ceil((camY+GH)/T)+1);

// Layer bawah (ground)
for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){
const t=map[y][x];
if(t!==TREE&&t!==TREE2&&t!==AIR)drawTileAt(t,x*T-camX,y*T-camY);
}

// Ground items
drawGroundItems();

// Player
drawCharacter(player.x,player.y,player.facing,player.frame,PLAYER_COLORS,player.inv>0);

// NPCs
for(const npc of npcs){
const nc={hair:npc.hair,skin:npc.skin,shirt:npc.shirt,legs:'#2a3a5a'};
drawCharacter(npc.x,npc.y,'down',frameCount*0.5,nc,false);
}

// Layer atas (pohon kanopi - hanya bagian atas)
for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){
const t=map[y][x];
if(t===TREE||t===TREE2){
const tsx=Math.round(x*T-camX),tsy=Math.round(y*T-camY);
// Hanya gambar kanopi atas
ctx.fillStyle=t===TREE?'#1a5a1a':'#1a4a1a';
ctx.beginPath();ctx.arc(tsx+16,tsy+10,14,0,Math.PI*2);ctx.fill();
ctx.fillStyle=t===TREE?'#2a7a2a':'#226a22';
ctx.beginPath();ctx.arc(tsx+14,tsy+8,10,0,Math.PI*2);ctx.fill();
}
}

drawNPCIndicators();
drawFireflies();
drawParticles();
drawFloatTexts();
drawFogOverlay();
drawQuestTracker();
drawInventoryBar();
drawDialogueBox();
drawNotifications();
drawScanlines();

// Dialog klik handling
if(dialogBox&&dialogChoices){
// Indikator nomor pilihan
ctx.fillStyle='rgba(232,148,58,0.5)';ctx.font='6px "Press Start 2P"';
ctx.textAlign='left';
ctx.fillText('Tekan 1-'+dialogChoices.length+' untuk memilih',50,GH-18);
ctx.textAlign='left';
}
}

// Dialog keyboard
window.addEventListener('keydown',e=>{
if(state!=='play'||!dialogBox)return;
const num=parseInt(e.key);
if(num>=1&&num<=dialogChoices.length){
e.preventDefault();e.stopPropagation();
advanceDialogue(dialogChoices[num-1]);
}
if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeDialogue();}
});

function gameLoop(){update();render();requestAnimationFrame(gameLoop);}

function init(){
const wrap=document.getElementById('wrap');
function resize(){
const maxW=window.innerWidth-16,maxH=window.innerHeight-16;
const scale=Math.min(maxW/GW,maxH/GH,2);
wrap.style.width=Math.floor(GW*scale)+'px';
wrap.style.height=Math.floor(GH*scale)+'px';
cvs.style.width='100%';cvs.style.height='100%';
}
resize();window.addEventListener('resize',resize);
showMenu();gameLoop();
}
init();
</script>
