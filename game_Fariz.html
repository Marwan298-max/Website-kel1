<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOLLOWMERE — a requiem in the deep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #050607;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
  }
  #wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas#game {
    image-rendering: auto;
    display: block;
    background: #050607;
  }
  #boot {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #6b6f66;
    background: #050607;
    z-index: 10;
    letter-spacing: 0.35em;
    font-size: 14px;
    text-transform: uppercase;
    transition: opacity 1.2s ease;
    cursor: pointer;
  }
  #boot .rune {
    width: 54px; height: 54px;
    margin-bottom: 26px;
    border: 1px solid #3a3d38;
    transform: rotate(45deg);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.9; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="boot"><div class="rune"></div><div>click to descend</div></div>
<script>
'use strict';
/* ============================================================================
   HOLLOWMERE — a requiem in the deep
   A single-file metroidvania. Everything (sprites, audio, world, music) is
   generated procedurally at boot. No external assets.
   ============================================================================
*/

/* ==========================================================================
   SECTION 0 — CONSTANTS & UTILITIES
   ========================================================================== */

const TILE   = 32;            // tile size in px
const GW     = 420;           // world width in tiles
const GH     = 130;           // world height in tiles
const STEP   = 1000 / 60;     // fixed timestep ms
const VIEW_W = 1280;          // internal render resolution
const VIEW_H = 720;

const canvas = document.getElementById('game');
canvas.width  = VIEW_W;
canvas.height = VIEW_H;
const ctx = canvas.getContext('2d');

function fitScreen() {
  const s = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  canvas.style.width  = Math.floor(VIEW_W * s) + 'px';
  canvas.style.height = Math.floor(VIEW_H * s) + 'px';
}
window.addEventListener('resize', fitScreen);
fitScreen();

// Deterministic RNG for texture / sprite generation so the world always
// looks identical between boots.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R  = mulberry32(0xC0FFEE);
const rr = (a, b) => a + R() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));

// Live (non-deterministic) randomness for gameplay effects.
const rnd  = Math.random;
const rndr = (a, b) => a + Math.random() * (b - a);

const clamp  = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp   = (a, b, t) => a + (b - a) * t;
const sign   = v => v < 0 ? -1 : (v > 0 ? 1 : 0);
const dist2  = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const rectsOverlap = (a, b) =>
  a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// AABB rect shorthand
function Rect(x, y, w, h) { return { x, y, w, h }; }

/* ==========================================================================
   SECTION 1 — INPUT
   ========================================================================== */

const Input = {
  held:    {},
  pressed: {},
  anyKey:  false,
  map: {
    left:  ['ArrowLeft',  'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up:    ['ArrowUp',    'KeyW'],
    down:  ['ArrowDown',  'KeyS'],
    jump:  ['Space',      'KeyJ'],
    attack:['KeyE',       'KeyX', 'KeyJ'],
    dash:  ['KeyC',       'KeyK', 'ShiftLeft', 'ShiftRight'],
    focus: ['KeyF'],
    inter: ['ArrowUp',    'KeyW', 'KeyE'],
    pause: ['Escape',     'KeyP'],
    mapKey:['Tab'],
    mute:  ['KeyM'],
    confirm:['Enter', 'KeyZ', 'Space'],
  },
  down(action) {
    const list = this.map[action];
    for (let i = 0; i < list.length; i++) if (this.held[list[i]]) return true;
    return false;
  },
  hit(action) {
    const list = this.map[action];
    for (let i = 0; i < list.length; i++) if (this.pressed[list[i]]) return true;
    return false;
  },
  clearFrame() { this.pressed = {}; this.anyKey = false; },
};

window.addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
  if (!Input.held[e.code]) Input.pressed[e.code] = true;
  Input.held[e.code] = true;
  Input.anyKey = true;
  AudioBoot.ensure();
});
window.addEventListener('keyup', e => { Input.held[e.code] = false; });
window.addEventListener('blur',  () => { Input.held = {}; });

/* ==========================================================================
   SECTION 2 — AUDIO ENGINE (fully procedural: sfx synthesis + ambient score)
   ========================================================================== */

const AudioBoot = {
  ready: false,
  ensure() {
    if (this.ready) return;
    SND.init();
    this.ready = true;
  }
};

const SND = {
  ac: null,
  master: null,
  sfxBus: null,
  musBus: null,
  verb: null,
  muted: false,
  noiseBuf: null,
  padOsc: [],
  padGain: null,
  padFilter: null,
  zoneScale: [0, 3, 5, 7, 10],        // minor pentatonic-ish
  baseHz: 110,
  nextNoteT: 0,
  bossMode: false,
  beatT: 0,

  init() {
    if (this.ac) return;
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return; }
    const ac = this.ac;

    this.master = ac.createGain();
    this.master.gain.value = 0.8;
    this.master.connect(ac.destination);

    this.sfxBus = ac.createGain();
    this.sfxBus.gain.value = 0.9;
    this.sfxBus.connect(this.master);

    this.musBus = ac.createGain();
    this.musBus.gain.value = 0.55;
    this.musBus.connect(this.master);

    // Simple generated-impulse reverb for the music bus.
    this.verb = ac.createConvolver();
    const len = ac.sampleRate * 2.4;
    const imp = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = imp.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
      }
    }
    this.verb.buffer = imp;
    const verbGain = ac.createGain();
    verbGain.gain.value = 0.5;
    this.verb.connect(verbGain);
    verbGain.connect(this.master);
    this.musBus.connect(this.verb);

    // Precompute a noise buffer for percussive / airy sounds.
    const nlen = ac.sampleRate;
    this.noiseBuf = ac.createBuffer(1, nlen, ac.sampleRate);
    const nd = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < nlen; i++) nd[i] = Math.random() * 2 - 1;

    this.startPad();
  },

  now() { return this.ac ? this.ac.currentTime : 0; },

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.8;
  },

  // ---- Ambient drone pad, retuned per zone ------------------------------
  startPad() {
    const ac = this.ac;
    this.padGain = ac.createGain();
    this.padGain.gain.value = 0.0;
    this.padFilter = ac.createBiquadFilter();
    this.padFilter.type = 'lowpass';
    this.padFilter.frequency.value = 500;
    this.padFilter.Q.value = 0.8;
    this.padGain.connect(this.padFilter);
    this.padFilter.connect(this.musBus);

    const freqs = [55, 82.5, 110];
    for (let i = 0; i < freqs.length; i++) {
      const o = ac.createOscillator();
      o.type = i === 2 ? 'sine' : 'triangle';
      o.frequency.value = freqs[i];
      o.detune.value = (i - 1) * 6;
      const g = ac.createGain();
      g.gain.value = i === 2 ? 0.25 : 0.4;
      o.connect(g); g.connect(this.padGain);
      o.start();
      this.padOsc.push(o);
    }
    // Slow filter breathing.
    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.06;
    const lg = ac.createGain();
    lg.gain.value = 180;
    lfo.connect(lg); lg.connect(this.padFilter.frequency);
    lfo.start();

    this.padGain.gain.setTargetAtTime(0.16, ac.currentTime, 3);
  },

  setZone(zoneId) {
    if (!this.ac) return;
    const roots = [110, 98, 87.3, 123.5]; // per-zone tonal centre
    const root = roots[clamp(zoneId, 0, 3)];
    this.baseHz = root;
    const t = this.ac.currentTime;
    const mult = [1, 1.5, 2];
    for (let i = 0; i < this.padOsc.length; i++) {
      this.padOsc[i].frequency.setTargetAtTime(root * mult[i % 3], t, 2.5);
    }
  },

  setBoss(b) {
    this.bossMode = b;
    if (this.padGain && this.ac) {
      this.padGain.gain.setTargetAtTime(b ? 0.07 : 0.16, this.ac.currentTime, 1.5);
    }
  },

  // Sparse melodic bells drifting through the caverns.
  tickMusic() {
    if (!this.ac || this.muted) return;
    const t = this.now();
    if (t > this.nextNoteT) {
      this.nextNoteT = t + rndr(2.6, 7.5);
      const deg = this.zoneScale[ri(0, this.zoneScale.length - 1)];
      const oct = ri(0, 2);
      const f = this.baseHz * 2 * Math.pow(2, oct) * Math.pow(2, deg / 12);
      this.bell(f, 0.05 + rndr(0, 0.05), rndr(2.5, 5));
    }
    if (this.bossMode) {
      const beat = 0.42;
      if (t > this.beatT) {
        this.beatT = t + beat;
        this.thump(55, 0.22);
        if (Math.floor(t / beat) % 2 === 0) this.tick(0.05);
      }
    }
  },

  // ---- Primitive voices --------------------------------------------------
  tone(type, f0, f1, dur, vol, attack = 0.005, dest = null) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxBus);
    o.start(t); o.stop(t + dur + 0.05);
  },

  noise(dur, vol, filterF, filterType = 'bandpass', q = 1) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const flt = ac.createBiquadFilter();
    flt.type = filterType;
    flt.frequency.setValueAtTime(filterF, t);
    flt.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(this.sfxBus);
    src.start(t); src.stop(t + dur + 0.05);
  },

  bell(f, vol, dur) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime;
    for (let i = 0; i < 2; i++) {
      const o = ac.createOscillator();
      o.type = 'sine';
      o.frequency.value = f * (i === 0 ? 1 : 2.01);
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i === 0 ? vol : vol * 0.3, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.musBus);
      o.start(t); o.stop(t + dur + 0.1);
    }
  },

  thump(f, vol) {
    this.tone('sine', f, f * 0.5, 0.25, vol, 0.01);
  },

  tick(vol) {
    this.noise(0.05, vol, 6000, 'highpass');
  },

  // ---- Named sound effects ----------------------------------------------
  swing()      { this.noise(0.14, 0.35, 2400, 'bandpass', 1.4); this.tone('sawtooth', 320, 120, 0.09, 0.05); },
  hitEnemy()   { this.noise(0.1, 0.5, 900, 'bandpass', 0.8); this.tone('square', 220, 80, 0.1, 0.16); },
  clank()      { this.tone('square', 1400, 900, 0.07, 0.1); this.noise(0.06, 0.2, 4000, 'highpass'); },
  hurt()       { this.tone('sawtooth', 300, 60, 0.4, 0.28); this.noise(0.3, 0.3, 500, 'lowpass'); },
  enemyDie()   { this.noise(0.35, 0.32, 700, 'lowpass'); this.tone('triangle', 400, 50, 0.3, 0.14); },
  jump()       { this.noise(0.09, 0.14, 1500, 'bandpass', 1.2); },
  flap()       { this.noise(0.12, 0.22, 900, 'bandpass', 0.7); },
  dash()       { this.noise(0.22, 0.3, 3200, 'bandpass', 0.6); this.tone('sine', 700, 200, 0.15, 0.06); },
  land()       { this.noise(0.1, 0.16, 300, 'lowpass'); },
  geo()        { this.tone('sine', 1200, 1800, 0.12, 0.12); this.tone('sine', 2400, 3000, 0.1, 0.05); },
  soul()       { this.tone('sine', 900, 1400, 0.25, 0.07); },
  heal()       { this.bell(660, 0.2, 1.6); this.bell(990, 0.12, 1.9); },
  focusLoop()  { this.tone('sine', 220, 440, 0.5, 0.04); },
  bench()      { this.bell(440, 0.18, 2.2); this.bell(554, 0.1, 2.4); },
  select()     { this.tone('sine', 800, 1000, 0.08, 0.08); },
  confirmS()   { this.bell(523, 0.15, 1.2); },
  roar()       { this.tone('sawtooth', 90, 40, 1.4, 0.4, 0.05); this.noise(1.2, 0.3, 300, 'lowpass'); },
  bossHit()    { this.noise(0.14, 0.5, 1200, 'bandpass', 0.7); this.tone('square', 160, 60, 0.16, 0.2); },
  shatter()    { this.noise(0.5, 0.4, 2500, 'highpass'); this.tone('sine', 2000, 300, 0.5, 0.12); },
  pickup()     { this.bell(784, 0.2, 2.0); this.bell(1175, 0.15, 2.4); this.bell(1568, 0.1, 2.8); },
  gate()       { this.noise(0.8, 0.3, 200, 'lowpass'); this.tone('sawtooth', 60, 30, 0.9, 0.2); },
};

/* ==========================================================================
   SECTION 3 — SPRITE FACTORY
   Every sprite in the game is drawn here, path by path, into cached
   offscreen canvases. Each entry stores normal frames plus a pre-baked
   white silhouette used for hit-flash.
   ========================================================================== */

const SPR = {};

function mkFrames(n, w, h, fn) {
  const f = [], wq = [];
  for (let i = 0; i < n; i++) {
    const c = makeCanvas(w, h);
    const g = c.getContext('2d');
    fn(g, i, n);
    f.push(c);
    // white silhouette bake
    const wc = makeCanvas(w, h);
    const wg = wc.getContext('2d');
    wg.drawImage(c, 0, 0);
    wg.globalCompositeOperation = 'source-in';
    wg.fillStyle = '#ffffff';
    wg.fillRect(0, 0, w, h);
    wq.push(wc);
  }
  return { f, w };
}

// Draws a sprite frame centered horizontally at cx, bottom-aligned at by.
function drawSpr(spr, idx, cx, by, flip, alpha = 1) {
  const img = spr.f[idx % spr.f.length];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(Math.round(cx), Math.round(by));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -img.width / 2, -img.height);
  ctx.restore();
}
function drawSprWhite(spr, idx, cx, by, flip) {
  const img = spr.w[idx % spr.w.length];
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(by));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -img.width / 2, -img.height);
  ctx.restore();
}

/* --------------------------------------------------------------------------
   3.1 — THE KNIGHT
   Poses are painted through one parametric painter so every frame shares
   anatomy: pale mask, curved horns, dark cloak with ragged hem, small legs.
   -------------------------------------------------------------------------- */

function paintKnightBody(g, P) {
  // P: { bob, lean, hem:[6 flutter offsets], legA, legB, tuck, kneel,
  //     eyeGlow, focus, hurtFlash }
  const cx = 28;
  const groundY = 60;
  const bob = P.bob || 0;
  const lean = P.lean || 0;

  g.save();
  g.translate(cx, groundY + bob);
  g.rotate(lean);

  const inkDark   = '#14151d';
  const cloak     = '#232634';
  const cloakRim  = '#3a3f52';
  const maskCol   = '#e9e6da';
  const maskShade = '#c9c5b6';

  // --- legs ------------------------------------------------------------
  if (!P.kneel) {
    g.fillStyle = inkDark;
    if (P.tuck) {
      // tucked legs (jump)
      g.beginPath();
      g.ellipse(-4, -4, 4, 5, -0.5, 0, Math.PI * 2);
      g.fill();
      g.beginPath();
      g.ellipse(5, -5, 4, 5, 0.4, 0, Math.PI * 2);
      g.fill();
    } else {
      // standing / running legs; legA & legB are x,y offsets
      g.save();
      g.translate(P.legA[0], P.legA[1]);
      g.beginPath();
      g.ellipse(0, 0, 3.2, 4.6, 0.1, 0, Math.PI * 2);
      g.fill();
      g.restore();
      g.save();
      g.translate(P.legB[0], P.legB[1]);
      g.beginPath();
      g.ellipse(0, 0, 3.2, 4.6, -0.1, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }
  } else {
    // kneeling for focus: folded legs
    g.fillStyle = inkDark;
    g.beginPath();
    g.ellipse(-5, -2, 6, 4, 0.2, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.ellipse(5, -2, 6, 4, -0.2, 0, Math.PI * 2);
    g.fill();
  }

  // --- cloak ------------------------------------------------------------
  // Cloak sweeps from narrow shoulders down to a ragged hem. The hem is
  // drawn as a jagged polyline whose points carry flutter offsets.
  const shoulderY = -26;
  const hemY = -6;
  const hw = 11;   // half width at hem
  const hem = P.hem; // 6 offsets

  g.fillStyle = cloak;
  g.beginPath();
  g.moveTo(-7 + lean * 4, shoulderY);
  g.bezierCurveTo(-13, shoulderY + 8, -hw - 3, hemY - 12, -hw - 2 + hem[0], hemY);
  // ragged hem: down-up zigzag across 6 points
  g.lineTo(-hw - 2 + hem[0] + 3, hemY + 4);
  g.lineTo(-hw * 0.6 + hem[1], hemY - 1);
  g.lineTo(-hw * 0.6 + hem[1] + 3, hemY + 5);
  g.lineTo(0 + hem[2], hemY - 2);
  g.lineTo(hem[2] + 3, hemY + 6);
  g.lineTo(hw * 0.6 + hem[3], hemY - 1);
  g.lineTo(hw * 0.6 + hem[3] - 3, hemY + 4);
  g.lineTo(hw + 2 + hem[4], hemY);
  g.bezierCurveTo(hw + 4, hemY - 12, 13, shoulderY + 8, 7 + lean * 4, shoulderY);
  g.closePath();
  g.fill();

  // cloak rim light along the leading edge
  g.strokeStyle = cloakRim;
  g.lineWidth = 1.4;
  g.beginPath();
  g.moveTo(7 + lean * 4, shoulderY + 1);
  g.bezierCurveTo(hw + 4, hemY - 12, hw + 3, hemY - 8, hw + 2 + hem[4], hemY);
  g.stroke();

  // inner shadow fold
  g.strokeStyle = 'rgba(0,0,0,0.45)';
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(-2 + hem[2] * 0.5, shoulderY + 6);
  g.quadraticCurveTo(-4, hemY - 14, -3 + hem[1] * 0.6, hemY - 2);
  g.stroke();

  // --- head / mask ------------------------------------------------------
  const hy = -36;
  g.save();
  g.translate(lean * 6, 0);

  // mask base
  g.fillStyle = maskCol;
  g.beginPath();
  g.moveTo(-10, hy + 4);
  g.bezierCurveTo(-11, hy - 8, -6, hy - 13, 0, hy - 13);
  g.bezierCurveTo(6, hy - 13, 11, hy - 8, 10, hy + 4);
  g.bezierCurveTo(8, hy + 10, 3, hy + 12, 0, hy + 12);
  g.bezierCurveTo(-3, hy + 12, -8, hy + 10, -10, hy + 4);
  g.closePath();
  g.fill();

  // horns — two sweeping curves, left one slightly chipped
  g.fillStyle = maskCol;
  g.beginPath(); // left horn
  g.moveTo(-6, hy - 10);
  g.bezierCurveTo(-11, hy - 18, -13, hy - 24, -10.5, hy - 28);
  g.bezierCurveTo(-10, hy - 24, -8, hy - 20, -3.5, hy - 13);
  g.closePath();
  g.fill();
  g.beginPath(); // right horn, longer
  g.moveTo(4, hy - 11);
  g.bezierCurveTo(9, hy - 19, 13, hy - 26, 12.5, hy - 31);
  g.bezierCurveTo(11, hy - 25, 7, hy - 19, 1.5, hy - 12);
  g.closePath();
  g.fill();

  // mask shading under the brow
  g.fillStyle = maskShade;
  g.beginPath();
  g.moveTo(-10, hy + 3);
  g.bezierCurveTo(-4, hy + 7, 4, hy + 7, 10, hy + 3);
  g.bezierCurveTo(8, hy + 10, 3, hy + 12, 0, hy + 12);
  g.bezierCurveTo(-3, hy + 12, -8, hy + 10, -10, hy + 3);
  g.closePath();
  g.globalAlpha = 0.5;
  g.fill();
  g.globalAlpha = 1;

  // eyes — vertical almonds
  if (P.eyeGlow) {
    g.fillStyle = '#ffffff';
    g.shadowColor = '#dfe9ff';
    g.shadowBlur = 8;
  } else {

}

function knightPoseParams(pose, i, n) {
  // Returns the parameter object consumed by paintKnightBody.
  const P = { hem: [0, 0, 0, 0, 0], legA: [-4, 0], legB: [4, 0], tuck: false, kneel: false, eyeGlow: false };
  switch (pose) {
    case 'idle': {
      const t = (i / n) * Math.PI * 2;
      P.bob = Math.sin(t) * 1.2;
      for (let k = 0; k < 5; k++) P.hem[k] = Math.sin(t - k * 0.6) * 1.4;
      P.legA = [-4, 0]; P.legB = [4, 0];
      break;
    }
    case 'run': {
      const t = (i / n) * Math.PI * 2;
      P.lean = 0.09;
      P.bob = Math.abs(Math.sin(t)) * -2;
      P.legA = [Math.sin(t) * 6 - 1, -Math.max(0, Math.cos(t)) * 4];
      P.legB = [Math.sin(t + Math.PI) * 6 + 1, -Math.max(0, Math.cos(t + Math.PI)) * 4];
      for (let k = 0; k < 5; k++) P.hem[k] = Math.sin(t * 2 - k * 0.8) * 2.6 - 2.5;
      break;
    }
    case 'jump': {
      P.tuck = true;
      P.bob = -1;
      P.lean = -0.04;
      for (let k = 0; k < 5; k++) P.hem[k] = -3 + Math.sin(i * 1.7 - k) * 1.2;
      break;
    }
    case 'fall': {
      P.tuck = false;
      P.legA = [-5, 2]; P.legB = [5, 3];
      for (let k = 0; k < 5; k++) P.hem[k] = -5 + Math.sin(i * 2.1 - k * 0.9) * 2;
      break;
    }
    case 'wall': {
      P.lean = -0.14;
      P.legA = [-2, 3]; P.legB = [5, 1];
      for (let k = 0; k < 5; k++) P.hem[k] = 3 + Math.sin(i * 1.3 - k) * 1.6;
      break;
    }
    case 'dash': {
      P.lean = 0.3;
      P.tuck = true;
      P.bob = -2;
      for (let k = 0; k < 5; k++) P.hem[k] = -6 - k * 1.2;
      break;
    }
    case 'focus': {
      const t = (i / n) * Math.PI * 2;
      P.kneel = true;
      P.eyeGlow = true;
      P.bob = Math.sin(t) * 0.8;
      for (let k = 0; k < 5; k++) P.hem[k] = Math.sin(t * 2 - k * 0.5) * 1.8;
      break;
    }
    case 'sit': {
      P.kneel = true;
      P.bob = 3;
      P.eyeGlow = false;
      for (let k = 0; k < 5; k++) P.hem[k] = Math.sin((i / n) * 6.28 - k * 0.4) * 0.7;
      break;
    }
    case 'hurt': {
      P.lean = -0.22;
      P.tuck = true;
      for (let k = 0; k < 5; k++) P.hem[k] = -4 + Math.sin(k * 1.4) * 2;
      break;
    }
  }
  return P;
}

function buildKnightSprites() {
  const W = 56, H = 64;
  SPR.knight = {};
  const poses = [
    ['idle', 6], ['run', 10], ['jump', 1], ['fall', 2],
    ['wall', 2], ['dash', 2], ['focus', 6], ['sit', 4], ['hurt', 1],
  ];
  for (const [pose, n] of poses) {
    SPR.knight[pose] = mkFrames(n, W, H, (g, i) => {
      g.save();
      g.translate(0, 0);
      paintKnightBody(g, knightPoseParams(pose, i, n));
      g.restore();
    });
  }
}

    g.beginPath();

    // rim light

    g.beginPath();

    // central gold clasp
    g.fillStyle = gold;
    g.beginPath();
    g.moveTo(0, -66 + breathe);
    g.lineTo(4, -60 + breathe); g.lineTo(0, -54 + breathe);
    g.lineTo(-4, -60 + breathe);
    g.closePath();
    g.fill();

    // pauldrons — high, pointed
    g.fillStyle = '#262838';
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(s * 8, -72 + breathe);
      g.quadraticCurveTo(s * 24, -74 + breathe, s * 20, -60 + breathe);
      g.quadraticCurveTo(s * 13, -62 + breathe, s * 7, -66 + breathe);

      g.fill();
      g.strokeStyle = cloakRim;
      g.lineWidth = 1;

    }

    // head — narrow pale mask, FOUR eyes, tall crown of horns
    const hy = -86 + breathe;
    g.fillStyle = pale;
    g.beginPath();
    g.moveTo(-8, hy + 8);
    g.bezierCurveTo(-10, hy - 6, -6, hy - 12, 0, hy - 12);
    g.bezierCurveTo(6, hy - 12, 10, hy - 6, 8, hy + 8);
    g.bezierCurveTo(5, hy + 13, -5, hy + 13, -8, hy + 8);
    g.closePath();
    g.fill();
    // crown: three horns
    g.fillStyle = pale;
    g.beginPath();
    g.moveTo(-6, hy - 9);
    g.bezierCurveTo(-12, hy - 20, -14, hy - 28, -10, hy - 34);
    g.bezierCurveTo(-9, hy - 26, -6, hy - 18, -2, hy - 12);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(6, hy - 9);
    g.bezierCurveTo(12, hy - 20, 14, hy - 28, 10, hy - 34);
    g.bezierCurveTo(9, hy - 26, 6, hy - 18, 2, hy - 12);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(-2, hy - 11);
    g.bezierCurveTo(-3, hy - 22, 0, hy - 27, 1, hy - 30);
    g.bezierCurveTo(2, hy - 24, 3, hy - 18, 3, hy - 12);

    // four eyes
    const eyesGlow = (i >= 8);

    g.beginPath(); g.ellipse(-4.5, hy - 1, 1.5, 2.4, 0.1, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(4.5, hy - 1, 1.5, 2.4, -0.1, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(-2, hy + 4, 1.1, 1.7, 0.1, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(2, hy + 4, 1.1, 1.7, -0.1, 0, Math.PI * 2); g.fill();
    g.shadowBlur = 0;
    // cheek crack
    g.strokeStyle = 'rgba(90,88,78,0.7)';
    g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(-7, hy + 3); g.lineTo(-5.5, hy + 6); g.lineTo(-6.5, hy + 9);
    g.stroke();

    // the great nail
    g.strokeStyle = '#d6d1bf';
    g.lineWidth = 3.4;
    g.lineCap = 'round';
    if (i === 6 || i === 7) {
      // sweeping slash / dash hold — nail horizontal
      g.beginPath();
      g.moveTo(14, -46);
      g.lineTo(44, -52);
      g.stroke();
      g.strokeStyle = '#948f7c';
      g.lineWidth = 1.2;
      g.beginPath();
      g.moveTo(16, -48); g.lineTo(42, -53.5);

    } else if (i === 8) {
      // raised high
      g.beginPath();
      g.moveTo(12, -50);
      g.lineTo(26, -84);
      g.stroke();
    } else if (i === 9) {
      // both hands channeling — nail planted
      g.beginPath();
      g.moveTo(16, -30);
      g.lineTo(20, -6);
      g.stroke();
    } else {
      g.beginPath();
      g.moveTo(13, -48);
      g.lineTo(18, -20);
      g.stroke();
    }
    g.restore();
    g.restore();
  });
}

function zoneIndexAtPx(px) {
  const tx = Math.floor(px / TILE);
  if (tx < 60) return 0;
  if (tx < 150) return 1;
  if (tx < 240) return 2;
  return 3;
}

// Tile atlas per zone: [top-exposed, interior, left/right-edge, bottom] x 4 noise variants
function buildTileAtlas() {
  SPR.tiles = [];
  for (let z = 0; z < 4; z++) {
    const Z = ZONES[z];
    const variants = [];
    for (let v = 0; v < 4; v++) {
      const rng = mulberry32(1000 + z * 100 + v);
      // top tile
      const top = makeCanvas(TILE, TILE);
      {
        const g = top.getContext('2d');
        g.fillStyle = Z.rock;
        g.fillRect(0, 0, TILE, TILE);
        // speckle texture
        for (let i = 0; i < 26; i++) {
          g.fillStyle = rng() > 0.5 ? Z.rockHi : Z.rockLo;
          g.globalAlpha = 0.25 + rng() * 0.3;
          g.fillRect((rng() * TILE) | 0, (rng() * TILE) | 0, 2 + (rng() * 3 | 0), 1 + (rng() * 2 | 0));
        }
        g.globalAlpha = 1;
        // top edge — mossy crust
        g.fillStyle = Z.rockHi;
        g.fillRect(0, 0, TILE, 4);
        g.fillStyle = Z.moss;
        for (let i = 0; i < TILE; i += 3) {
          const hh = 2 + ((rng() * 4) | 0);
          g.globalAlpha = 0.5 + rng() * 0.5;
          g.fillRect(i, 0, 3, hh);
        }
        g.globalAlpha = 1;
        g.fillStyle = 'rgba(255,255,255,0.09)';
        g.fillRect(0, 0, TILE, 1.5);
      }
      // interior tile
      const innr = makeCanvas(TILE, TILE);
      {
        const g = innr.getContext('2d');
        g.fillStyle = Z.rockLo;
        g.fillRect(0, 0, TILE, TILE);
        for (let i = 0; i < 30; i++) {
          g.fillStyle = rng() > 0.5 ? Z.rock : Z.rockHi;
          g.globalAlpha = 0.12 + rng() * 0.2;
          g.fillRect((rng() * TILE) | 0, (rng() * TILE) | 0, 2 + (rng() * 4 | 0), 2);
        }
        g.globalAlpha = 1;
      }
      // bottom tile (ceiling underside)
      const bott = makeCanvas(TILE, TILE);
      {
        const g = bott.getContext('2d');
        g.drawImage(innr, 0, 0);
        g.fillStyle = 'rgba(0,0,0,0.4)';
        g.fillRect(0, TILE - 3, TILE, 3);
      }
      variants.push({ top, innr, bott });
    }
    SPR.tiles.push(variants);
  }
  // one-way platform plank
  SPR.plank = mkFrames(1, TILE, 12, (g) => {
    g.fillStyle = '#2c2620';
    g.fillRect(0, 2, TILE, 7);
    g.fillStyle = '#4a4032';
    g.fillRect(0, 2, TILE, 2);
    g.fillStyle = 'rgba(0,0,0,0.5)';
    g.fillRect(0, 8, TILE, 1);
    g.strokeStyle = '#1a1612';
    g.lineWidth = 1;
    g.strokeRect(0.5, 2.5, TILE - 1, 6);
    g.fillStyle = '#3a3226';
    g.fillRect(3, 3, 2, 6);
    g.fillRect(TILE - 6, 3, 2, 6);
  }).f[0];
  // spikes
  SPR.spike = mkFrames(1, TILE, TILE, (g) => {
    const rng = mulberry32(777);
    for (let i = 0; i < 4; i++) {
      const bx = 3 + i * 7 + rng() * 3;
      const h = 14 + rng() * 12;
      g.fillStyle = '#c9c4b2';
      g.beginPath();
      g.moveTo(bx - 3.5, TILE);
      g.quadraticCurveTo(bx - 2, TILE - h * 0.6, bx, TILE - h);
      g.quadraticCurveTo(bx + 2, TILE - h * 0.6, bx + 3.5, TILE);
      g.closePath();
      g.fill();
      g.fillStyle = '#8f8a78';
      g.beginPath();
      g.moveTo(bx + 0.5, TILE - h + 2);
      g.quadraticCurveTo(bx + 2, TILE - h * 0.5, bx + 3.5, TILE);
      g.lineTo(bx + 0.5, TILE);
      g.closePath();
      g.fill();
    }
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.fillRect(0, TILE - 3, TILE, 3);
  }).f[0];
}

// Background parallax layers per zone (pre-rendered silhouette strips)
function buildBackgrounds() {
  SPR.bg = [];
  for (let z = 0; z < 4; z++) {
    const Z = ZONES[z];
    const layers = [];
    const rng = mulberry32(500 + z * 31);
    for (let L = 0; L < 3; L++) {
      const c = makeCanvas(1024, 560);
      const g = c.getContext('2d');
      const depth = 0.25 + L * 0.22;
      const alpha = 0.5 + L * 0.22;
      g.fillStyle = Z.rockLo;
      g.globalAlpha = alpha * 0.55;
      if (z === 0) {
        // broken pillars and arches
        for (let i = 0; i < 9; i++) {
          const x = rng() * 1024, w = 26 + rng() * 44;
          const h = 160 + rng() * 300;
          g.fillRect(x, 560 - h, w, h);
          g.fillRect(x - 8, 560 - h, w + 16, 12);
          if (rng() > 0.5) g.fillRect(x - 8, 560 - h + 40 + rng() * 60, w + 16, 8);
        }
      } else if (z === 1) {
        // giant mushrooms and hanging roots
        for (let i = 0; i < 8; i++) {
          const x = rng() * 1024, h = 140 + rng() * 260, capW = 50 + rng() * 90;
          g.fillRect(x - 7, 560 - h, 14, h);
          g.beginPath();
          g.ellipse(x, 560 - h, capW / 2, 22 + rng() * 16, 0, Math.PI, 0);
          g.fill();
        }
        for (let i = 0; i < 14; i++) {
          const x = rng() * 1024, len = 40 + rng() * 160;
          g.save();
          g.strokeStyle = Z.rockLo;
          g.globalAlpha = alpha * 0.8;
          g.lineWidth = 2 + rng() * 3;
          g.beginPath();
          g.moveTo(x, 0);
          g.quadraticCurveTo(x + (rng() - 0.5) * 40, len / 2, x + (rng() - 0.5) * 20, len);
          g.stroke();
          g.restore();
        }
      } else if (z === 2) {
        // cathedral columns and rose arches
        for (let i = 0; i < 7; i++) {
          const x = rng() * 1024, w = 34 + rng() * 30, h = 240 + rng() * 300;
          g.fillRect(x, 560 - h, w, h);
          g.fillRect(x - 10, 560 - h, w + 20, 14);
          g.fillRect(x - 10, 560 - h + h * 0.4, w + 20, 10);
          // pointed arch above
          g.beginPath();
          g.moveTo(x - 14, 560 - h - 14);
          g.quadraticCurveTo(x + w / 2, 560 - h - 60 - rng() * 40, x + w + 14, 560 - h - 14);
          g.lineTo(x + w + 14, 560 - h);
          g.lineTo(x - 14, 560 - h);
          g.closePath();
          g.fill();
        }
      } else {
        // austere court — rows of thin obelisks
        for (let i = 0; i < 12; i++) {
          const x = rng() * 1024, w = 18 + rng() * 20, h = 200 + rng() * 320;
          g.fillRect(x, 560 - h, w, h);
          g.beginPath();
          g.moveTo(x - 4, 560 - h);
          g.lineTo(x + w / 2, 560 - h - 26 - rng() * 30);
          g.lineTo(x + w + 4, 560 - h);
          g.closePath();
          g.fill();
        }
      }
      layers.push({ c, depth });
    }
    SPR.bg.push(layers);
  }
}

/* --------------------------------------------------------------------------
   3.5 — slash effect painter (drawn live, not cached)
   -------------------------------------------------------------------------- */

function drawSlash(cx, cy, dir, prog, flip) {
  // dir: 0 side, 1 up, 2 down ; prog: 0..1
  const a = 1 - prog;
  if (a <= 0) return;
  ctx.save();
  ctx.translate(cx, cy);
  if (flip) ctx.scale(-1, 1);
  let rot = 0;
  if (dir === 1) rot = -Math.PI / 2;
  if (dir === 2) rot = Math.PI / 2;
  ctx.rotate(rot);

  const r1 = 16 + prog * 12;
  const r2 = 30 + prog * 18;
  const glow = 'rgba(223, 232, 240, 0.78)';
  const edge = 'rgba(255, 255, 255, 0.8)';

  ctx.shadowColor = 'rgba(220, 234, 245, 0.85)';
  ctx.shadowBlur = 16;
  ctx.globalAlpha = a * 0.9;
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.moveTo(-4, -r2);
  ctx.quadraticCurveTo(0, -r1 * 0.2, 4, -r2);
  ctx.lineTo(5, r2 * 0.7);
  ctx.quadraticCurveTo(0, r1 + 6, -5, r2 * 0.7);
  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha = a * 0.52;
  ctx.strokeStyle = edge;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-2, -r2 - 1);
  ctx.quadraticCurveTo(0, -r1 * 0.5, 2, -r2 - 1);
  ctx.stroke();

  ctx.globalAlpha = a * 0.65;
  ctx.fillStyle = 'rgba(165, 176, 195, 0.35)';
  ctx.beginPath();
  ctx.moveTo(0, -r2 * 0.4);
  ctx.lineTo(2, r2 * 0.9);
  ctx.lineTo(-2, r2 * 0.9);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

const pickupsDef = [];
const benchDefs = [];
const tabletDefs = [];
const totemDefs = [];

function T(x, y) { return y * GW + x; }
function tileGet(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= GW || ty >= GH) return 1;
  return grid[T(tx, ty)];
}
function tileSet(tx, ty, v) {
  if (tx < 0 || ty < 0 || tx >= GW || ty >= GH) return;
  grid[T(tx, ty)] = v;
}
function fillRectT(x, y, w, h, v) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      tileSet(i, j, v);
}
const carve  = (x, y, w, h) => fillRectT(x, y, w, h, 0);
const solid  = (x, y, w, h) => fillRectT(x, y, w, h, 1);
const spikesT = (x, y, w)   => fillRectT(x, y, w, 1, 2);
const oneway  = (x, y, w)   => fillRectT(x, y, w, 1, 3);

function addDecor(type, x, y, extra) {

function spawnE(type, tx, ty) { enemySpawns.push({ type, x: tx * TILE, y: ty * TILE }); }
function pickup(type, tx, ty) { pickupsDef.push({ type, x: tx * TILE, y: ty * TILE }); }
function benchAt(tx, ty, id)  { benchDefs.push({ id, x: tx * TILE, y: ty * TILE }); }

/* ==========================================================================
   SECTION 5 — PHYSICS HELPERS
   ========================================================================== */

function isSolidTile(tx, ty) { return tileGet(tx, ty) === 1; }

function moveX(e, dx) {
  e.hitWall = 0;
  let nx = e.x + dx;
  const ys = [];
  const n = Math.max(2, Math.ceil(e.h / TILE) + 1);
  for (let i = 0; i <= n; i++) ys.push(e.y + 1 + (e.h - 2) * (i / n));
  if (dx > 0) {
    const edge = nx + e.w;
    const tx = Math.floor(edge / TILE);
    for (const py of ys) {
      if (isSolidTile(tx, Math.floor(py / TILE))) {
        nx = tx * TILE - e.w - 0.01;
        e.hitWall = 1;
        break;
      }
    }
  } else if (dx < 0) {
    const tx = Math.floor(nx / TILE);
    for (const py of ys) {
      if (isSolidTile(tx, Math.floor(py / TILE))) {
        nx = (tx + 1) * TILE + 0.01;
        e.hitWall = 1;
        break;
      }
    }
  }
  e.x = nx;
}

function moveY(e, dy) {
  e.hitFloor = 0; e.hitCeil = 0;
  const prevBottom = e.y + e.h;
  let ny = e.y + dy;
  const xs = [];
  const n = Math.max(2, Math.ceil(e.w / TILE) + 1);
  for (let i = 0; i <= n; i++) xs.push(e.x + 1 + (e.w - 2) * (i / n));
  if (dy > 0) {
    const bottom = ny + e.h;
    const ty = Math.floor(bottom / TILE);
    for (const px of xs) {
      const tx = Math.floor(px / TILE);
      const t = tileGet(tx, ty);
      if (t === 1) {
        ny = ty * TILE - e.h - 0.01;
        e.hitFloor = 1;
        break;
      } else if (t === 3 && !e.dropThru && prevBottom <= ty * TILE + 6) {
        ny = ty * TILE - e.h - 0.01;
        e.hitFloor = 2; // landed on plank
        break;
      }
    }
  } else if (dy < 0) {
    const ty = Math.floor(ny / TILE);
    for (const px of xs) {
      if (isSolidTile(Math.floor(px / TILE), ty)) {
        ny = (ty + 1) * TILE + 0.01;
        e.hitCeil = 1;
        break;
      }
    }
  }
  e.y = ny;
}

function touchingSpike(e) {
  const pts = [
    [e.x + 3, e.y + e.h - 2], [e.x + e.w - 3, e.y + e.h - 2],
    [e.x + e.w / 2, e.y + e.h / 2], [e.x + e.w / 2, e.y + 3],
    [e.x + 3, e.y + 3], [e.x + e.w - 3, e.y + 3],
  ];
  for (const [px, py] of pts) {
    if (tileGet(Math.floor(px / TILE), Math.floor(py / TILE)) === 2) return true;
  }
  return false;
}

function probeGroundAhead(e, dir) {
  const px = dir > 0 ? e.x + e.w + 4 : e.x - 4;
  const py = e.y + e.h + 6;
  const t = tileGet(Math.floor(px / TILE), Math.floor(py / TILE));
  return t === 1 || t === 3;
}

const particles = [];
const MAXP = 500;

function addP(o) {

function burstDust(x, y, n, spread) {

}
function burstHit(x, y) {

    const a = rndr(0, Math.PI * 2), s = rndr(1, 4.5);
    addP({

      life: rndr(10, 22), size: rndr(1.5, 3.5),
      col: rndr(0, 1) > 0.5 ? '#e9e6da' : '#b8b2a0', grav: 0.08, drag: 0.92,
    });

}
function burstVoid(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rndr(0, Math.PI * 2), s = rndr(0.5, 3.5);
    addP({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
      life: rndr(20, 46), size: rndr(2, 6),
      col: rndr(0, 1) > 0.3 ? 'rgba(20,18,30,0.85)' : 'rgba(60,55,80,0.7)',
      grav: 0.02, drag: 0.95,
    });
  }
}
function burstSoul(x, y, n) {
  for (let i = 0; i < n; i++) {
    addP({
      x: x + rndr(-8, 8), y: y + rndr(-8, 8),
      vx: rndr(-1, 1), vy: rndr(-2, -0.5),
      life: rndr(30, 60), size: rndr(2, 4),
      col: 'rgba(225,232,240,0.85)', grav: -0.01, drag: 0.96, seek: 'player',
    });

}
function burstMaskShards(x, y) {
  for (let i = 0; i < 7; i++) {
    const a = rndr(0, Math.PI * 2), s = rndr(1.5, 4);
    addP({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
      life: rndr(40, 70), size: rndr(3, 6),
      col: '#e9e6da', grav: 0.14, drag: 0.98, type: 'shard',
      rot: rndr(0, 6.28), vr: rndr(-0.2, 0.2),
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t++;
    if (p.seek === 'player') {
      const dx = (player.x + player.w / 2) - p.x;
      const dy = (player.y + player.h / 2) - p.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      p.vx += (dx / d) * 0.35;
      p.vy += (dy / d) * 0.35;
    }
    p.vy += p.grav;
    p.vx *= p.drag; p.vy *= p.drag;
    p.x += p.vx; p.y += p.vy;
    if (p.type === 'shard') p.rot += p.vr;
    if (p.t >= p.life) particles.splice(i, 1);
  }
}

function renderParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    if (p.type === 'shard') {
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.moveTo(0, -p.size);
      ctx.lineTo(p.size * 0.6, p.size);
      ctx.lineTo(-p.size * 0.6, p.size * 0.6);
      ctx.closePath();
      ctx.fill();
    } else if (p.type === 'ring') {
      ctx.strokeStyle = p.col;
      ctx.lineWidth = 2 * a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size + p.t * 1.6, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}
