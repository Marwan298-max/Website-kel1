  visited: [false, false, false, false],
  zoneCard: 0,
  zoneCardText: '',
  bossDead: false,
  bossActive: false,
  gateClosed: false,
  geoBank: 0,
  msg: null, msgT: 0,
};

const cam = { x: 0, y: 0, shake: 0, sx: 0, sy: 0 };

const player = {
  x: 0, y: 0, w: 18, h: 34,
  vx: 0, vy: 0,
  face: 1,
  grounded: false, wasGrounded: false,
  coyote: 0, jbuf: 0,
  jumpsUsed: 0,
  wallDir: 0, wallSlide: false,
  dropThru: false,
  state: 'idle',
  anim: 0,
  attackT: 0, attackCD: 0, attackDir: 0, swingId: 0,
  dashT: 0, dashCD: 0, dashDirX: 1, dashDirY: 0,
  hp: 5, maxHp: 5,
  soul: 0, soulMax: 99,
  geo: 0,
  invT: 0, hurtT: 0,
  focusT: 0, focusing: false,
  sit: false, sitBench: null,
  dead: false, deadT: 0,
  respawnX: 0, respawnY: 0,
  lastSafeX: 0, lastSafeY: 0,
  hazardFade: 0,
  abilities: { dash: true, wings: false, claws: false },
  nailDmg: 1,
};

let enemies = [];
let projectiles = [];
let geos = [];
let pickups = [];
let benches = [];
let tablets = [];
let totems = [];
let shade = null;
let boss = null;
let endingDoor = null;

function resetWorldEntities() {
  enemies = [];
  projectiles = [];
  geos = [];
  pickups = [];
  benches = [];
  tablets = [];
  totems = [];
  shade = null;
  boss = null;
  endingDoor = null;

  for (const s of enemySpawns) enemies.push(makeEnemy(s.type, s.x, s.y));
  for (const p of pickupsDef) {
    if (p.type === 'nothing') {
      endingDoor = { x: p.x - 20, y: p.y - 96, w: 60, h: 96 };
      continue;
    }
    pickups.push({ type: p.type, x: p.x + 16, y: p.y - 20, w: 30, h: 30, bob: rnd(0, 6.28), taken: false });
  }
  for (const b of benchDefs) benches.push({ id: b.id, x: b.x - 44, y: b.y - 58, w: 88, h: 58 });
  for (const t of tabletDefs) tablets.push({ x: t.x - 10, y: t.y - 60, w: 40, h: 60, text: t.text });
  for (const t of totemDefs) totems.push({ x: t.x - 12, y: t.y - 80, w: 40, h: 80, used: false });
}

function placePlayerAtBench(id) {
  const b = benches.find(bb => bb.id === id) || benches[0];
  player.x = b.x + b.w / 2 - player.w / 2;
  player.y = b.y + b.h - player.h;
  player.respawnX = player.x;
  player.respawnY = player.y;
  player.lastSafeX = player.x;
  player.lastSafeY = player.y;
  player.vx = 0; player.vy = 0;
}

/* -- player update --------------------------------------------------------- */

function updatePlayer() {
  const p = player;
  p.anim += 1;

  if (p.dead) {
    p.deadT++;
    if (p.deadT === 100) {
      game.state = 'dead';
    }
    return;
  }

  if (p.sit) {
    // resting at a bench
    if (Input.hit('jump') || Input.hit('left') || Input.hit('right') || Input.hit('dash')) {
      p.sit = false;
      p.sitBench = null;
      p.vy = -1;
    }
    return;
  }

  if (game.reading) return;

  if (p.hazardFade > 0) {
    p.hazardFade--;
    if (p.hazardFade === 0) {
      p.x = p.lastSafeX; p.y = p.lastSafeY;
      p.vx = 0; p.vy = 0;
      p.invT = 60;
      p.hazardFade = -1; // mark fade-in
    }
    return;
  }
  if (p.hazardFade === -1) { game.fadeDir = -1; p.hazardFade = 0; }

  const left  = Input.down('left');
  const right = Input.down('right');
  const up    = Input.down('up');
  const down  = Input.down('down');
  const jumpP = Input.hit('jump');
  const atkP  = Input.hit('attack');
  const dashP = Input.hit('dash');
  const focusHeld = Input.down('focus');

  // timers
  if (p.invT > 0) p.invT--;
  if (p.hurtT > 0) p.hurtT--;
  if (p.attackCD > 0) p.attackCD--;
  if (p.dashCD > 0) p.dashCD--;
  if (p.coyote > 0) p.coyote--;
  if (p.jbuf > 0) p.jbuf--;

  // ------- focus / heal --------------------------------------------------
  p.focusing = false;
  if (focusHeld && p.grounded && p.dashT <= 0 && p.attackT <= 0 &&
      p.soul >= 33 && p.hp < p.maxHp && p.hurtT <= 0 && !left && !right) {
    p.focusing = true;
    p.focusT++;
    p.vx = 0;
    if (p.focusT % 8 === 0) {
      SND.focusLoop();
      const a = rndr(0, Math.PI * 2), r = rndr(24, 40);
      addP({
        x: p.x + p.w / 2 + Math.cos(a) * r, y: p.y + p.h / 2 + Math.sin(a) * r,
        vx: 0, vy: 0, life: 20, size: 2.5, col: 'rgba(235,240,245,0.9)',
        seek: 'player', drag: 1,
      });
    }
    if (p.focusT >= 52) {
      p.focusT = 0;
      p.soul -= 33;
      p.hp++;
      SND.heal();
      addP({ x: p.x + p.w / 2, y: p.y + p.h / 2, life: 26, size: 10, col: 'rgba(240,242,238,0.9)', type: 'ring' });
      burstSoul(p.x + p.w / 2, p.y, 8);
    }
  } else {
    p.focusT = 0;
  }

  const canAct = !p.focusing && p.hurtT <= 0;

  // ------- horizontal movement ------------------------------------------
  let move = 0;
  if (canAct) {
    if (left) move -= 1;
    if (right) move += 1;
  }
  if (move !== 0 && p.dashT <= 0) p.face = move;

  if (p.dashT > 0) {
    // dashing — velocity locked
    p.dashT--;
    p.vx = p.dashDirX * 11;
    p.vy = p.dashDirY * 4;
    if (p.dashT % 2 === 0) {
      addP({
        x: p.x + p.w / 2, y: p.y + p.h / 2 + rndr(-8, 8),
        vx: -p.dashDirX * 1.5, vy: 0, life: 14, size: rndr(2, 4),
        col: 'rgba(200,200,210,0.4)', drag: 0.9,
      });
    }
  } else if (canAct) {
    const target = move * 3.4;
    p.vx = lerp(p.vx, target, p.grounded ? 0.3 : 0.18);
    if (move === 0 && Math.abs(p.vx) < 0.2) p.vx = 0;
  } else if (p.hurtT > 0) {
    p.vx *= 0.9;
  }

  // ------- jump ----------------------------------------------------------
  if (jumpP && canAct) p.jbuf = 7;
  if (p.jbuf > 0) {
    if (p.grounded || p.coyote > 0) {
      p.vy = -9.2;
      p.jbuf = 0; p.coyote = 0;
      p.grounded = false;
      p.jumpsUsed = 0;
      SND.jump();
      burstDust(p.x + p.w / 2, p.y + p.h, 5, 8);
    } else if (p.wallSlide && p.abilities.claws) {
      // wall jump
      p.vy = -8.8;
      p.vx = -p.wallDir * 5.5;
      p.face = -p.wallDir;
      p.jbuf = 0;
      p.hurtT = Math.max(p.hurtT, 7); // brief control lock
      SND.jump();
      burstDust(p.x + (p.wallDir > 0 ? p.w : 0), p.y + p.h * 0.6, 6, 5);
    } else if (p.jumpsUsed < 1) {
      p.vy = -8.8;
      p.jumpsUsed = 1;
      p.jbuf = 0;
      SND.flap();
      burstDust(p.x + p.w / 2, p.y + p.h * 0.55, 7, 9);
      for (let i = 0; i < 7; i++) {
        addP({
          x: p.x + p.w / 2 + rndr(-10, 10), y: p.y + p.h * 0.6 + rndr(-2, 3),
          vx: rndr(-1.2, 1.2), vy: rndr(-0.4, 1.6), life: 18, size: rndr(2, 4),
          col: 'rgba(225,232,238,0.7)', drag: 0.92,
        });
      }
    }
  }
  // variable jump height
  if (p.vy < -3 && !Input.down('jump')) p.vy = -3;

  // ------- dash ----------------------------------------------------------
  if (dashP && canAct && p.abilities.dash && p.dashCD <= 0 && p.dashT <= 0) {
    p.dashT = 9;
    p.dashCD = 28;
    p.dashDirX = p.face;
    p.dashDirY = up ? -0.6 : (down && !p.grounded ? 0.6 : 0);
    if (p.dashDirY !== 0) p.dashDirX = move !== 0 ? move : p.face;
    const dl = Math.sqrt(p.dashDirX * p.dashDirX + p.dashDirY * p.dashDirY);
    p.dashDirX /= dl; p.dashDirY /= dl;
    SND.dash();
  }

  // ------- attack ---------------------------------------------------------
  if (atkP && canAct && p.attackCD <= 0 && p.dashT <= 0) {
    p.attackT = 11;
    p.attackCD = 21;
    p.swingId++;
    p.attackDir = up ? 1 : (down && !p.grounded ? 2 : 0);
    SND.swing();
  }
  if (p.attackT > 0) {
    p.attackT--;
    const box = nailBox();
    if (box) resolveNailHits(box);
  }

  // ------- physics --------------------------------------------------------
  const inWallJumpLock = p.hurtT > 0 && p.vy < 0 && !p.grounded && p.abilities.claws;
  if (p.dashT <= 0) {
    p.vy += 0.42;
    const maxFall = p.wallSlide ? 2.2 : 9.5;
    if (p.vy > maxFall) p.vy = maxFall;
  }

  p.wasGrounded = p.grounded;
  p.grounded = false;

  // drop through planks
  p.dropThru = down && Input.down('jump') && p.wasGrounded ? true : (p.dropThru && down);

  moveX(p, p.vx);
  moveY(p, p.vy);

  if (p.hitFloor) {
    if (!p.wasGrounded && p.vy > 3) {
      SND.land();
      burstDust(p.x + p.w / 2, p.y + p.h, 6, 10);
    }
    p.grounded = true;
    p.coyote = 6;
    p.jumpsUsed = 0;
    p.vy = 0;
    if (p.hitFloor === 2 && down && Input.held['Space'] === undefined) { /* plank land ok */ }
  }
  if (p.hitCeil) p.vy = Math.max(p.vy, 0);

  // wall slide detection
  p.wallSlide = false;
  p.wallDir = 0;
  if (!p.grounded && p.vy > 0 && p.abilities.claws && p.dashT <= 0) {
    const pushL = left && p.hitWallPrevL;
    if (touchingWallSide(p, -1) && left) { p.wallSlide = true; p.wallDir = -1; }
    else if (touchingWallSide(p, 1) && right) { p.wallSlide = true; p.wallDir = 1; }
    if (p.wallSlide) {
      p.face = -p.wallDir;
      if (p.anim % 6 === 0) {
        addP({
          x: p.x + (p.wallDir > 0 ? p.w : 0), y: p.y + rndr(4, p.h - 4),
          vx: -p.wallDir * 0.3, vy: rndr(-0.5, 0.5), life: 14, size: 2,
          col: 'rgba(190,185,165,0.5)', drag: 0.92,
        });
      }
    }
  }

  // track wall contact for slide
  p.hitWallPrevL = false;
  if (p.hitWall && p.vx === 0) {
    const tR = isSolidTile(Math.floor((p.x + p.w + 2) / TILE), Math.floor((p.y + p.h / 2) / TILE));
    p.hitWallPrevL = !tR;
  }

  // hazards
  if (p.invT <= 0 && touchingSpike(p) && p.hazardFade === 0) {
    hazardHit();
    return;
  }

  // record last safe ground
  if (p.grounded) {
    const footT = tileGet(Math.floor((p.x + p.w / 2) / TILE), Math.floor((p.y + p.h + 4) / TILE));
    if (footT === 1 && !touchingSpike({ x: p.x - 8, y: p.y, w: p.w + 16, h: p.h + 8 })) {
      p.lastSafeX = p.x;
      p.lastSafeY = p.y;
    }
  }

  // ------- state machine for animation ------------------------------------
  if (p.dashT > 0) p.state = 'dash';
  else if (p.hurtT > 14) p.state = 'hurt';
  else if (p.focusing) p.state = 'focus';
  else if (p.wallSlide) p.state = 'wall';
  else if (!p.grounded) p.state = p.vy < 0 ? 'jump' : 'fall';
  else if (Math.abs(p.vx) > 0.6) p.state = 'run';
  else p.state = 'idle';

  // ------- interactions ----------------------------------------------------
  const pr = { x: p.x - 8, y: p.y - 8, w: p.w + 16, h: p.h + 16 };
  game.nearInteract = null;
  if (p.grounded) {
    for (const b of benches) {
      if (rectsOverlap(pr, b)) { game.nearInteract = { kind: 'bench', o: b }; break; }
    }
    if (!game.nearInteract) {
      for (const t of tablets) {
        if (rectsOverlap(pr, t)) { game.nearInteract = { kind: 'tablet', o: t }; break; }
      }
    }
  }
  if (game.nearInteract && Input.hit('inter') && canAct) {
    if (game.nearInteract.kind === 'bench') {
      p.sit = true;
      p.sitBench = game.nearInteract.o;
      p.x = game.nearInteract.o.x + game.nearInteract.o.w / 2 - p.w / 2;
      p.y = game.nearInteract.o.y + game.nearInteract.o.h - p.h - 14;
      p.hp = p.maxHp;
      p.respawnX = p.x; p.respawnY = p.y;
      p.lastSafeX = p.x; p.lastSafeY = p.y;
      saveGame();
      SND.bench();
      showMsg('Rest complete — journey saved');
    } else {
      game.reading = game.nearInteract.o.text;
      SND.select();
    }
  }

  // pickups
  for (const pk of pickups) {
    if (pk.taken) continue;
    if (rectsOverlap(pr, { x: pk.x - 15, y: pk.y - 15, w: 30, h: 30 })) {
      collectRelic(pk);
    }
  }

  // ending door
  if (endingDoor && game.bossDead && rectsOverlap(pr, endingDoor)) {
    startEnding();
  }

  // totem soul recharge happens through nail hits (resolveNailHits)

  // zone tracking
  const z = zoneIndexAtPx(p.x);
  if (!game.visited[z]) {
    game.visited[z] = true;
    game.zoneCard = 260;
    game.zoneCardText = ZONES[z].name;
    SND.setZone(z);
  } else {
    const cz = game.currentZone;
    if (cz !== z) SND.setZone(z);
  }
  game.currentZone = z;

  // boss trigger
  if (!game.bossDead && !game.bossActive && zoneIndexAtPx(p.x) === 3 && p.x > 252 * TILE) {
    startBoss();
  }
}

function touchingWallSide(p, dir) {
  const px = dir > 0 ? p.x + p.w + 2 : p.x - 2;
  const ty0 = Math.floor((p.y + 4) / TILE);
  const ty1 = Math.floor((p.y + p.h - 4) / TILE);
  const tx = Math.floor(px / TILE);
  return isSolidTile(tx, ty0) || isSolidTile(tx, ty1);
}

function nailBox() {
  const p = player;
  if (p.attackT < 4) return null; // active window frames 11..4
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  if (p.attackDir === 1) return Rect(cx - 20, p.y - 40, 40, 42);
  if (p.attackDir === 2) return Rect(cx - 16, p.y + p.h - 4, 32, 40);
  return Rect(p.face > 0 ? p.x + p.w - 4 : p.x - 34, cy - 16, 38, 34);
}

function resolveNailHits(box) {
  const p = player;
  let pogoed = false;

  // enemies
  for (const e of enemies) {
    if (e.dead || e.hitSwing === p.swingId) continue;
    if (rectsOverlap(box, e)) {
      e.hitSwing = p.swingId;
      hurtEnemy(e, p.nailDmg, sign(e.x + e.w / 2 - (p.x + p.w / 2)) || p.face);
      gainSoul(11);
      pogoed = pogoed || hitResponse(box);
    }
  }
  // boss
  if (boss && !boss.dead && boss.hitSwing !== p.swingId) {
    if (rectsOverlap(box, boss) && boss.vulnT <= 0) {
      boss.hitSwing = p.swingId;
      hurtBoss(p.nailDmg);
      gainSoul(11);
      pogoed = pogoed || hitResponse(box);
    }
  }
  // shade
  if (shade && shade.hitSwing !== p.swingId && rectsOverlap(box, shade)) {
    shade.hitSwing = p.swingId;
    reclaimShade();
    pogoed = pogoed || hitResponse(box);
  }
  // totems
  for (const t of totems) {
    if (t.used) continue;
    if (rectsOverlap(box, t)) {
      t.used = true;
      gainSoul(40);
      SND.soul();
      burstSoul(t.x + t.w / 2, t.y + 20, 16);
      addP({ x: t.x + t.w / 2, y: t.y + 20, life: 24, size: 8, col: 'rgba(225,232,240,0.8)', type: 'ring' });
      pogoed = pogoed || hitResponse(box);
    }
  }
  // spikes pogo
  if (p.attackDir === 2 && !pogoed) {
    const tipY = p.y + p.h + 10;
    const cx = p.x + p.w / 2;
    if (tileGet(Math.floor(cx / TILE), Math.floor(tipY / TILE)) === 2) {
      pogoed = true;
    }
  }
  // projectiles can be slashed away
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    if (rectsOverlap(box, pr)) {
      projectiles.splice(i, 1);
      burstHit(pr.x, pr.y);
      SND.clank();
      pogoed = pogoed || hitResponse(box);
    }
  }
  if (pogoed && p.attackDir === 2) {
    p.vy = -8.6;
    p.attackT = Math.min(p.attackT, 4);
    p.dashCD = 0;
    p.jumpsUsed = 0;
  }
}

function hitResponse(box) {
  const p = player;
  game.hitstop = Math.max(game.hitstop, 3);
  cam.shake = Math.max(cam.shake, 4);
  if (p.attackDir === 0) {
    p.vx = -p.face * 3; // recoil
  }
  if (p.attackDir === 2) return true;
  return false;
}

function gainSoul(n) {
  player.soul = Math.min(player.soulMax, player.soul + n);
  SND.soul();
}

function hazardHit() {
  const p = player;
  p.hp -= 1;
  SND.hurt();
  cam.shake = 8;
  game.hitstop = 6;
  burstMaskShards(p.x + p.w / 2, p.y + p.h / 2);
  if (p.hp <= 0) {
    killPlayer();
  } else {
    p.hazardFade = 26;
    game.fadeDir = 1;
    p.invT = 200;
  }
}

function hurtPlayer(dmg, srcX) {
  const p = player;
  if (p.invT > 0 || p.dead || p.dashT > 0 || p.hazardFade !== 0) return;
  p.hp -= dmg;
  SND.hurt();
  cam.shake = 9;
  game.hitstop = 8;
  p.invT = 90;
  p.focusT = 0;
  const dir = sign(p.x + p.w / 2 - srcX) || 1;
  p.vx = dir * 4.5;
  p.vy = -4;
  p.hurtT = 18;
  burstMaskShards(p.x + p.w / 2, p.y + p.h / 2);
  if (p.hp <= 0) killPlayer();
}

function killPlayer() {
  const p = player;
  p.dead = true;
  p.deadT = 0;
  p.hp = 0;
  game.deaths++;
  SND.shatter();
  SND.roar();
  cam.shake = 12;
  burstVoid(p.x + p.w / 2, p.y + p.h / 2, 30);
  burstMaskShards(p.x + p.w / 2, p.y + p.h / 2);
  // spawn shade holding geo
  shade = {
    x: p.x - 8, y: p.y - 10, w: 34, h: 50,
    vx: 0, vy: 0, t: 0, hitSwing: -1,
    geo: p.geo, baseY: p.y,
  };
  p.geo = 0;
}

function reclaimShade() {
  if (!shade) return;
  player.geo += shade.geo;
  SND.pickup();
  burstVoid(shade.x + 17, shade.y + 25, 20);
  burstSoul(shade.x + 17, shade.y + 25, 10);
  showMsg(shade.geo > 0 ? 'Reclaimed ' + shade.geo + ' geo' : 'The echo rests');
  shade = null;
}

function collectRelic(pk) {
  pk.taken = true;
  SND.pickup();
  cam.shake = 4;
  switch (pk.type) {
    case 'wings':
      player.abilities.wings = true;
      showMsg('MOTH WINGS — press Jump again in the air');
      burstSoul(pk.x, pk.y, 14);
      break;
    case 'claws':
      player.abilities.claws = true;
      showMsg('TALON CLAWS — slide down walls and press Jump');
      burstSoul(pk.x, pk.y, 14);
      break;
    case 'mask':
      player.maxHp++;
      player.hp = player.maxHp;
      showMsg('MASK OF VIGOR — your shell grows by one');
      burstMaskShards(pk.x, pk.y);
      break;
    case 'vessel':
      player.soulMax = 132;
      player.soul = Math.min(player.soul, player.soulMax);
      showMsg('SOUL VESSEL — you may hold deeper reserves');
      burstSoul(pk.x, pk.y, 14);
      break;
  }
  saveGame();
}

function showMsg(text) {
  game.msg = text;
  game.msgT = 220;
}

/* ==========================================================================
   SECTION 8 — ENEMIES
   ========================================================================== */

function makeEnemy(type, x, y) {
  const base = {
    type, x: x - 10, y: y - 20, w: 20, h: 20,
    vx: 0, vy: 0, face: -1, t: rnd(0, 100),
    hp: 2, maxhp: 2, dead: false, deadT: 0,
    flash: 0, hitSwing: -1, hitWall: 0, hitFloor: 0, dropThru: false,
    state: 'idle', stateT: 0, anchored: false,
  };
  switch (type) {
    case 'mite':
      Object.assign(base, { w: 30, h: 18, hp: 2, maxhp: 2, anchored: false, drop: 3 });
      base.y = y - 18;
      break;
    case 'gloom':
      Object.assign(base, { w: 24, h: 24, hp: 2, maxhp: 2, anchored: true, fly: true, drop: 6 });
      base.x = x - 12; base.y = y - 12;
      break;
    case 'spore':
      Object.assign(base, { w: 26, h: 30, hp: 3, maxhp: 3, anchored: true, root: true, drop: 8, cd: rnd(60, 160) });
      base.y = y - 30;
      break;
    case 'sentry':
      Object.assign(base, { w: 26, h: 44, hp: 5, maxhp: 5, anchored: false, drop: 14 });
      base.y = y - 44;
      break;
    case 'beetle':
      Object.assign(base, { w: 48, h: 32, hp: 8, maxhp: 8, anchored: false, drop: 22 });
      base.x = x - 24; base.y = y - 32;
      break;
  }
  return base;
}

function hurtEnemy(e, dmg, kdir) {
  e.hp -= dmg;
  e.flash = 6;
  SND.hitEnemy();
  burstHit(e.x + e.w / 2, e.y + e.h / 2);
  if (!e.fly && !e.root) e.vx += kdir * 2.2;
  if (e.hp <= 0) {
    e.dead = true;
    e.deadT = 0;
    SND.enemyDie();
    burstVoid(e.x + e.w / 2, e.y + e.h / 2, 14);
    dropGeo(e.x + e.w / 2, e.y + e.h / 2, e.drop);
  }
}

function dropGeo(x, y, n) {
  for (let i = 0; i < n; i++) {
    geos.push({
      x: x - 5, y: y - 5, w: 10, h: 10,
      vx: rndr(-2.5, 2.5), vy: rndr(-5, -2),
      t: 0, grounded: false,
    });
  }
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t++;
    if (e.flash > 0) e.flash--;

    if (e.dead) {
      e.deadT++;
      if (e.deadT > 30) enemies.splice(i, 1);
      continue;
    }

    const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
    const ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
    const d2 = dist2(pcx, pcy, ecx, ecy);

    switch (e.type) {
      case 'mite': {
        e.vx = e.face * 1.1;
        e.vy += 0.42;
        if (e.vy > 9) e.vy = 9;
        moveX(e, e.vx);
        if (e.hitWall) e.face *= -1;
        moveY(e, e.vy);
        if (e.hitFloor) { e.vy = 0; }
        else if (!e.groundedPrev && e.vy >= 0) {}
        // turn at ledges
        if (e.hitFloor || tileGet(Math.floor(ecx / TILE), Math.floor((e.y + e.h + 4) / TILE)) === 1) {
          if (!probeGroundAhead(e, e.face)) e.face *= -1;
        }
        e.groundedPrev = e.hitFloor > 0;
        break;
      }
      case 'gloom': {
        if (d2 < 260 * 260) {
          const d = Math.sqrt(d2) || 1;
          e.vx += ((pcx - ecx) / d) * 0.09;
          e.vy += ((pcy - ecy) / d) * 0.09;
          const sp = Math.sqrt(e.vx * e.vx + e.vy * e.vy);
          if (sp > 2.1) { e.vx = e.vx / sp * 2.1; e.vy = e.vy / sp * 2.1; }
          e.face = sign(e.vx) || e.face;
        } else {
          e.vx *= 0.96;
          e.vy = Math.sin(e.t * 0.05) * 0.4;
        }
        e.x += e.vx; e.y += e.vy;
        break;
      }
      case 'spore': {
        e.cd--;
        if (e.cd <= 0 && d2 < 420 * 420) {
          e.cd = 150 + rnd(0, 60);
          const dx = pcx - ecx, dy = pcy - ecy;
          const t = 46;
          const vx = dx / t;
          const vy = dy / t - 0.5 * 0.16 * t;
          projectiles.push({
            x: ecx - 8, y: e.y - 6, w: 16, h: 16,
            vx, vy, grav: 0.16, t: 0, life: 150, kind: 'spore',
          });
          SND.swing();
        }
        break;
      }
      case 'sentry': {
        e.stateT++;
        e.vy += 0.42;
        if (e.vy > 9) e.vy = 9;
        if (e.state === 'idle') {
          e.vx = e.face * 1.0;
          moveX(e, e.vx);
          if (e.hitWall) e.face *= -1;
          if (d2 < 210 * 210 && Math.abs(pcy - ecy) < 60) {
            e.state = 'tele'; e.stateT = 0;
            e.face = sign(pcx - ecx) || e.face;
          }
        } else if (e.state === 'tele') {
          e.vx = 0;
          if (e.stateT > 28) { e.state = 'lunge'; e.stateT = 0; SND.dash(); }
        } else if (e.state === 'lunge') {
          e.vx = e.face * 6;
          if (e.stateT > 18) { e.state = 'rest'; e.stateT = 0; }
        } else if (e.state === 'rest') {
          e.vx *= 0.8;
          if (e.stateT > 26) { e.state = 'idle'; e.stateT = 0; }
        }
        moveX(e, e.vx);
        if (e.hitWall && e.state === 'lunge') { e.state = 'rest'; e.stateT = 0; cam.shake = 3; }
        moveY(e, e.vy);
        if (e.hitFloor) e.vy = 0;
        break;
      }
      case 'beetle': {
        e.vy += 0.42;
        if (e.vy > 9) e.vy = 9;
        if (e.state === 'idle') {
          e.vx = e.face * 0.6;
          moveX(e, e.vx);
          if (e.hitWall) e.face *= -1;
          if (d2 < 300 * 300 && Math.abs(pcy - ecy) < 70 &&
              sign(pcx - ecx) === e.face) {
            e.state = 'tele'; e.stateT = 0;
          }
        } else if (e.state === 'tele') {
          e.vx = 0;
          e.stateT++;
          if (e.stateT > 34) { e.state = 'charge'; e.stateT = 0; SND.dash(); }
        } else if (e.state === 'charge') {
          e.vx = e.face * 6.4;
          moveX(e, e.vx);
          if (e.hitWall) {
            e.state = 'stun'; e.stateT = 0;
            cam.shake = 6; SND.clank();
            burstDust(e.x + (e.face > 0 ? e.w : 0), e.y + e.h / 2, 10, 8);
          }
          if (e.stateT > 90) { e.state = 'idle'; }
        } else if (e.state === 'stun') {
          e.vx *= 0.8;
          e.stateT++;
          if (e.stateT > 50) e.state = 'idle';
        }
        if (e.state !== 'charge') moveX(e, e.vx);
        moveY(e, e.vy);
        if (e.hitFloor) e.vy = 0;
        break;
      }
    }

    // contact damage
    if (!e.dead && rectsOverlap(player, e)) {
      hurtPlayer(1, e.x + e.w / 2);
    }
  }
}

function renderEnemy(e) {
  const ecx = e.x + e.w / 2, bottom = e.y + e.h;
  let spr = null, idx = 0;
  switch (e.type) {
    case 'mite':
      spr = SPR.mite; idx = Math.floor(e.t / 5);
      drawSpr(spr, idx, ecx, bottom, e.face < 0);
      break;
    case 'gloom':
      spr = SPR.gloom; idx = Math.floor(e.t / 4);
      drawSpr(spr, idx, ecx, bottom + 8, e.face < 0);
      break;
    case 'spore':
      spr = SPR.spore; idx = (e.cd < 30) ? 3 : Math.floor(e.t / 14) % 3;
      drawSpr(spr, idx, ecx, bottom, e.face < 0);
      break;
    case 'sentry':
      spr = SPR.sentry;
      idx = e.state === 'tele' ? 6 : (e.state === 'lunge' ? 7 : Math.floor(e.t / 6));
      drawSpr(spr, idx, ecx, bottom, e.face < 0);
      break;
    case 'beetle':
      spr = SPR.beetle;
      idx = e.state === 'tele' ? 0 : (e.state === 'stun' ? 2 : Math.floor(e.t / 6));
      drawSpr(spr, idx, ecx, bottom, e.face < 0);
      break;
  }
  if (e.flash > 0) {
    drawSprWhite(spr, idx, ecx, bottom, e.face < 0);
  }
  // death fade
  if (e.dead) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - e.deadT / 30);
    // re-render dimmed handled by alpha overlay of bg? simpler: draw shrinking
    ctx.restore();
  }
}

/* ==========================================================================
   SECTION 9 — BOSS : THE PALE WARDEN
   ========================================================================== */

function startBoss() {
  game.bossActive = true;
  boss = {
    x: 272 * TILE, y: 104 * TILE - 96, w: 46, h: 96,
    vx: 0, vy: 0, face: -1,
    hp: 100, maxhp: 100,
    phase: 1,
    state: 'intro', stateT: 0, t: 0,
    flash: 0, hitSwing: -1, vulnT: 0,
    hitWall: 0, hitFloor: 0, dropThru: false,
    dead: false, deadT: 0,
  };
  // close the gate
  solid(246, 96, 2, 10);
  game.gateClosed = true;
  SND.gate();
  SND.setBoss(true);
  SND.roar();
  cam.shake = 10;
  showMsg('THE PALE WARDEN');
}

function hurtBoss(dmg) {
  if (!boss || boss.dead) return;
  boss.hp -= dmg;
  boss.flash = 6;
  SND.bossHit();
  burstHit(boss.x + boss.w / 2, boss.y + boss.h * 0.4);
  if (boss.hp <= 40 && boss.phase === 1) {
    boss.phase = 2;
    boss.state = 'roar';
    boss.stateT = 0;
    boss.vulnT = 70;
    SND.roar();
    cam.shake = 12;
    addP({ x: boss.x + boss.w / 2, y: boss.y + boss.h / 2, life: 30, size: 16, col: 'rgba(235,230,210,0.8)', type: 'ring' });
  }
  if (boss.hp <= 0) {
    boss.hp = 0;
    boss.dead = true;
    boss.deadT = 0;
    game.slowmo = 90;
    SND.shatter();
    SND.roar();
    cam.shake = 14;
  }
}

function endBoss() {
  game.bossDead = true;
  game.bossActive = false;
  SND.setBoss(false);
  // open the gate
  carve(246, 96, 2, 10);
  game.gateClosed = false;
  dropGeo(boss.x + boss.w / 2, boss.y + boss.h / 2, 60);
  burstVoid(boss.x + boss.w / 2, boss.y + boss.h / 2, 40);
  boss = null;
  saveGame();
}

function updateBoss() {
  if (!boss) return;
  const b = boss;
  b.t++;
  if (b.flash > 0) b.flash--;
  if (b.vulnT > 0) b.vulnT--;

  if (b.dead) {
    b.deadT++;
    if (b.deadT === 120) endBoss();
    return;
  }

  const pcx = player.x + player.w / 2;
  const bcx = b.x + b.w / 2;
  const speedMul = b.phase === 2 ? 1.3 : 1;

  b.stateT++;
  b.vy += 0.42;
  if (b.vy > 10) b.vy = 10;

  switch (b.state) {
    case 'intro':
      b.vx = 0;
      if (b.stateT > 90) { b.state = 'idle'; b.stateT = 0; }
      break;

    case 'idle': {
      // stalk toward the player
      b.face = sign(pcx - bcx) || b.face;
      b.vx = b.face * 1.1 * speedMul;
      moveX(b, b.vx);
      if (b.stateT > (b.phase === 2 ? 46 : 70)) {
        b.stateT = 0;
        const roll = Math.random();
        const d = Math.abs(pcx - bcx);
        if (d > 200) b.state = roll < 0.55 ? 'leapTele' : 'dashTele';
        else b.state = roll < 0.45 ? 'dashTele' : (b.phase === 2 && roll < 0.7 ? 'burst' : 'leapTele');
      }
      break;
    }

    case 'leapTele':
      b.vx = 0;
      if (b.stateT > 26 / speedMul) {
        b.state = 'leap'; b.stateT = 0;
        b.vy = -11;
        b.vx = sign(pcx - bcx) * 4.4 * speedMul;
        b.face = sign(b.vx) || b.face;
        SND.dash();
      }
      break;

    case 'leap':
      moveX(b, b.vx);
      if (b.hitFloor && b.stateT > 8) {
        b.state = 'land'; b.stateT = 0;
        cam.shake = 8;
        SND.clank();
        burstDust(bcx, b.y + b.h, 14, 20);
        // shockwaves both directions
        for (const dir of [-1, 1]) {
          projectiles.push({
            x: bcx + dir * 20 - 8, y: b.y + b.h - 26, w: 16, h: 26,
            vx: dir * 5 * speedMul, vy: 0, grav: 0, t: 0, life: 80,
            kind: 'shock', ground: true,
          });
        }
      }
      break;

    case 'land':
      b.vx = 0;
      if (b.stateT > 30) { b.state = 'idle'; b.stateT = 0; }
      break;

    case 'dashTele':
      b.vx = 0;
      b.face = sign(pcx - bcx) || b.face;
      if (b.stateT > 30 / speedMul) {
        b.state = 'dash'; b.stateT = 0;
        SND.dash(); SND.roar();
      }
      break;

    case 'dash':
      b.vx = b.face * 8.5 * speedMul;
      moveX(b, b.vx);
      if (b.t % 3 === 0) {
        addP({
          x: bcx, y: b.y + rndr(10, b.h - 10),
          vx: -b.face * 2, vy: 0, life: 14, size: 4,
          col: 'rgba(210,205,190,0.4)', drag: 0.9,
        });
      }
      if (b.hitWall || b.stateT > 40) {
        b.state = 'rest'; b.stateT = 0;
        cam.shake = 6;
        SND.clank();
      }
      break;

    case 'burst':
      b.vx = 0;
      if (b.stateT === 1) SND.roar();
      if (b.stateT === 40) {
        const n = 9;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + rndr(-0.1, 0.1);
          projectiles.push({
            x: bcx - 8, y: b.y + b.h * 0.45 - 8, w: 16, h: 16,
            vx: Math.cos(a) * 3.4, vy: Math.sin(a) * 3.4,
            grav: 0, t: 0, life: 130, kind: 'pale',
          });
        }
        SND.swing();
        cam.shake = 5;
      }
      if (b.stateT > 70) { b.state = 'idle'; b.stateT = 0; }
      break;

    case 'roar':
      b.vx = 0;
      if (b.t % 5 === 0) {
        burstVoid(bcx + rndr(-30, 30), b.y + rndr(0, b.h), 3);
      }
      if (b.stateT > 70) {
        b.state = 'idle'; b.stateT = 0;
        // phase 2 summons a pair of mites
        if (!b.summoned) {
          b.summoned = true;
          enemies.push(makeEnemy('mite', b.x - 60, b.y + b.h));
          enemies.push(makeEnemy('mite', b.x + b.w + 60, b.y + b.h));
        }
      }
      break;

    case 'rest':
      b.vx *= 0.85;
      moveX(b, b.vx);
      if (b.stateT > 34) { b.state = 'idle'; b.stateT = 0; }
      break;
  }

  moveY(b, b.vy);
  if (b.hitFloor) {
    b.vy = 0;
    if (b.state === 'leap') { /* handled above via stateT */ }
  }

  // contact damage
  if (rectsOverlap(player, b)) hurtPlayer(1, bcx);
}

function renderBoss() {
  if (!boss) return;
  const b = boss;
  const bcx = b.x + b.w / 2, bottom = b.y + b.h;
  let idx = 0;
  switch (b.state) {
    case 'leapTele': idx = 4; break;
    case 'leap': idx = 5; break;
    case 'land': idx = 6; break;
    case 'dash': idx = 7; break;
    case 'dashTele': idx = 8; break;
    case 'burst': case 'roar': idx = 9; break;
    default: idx = Math.floor(b.t / 8) % 4;
  }
  if (b.dead) {
    const a = Math.max(0, 1 - b.deadT / 120);
    drawSpr(SPR.warden, idx, bcx, bottom, b.face < 0, a);
    if (b.deadT % 12 < 6) drawSprWhite(SPR.warden, idx, bcx, bottom, b.face < 0);
    return;
  }
  drawSpr(SPR.warden, idx, bcx, bottom, b.face < 0);
  if (b.flash > 0) drawSprWhite(SPR.warden, idx, bcx, bottom, b.face < 0);
}

/* ==========================================================================
   SECTION 10 — PROJECTILES & GEO
   ========================================================================== */

function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.t++;
    p.vy += p.grav || 0;
    p.x += p.vx;
    p.y += p.vy;
    if (p.kind === 'shock' && p.ground) {
      // ride the ground
      const below = tileGet(Math.floor((p.x + 8) / TILE), Math.floor((p.y + p.h + 6) / TILE));
      if (below !== 1) p.y += 4;
    }
    let kill = p.t > p.life;
    if (isSolidTile(Math.floor((p.x + 8) / TILE), Math.floor((p.y + 8) / TILE))) kill = true;
    if (kill) {
      burstHit(p.x + 8, p.y + 8);
      projectiles.splice(i, 1);
      continue;
    }
    const pr = { x: p.x + 3, y: p.y + 3, w: 10, h: 10 };
    if (rectsOverlap(pr, player)) {
      hurtPlayer(1, p.x + 8);
      projectiles.splice(i, 1);
    }
  }
}

function renderProjectiles() {
  for (const p of projectiles) {
    if (p.kind === 'spore') {
      drawSpr(SPR.sporeBall, Math.floor(p.t / 4), p.x + 8, p.y + 16, false);
    } else if (p.kind === 'shock') {
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#d8d2be';
      ctx.beginPath();
      ctx.moveTo(p.x + 8, p.y + p.h);
      ctx.lineTo(p.x + 14, p.y + p.h - 18 - Math.sin(p.t * 0.4) * 4);
      ctx.lineTo(p.x + 20, p.y + p.h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.moveTo(p.x + 8, p.y + p.h);
      ctx.lineTo(p.x + 11, p.y + p.h - 10);
      ctx.lineTo(p.x + 14, p.y + p.h);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (p.kind === 'pale') {
      ctx.save();
      ctx.fillStyle = 'rgba(235,230,210,0.9)';
      ctx.beginPath();
      ctx.arc(p.x + 8, p.y + 8, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.arc(p.x + 6, p.y + 6, 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function updateGeos() {
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  for (let i = geos.length - 1; i >= 0; i--) {
    const g = geos[i];
    g.t++;
    if (g.t > 24) {
      const d2 = dist2(pcx, pcy, g.x, g.y);
      if (d2 < 110 * 110) {
        const d = Math.sqrt(d2) || 1;
        g.vx += ((pcx - g.x) / d) * 0.9;
        g.vy += ((pcy - g.y) / d) * 0.9;
        g.x += g.vx; g.y += g.vy;
      } else {
        g.vy += 0.3;
        g.x += g.vx; g.y += g.vy;
        // bounce
        if (isSolidTile(Math.floor(g.x / TILE), Math.floor((g.y + 5) / TILE))) {
          g.y -= g.vy;
          g.vy *= -0.45;
          g.vx *= 0.8;
          if (Math.abs(g.vy) < 0.8) g.vy = 0;
        }
        if (isSolidTile(Math.floor((g.x + sign(g.vx) * 5) / TILE), Math.floor(g.y / TILE))) {
          g.vx *= -0.6;
        }
      }
    } else {
      g.vy += 0.3;
      g.x += g.vx; g.y += g.vy;
    }
    if (dist2(pcx, pcy, g.x, g.y) < 22 * 22) {
      player.geo++;
      SND.geo();
      geos.splice(i, 1);
    }
  }
}

function renderGeos() {
  for (const g of geos) {
    const sq = Math.abs(Math.sin(g.t * 0.15));
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.scale(0.4 + sq * 0.6, 1);
    ctx.drawImage(SPR.geo.f[0], -9, -9);
    ctx.restore();
  }
}

/* ==========================================================================
   SECTION 11 — CAMERA & RENDERING
   ========================================================================== */

function updateCamera() {
  const p = player;
  const tx = p.x + p.w / 2 + p.face * 44 - VIEW_W / 2;
  const ty = p.y + p.h / 2 - VIEW_H / 2 - 20;
  cam.x = lerp(cam.x, tx, 0.1);
  cam.y = lerp(cam.y, ty, 0.12);
  cam.x = clamp(cam.x, 0, GW * TILE - VIEW_W);
  cam.y = clamp(cam.y, 0, GH * TILE - VIEW_H);
  if (cam.shake > 0) {
    cam.shake *= 0.86;
    if (cam.shake < 0.3) cam.shake = 0;
    cam.sx = rndr(-cam.shake, cam.shake);
    cam.sy = rndr(-cam.shake, cam.shake);
  } else { cam.sx = 0; cam.sy = 0; }
}

function renderWorld() {
  const z = zoneIndexAtPx(player.x + player.w / 2);
  const Z = ZONES[z];
  const cx = cam.x + cam.sx, cy = cam.y + cam.sy;

  // base
  ctx.fillStyle = Z.bg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // parallax layers
  for (let L = 0; L < SPR.bg[z].length; L++) {
    const layer = SPR.bg[z][L];
    const ox = -((cx * layer.depth) % 1024);
    const oy = -90 - (cy - 3200) * layer.depth * 0.3;
    ctx.drawImage(layer.c, ox, oy);
    ctx.drawImage(layer.c, ox + 1024, oy);
    if (ox + 2048 < VIEW_W) ctx.drawImage(layer.c, ox + 2048, oy);
  }

  // zone fog wash
  ctx.fillStyle = Z.fog;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  ctx.save();
  ctx.translate(-cx, -cy);

  // ------ decor behind ------
  const vx0 = cx - 100, vx1 = cx + VIEW_W + 100, vy0 = cy - 120, vy1 = cy + VIEW_H + 120;
  for (const d of decor) {
    if (d.x < vx0 - 100 || d.x > vx1 + 100 || d.y < vy0 - 200 || d.y > vy1 + 200) continue;
    if (d.type === 'vine') {
      const img = SPR.vine(d.len, d.z);
      ctx.drawImage(img, d.x + 1, d.y - 2);
    } else if (d.type === 'mushroom') {
      const img = SPR.mushroom(d.scale, d.z);
      ctx.save();
      ctx.translate(d.x + 16, d.y);
      if (d.flip) ctx.scale(-1, 1);
      ctx.drawImage(img, -32, -54);
      ctx.restore();
    } else if (d.type === 'bones') {
      ctx.drawImage(SPR.bones, d.x - 14, d.y - 20);
    } else if (d.type === 'lamp') {
      ctx.drawImage(SPR.lamp, d.x - 4, d.y - 52);
    }
  }

  // ------ tiles ------
  const tx0 = Math.max(0, Math.floor(cx / TILE));
  const ty0 = Math.max(0, Math.floor(cy / TILE));
  const tx1 = Math.min(GW - 1, Math.floor((cx + VIEW_W) / TILE));
  const ty1 = Math.min(GH - 1, Math.floor((cy + VIEW_H) / TILE));
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const v = grid[T(tx, ty)];
      if (v === 0) continue;
      const px = tx * TILE, py = ty * TILE;
      if (v === 2) {
        ctx.drawImage(SPR.spike, px, py);
        continue;
      }
      if (v === 3) {
        ctx.drawImage(SPR.plank, px, py - 6);
        continue;
      }
      const vars = SPR.tiles[z][(tx * 7 + ty * 13) % 4];
      const openTop = tileGet(tx, ty - 1) === 0 || tileGet(tx, ty - 1) === 2;
      const openBottom = tileGet(tx, ty + 1) === 0;
      if (openTop) ctx.drawImage(vars.top, px, py);
      else if (openBottom) ctx.drawImage(vars.bott, px, py);
      else ctx.drawImage(vars.innr, px, py);
    }
  }

  // ------ benches / tablets / totems ------
  for (const b of benches) {
    ctx.save();
    if (player.sitBench === b) {
      // warm glow while resting
    }
    ctx.drawImage(SPR.bench, b.x - 16, b.y - 2);
    ctx.restore();
  }
  for (const t of tablets) ctx.drawImage(SPR.tablet, t.x - 6, t.y - 6);
  for (const t of totems) {
    ctx.drawImage(SPR.totem, t.x - 8, t.y - 6);
    if (!t.used) {
      ctx.save();
      ctx.globalAlpha = 0.5 + Math.sin(game.frame * 0.05) * 0.2;
      ctx.fillStyle = 'rgba(210,235,235,0.5)';
      ctx.beginPath();
      ctx.arc(t.x + 12, t.y + 30, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ------ relics ------
  for (const pk of pickups) {
    if (pk.taken) continue;
    pk.bob += 0.04;
    const by = pk.y + Math.sin(pk.bob) * 5;
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(pk.bob * 1.4) * 0.12;
    const img = pk.type === 'wings' ? SPR.relicWings :
                pk.type === 'claws' ? SPR.relicClaws :
                pk.type === 'mask' ? SPR.relicMask : SPR.relicVessel;
    ctx.fillStyle = 'rgba(230,235,240,0.25)';
    ctx.beginPath();
    ctx.arc(pk.x, by, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.drawImage(img, pk.x - img.width / 2, by - img.height / 2);
    ctx.restore();
  }

  // ------ ending door ------
  if (endingDoor && game.bossDead) {
    ctx.save();
    ctx.globalAlpha = 0.7 + Math.sin(game.frame * 0.03) * 0.2;
    ctx.drawImage(SPR.door, endingDoor.x - 15, endingDoor.y - 4);
    ctx.restore();
  }

  // ------ enemies / boss / shade / geos / projectiles ------
  for (const e of enemies) renderEnemy(e);
  renderBoss();
  if (shade) {
    shade.t++;
    drawSpr(SPR.shade, Math.floor(shade.t / 9), shade.x + 17, shade.y + 50, false,
      0.75 + Math.sin(shade.t * 0.08) * 0.15);
  }
  renderGeos();
  renderProjectiles();

  // ------ player ------
  renderPlayer();

  // ------ particles ------
  renderParticles();

  // ambient motes (world space)
  ctx.save();
  for (const m of motes) {
    m.x += Math.sin(game.frame * 0.008 * m.sp + m.ph) * 0.3;
    m.y -= m.sp * 0.4;
    if (m.y < cy - 50) m.y = cy + VIEW_H + 40;
    if (m.x < cx - 50) m.x = cx + VIEW_W + 40;
    if (m.x > cx + VIEW_W + 50) m.x = cx - 40;
    if (m.y > cy + VIEW_H + 60) m.y = cy - 40;
    if (m.x < vx0 || m.x > vx1 || m.y < vy0 || m.y > vy1) continue;
    ctx.globalAlpha = 0.14 + Math.sin(game.frame * 0.03 + m.ph) * 0.08;
    ctx.fillStyle = Z.glow;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // lamps' light halos
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const d of decor) {
    if (d.type !== 'lamp') continue;
    if (d.x < vx0 || d.x > vx1 || d.y < vy0 - 100 || d.y > vy1) continue;
    const lx = d.x + 16, ly = d.y - 20;
    const gr = ctx.createRadialGradient(lx, ly, 4, lx, ly, 90);
    gr.addColorStop(0, 'rgba(240,232,200,0.14)');
    gr.addColorStop(1, 'rgba(240,232,200,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(lx, ly, 90, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.restore(); // world transform

  // vignette
  const vg = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.36, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

function renderPlayer() {
  const p = player;
  if (p.dead) return;
  if (p.invT > 0 && p.hazardFade === 0 && Math.floor(game.frame / 4) % 2 === 0 && p.hurtT <= 0) {
    // flicker while invulnerable — skip draw this frame
    if (p.invT > 20) return;
  }
  const cx = p.x + p.w / 2;
  const bottom = p.y + p.h + 2;
  const spr = SPR.knight[p.state] || SPR.knight.idle;
  const idx = Math.floor(p.anim / (p.state === 'run' ? 3 : 8));
  drawSpr(spr, idx, cx, bottom, p.face < 0);

  // nail slash
  if (p.attackT > 0) {
    const prog = 1 - p.attackT / 11;
    const scy = p.y + p.h / 2;
    drawSlash(cx + (p.attackDir === 0 ? p.face * 8 : 0),
              p.attackDir === 1 ? p.y - 12 : (p.attackDir === 2 ? p.y + p.h + 8 : scy),
              p.attackDir, prog, p.face < 0);
  }
}

function drawMaskIcon(x, y, filled, scale = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  if (filled) {
    ctx.fillStyle = '#e9e6da';
  } else {
    ctx.fillStyle = 'rgba(233,230,218,0.14)';
  }
  ctx.beginPath();
  ctx.moveTo(-8, 2);
  ctx.bezierCurveTo(-9, -9, -5, -13, 0, -13);
  ctx.bezierCurveTo(5, -13, 9, -9, 8, 2);
  ctx.bezierCurveTo(6, 8, 3, 10, 0, 10);
  ctx.bezierCurveTo(-3, 10, -6, 8, -8, 2);
  ctx.closePath();
  ctx.fill();
  // horns
  ctx.beginPath();
  ctx.moveTo(-4, -11); ctx.quadraticCurveTo(-8, -17, -6, -21);
  ctx.quadraticCurveTo(-4, -16, -1, -13);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(4, -11); ctx.quadraticCurveTo(8, -17, 6, -21);
  ctx.quadraticCurveTo(4, -16, 1, -13);
  ctx.closePath(); ctx.fill();
  if (filled) {
    ctx.fillStyle = '#101014';
    ctx.beginPath(); ctx.ellipse(-3.4, 0, 1.7, 2.8, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3.4, 0, 1.7, 2.8, -0.1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawHUD() {
  const p = player;
  ctx.save();

  // soul vessel — ornate orb, top-left
  const sx = 64, sy = 68, sr = 30;
  const fill = p.soul / p.soulMax;
  ctx.fillStyle = 'rgba(10,12,14,0.75)';
  ctx.beginPath(); ctx.arc(sx, sy, sr + 6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(233,228,216,0.8)';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(sx, sy, sr + 6, 0, Math.PI * 2); ctx.stroke();
  // inner fill
  ctx.save();
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = 'rgba(235,238,240,0.16)';
  ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
  ctx.fillStyle = 'rgba(240,244,246,0.92)';
  const fh = sr * 2 * fill;
  ctx.beginPath();
  ctx.moveTo(sx - sr, sy + sr - fh);
  ctx.quadraticCurveTo(sx, sy + sr - fh + Math.sin(game.frame * 0.06) * 3, sx + sr, sy + sr - fh);
  ctx.lineTo(sx + sr, sy + sr);
  ctx.lineTo(sx - sr, sy + sr);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  // ornament ticks
  ctx.strokeStyle = 'rgba(233,228,216,0.5)';
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
    ctx.beginPath();
    ctx.moveTo(sx + Math.cos(a) * (sr + 8), sy + Math.sin(a) * (sr + 8));
    ctx.lineTo(sx + Math.cos(a) * (sr + 13), sy + Math.sin(a) * (sr + 13));
    ctx.stroke();
  }

  // masks
  for (let i = 0; i < p.maxHp; i++) {
    drawMaskIcon(112 + i * 30, 52, i < p.hp);
  }

  // geo counter
  ctx.save();
  ctx.translate(118, 84);
  ctx.scale(0.9, 0.9);
  ctx.drawImage(SPR.geo.f[0], -9, -9);
  ctx.restore();
  ctx.fillStyle = '#d8d2be';
  ctx.font = '600 20px Cinzel, serif';
  ctx.textAlign = 'left';
  ctx.fillText(String(p.geo), 134, 91);

  // boss bar
  if (game.bossActive && boss && !boss.dead) {
    const bw = 480, bx = VIEW_W / 2 - bw / 2, by = VIEW_H - 56;
    ctx.fillStyle = 'rgba(10,10,12,0.7)';
    ctx.fillRect(bx - 4, by - 4, bw + 8, 16);
    ctx.strokeStyle = 'rgba(233,228,216,0.7)';
    ctx.lineWidth = 1.4;
    ctx.strokeRect(bx - 4, by - 4, bw + 8, 16);
    ctx.fillStyle = 'rgba(233,228,216,0.85)';
    ctx.fillRect(bx, by, bw * (boss.hp / boss.maxhp), 8);
    ctx.fillStyle = 'rgba(233,228,216,0.85)';
    ctx.font = '600 15px Cinzel, serif';
    ctx.textAlign = 'center';
    ctx.fillText('T H E   P A L E   W A R D E N', VIEW_W / 2, by - 12);
  }

  // zone title card
  if (game.zoneCard > 0) {
    game.zoneCard--;
    const t = game.zoneCard;
    let a = 1;
    if (t > 220) a = (260 - t) / 40;
    if (t < 50) a = t / 50;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#e9e4d8';
    ctx.font = '600 40px Cinzel, serif';
    ctx.textAlign = 'center';
    ctx.fillText(game.zoneCardText.split('').join(' '), VIEW_W / 2, 150);
    ctx.globalAlpha = a * 0.6;
    ctx.font = 'italic 18px "Cormorant Garamond", serif';
    ctx.fillText('— ' + (game.currentZone + 1) + ' —', VIEW_W / 2, 180);
    ctx.globalAlpha = 1;
  }

  // message toast
  if (game.msgT > 0) {
    game.msgT--;
    const a = Math.min(1, game.msgT / 40);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10,12,14,0.8)';
    const w = ctx.measureText(game.msg).width;
    ctx.fillRect(VIEW_W / 2 - 240, VIEW_H - 130, 480, 40);
    ctx.fillStyle = '#e9e4d8';
    ctx.font = 'italic 19px "Cormorant Garamond", serif';
    ctx.textAlign = 'center';
    ctx.fillText(game.msg, VIEW_W / 2, VIEW_H - 104);
    ctx.globalAlpha = 1;
  }

  // interaction prompt
  if (game.nearInteract && !player.sit) {
    const label = game.nearInteract.kind === 'bench' ? 'Rest' : 'Read';
    ctx.fillStyle = 'rgba(233,228,216,0.9)';
    ctx.font = 'italic 18px "Cormorant Garamond", serif';
    ctx.textAlign = 'center';
    // little arrow
    ctx.beginPath();
    ctx.moveTo(VIEW_W / 2 - 4, VIEW_H / 2 + 46);
    ctx.lineTo(VIEW_W / 2 + 4, VIEW_H / 2 + 46);
    ctx.lineTo(VIEW_W / 2, VIEW_H / 2 + 38);
    ctx.closePath();
    ctx.fill();
    ctx.fillText(label, VIEW_W / 2, VIEW_H / 2 + 66);
  }

  ctx.restore();
}

function drawMapOverlay() {
  ctx.fillStyle = 'rgba(5,6,8,0.88)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = '#e9e4d8';
  ctx.font = '600 34px Cinzel, serif';
  ctx.textAlign = 'center';
  ctx.fillText('WANDERER\u2019S MAP', VIEW_W / 2, 110);

  const names = ['Fading Crossing', 'Gloomroot Gardens', 'The Sunken Choir', 'The Pale Court'];
  const zx = [180, 380, 640, 940];
  const wy = [300, 280, 260, 330];
  const ww = [150, 240, 260, 160];
  const wh = [120, 170, 200, 140];
  for (let i = 0; i < 4; i++) {
    const known = game.visited[i];
    ctx.strokeStyle = known ? 'rgba(233,228,216,0.75)' : 'rgba(233,228,216,0.14)';
    ctx.lineWidth = 1.6;
    ctx.strokeRect(zx[i] - ww[i] / 2, wy[i], ww[i], wh[i]);
    if (known) {
      ctx.fillStyle = 'rgba(233,228,216,0.07)';
      ctx.fillRect(zx[i] - ww[i] / 2, wy[i], ww[i], wh[i]);
      ctx.fillStyle = 'rgba(233,228,216,0.85)';
      ctx.font = 'italic 17px "Cormorant Garamond", serif';
      ctx.fillText(names[i], zx[i], wy[i] + wh[i] + 26);
      // bench marks
      ctx.fillStyle = 'rgba(184,168,106,0.9)';
      for (const b of benches) {
        const bz = zoneIndexAtPx(b.x + 44);
        if (bz !== i) continue;
        const rx = zx[i] - ww[i] / 2 + ((b.x + 44) / (GW * TILE)) * ww[i];
        ctx.fillRect(rx - 3, wy[i] + wh[i] * 0.8, 6, 6);
      }
    } else {
      ctx.fillStyle = 'rgba(233,228,216,0.3)';
      ctx.font = 'italic 17px "Cormorant Garamond", serif';
      ctx.fillText('unknown', zx[i], wy[i] + wh[i] / 2);
    }
    if (i < 3) {
      ctx.strokeStyle = 'rgba(233,228,216,0.3)';
      ctx.beginPath();
      ctx.moveTo(zx[i] + ww[i] / 2, wy[i] + wh[i] / 2);
      ctx.lineTo(zx[i + 1] - ww[i + 1] / 2, wy[i + 1] + wh[i + 1] / 2);
      ctx.stroke();
    }
  }
  // player dot
  if (game.currentZone !== undefined) {
    const i = game.currentZone;
    const px = zx[i] - ww[i] / 2 + (player.x / (GW * TILE)) * ww[i];
    const py = wy[i] + (player.y / (GH * TILE)) * wh[i];
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(clamp(px, zx[i] - ww[i] / 2, zx[i] + ww[i] / 2), clamp(py, wy[i], wy[i] + wh[i]), 5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(233,228,216,0.5)';
  ctx.font = 'italic 16px "Cormorant Garamond", serif';
  ctx.fillText('Tab — close', VIEW_W / 2, VIEW_H - 50);
}

function renderTitle() {
  ctx.fillStyle = '#0a0c0e';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // drifting fog banks
  ctx.save();
  for (let i = 0; i < 4; i++) {
    const fx = ((game.frame * (0.2 + i * 0.12) + i * 400) % (VIEW_W + 700)) - 350;
    const g = ctx.createRadialGradient(fx, 380 + i * 70, 10, fx, 380 + i * 70, 320);
    g.addColorStop(0, 'rgba(120,135,130,0.05)');
    g.addColorStop(1, 'rgba(120,135,130,0)');
    ctx.fillStyle = g;
    ctx.fillRect(fx - 330, 100, 660, 620);
  }
  ctx.restore();

  // silhouette pillars
  ctx.fillStyle = '#101317';
  for (let i = 0; i < 7; i++) {
    const px = i * 210 + 40;
    ctx.fillRect(px, 300, 34, 420);
    ctx.fillRect(px - 10, 300, 54, 16);
  }
  ctx.fillStyle = '#0d0f12';
  ctx.fillRect(0, 640, VIEW_W, 80);

  // knight sitting at the centre-bottom
  ctx.save();
  ctx.translate(VIEW_W / 2, 648);
  ctx.scale(1.8, 1.8);
  ctx.drawImage(SPR.knight.sit.f[Math.floor(game.frame / 16) % 4], -28, -62);
  ctx.restore();

  // motes
  ctx.save();
  for (const m of titleMotes) {
    m.y -= m.sp;
    if (m.y < -10) m.y = VIEW_H + 10;
    ctx.globalAlpha = 0.1 + Math.sin(game.frame * 0.02 + m.ph) * 0.06;
    ctx.fillStyle = '#b8cfc0';
    ctx.beginPath();
    ctx.arc(m.x + Math.sin(game.frame * 0.01 + m.ph) * 14, m.y, m.s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // title
  ctx.textAlign = 'center';

  ctx.fillText('HOLLOWMERE', VIEW_W / 2, 220);

  // menu
  const items = [];

  const sel = clamp(game.titleSel, 0, items.length - 1);
  ctx.font = '600 24px Cinzel, serif';
  for (let i = 0; i < items.length; i++) {
    const y = 420 + i * 46;

      ctx.fillStyle = 'rgba(233,228,216,0.45)';

  ctx.fillText('arrows to move · Z to confirm', VIEW_W / 2, VIEW_H - 36);

  // menu nav handled in updateTitle()
  game.titleItems = items;
}

function updateTitle() {
  const items = game.titleItems || ['New Descent', 'Controls'];
  if (Input.hit('down')) { game.titleSel = (game.titleSel + 1) % items.length; SND.select(); }
  if (Input.hit('up')) { game.titleSel = (game.titleSel - 1 + items.length) % items.length; SND.select(); }
  if (Input.hit('confirm')) {
    SND.confirmS();
    const choice = items[game.titleSel];
    if (choice === 'New Descent') startNewGame();
    else if (choice === 'Continue') startContinue();
    else if (choice === 'Controls') game.state = 'controls';
  }
}

function renderPause() {

  ctx.fillStyle = '#e9e4d8';
  ctx.textAlign = 'center';
  ctx.font = '600 44px Cinzel, serif';
  ctx.fillText('A MOMENT OF QUIET', VIEW_W / 2, 170);

  const items = ['Resume', 'Controls', 'Abandon to Title'];
  ctx.font = '600 24px Cinzel, serif';
  for (let i = 0; i < items.length; i++) {
    const y = 280 + i * 48;
    if (i === game.pauseSel) {
      ctx.fillStyle = '#e9e4d8';
      ctx.fillText('·  ' + items[i] + '  ·', VIEW_W / 2, y);
    } else {
      ctx.fillStyle = 'rgba(233,228,216,0.45)';
      ctx.fillText(items[i], VIEW_W / 2, y);
    }
  }

  // abilities acquired
  ctx.font = 'italic 19px "Cormorant Garamond", serif';
  ctx.fillStyle = 'rgba(184,168,106,0.9)';
  const ab = [];
  if (player.abilities.dash) ab.push('Shade Dash');
  if (player.abilities.wings) ab.push('Moth Wings');
  if (player.abilities.claws) ab.push('Talon Claws');
  ctx.fillText('Gifts: ' + (ab.join(' · ') || 'none yet'), VIEW_W / 2, 470);
  ctx.fillStyle = 'rgba(233,228,216,0.5)';
  ctx.fillText('Masks: ' + player.maxHp + '   Vessel: ' + player.soulMax, VIEW_W / 2, 500);

  if (game.pauseShowsControls) renderControlsOverPause();
}

function renderControlsOverPause() {
  // reuse the controls layout dimmed
  ctx.fillStyle = 'rgba(5,6,8,0.9)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  renderControls();
}

function renderDeathOverlay() {
  ctx.fillStyle = 'rgba(3,3,5,0.9)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = 'rgba(233,228,216,0.9)';
  ctx.textAlign = 'center';
  ctx.font = '600 52px Cinzel, serif';
  ctx.globalAlpha = clamp(game.frame / 60, 0, 1);
  ctx.fillText('THE SHELL BREAKS', VIEW_W / 2, VIEW_H / 2 - 10);
  ctx.font = 'italic 22px "Cormorant Garamond", serif';
  ctx.fillStyle = 'rgba(233,228,216,0.55)';
  ctx.fillText('an echo remains where you fell', VIEW_W / 2, VIEW_H / 2 + 40);
  ctx.globalAlpha = 1;
}

function startEnding() {
  game.state = 'ending';
  game.endT = 0;
  SND.setBoss(false);
  SND.confirmS();
}

function renderEnding() {
  game.endT++;
  ctx.fillStyle = '#08090b';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  const a = clamp(game.endT / 120, 0, 1);
  ctx.globalAlpha = a;
  ctx.fillStyle = '#e9e4d8';
  ctx.textAlign = 'center';
  ctx.font = '600 48px Cinzel, serif';
  ctx.fillText('THE COURT IS SILENT', VIEW_W / 2, 240);
  ctx.font = 'italic 24px "Cormorant Garamond", serif';
  ctx.fillStyle = 'rgba(233,228,216,0.7)';
  const mins = Math.floor(game.time / 3600);
  const secs = Math.floor((game.time / 60) % 60);
  ctx.fillText('The Warden kneels. The pale light dims, and the deep belongs to the small once more.', VIEW_W / 2, 310);
  ctx.fillText('Time below — ' + mins + 'm ' + secs + 's    ·    Deaths — ' + game.deaths + '    ·    Geo — ' + player.geo, VIEW_W / 2, 370);
  if (game.endT > 240) {
    ctx.fillStyle = 'rgba(233,228,216,0.45)';
    ctx.fillText('press Z to return to the surface', VIEW_W / 2, 480);
    if (Input.hit('confirm')) {
      localStorage.removeItem('hollowmere_save');
      game.state = 'title';
      game.titleSel = 0;
      SND.setZone(0);
    }
  }
  ctx.globalAlpha = 1;
}

/* ==========================================================================
   SECTION 14 — SAVE / LOAD
   ========================================================================== */

function saveGame() {
  const taken = pickups.filter(p => p.taken).map(p => pickupsDef.findIndex(d => d.x - 16 === p.x - 16 + 16));
  const data = {
    bench: player.sitBench ? player.sitBench.id : 'crossing',
    geo: player.geo,
    maxHp: player.maxHp,
    soulMax: player.soulMax,
    abilities: player.abilities,
    bossDead: game.bossDead,
    visited: game.visited,
    totemsUsed: totems.map(t => t.used),
    deaths: game.deaths,
    time: game.time,
    relinks: pickups.map((p, i) => p.taken ? i : -1).filter(i => i >= 0),
  };
  try { localStorage.setItem('hollowmere_save', JSON.stringify(data)); } catch (e) {}
}

function loadSaveData() {
  try { return JSON.parse(localStorage.getItem('hollowmere_save')); } catch (e) { return null; }
}

/* ==========================================================================
   SECTION 15 — GAME FLOW & MAIN LOOP
   ========================================================================== */

function startNewGame() {
  buildWorldReset();
  game.state = 'play';
  game.fade = 1; game.fadeDir = -1;
  game.deaths = 0;
  game.time = 0;
  game.bossDead = false;
  game.bossActive = false;
  game.gateClosed = false;
  game.visited = [false, false, false, false];
  game.currentZone = 0;
  showMsg('Beneath the town, something pale still dreams...');
  SND.setZone(0);
}

function startContinue() {
  buildWorldReset();
  const d = loadSaveData();
  if (d) {
    player.geo = d.geo || 0;
    player.maxHp = d.maxHp || 5;
    player.hp = player.maxHp;
    player.soulMax = d.soulMax || 99;
    player.abilities = d.abilities || { dash: true, wings: false, claws: false };
    game.bossDead = !!d.bossDead;
    game.visited = d.visited || [true, false, false, false];
    game.deaths = d.deaths || 0;
    game.time = d.time || 0;
    if (d.totemsUsed) for (let i = 0; i < d.totemsUsed.length && i < totems.length; i++) totems[i].used = d.totemsUsed[i];
    if (d.relinks) for (const i of d.relinks) if (pickups[i]) pickups[i].taken = true;
    placePlayerAtBench(d.bench || 'crossing');
    game.currentZone = zoneIndexAtPx(player.x);
    game.visited[game.currentZone] = true;
  }
  game.state = 'play';
  game.fade = 1; game.fadeDir = -1;
  SND.setZone(game.currentZone);
}

function buildWorldReset() {
  // rebuild grid (in case a boss gate altered it)
  grid.fill(1);
  decor.length = 0;
  buildWorld(); // re-runs layout (idempotent-ish; decor re-scattered identically via seeded rng? rng is shared, so re-seed inside)
  resetWorldEntities();
  player.maxHp = 5; player.hp = 5;
  player.soul = 0; player.soulMax = 99;
  player.geo = 0;
  player.abilities = { dash: true, wings: false, claws: false };
  player.dead = false;
  player.sit = false;
  placePlayerAtBench('crossing');
  cam.x = player.x - VIEW_W / 2;
  cam.y = player.y - VIEW_H / 2;
}

function updatePlay() {
  game.time++;
  SND.tickMusic();

  if (game.reading) {
    if (Input.anyKey) game.reading = null;
    return;
  }
  if (Input.hit('mapKey')) {
    game.mapOpen = !game.mapOpen;
    SND.select();
  }
  if (game.mapOpen) return;

  if (Input.hit('pause')) {
    game.state = 'pause';
    game.pauseSel = 0;
    game.pauseShowsControls = false;
    SND.select();
    return;
  }
  if (Input.hit('mute')) {
    SND.setMuted(!SND.muted);
    showMsg(SND.muted ? 'sound sealed' : 'sound restored');
  }

  if (game.hitstop > 0) { game.hitstop--; return; }

  if (game.slowmo > 0) game.slowmo--;

  updatePlayer();
  if (!player.dead) {
    updateEnemies();
    updateBoss();
    updateProjectiles();
    updateGeos();
  }
  updateParticles();
  updateCamera();

  // fade management
  if (game.fadeDir === -1 && game.fade > 0) game.fade = Math.max(0, game.fade - 0.03);
  if (game.fadeDir === 1 && game.fade < 1) game.fade = Math.min(1, game.fade + 0.08);
  if (player.hazardFade === 0 && game.fade >= 1 && game.fadeDir === 1) game.fadeDir = -1;
}

function updatePause() {
  if (Input.hit('pause')) { game.state = 'play'; SND.select(); return; }
  if (Input.hit('down')) { game.pauseSel = (game.pauseSel + 1) % 3; SND.select(); }
  if (Input.hit('up')) { game.pauseSel = (game.pauseSel + 2) % 3; SND.select(); }
  if (Input.hit('confirm')) {
    SND.confirmS();
    if (game.pauseSel === 0) game.state = 'play';
    else if (game.pauseSel === 1) game.state = 'controls';
    else {
      game.state = 'title';
      game.titleSel = 0;
    }
  }
}

function updateDeadState() {
  if (game.frame % 30 === 0 || Input.hit('confirm')) {
    // respawn
    player.dead = false;
    player.deadT = 0;
    player.hp = player.maxHp;
    player.soul = 0;
    player.vx = 0; player.vy = 0;
    player.invT = 60;
    player.x = player.respawnX;
    player.y = player.respawnY;
    player.lastSafeX = player.x;
    player.lastSafeY = player.y;
    if (game.gateClosed) {
      carve(246, 96, 2, 10);
      game.gateClosed = false;
    }
    if (boss) {
      boss.hp = boss.maxhp;
      boss.phase = 1;
      boss.state = 'idle';
      boss.stateT = 0;
      boss.x = 272 * TILE; boss.y = 104 * TILE - 96;
      boss.vulnT = 60;
      // clear summons & projectiles
      enemies = enemies.filter(e => e.type !== 'mite' || e.spawnZone !== 3);
      projectiles = [];
    }
    game.bossActive = false;
    SND.setBoss(false);
    game.state = 'play';
    game.fade = 1; game.fadeDir = -1;
  }
}

function updateControlsState() {
  if (Input.anyKey) {
    game.state = game.returnToPause ? 'pause' : 'title';
    game.returnToPause = false;
  }
}

let acc = 0;
let lastT = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(100, now - lastT);
  lastT = now;

  const scale = game.slowmo > 0 ? 0.35 : 1;
  let stepped = false;
  while (acc >= STEP) {
    game.frame++;
    switch (game.state) {
      case 'title': updateTitle(); break;
      case 'controls': updateControlsState(); break;
      case 'play': updatePlay(); break;
      case 'pause': updatePause(); break;
      case 'dead': updateDeadState(); break;
      case 'ending': /* rendered + polled in renderEnding */ break;
    }
    acc -= STEP;
    if (game.slowmo > 0) acc -= STEP * (1 - scale);
    stepped = true;
  }

  // ---- render ----
  switch (game.state) {
    case 'title':
      renderTitle();
      break;
    case 'controls':
      renderControls();
      break;
    case 'play':
    case 'dead':
    case 'pause':
      renderWorld();
      drawHUD();
      if (game.mapOpen) drawMapOverlay();
      if (game.reading) drawReading();
      if (game.state === 'pause') renderPause();
      if (game.state === 'dead') renderDeathOverlay();
      // fade veil
      if (game.fade > 0) {
        ctx.fillStyle = 'rgba(3,3,5,' + game.fade + ')';
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      }
      break;
    case 'ending':
      renderEnding();
      break;
  }

  Input.clearFrame();
}

/* ==========================================================================
   SECTION 16 — BOOT
   ========================================================================== */

function boot() {
  buildKnightSprites();
  buildEnemySprites();
  buildBossSprites();
  buildTileAtlas();
  buildBackgrounds();
  buildProps();
  buildWorld();
  resetWorldEntities();
  placePlayerAtBench('crossing');
  cam.x = clamp(player.x - VIEW_W / 2, 0, GW * TILE - VIEW_W);
  cam.y = clamp(player.y - VIEW_H / 2, 0, GH * TILE - VIEW_H);
  requestAnimationFrame(frame);
}

const bootEl = document.getElementById('boot');
function begin() {
  bootEl.style.opacity = '0';
  setTimeout(() => bootEl.remove(), 1300);
  AudioBoot.ensure();
  boot();
}
bootEl.addEventListener('click', begin);
window.addEventListener('keydown', function once(e) {
  if (bootEl.isConnected) { window.removeEventListener('keydown', once); begin(); }
});
</script>
