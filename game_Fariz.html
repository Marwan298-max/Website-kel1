<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOLLOWMERE — a requiem in the deep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #050607;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
  }
  #wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas#game {
    image-rendering: auto;
    display: block;
    background: #050607;
  }
  #boot {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #6b6f66;
    background: #050607;
    z-index: 10;
    letter-spacing: 0.35em;
    font-size: 14px;
    text-transform: uppercase;
    transition: opacity 1.2s ease;
    cursor: pointer;
  }
  #boot .rune {
    width: 54px; height: 54px;
    margin-bottom: 26px;
    border: 1px solid #3a3d38;
    transform: rotate(45deg);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.9; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="boot"><div class="rune"></div><div>click to descend</div></div>
<script>
'use strict';
/* ============================================================================
   HOLLOWMERE — a requiem in the deep  (v1.5)
   v1.5: THE DEEP WIDENS — the map is rebuilt and nearly doubled (7 zones):
   the EMBER KILN (flame-geyser gauntlet), the HOLLOW SANCTUM (phase-curtain
   seals) and the DREAMING THRONE, home of a second boss — THE ASHEN SERAPH,
   an aerial fight whose ember cloak must be waited out before it can be
   hurt.  New pixel foes (ember wisp, veil wraith), new pixel backgrounds,
   pixel weapon ICONS drawn upright, an inventory that only lists what you
   truly carry, and a revolver-style weapon swap: the chest no longer
   equips ILLUMINA — open the VESSEL, click the chambered blade, watch the
   old one slide out and the new one lock home.
   v1.6: THE OATH — the Pale Warden now swings true pixel slashes and can
   be PARRIED: time a nail strike as his blow lands to deflect it, chip a
   quarter of your blade's damage back and STUN him. THE ASHEN SERAPH is
   rebuilt as a cycling two-stage duel — it hunts the sky (ember rings,
   cinder rain, random holy light beams with ground warnings, homing
   feather volleys, cross-arena swoops), then drops to the sand with TWIN
   BLADES (slash combos, slash waves, dash slashes, a blade-parry stance
   that punishes careless strikes, ember novas, plunging crashes) before
   rising again; only the grounded stage bares it to harm. Slay it and
   claim SERAPH'S OATH, a long winged light-blade with a blinking eye:
   V calls JUDGEMENT (instant beams rain on every foe at once, 3x blade
   damage), B is the OATH DASH (dash along your cursor, sword forward,
   2x blade damage), and at rest the knight holds the winged blade out
   while its wings flap and its aura shines.
   v1.4: full PIXEL-ART pass — every enemy (mite, gloom, spore, sentry,
   beetle) and the Pale Warden redrawn / re-baked as chunky virtual-pixel
   sprites with nearest-neighbour upscale; parallax background trees
   pixelated; ILLUMINA redesigned after the classic winged light-blade
   (icy blue, wing crossguard, pink core glint) as pixel art for both the
   relic and the in-hand blade; the sword now sheds yellow/white pixel
   embers; Light Beam retargeted to strike the NEAREST ENEMY IN FRONT of
   the player; inventory is now fully interactive (mouse hover, tooltips,
   click-to-equip weapons).
   v1.3: nail slash rebuilt as procedurally generated PIXEL ART — 7-frame
   directional sweeps (side/up/down) baked at 56×56 virtual pixels, 3×
   nearest-neighbour upscale, 4-step palette, per-pixel dithering, spark
   ticks, motion-echo band, dissolving flecks, additive glow pass.
   v1.2: fixed enemy-hit crash (mkFrames white-silhouette loss), hardened
   drawSprWhite, canvas state reset per frame.
   v1.1: fixed attack/map crash typos, duplicate spawns, prop anchoring,
   boss sprite clipping, enemy double-move, platform reachability.
   Everything (sprites, audio, world, music, slash) is generated procedurally.
   ============================================================================
*/

/* ==========================================================================
   SECTION 0 — CONSTANTS & UTILITIES
   ========================================================================== */

const TILE   = 32;
const GW     = 660;    // v1.5: the deep nearly doubled — 7 zones
const GH     = 130;
const STEP   = 1000 / 60;
const VIEW_W = 1280;
const VIEW_H = 720;

const canvas = document.getElementById('game');
canvas.width  = VIEW_W;
canvas.height = VIEW_H;
const ctx = canvas.getContext('2d');

function fitScreen() {
  const s = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  canvas.style.width  = Math.floor(VIEW_W * s) + 'px';
  canvas.style.height = Math.floor(VIEW_H * s) + 'px';
}
window.addEventListener('resize', fitScreen);
fitScreen();

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R  = mulberry32(0xC0FFEE);
const rr = (a, b) => a + R() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));

const rnd  = Math.random;
const rndr = (a, b) => a + Math.random() * (b - a);

const clamp  = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp   = (a, b, t) => a + (b - a) * t;
const sign   = v => v < 0 ? -1 : (v > 0 ? 1 : 0);
const dist2  = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const rectsOverlap = (a, b) =>
  a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function Rect(x, y, w, h) { return { x, y, w, h }; }

/* ==========================================================================
   SECTION 1 — INPUT
   ========================================================================== */

const Input = {
  held:    {},
  pressed: {},
  anyKey:  false,
  map: {
    left:  ['ArrowLeft',  'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up:    ['ArrowUp',    'KeyW'],
    down:  ['ArrowDown',  'KeyS'],
    jump:  ['KeyZ',       'Space'],
    attack:['KeyX',       'KeyJ'],
    dash:  ['KeyC',       'KeyK', 'ShiftLeft', 'ShiftRight'],
    focus: ['KeyF'],
    skill: ['KeyV',       'KeyL'],
    skillB:['KeyB'],                    // v1.6: Seraph's Oath — the Oath Dash
    inter: ['ArrowUp',    'KeyW', 'KeyE'],
    inv:   ['KeyI',       'Tab'],
    pause: ['Escape',     'KeyP'],
    mute:  ['KeyM'],
    confirm:['Enter', 'KeyZ', 'Space'],
  },
  down(action) {
    const list = this.map[action];
    for (let i = 0; i < list.length; i++) if (this.held[list[i]]) return true;
    return false;
  },
  hit(action) {
    const list = this.map[action];
    for (let i = 0; i < list.length; i++) if (this.pressed[list[i]]) return true;
    return false;
  },
  clearFrame() { this.pressed = {}; this.anyKey = false; },
};

window.addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
  if (!Input.held[e.code]) Input.pressed[e.code] = true;
  Input.held[e.code] = true;
  Input.anyKey = true;
  AudioBoot.ensure();
});
window.addEventListener('keyup', e => { Input.held[e.code] = false; });
window.addEventListener('blur',  () => { Input.held = {}; });

/* -- mouse (used by the interactive inventory + controls screen) ---------- */
const Mouse = {
  x: -100, y: -100,      // position in 1280×720 view coordinates
  clicked: false,        // set on mousedown, consumed by the active UI
  inside: false,
  wheelY: 0,             // v1.6c: accumulated wheel delta, consumed per frame
};
function mouseToView(e) {
  const r = canvas.getBoundingClientRect();
  Mouse.x = (e.clientX - r.left) * (VIEW_W / r.width);
  Mouse.y = (e.clientY - r.top)  * (VIEW_H / r.height);
  Mouse.inside = Mouse.x >= 0 && Mouse.y >= 0 && Mouse.x < VIEW_W && Mouse.y < VIEW_H;
}
canvas.addEventListener('mousemove',  mouseToView);
canvas.addEventListener('mousedown',  e => { mouseToView(e); Mouse.clicked = true; AudioBoot.ensure(); });
window.addEventListener('mouseup', () => { /* click is consumed on down */ });
canvas.addEventListener('wheel', e => { e.preventDefault(); Mouse.wheelY += e.deltaY; }, { passive: false });

/* ==========================================================================
   SECTION 2 — AUDIO ENGINE
   ========================================================================== */

const AudioBoot = {
  ready: false,
  ensure() {
    if (this.ready) return;
    SND.init();
    this.ready = true;
  }
};

const SND = {
  ac: null,
  master: null,
  sfxBus: null,
  musBus: null,
  verb: null,
  muted: false,
  noiseBuf: null,
  padOsc: [],
  padGain: null,
  padFilter: null,
  zoneScale: [0, 3, 5, 7, 10],
  baseHz: 110,
  nextNoteT: 0,
  bossMode: false,
  beatT: 0,

  init() {
    if (this.ac) return;
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return; }
    const ac = this.ac;

    this.master = ac.createGain();
    this.master.gain.value = 0.8;
    this.master.connect(ac.destination);

    this.sfxBus = ac.createGain();
    this.sfxBus.gain.value = 0.9;
    this.sfxBus.connect(this.master);

    this.musBus = ac.createGain();
    this.musBus.gain.value = 0.55;
    this.musBus.connect(this.master);

    this.verb = ac.createConvolver();
    const len = ac.sampleRate * 2.4;
    const imp = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = imp.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
      }
    }
    this.verb.buffer = imp;
    const verbGain = ac.createGain();
    verbGain.gain.value = 0.5;
    this.verb.connect(verbGain);
    verbGain.connect(this.master);
    this.musBus.connect(this.verb);

    const nlen = ac.sampleRate;
    this.noiseBuf = ac.createBuffer(1, nlen, ac.sampleRate);
    const nd = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < nlen; i++) nd[i] = Math.random() * 2 - 1;

    this.startPad();
  },

  now() { return this.ac ? this.ac.currentTime : 0; },

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.8;
  },

  startPad() {
    const ac = this.ac;
    this.padGain = ac.createGain();
    this.padGain.gain.value = 0.0;
    this.padFilter = ac.createBiquadFilter();
    this.padFilter.type = 'lowpass';
    this.padFilter.frequency.value = 500;
    this.padFilter.Q.value = 0.8;
    this.padGain.connect(this.padFilter);
    this.padFilter.connect(this.musBus);

    const freqs = [55, 82.5, 110];
    for (let i = 0; i < freqs.length; i++) {
      const o = ac.createOscillator();
      o.type = i === 2 ? 'sine' : 'triangle';
      o.frequency.value = freqs[i];
      o.detune.value = (i - 1) * 6;
      const g = ac.createGain();
      g.gain.value = i === 2 ? 0.25 : 0.4;
      o.connect(g); g.connect(this.padGain);
      o.start();
      this.padOsc.push(o);
    }
    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.06;
    const lg = ac.createGain();
    lg.gain.value = 180;
    lfo.connect(lg); lg.connect(this.padFilter.frequency);
    lfo.start();

    this.padGain.gain.setTargetAtTime(0.16, ac.currentTime, 3);
  },

  setZone(zoneId) {
    if (!this.ac) return;
    const roots = [110, 98, 87.3, 123.5, 82.4, 73.4, 65.4];   // v1.5: 7 zones
    const root = roots[clamp(zoneId, 0, roots.length - 1)];
    this.baseHz = root;
    const t = this.ac.currentTime;
    const mult = [1, 1.5, 2];
    for (let i = 0; i < this.padOsc.length; i++) {
      this.padOsc[i].frequency.setTargetAtTime(root * mult[i % 3], t, 2.5);
    }
  },

  setBoss(b) {
    this.bossMode = b;
    if (this.padGain && this.ac) {
      this.padGain.gain.setTargetAtTime(b ? 0.07 : 0.16, this.ac.currentTime, 1.5);
    }
  },

  tickMusic() {
    if (!this.ac || this.muted) return;
    const t = this.now();
    if (t > this.nextNoteT) {
      this.nextNoteT = t + rndr(2.6, 7.5);
      const deg = this.zoneScale[ri(0, this.zoneScale.length - 1)];
      const oct = ri(0, 2);
      const f = this.baseHz * 2 * Math.pow(2, oct) * Math.pow(2, deg / 12);
      this.bell(f, 0.05 + rndr(0, 0.05), rndr(2.5, 5));
    }
    if (this.bossMode) {
      const beat = 0.42;
      if (t > this.beatT) {
        this.beatT = t + beat;
        this.thump(55, 0.22);
        if (Math.floor(t / beat) % 2 === 0) this.tick(0.05);
      }
    }
  },

  tone(type, f0, f1, dur, vol, attack = 0.005, dest = null) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxBus);
    o.start(t); o.stop(t + dur + 0.05);
  },

  noise(dur, vol, filterF, filterType = 'bandpass', q = 1) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const flt = ac.createBiquadFilter();
    flt.type = filterType;
    flt.frequency.setValueAtTime(filterF, t);
    flt.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(this.sfxBus);
    src.start(t); src.stop(t + dur + 0.05);
  },

  bell(f, vol, dur) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime;
    for (let i = 0; i < 2; i++) {
      const o = ac.createOscillator();
      o.type = 'sine';
      o.frequency.value = f * (i === 0 ? 1 : 2.01);
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(i === 0 ? vol : vol * 0.3, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.musBus);
      o.start(t); o.stop(t + dur + 0.1);
    }
  },

  thump(f, vol) { this.tone('sine', f, f * 0.5, 0.25, vol, 0.01); },
  tick(vol) { this.noise(0.05, vol, 6000, 'highpass'); },

  swing()      { this.noise(0.14, 0.35, 2400, 'bandpass', 1.4); this.tone('sawtooth', 320, 120, 0.09, 0.05); },
  hitEnemy()   { this.noise(0.1, 0.5, 900, 'bandpass', 0.8); this.tone('square', 220, 80, 0.1, 0.16); },
  clank()      { this.tone('square', 1400, 900, 0.07, 0.1); this.noise(0.06, 0.2, 4000, 'highpass'); },
  hurt()       { this.tone('sawtooth', 300, 60, 0.4, 0.28); this.noise(0.3, 0.3, 500, 'lowpass'); },
  enemyDie()   { this.noise(0.35, 0.32, 700, 'lowpass'); this.tone('triangle', 400, 50, 0.3, 0.14); },
  jump()       { this.noise(0.09, 0.14, 1500, 'bandpass', 1.2); },
  flap()       { this.noise(0.12, 0.22, 900, 'bandpass', 0.7); },
  dash()       { this.noise(0.22, 0.3, 3200, 'bandpass', 0.6); this.tone('sine', 700, 200, 0.15, 0.06); },
  land()       { this.noise(0.1, 0.16, 300, 'lowpass'); },
  geo()        { this.tone('sine', 1200, 1800, 0.12, 0.12); this.tone('sine', 2400, 3000, 0.1, 0.05); },
  soul()       { this.tone('sine', 900, 1400, 0.25, 0.07); },
  heal()       { this.bell(660, 0.2, 1.6); this.bell(990, 0.12, 1.9); },
  focusLoop()  { this.tone('sine', 220, 440, 0.5, 0.04); },
  bench()      { this.bell(440, 0.18, 2.2); this.bell(554, 0.1, 2.4); },
  select()     { this.tone('sine', 800, 1000, 0.08, 0.08); },
  confirmS()   { this.bell(523, 0.15, 1.2); },
  roar()       { this.tone('sawtooth', 90, 40, 1.4, 0.4, 0.05); this.noise(1.2, 0.3, 300, 'lowpass'); },
  bossHit()    { this.noise(0.14, 0.5, 1200, 'bandpass', 0.7); this.tone('square', 160, 60, 0.16, 0.2); },
  shatter()    { this.noise(0.5, 0.4, 2500, 'highpass'); this.tone('sine', 2000, 300, 0.5, 0.12); },
  pickup()     { this.bell(784, 0.2, 2.0); this.bell(1175, 0.15, 2.4); this.bell(1568, 0.1, 2.8); },
  gate()       { this.noise(0.8, 0.3, 200, 'lowpass'); this.tone('sawtooth', 60, 30, 0.9, 0.2); },
  shadeCast()  { this.tone('triangle', 600, 1600, 0.25, 0.16, 0.01); this.bell(880, 0.12, 1.4); this.noise(0.18, 0.18, 3000, 'bandpass', 1.2); },
  shadeHit()   { this.noise(0.12, 0.4, 1400, 'bandpass', 0.8); this.tone('square', 440, 200, 0.1, 0.12); },
  // v1.6 — parry ring, holy beams, feather volleys, stun wobble
  parry()      { this.tone('square', 1500, 480, 0.16, 0.22); this.bell(1568, 0.22, 0.9); this.noise(0.08, 0.3, 5200, 'highpass'); },
  holyBeam()   { this.bell(392, 0.16, 1.5); this.bell(784, 0.12, 1.8); this.noise(0.45, 0.2, 2600, 'bandpass', 0.8); this.tone('sine', 220, 880, 0.4, 0.09); },
  feather()    { this.noise(0.16, 0.16, 2200, 'bandpass', 1.6); this.tone('sine', 1400, 900, 0.12, 0.05); },
  stunRing()   { this.tone('sine', 700, 180, 0.5, 0.16); this.tone('square', 900, 300, 0.3, 0.07); },
};

/* ==========================================================================
   SECTION 3 — SPRITE FACTORY
   ========================================================================== */

const SPR = {};

// mkFrames bakes normal frames (f) AND white silhouettes (w) for hit-flashes.
function mkFrames(n, w, h, fn) {
  const f = [], wq = [];
  for (let i = 0; i < n; i++) {
    const c = makeCanvas(w, h);
    const g = c.getContext('2d');
    fn(g, i, n);
    f.push(c);
    const wc = makeCanvas(w, h);
    const wg = wc.getContext('2d');
    wg.drawImage(c, 0, 0);
    wg.globalCompositeOperation = 'source-in';
    wg.fillStyle = '#ffffff';
    wg.fillRect(0, 0, w, h);
    wq.push(wc);
  }
  return { f, w: wq };
}

function drawSpr(spr, idx, cx, by, flip, alpha = 1) {
  const img = spr.f[idx % spr.f.length];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(Math.round(cx), Math.round(by));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -img.width / 2, -img.height);
  ctx.restore();
}

// Hardened — falls back to normal frames if a silhouette set is ever missing.
function drawSprWhite(spr, idx, cx, by, flip) {
  const frames = (spr.w && spr.w.length) ? spr.w : spr.f;
  const img = frames[idx % frames.length];
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(by));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -img.width / 2, -img.height);
  ctx.restore();
}

/* --------------------------------------------------------------------------
   PIXEL-ART BAKING TOOLS (v1.4)
   Everything that should read as "pixel art" is drawn on a small VIRTUAL
   pixel grid, then upscaled by an integer factor with nearest-neighbour
   sampling — the same technique the v1.3 slash uses — so every pixel is a
   hard, chunky square.  Used by the enemies, the boss, the background
   trees, and the redesigned Illumina.
   -------------------------------------------------------------------------- */

// Nearest-neighbour upscale a small canvas by an integer factor.
function upscaleNN(small, factor) {
  const c = makeCanvas(small.width * factor, small.height * factor);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(small, 0, 0, c.width, c.height);
  return c;
}

// Post-process pixelation: downscale (averaging) then nearest-neighbour
// back up.  By default alpha below alphaCut is snapped to fully transparent
// and everything else opaque (crisp sprite edges).  quantizeAlpha=true
// instead preserves translucency in coarse 32-steps — used by the soft
// parallax background layers so their depth falloff survives pixelation.
function pixelateCanvas(src, factor, alphaCut = 0.4, quantizeAlpha = false) {
  const sw = Math.max(1, Math.round(src.width / factor));
  const sh = Math.max(1, Math.round(src.height / factor));
  const small = makeCanvas(sw, sh);
  const sg = small.getContext('2d');
  sg.imageSmoothingEnabled = true;
  sg.drawImage(src, 0, 0, sw, sh);
  // snap/quantize alpha + posterize RGB so blocks read as deliberate pixels
  const img = sg.getImageData(0, 0, sw, sh);
  const d = img.data;
  const cut = alphaCut * 255;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < cut) { d[i + 3] = 0; continue; }
    d[i + 3] = quantizeAlpha ? Math.min(255, Math.round(d[i + 3] / 32) * 32) : 255;
    d[i]     = Math.min(255, Math.round(d[i]     / 34) * 34);
    d[i + 1] = Math.min(255, Math.round(d[i + 1] / 34) * 34);
    d[i + 2] = Math.min(255, Math.round(d[i + 2] / 34) * 34);
  }
  sg.putImageData(img, 0, 0);
  return upscaleNN(small, factor);
}

// Pixelate an entire frame set ({f:[], w:[]}) and rebuild the white
// hit-flash silhouettes from the pixelated frames.
function pixelateFrameSet(set, factor, alphaCut = 0.4) {
  const f = set.f.map(c => pixelateCanvas(c, factor, alphaCut));
  const w = f.map(c => {
    const wc = makeCanvas(c.width, c.height);
    const wg = wc.getContext('2d');
    wg.drawImage(c, 0, 0);
    wg.globalCompositeOperation = 'source-in';
    wg.fillStyle = '#ffffff';
    wg.fillRect(0, 0, c.width, c.height);
    return wc;
  });
  return { f, w };
}

// mkPixelFrames — like mkFrames, but drawFn paints on a VIRTUAL pixel grid
// of gw×gh cells via the px(x, y, col) plotter; each cell becomes a hard
// pix×pix square in the final sprite.  White flash silhouettes included.
function mkPixelFrames(n, gw, gh, pix, fn) {
  const f = [], wq = [];
  for (let i = 0; i < n; i++) {
    const small = makeCanvas(gw, gh);
    const sg = small.getContext('2d');
    const px = (x, y, col) => {
      x |= 0; y |= 0;
      if (x < 0 || y < 0 || x >= gw || y >= gh) return;
      sg.fillStyle = col;
      sg.fillRect(x, y, 1, 1);
    };
    const rect = (x, y, w, h, col) => {
      for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) px(xx, yy, col);
    };
    fn(px, rect, i, n, sg);
    const c = upscaleNN(small, pix);
    f.push(c);
    const wc = makeCanvas(c.width, c.height);
    const wg = wc.getContext('2d');
    wg.drawImage(c, 0, 0);
    wg.globalCompositeOperation = 'source-in';
    wg.fillStyle = '#ffffff';
    wg.fillRect(0, 0, c.width, c.height);
    wq.push(wc);
  }
  return { f, w: wq };
}

/* --------------------------------------------------------------------------
   3.1 — THE KNIGHT
   -------------------------------------------------------------------------- */

function paintKnightBody(g, P) {
  // P: { bob, lean, hem:[5 flutter offsets], legA, legB, tuck, kneel, eyeGlow }
  // =====================================================================
  // Restored original smooth-bezier silhouette, with richer multi-layer
  // shading: 4 cloak tones (deep shadow / base / mid / rim+glint), 3 mask
  // tones (base / brow shadow / forehead highlight), 3 horn tones.
  // =====================================================================
  const cx = 28;
  const groundY = 72;   // was 60; shifted down 12px to match the taller 76px canvas
  const bob = P.bob || 0;
  const lean = P.lean || 0;

  g.save();
  g.translate(cx, groundY + bob);
  g.rotate(lean);

  // -- enriched palette -------------------------------------------------
  const inkDark   = '#0a0b12';   // darkest outline (was #14151d)
  const cloakSh   = '#11141e';   // cloak deep shadow  (NEW)
  const cloak     = '#1d2030';   // cloak base         (was #232634, slightly darker)
  const cloakMid  = '#272b3d';   // cloak mid-tone     (NEW)
  const cloakRim  = '#3e4458';   // cloak rim light    (was #3a3f52, brighter)
  const cloakHi   = '#565e7a';   // cloak edge glint   (NEW)
  const maskCol   = '#ece8db';   // mask base          (was #e9e6da, brighter)
  const maskShade = '#a8a394';   // mask brow shadow   (was #c9c5b6, darker for contrast)
  const maskHi    = '#faf6ec';   // mask highlight     (NEW)
  const hornSh    = '#8c8676';   // horn shadow        (NEW)
  const hornHi    = '#f4f0e4';   // horn highlight     (NEW)

  // --- legs (original shapes + added shading) -------------------------
  if (!P.kneel) {
    if (P.tuck) {
      // tucked legs (jump / dash)
      g.fillStyle = inkDark;
      g.beginPath(); g.ellipse(-4, -4, 4, 5, -0.5, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(5, -5, 4, 5, 0.4, 0, Math.PI * 2); g.fill();
      // leg mid-tone highlight
      g.fillStyle = cloakMid;
      g.beginPath(); g.ellipse(-4, -5, 1.8, 2.4, -0.5, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(5, -6, 1.8, 2.4, 0.4, 0, Math.PI * 2); g.fill();
    } else {
      // standing / running legs; legA & legB are x,y offsets
      g.fillStyle = inkDark;
      g.save();
      g.translate(P.legA[0], P.legA[1]);
      g.beginPath(); g.ellipse(0, 0, 3.2, 4.6, 0.1, 0, Math.PI * 2); g.fill();
      g.fillStyle = cloakSh;
      g.beginPath(); g.ellipse(0, 0, 2.2, 3.6, 0.1, 0, Math.PI * 2); g.fill();
      g.fillStyle = cloakMid;
      g.beginPath(); g.ellipse(-0.4, -0.8, 1, 1.8, 0.1, 0, Math.PI * 2); g.fill();
      g.restore();
      g.fillStyle = inkDark;
      g.save();
      g.translate(P.legB[0], P.legB[1]);
      g.beginPath(); g.ellipse(0, 0, 3.2, 4.6, -0.1, 0, Math.PI * 2); g.fill();
      g.fillStyle = cloakSh;
      g.beginPath(); g.ellipse(0, 0, 2.2, 3.6, -0.1, 0, Math.PI * 2); g.fill();
      g.fillStyle = cloakMid;
      g.beginPath(); g.ellipse(-0.4, -0.8, 1, 1.8, -0.1, 0, Math.PI * 2); g.fill();
      g.restore();
    }
  } else {
    // kneeling for focus / sit: folded legs
    g.fillStyle = inkDark;
    g.beginPath(); g.ellipse(-5, -2, 6, 4, 0.2, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(5, -2, 6, 4, -0.2, 0, Math.PI * 2); g.fill();
    g.fillStyle = cloakSh;
    g.beginPath(); g.ellipse(-5, -2, 4.6, 3, 0.2, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(5, -2, 4.6, 3, -0.2, 0, Math.PI * 2); g.fill();
    g.fillStyle = cloakMid;
    g.beginPath(); g.ellipse(-5, -2.6, 2.4, 1.6, 0.2, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(5, -2.6, 2.4, 1.6, -0.2, 0, Math.PI * 2); g.fill();
  }

  // --- cloak (original silhouette, 4 shading layers) ------------------
  const shoulderY = -26;
  const hemY = -6;
  const hw = 11;
  const hem = P.hem;

  // Layer 1: deep shadow silhouette (slightly larger, drawn behind)
  g.fillStyle = cloakSh;
  g.beginPath();
  g.moveTo(-8 + lean * 4, shoulderY - 1);
  g.bezierCurveTo(-14, shoulderY + 8, -hw - 4, hemY - 12, -hw - 3 + hem[0], hemY + 1);
  g.lineTo(-hw - 3 + hem[0] + 3, hemY + 5);
  g.lineTo(-hw * 0.6 + hem[1], hemY);
  g.lineTo(-hw * 0.6 + hem[1] + 3, hemY + 6);
  g.lineTo(0 + hem[2], hemY - 1);
  g.lineTo(hem[2] + 3, hemY + 7);
  g.lineTo(hw * 0.6 + hem[3], hemY);
  g.lineTo(hw * 0.6 + hem[3] - 3, hemY + 5);
  g.lineTo(hw + 3 + hem[4], hemY + 1);
  g.bezierCurveTo(hw + 5, hemY - 12, 14, shoulderY + 8, 8 + lean * 4, shoulderY - 1);
  g.closePath();
  g.fill();

  // Layer 2: base cloak colour (original path)
  g.fillStyle = cloak;
  g.beginPath();
  g.moveTo(-7 + lean * 4, shoulderY);
  g.bezierCurveTo(-13, shoulderY + 8, -hw - 3, hemY - 12, -hw - 2 + hem[0], hemY);
  g.lineTo(-hw - 2 + hem[0] + 3, hemY + 4);
  g.lineTo(-hw * 0.6 + hem[1], hemY - 1);
  g.lineTo(-hw * 0.6 + hem[1] + 3, hemY + 5);
  g.lineTo(0 + hem[2], hemY - 2);
  g.lineTo(hem[2] + 3, hemY + 6);
  g.lineTo(hw * 0.6 + hem[3], hemY - 1);
  g.lineTo(hw * 0.6 + hem[3] - 3, hemY + 4);
  g.lineTo(hw + 2 + hem[4], hemY);
  g.bezierCurveTo(hw + 4, hemY - 12, 13, shoulderY + 8, 7 + lean * 4, shoulderY);
  g.closePath();
  g.fill();

  // Layer 3: mid-tone center fold (narrower, gives volume)
  g.fillStyle = cloakMid;
  g.beginPath();
  g.moveTo(-4 + lean * 3, shoulderY + 3);
  g.bezierCurveTo(-9, shoulderY + 12, -hw * 0.7, hemY - 10, -hw * 0.45 + hem[1] * 0.5, hemY - 1);
  g.lineTo(-hw * 0.2 + hem[2] * 0.5, hemY);
  g.lineTo(0 + hem[2], hemY - 1);
  g.lineTo(hw * 0.2 + hem[3] * 0.5, hemY);
  g.lineTo(hw * 0.45 + hem[3] * 0.5, hemY - 1);
  g.bezierCurveTo(hw * 0.7, hemY - 10, 9, shoulderY + 12, 4 + lean * 3, shoulderY + 3);
  g.closePath();
  g.fill();

  // Layer 4: rim light along the leading edge + shoulder glint
  g.strokeStyle = cloakRim;
  g.lineWidth = 1.6;
  g.beginPath();
  g.moveTo(7 + lean * 4, shoulderY + 1);
  g.bezierCurveTo(hw + 4, hemY - 12, hw + 3, hemY - 8, hw + 2 + hem[4], hemY);
  g.stroke();
  // bright glint at shoulder
  g.fillStyle = cloakHi;
  g.beginPath();
  g.ellipse(6 + lean * 4, shoulderY + 3, 1.5, 2.2, 0.3, 0, Math.PI * 2);
  g.fill();

  // inner shadow fold (deeper than before)
  g.strokeStyle = 'rgba(0,0,0,0.55)';
  g.lineWidth = 2.2;
  g.beginPath();
  g.moveTo(-2 + hem[2] * 0.5, shoulderY + 6);
  g.quadraticCurveTo(-4, hemY - 14, -3 + hem[1] * 0.6, hemY - 2);
  g.stroke();

  // --- head / mask (original shapes + 3-tone shading) -----------------
  const hy = -36;
  g.save();
  g.translate(lean * 6, 0);

  // mask base
  g.fillStyle = maskCol;
  g.beginPath();
  g.moveTo(-10, hy + 4);
  g.bezierCurveTo(-11, hy - 8, -6, hy - 13, 0, hy - 13);
  g.bezierCurveTo(6, hy - 13, 11, hy - 8, 10, hy + 4);
  g.bezierCurveTo(8, hy + 10, 3, hy + 12, 0, hy + 12);
  g.bezierCurveTo(-3, hy + 12, -8, hy + 10, -10, hy + 4);
  g.closePath();
  g.fill();

  // horns — two sweeping curves, left one slightly chipped
  g.fillStyle = maskCol;
  g.beginPath(); // left horn
  g.moveTo(-6, hy - 10);
  g.bezierCurveTo(-11, hy - 18, -13, hy - 24, -10.5, hy - 28);
  g.bezierCurveTo(-10, hy - 24, -8, hy - 20, -3.5, hy - 13);
  g.closePath();
  g.fill();
  g.beginPath(); // right horn, longer
  g.moveTo(4, hy - 11);
  g.bezierCurveTo(9, hy - 19, 13, hy - 26, 12.5, hy - 31);
  g.bezierCurveTo(11, hy - 25, 7, hy - 19, 1.5, hy - 12);
  g.closePath();
  g.fill();

  // horn shadows (inner edge)
  g.fillStyle = hornSh;
  g.globalAlpha = 0.55;
  g.beginPath(); // left horn shadow
  g.moveTo(-6, hy - 10);
  g.bezierCurveTo(-9, hy - 16, -10, hy - 22, -9, hy - 26);
  g.bezierCurveTo(-8, hy - 22, -7, hy - 18, -5, hy - 13);
  g.closePath();
  g.fill();
  g.beginPath(); // right horn shadow
  g.moveTo(4, hy - 11);
  g.bezierCurveTo(7, hy - 17, 10, hy - 24, 9.5, hy - 29);
  g.bezierCurveTo(8.5, hy - 24, 6, hy - 19, 2.5, hy - 12);
  g.closePath();
  g.fill();
  g.globalAlpha = 1;

  // horn highlights (outer edge)
  g.fillStyle = hornHi;
  g.globalAlpha = 0.7;
  g.beginPath();
  g.ellipse(-9, hy - 22, 0.8, 3, 0.3, 0, Math.PI * 2); g.fill();
  g.beginPath();
  g.ellipse(10, hy - 25, 0.8, 4, -0.2, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;

  // mask shading under the brow (darker for contrast)
  g.fillStyle = maskShade;
  g.beginPath();
  g.moveTo(-10, hy + 3);
  g.bezierCurveTo(-4, hy + 7, 4, hy + 7, 10, hy + 3);
  g.bezierCurveTo(8, hy + 10, 3, hy + 12, 0, hy + 12);
  g.bezierCurveTo(-3, hy + 12, -8, hy + 10, -10, hy + 3);
  g.closePath();
  g.globalAlpha = 0.55;
  g.fill();
  g.globalAlpha = 1;

  // forehead highlight (NEW — gives the mask a sheen)
  g.fillStyle = maskHi;
  g.globalAlpha = 0.6;
  g.beginPath();
  g.ellipse(0, hy - 9, 4, 2, 0, 0, Math.PI * 2);
  g.fill();
  g.globalAlpha = 1;

  // eyes — vertical almonds
  if (P.eyeGlow) {
    g.fillStyle = '#ffffff';
    g.shadowColor = '#dfe9ff';
    g.shadowBlur = 8;
  } else {
    g.fillStyle = '#0a0b10';
  }
  g.beginPath();
  g.ellipse(-4.4, hy + 1, 2.1, 3.6, 0.12, 0, Math.PI * 2);
  g.fill();
  g.beginPath();
  g.ellipse(4.4, hy + 1, 2.1, 3.6, -0.12, 0, Math.PI * 2);
  g.fill();
  g.shadowBlur = 0;

  // crack on the left cheek
  g.strokeStyle = 'rgba(90,90,84,0.7)';
  g.lineWidth = 0.9;
  g.beginPath();
  g.moveTo(-8.5, hy + 2);
  g.lineTo(-7, hy + 5);
  g.lineTo(-8, hy + 8);
  g.stroke();

  g.restore(); // head lean
  g.restore(); // body
}



function knightPoseParams(pose, i, n) {
  const P = { hem: [0, 0, 0, 0, 0], legA: [-4, 0], legB: [4, 0], tuck: false, kneel: false, eyeGlow: false };
  switch (pose) {
    case 'idle': {
      const t = (i / n) * Math.PI * 2;
      P.bob = Math.sin(t) * 1.2;
      for (let k = 0; k < 5; k++) P.hem[k] = Math.sin(t - k * 0.6) * 1.4;
      break;
    }
    case 'run': {
      const t = (i / n) * Math.PI * 2;
      P.lean = 0.09;
      P.bob = Math.abs(Math.sin(t)) * -2;
      P.legA = [Math.sin(t) * 6 - 1, -Math.max(0, Math.cos(t)) * 4];
      P.legB = [Math.sin(t + Math.PI) * 6 + 1, -Math.max(0, Math.cos(t + Math.PI)) * 4];
      for (let k = 0; k < 5; k++) P.hem[k] = Math.sin(t * 2 - k * 0.8) * 2.6 - 2.5;
      break;
    }
    case 'jump': {
      // 4-frame jump: 0 crouch, 1 launch, 2 apex tuck, 3 hang
      const t = i / (n - 1);  // 0..1
      if (i === 0) {
        // crouch — squat down, hem pools
        P.bob = 4;
        P.lean = 0;
        P.tuck = false;
        P.legA = [-3, 3]; P.legB = [3, 3];
        for (let k = 0; k < 5; k++) P.hem[k] = 2 + Math.sin(k) * 0.5;
      } else if (i === 1) {
        // launch — spring up, legs extend down, cloak flares up
        P.bob = -3;
        P.lean = -0.05;
        P.tuck = false;
        P.legA = [-3, -2]; P.legB = [3, -3];
        for (let k = 0; k < 5; k++) P.hem[k] = -5 + Math.sin(k * 1.2) * 1.5;
      } else if (i === 2) {
        // apex tuck — legs tucked, cloak suspended
        P.tuck = true;
        P.bob = -2;
        P.lean = -0.02;
        for (let k = 0; k < 5; k++) P.hem[k] = -3 + Math.sin(i * 1.7 - k) * 1.2;
      } else {
        // hang — slight drift, cloak settles
        P.tuck = true;
        P.bob = -1;
        P.lean = 0.03;
        for (let k = 0; k < 5; k++) P.hem[k] = -2 + Math.sin(k * 0.8) * 1;
      }
      break;
    }
    case 'fall': {
      P.legA = [-5, 2]; P.legB = [5, 3];
      for (let k = 0; k < 5; k++) P.hem[k] = -5 + Math.sin(i * 2.1 - k * 0.9) * 2;
      break;
    }
    case 'wall': {
      P.lean = -0.14;
      P.legA = [-2, 3]; P.legB = [5, 1];
      for (let k = 0; k < 5; k++) P.hem[k] = 3 + Math.sin(i * 1.3 - k) * 1.6;
      break;
    }
    case 'dash': {
      // 4-frame dash: 0 wind-up, 1 extend, 2 sustain, 3 recover
      if (i === 0) {
        // wind-up — lean back slightly, coil
        P.lean = -0.08;
        P.tuck = false;
        P.bob = 1;
        P.legA = [-5, 0]; P.legB = [5, 0];
        for (let k = 0; k < 5; k++) P.hem[k] = 1 + Math.sin(k) * 0.6;
      } else if (i === 1) {
        // extend — full lean, cloak streams back hard
        P.lean = 0.35;
        P.tuck = true;
        P.bob = -2;
        for (let k = 0; k < 5; k++) P.hem[k] = -7 - k * 1.4;
      } else if (i === 2) {
        // sustain — held lean, cloak still streaming
        P.lean = 0.3;
        P.tuck = true;
        P.bob = -2;
        for (let k = 0; k < 5; k++) P.hem[k] = -6 - k * 1.2;
      } else {
        // recover — lean forward less, cloak catching up
        P.lean = 0.12;
        P.tuck = false;
        P.bob = 0;
        P.legA = [-2, 0]; P.legB = [4, 0];
        for (let k = 0; k < 5; k++) P.hem[k] = -2 + Math.sin(k * 0.9) * 1;
      }
      break;
    }
    case 'focus': {
      const t = (i / n) * Math.PI * 2;
      P.kneel = true;
      P.eyeGlow = true;
      P.bob = Math.sin(t) * 0.8;
      for (let k = 0; k < 5; k++) P.hem[k] = Math.sin(t * 2 - k * 0.5) * 1.8;
      break;
    }
    case 'sit': {
      P.kneel = true;
      P.bob = 3;
      for (let k = 0; k < 5; k++) P.hem[k] = Math.sin((i / n) * 6.28 - k * 0.4) * 0.7;
      break;
    }
    case 'hurt': {
      P.lean = -0.22;
      P.tuck = true;
      for (let k = 0; k < 5; k++) P.hem[k] = -4 + Math.sin(k * 1.4) * 2;
      break;
    }
  }
  return P;
}

function buildKnightSprites() {
  // Canvas enlarged from 56×64 → 56×76 so the tall horns (which reach up to
  // y ≈ -7 in the old 64-tall canvas) are no longer clipped at the top.
  const W = 56, H = 76;
  SPR.knight = {};
  const poses = [
    ['idle', 6], ['run', 10], ['jump', 4], ['fall', 2],
    ['wall', 2], ['dash', 4], ['focus', 6], ['sit', 4], ['hurt', 1],
  ];
  for (const [pose, n] of poses) {
    SPR.knight[pose] = mkFrames(n, W, H, (g, i) => {
      paintKnightBody(g, knightPoseParams(pose, i, n));
    });
  }
}

/* --------------------------------------------------------------------------
   3.2 — ENEMY SPRITES
   -------------------------------------------------------------------------- */

function buildEnemySprites() {

  /* -- v1.4: ALL ENEMIES REBAKED AS TRUE PIXEL ART ------------------------
     Each enemy is painted on a small VIRTUAL pixel grid with the px/rect
     plotters, then upscaled 2× nearest-neighbour — hard chunky squares,
     4-5 tone palettes, dark outlines — matching the pixel slash style.
     Canvas sizes are UNCHANGED so all draw anchors stay valid.
     ---------------------------------------------------------------------- */

  // ---- MITE — crawling shell bug (44×28 final, 22×14 grid @2×) ----------
  SPR.mite = mkPixelFrames(6, 22, 14, 2, (px, rect, i) => {
    const ph = (i / 6) * Math.PI * 2;
    const ink = '#14161c', shell = '#2c3038', shellHi = '#414855',
          rim = '#4a505e', face = '#ddd8c8', faceSh = '#b0aa98', eye = '#0a0a0e';
    // shell dome
    rect(7, 4, 7, 1, shell);  rect(5, 5, 11, 1, shell);
    rect(4, 6, 13, 1, shell);
    rect(3, 7, 14, 3, shell);
    rect(4, 10, 13, 1, shell);
    // top highlight arc + rim seams
    rect(7, 5, 6, 1, shellHi);
    px(5, 6, shellHi); px(6, 5, shellHi); px(14, 6, shellHi);
    for (let y = 6; y <= 9; y++) { px(8, y, rim); px(13, y, rim); }
    rect(4, 10, 12, 1, ink);                       // belly line
    // face (right side)
    px(17, 5, face); px(18, 5, face);
    rect(16, 6, 4, 4, face);
    px(17, 10, face); px(18, 10, faceSh); px(16, 10, faceSh);
    px(18, 7, eye);
    // antenna
    const asy = Math.round(Math.sin(ph));
    px(19, 5, ink); px(20, 4, ink); px(21, 3 + asy, rim);
    // legs — 3 pairs, swaying stride
    for (let s = 0; s < 3; s++) {
      const sw = Math.round(Math.sin(ph + s * 2.1) * 1.2);
      const bx = 5 + s * 4;
      rect(bx + sw, 11, 1, 2, ink);
      px(bx + sw, 13, ink);
      rect(bx - 1 - sw, 11, 1, 2, ink);
    }
  });

  // ---- GLOOM — moth wraith (52×44 final, 26×22 grid @2×) ----------------
  SPR.gloom = mkPixelFrames(6, 26, 22, 2, (px, rect, i) => {
    const ph = (i / 6) * Math.PI * 2;
    const flap = Math.round(Math.sin(ph * 2) * 2);
    const body = '#262a35', bodyHi = '#363c4b', wing = '#5d6a72',
          wingHi = '#7e8d95', mask = '#e2ddcc', maskSh = '#bcb7a6', eye = '#0a0a0e';
    // wings (two flapping panes)
    for (const side of [-1, 1]) {
      for (let t = 0; t <= 6; t++) {
        const x = side < 0 ? 10 - t : 16 + t;
        const yT = 9 - Math.round(t * 0.9) + flap;
        const yB = 11 - Math.round(t * 0.55) + flap;
        for (let y = Math.min(yT, yB); y <= Math.max(yT, yB); y++) px(x, y, wing);
        px(x, yT, wingHi);                       // leading edge glint
      }
      px(side < 0 ? 4 : 22, 4 + flap, wingHi);   // wing tip pixel
    }

  /* -- Vengeful Shade : player's soul projectile -------------------------- */
  // 4-frame pulsing animation, pixelated to match the knight.
  SPR.shadeBolt = mkFrames(4, 24, 24, (g, i) => {
    g.imageSmoothingEnabled = false;
    const ph = (i / 4) * Math.PI * 2;
    const pulse = Math.sin(ph);
    g.save();
    g.translate(12, 12);
    // hard pixel helper
    function px(x, y, s, col, a) {
      g.globalAlpha = a == null ? 1 : a;
      g.fillStyle = col;
      g.fillRect(Math.round(x) - (s >> 1), Math.round(y) - (s >> 1), s, s);
    }
    // outer dim halo — scattered pixels
    const haloR = 10 + pulse * 1;
    g.globalAlpha = 0.25;
    g.fillStyle = 'rgba(140,150,180,0.5)';
    for (let a = 0; a < 12; a++) {
      const ang = (a / 12) * Math.PI * 2;
      px(Math.cos(ang) * haloR, Math.sin(ang) * haloR, 2, 'rgba(140,150,180,0.5)', 0.3);
    }
    // mid aura — pale lavender ring
    const midR = 8;
    for (let a = 0; a < 10; a++) {
      const ang = (a / 10) * Math.PI * 2 + ph * 0.3;
      px(Math.cos(ang) * midR, Math.sin(ang) * midR, 2, 'rgba(180,170,210,0.6)', 0.6);
    }

    g.globalAlpha = 1;
    g.fillStyle = '#1c1830';
    g.fillRect(-4, -4, 8, 8);
    g.fillRect(-5, -2, 10, 4);
    g.fillRect(-2, -5, 4, 10);

  /* -- The Nail : player's sword, pixelated (matches reference) ------------ */
  // Drawn horizontally, tip pointing right.  Pommel at left, blade tip at right.
  // Palette: dark outline, rust-brown body, bright orange ridge, white glint.
  // The sprite is cached in 3 swing-angle variants: side, up, down.
  // For each variant we store the "rest" angle too (carried at side).
  SPR.nail = {};
  function buildNailSprite() {
    // We paint the nail pointing RIGHT.  drawSprNail() rotates it to the
    // current swing angle.  Canvas is 48x20 to fit the blade + hilt.
    const W = 48, H = 20;
    const c = makeCanvas(W, H);
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;

    // palette
    const OUT  = '#1a0f08';   // darkest outline / deep shadow
    const DARK = '#3d2410';   // dark brown shadow
    const MID  = '#8b5a2b';   // mid rust brown
    const HI   = '#c97a3a';   // bright orange highlight
    const EDGE = '#ffb066';   // edge glint
    const GLINT = '#fff0d8';  // specular white-pink
    const WRAP = '#2a1a0e';   // grip wrap dark
    const WRAPH = '#5a3a1e';  // grip wrap mid
    const POMMEL = '#1a0f08'; // pommel dark
    const POMMELH = '#4a3020';// pommel highlight

    // helper: pixel block
    function px(x, y, w, h, col) {
      g.fillStyle = col;
      g.fillRect(x, y, w, h);
    }

    const cy = 10;  // vertical center

    // --- pommel (left end, 2x3 flared block) ---
    px(0, cy - 2, 3, 5, OUT);
    px(1, cy - 1, 2, 3, POMMEL);
    px(1, cy - 1, 1, 1, POMMELH);

    // --- grip (4px wide, wrapped) ---
    px(3, cy - 1, 5, 3, OUT);
    px(4, cy, 3, 1, WRAP);
    px(4, cy - 1, 1, 1, WRAPH);
    px(6, cy, 1, 1, WRAPH);

    // --- guard / collar (flares out 2px each side) ---
    px(8, cy - 2, 3, 5, OUT);
    px(9, cy - 1, 1, 3, DARK);
    px(9, cy - 2, 1, 1, MID);   // top flare
    px(9, cy + 2, 1, 1, MID);   // bottom flare

    // --- blade base (wider, 3px tall) ---
    px(11, cy - 2, 6, 5, OUT);
    px(12, cy - 1, 5, 3, MID);
    // ridge highlight along the top edge
    px(12, cy - 1, 5, 1, HI);
    px(12, cy - 1, 2, 1, EDGE);

    // --- blade mid (tapering to 2px tall) ---
    px(17, cy - 2, 8, 4, OUT);
    px(18, cy - 1, 7, 2, MID);
    px(18, cy - 1, 7, 1, HI);
    px(18, cy - 1, 3, 1, EDGE);

    // specular glint (two white-pink pixels)
    px(21, cy - 1, 1, 1, GLINT);
    px(22, cy, 1, 1, GLINT);

    // --- blade tip (chisel — flat, 1px tall) ---
    px(25, cy - 1, 6, 3, OUT);
    px(26, cy - 1, 5, 1, MID);
    px(26, cy - 1, 3, 1, HI);
    px(26, cy - 1, 1, 1, EDGE);
    // flat chisel end
    px(31, cy, 1, 1, DARK);

    // edge shadow along the bottom of the blade
    px(12, cy + 1, 5, 1, DARK);
    px(18, cy, 7, 1, DARK);

    SPR.nail.side = c;
  }
  buildNailSprite();

  /* -- v1.5 : upright weapon ICON for the inventory frame ------------------

  SPR.iconNail = mkPixelFrames(1, 11, 26, 3, (px, rect) => {
    const OUT  = '#1a0f08', DARK = '#3d2410', MID = '#8b5a2b',

    // ---- blade (y2..14): 3px core tapering out to 5px ----
    for (let y = 2; y <= 14; y++) {
      const w = y < 4 ? 3 : 5;
      rect(cx - 2, y, w, 1, OUT);
      rect(cx - 1, y, 1, 1, MID);         // left body
      px(cx, y, GLINT);                    // bright spine

    rect(2, 15, 7, 1, DARK);
    px(1, 15, MID); px(9, 15, MID);
    // ---- grip (y17..23, wrapped) ----
    rect(cx - 1, 17, 3, 7, OUT);
    rect(cx, 17, 1, 7, WRAP);
    px(cx - 1, 18, WRAPH); px(cx + 1, 18, WRAPH);
    px(cx - 1, 21, WRAPH); px(cx + 1, 21, WRAPH);
    px(cx - 1, 17, WRAPH);
    // ---- pommel (y24..25) ----
    rect(3, 24, 5, 2, OUT);
    rect(4, 24, 3, 1, POMH);
    px(3, 25, POM); px(7, 25, POM);
  });
}

/* --------------------------------------------------------------------------
   3.3 — THE PALE WARDEN (boss)
   frames: 0-3 idle breathe, 4 crouch, 5 leap tuck, 6 land slash,
   7 dash, 8 raise, 9 burst.
   -------------------------------------------------------------------------- */

function buildBossSprites() {
  SPR.warden = mkFrames(10, 130, 170, (g, i) => {
    const ph = i < 4 ? (i / 4) * Math.PI * 2 : 0;
    const ink = '#101018', cloak = '#1d1e2c', cloakRim = '#34364c',
          pale = '#ece7d8', paleSh = '#c8c3b2', gold = '#b8a86a';
    const breathe = i < 4 ? Math.sin(ph) * 2 : 0;
    const crouch = (i === 4) ? 14 : (i === 5 ? -8 : 0);
    const lungeLean = i === 7 ? 0.35 : (i === 8 ? -0.12 : (i === 6 ? -0.2 : 0.02));

    g.save();
    g.translate(65, 168);
    g.scale(1.2, 1.2);
    g.translate(0, crouch);

    g.strokeStyle = ink;
    g.lineWidth = 4;
    g.lineCap = 'round';
    const spread = i === 7 ? 10 : (i === 5 ? -6 : 0);
    g.beginPath(); g.moveTo(-5, -34); g.lineTo(-9 - spread, 0); g.stroke();
    g.beginPath(); g.moveTo(5, -34);  g.lineTo(9 + spread, 0);  g.stroke();

    g.save();
    g.rotate(lungeLean);

    g.fillStyle = cloak;
    g.beginPath();
    g.moveTo(-11, -74 + breathe);
    g.bezierCurveTo(-22, -62, -24, -34, -20 + Math.sin(ph * 1.3) * 2, -4);
    g.lineTo(-14, -10); g.lineTo(-9, -3); g.lineTo(-4, -11);
    g.lineTo(0, -4 + Math.sin(ph) * 2); g.lineTo(4, -11);
    g.lineTo(9, -3); g.lineTo(14, -10);
    g.lineTo(20 + Math.sin(ph * 1.7) * 2, -4);
    g.bezierCurveTo(24, -34, 22, -62, 11, -74 + breathe);
    g.closePath();
    g.fill();
    g.strokeStyle = cloakRim;
    g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(11, -73 + breathe);
    g.bezierCurveTo(22, -62, 23, -34, 20, -6);
    g.stroke();
    g.fillStyle = gold;
    g.beginPath();
    g.moveTo(0, -66 + breathe);
    g.lineTo(4, -60 + breathe); g.lineTo(0, -54 + breathe);
    g.lineTo(-4, -60 + breathe);
    g.closePath();
    g.fill();

    g.fillStyle = '#262838';
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(s * 8, -72 + breathe);
      g.quadraticCurveTo(s * 24, -74 + breathe, s * 20, -60 + breathe);
      g.quadraticCurveTo(s * 13, -62 + breathe, s * 7, -66 + breathe);
      g.closePath();
      g.fill();
      g.strokeStyle = cloakRim;
      g.lineWidth = 1;
      g.stroke();
    }

    const hy = -86 + breathe;
    g.fillStyle = pale;
    g.beginPath();
    g.moveTo(-8, hy + 8);
    g.bezierCurveTo(-10, hy - 6, -6, hy - 12, 0, hy - 12);
    g.bezierCurveTo(6, hy - 12, 10, hy - 6, 8, hy + 8);
    g.bezierCurveTo(5, hy + 13, -5, hy + 13, -8, hy + 8);
    g.closePath();
    g.fill();
    g.fillStyle = pale;
    g.beginPath();
    g.moveTo(-6, hy - 9);
    g.bezierCurveTo(-12, hy - 20, -14, hy - 28, -10, hy - 34);
    g.bezierCurveTo(-9, hy - 26, -6, hy - 18, -2, hy - 12);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(6, hy - 9);
    g.bezierCurveTo(12, hy - 20, 14, hy - 28, 10, hy - 34);
    g.bezierCurveTo(9, hy - 26, 6, hy - 18, 2, hy - 12);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(-2, hy - 11);
    g.bezierCurveTo(-3, hy - 22, 0, hy - 27, 1, hy - 30);
    g.bezierCurveTo(2, hy - 24, 3, hy - 18, 3, hy - 12);
    g.closePath(); g.fill();
    const eyesGlow = (i >= 8);
    g.fillStyle = eyesGlow ? '#ffffff' : '#0a0a0e';
    if (eyesGlow) { g.shadowColor = '#cfd8ff'; g.shadowBlur = 6; }
    g.beginPath(); g.ellipse(-4.5, hy - 1, 1.5, 2.4, 0.1, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(4.5, hy - 1, 1.5, 2.4, -0.1, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(-2, hy + 4, 1.1, 1.7, 0.1, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(2, hy + 4, 1.1, 1.7, -0.1, 0, Math.PI * 2); g.fill();
    g.shadowBlur = 0;
    g.fillStyle = paleSh;
    g.strokeStyle = 'rgba(90,88,78,0.7)';
    g.lineWidth = 0.8;
    g.beginPath();
    g.moveTo(-7, hy + 3); g.lineTo(-5.5, hy + 6); g.lineTo(-6.5, hy + 9);
    g.stroke();

    g.strokeStyle = '#d6d1bf';
    g.lineWidth = 3.4;
    g.lineCap = 'round';
    if (i === 6 || i === 7) {
      g.beginPath();
      g.moveTo(14, -46);
      g.lineTo(44, -52);
      g.stroke();
      g.strokeStyle = '#948f7c';
      g.lineWidth = 1.2;
      g.beginPath();
      g.moveTo(16, -48); g.lineTo(42, -53.5);
      g.stroke();
    } else if (i === 8) {
      g.beginPath();
      g.moveTo(12, -50);
      g.lineTo(26, -84);
      g.stroke();
    } else if (i === 9) {
      g.beginPath();
      g.moveTo(16, -30);
      g.lineTo(20, -6);
      g.stroke();
    } else {
      g.beginPath();
      g.moveTo(13, -48);
      g.lineTo(18, -20);
      g.stroke();
    }
    g.restore();
    g.restore();
  });

  // v1.4: re-bake the Pale Warden as chunky pixel art to match the bestiary
  SPR.warden = pixelateFrameSet(SPR.warden, 2, 0.35);

  /* -- v1.5 : THE ASHEN SERAPH — second boss, drawn as true pixel art -------
     30×30 virtual grid @2× → 60×60.  A burning seraph: horned pale mask,
     ember-gold wing membranes, a white-hot heart-core in its chest.
     AIR frames · 0-3 hover (wing flap) · 4 ring telegraph (wings raised,
     core blazing) · 5 rain telegraph (wings spread) · 6 swoop (wings
     swept back) · 7 rest (wings drooped, cloak open, core dim).
     v1.6 GROUND frames (twin-blade stance) · 8,9 ground idle · 10 slash
     windup (blades raised) · 11 slash follow-through · 12 parry stance
     (blades crossed) · 13 dash lunge · 14 plunge dive · 15 stunned. -- */

  // v1.6: grounded twin-blade poses (facing RIGHT; flip at draw time)
  function seraphGroundPose(px, rect, g) {
    const ink   = '#160b06';
    const cloak = '#2c1c14', cloakHi = '#46301f', cloakRim = '#5c3f26';
    const wing  = '#b05a20', wingHi = '#e08a38', wingEdge = '#ffc86a';
    const blade = '#f2e8c8', bladeHi = '#ffffff', bladeEdge = '#ffd890';
    const gold  = '#e8c060';
    const ember = '#ff9a3c';
    const mask  = '#e8e0cc', maskSh = '#b8b09a';
    const stun  = g === 7;
    const core  = stun ? '#7a5a3a' : '#fff0c0';
    const coreHi= stun ? '#9a7850' : '#ffffff';
    const eye   = stun ? '#3a2a1a' : '#ff7828';
    const cx    = 14;
    const lean  = g === 5 ? 3 : (g === 3 ? 2 : (g === 2 ? -1 : 0));
    const bob   = g === 1 ? 1 : 0;
    const drop  = stun ? 3 : 0;

    // ---- legs / kneel ----
    if (stun) {
      rect(8, 27, 7, 2, ink); rect(16, 27, 6, 2, ink);
      px(8, 29, ink); px(21, 29, ink);
    } else {
      rect(11, 26, 2, 3, ink); px(11, 29, ink);
      rect(17, 26, 2, 3 - bob, ink); px(18, 29, ink);
    }

    // ---- wings ----
    if (g === 2) {
      // windup — wings thrust upward
      for (const s of [-1, 1]) {
        for (let t = 0; t <= 9; t++) {
          const x = cx + s * (4 + (t >> 1));
          const y = 12 - t;
          px(x, y, wing); px(x + s, y, wingHi);
        }
        px(cx + s * 8, 2, wingEdge);
      }
    } else if (g === 6) {
      // plunge — wings spread wide and high
      for (const s of [-1, 1]) {
        for (let t = 0; t <= 10; t++) {
          const x = cx + s * (3 + t);
          const y = 10 - Math.round(t * 0.55);
          px(x, y, wing); px(x, y - 1, wingHi);
        }
        px(cx + s * 13, 4, wingEdge);
      }
    } else if (g === 5) {
      // dash — swept flat behind
      for (let t = 0; t <= 10; t++) {
        px(11 - t, 16 + (t >> 1), wing); px(11 - t, 15 + (t >> 1), wingHi);
      }
      px(0, 21, wingEdge);
    } else {
      // folded mantle along the back
      for (let t = 0; t <= 9; t++) {
        px(9 - (t >> 1), 12 + t, wing);
        if (t % 3 === 0) px(8 - (t >> 1), 12 + t, wingHi);
      }
      px(4, 21, wingEdge);
    }

    // ---- torso ----
    const ty = 14 + bob + drop;
    rect(cx - 4 + lean, ty, 9, 2, cloak);
    rect(cx - 5 + lean, ty + 2, 11, 6, cloak);
    rect(cx - 4 + lean, ty + 8, 9, 2 + (stun ? 2 : 0), cloak);
    px(cx - 4 + lean, ty + 1, cloakHi);
    rect(cx + 3 + lean, ty + 1, 1, 8, cloakRim);
    // heart-core (dim only when stunned)
    rect(cx - 1 + lean, ty + 3, 3, 3, core);
    px(cx + lean, ty + 4, coreHi);
    if (!stun) { px(cx - 2 + lean, ty + 4, ember); px(cx + 2 + lean, ty + 3, ember); }

    // ---- head ----
    const hy = ty - 5 + (stun ? 2 : 0);
    px(cx - 2 + lean, hy - 2, mask); px(cx - 3 + lean, hy - 3, mask);
    px(cx + 2 + lean, hy - 2, mask); px(cx + 3 + lean, hy - 3, mask);
    px(cx + lean, hy - 3, mask); px(cx + lean, hy - 4, maskSh);
    rect(cx - 3 + lean, hy, 7, 1, mask);
    rect(cx - 4 + lean, hy + 1, 9, 4, mask);
    rect(cx - 3 + lean, hy + 5, 7, 1, maskSh);
    px(cx - 1 + lean, hy + 2, eye); px(cx + 3 + lean, hy + 2, eye);
    if (!stun) { px(cx - 1 + lean, hy + 1, coreHi); px(cx + 3 + lean, hy + 1, coreHi); }

    // ---- twin blades ----
    if (g === 2) {
      // windup — right blade raised high, left blade back
      for (let t = 0; t <= 9; t++) { px(20, 8 + t, blade); px(21, 8 + t, bladeHi); }
      px(20, 7, bladeEdge); px(21, 7, bladeEdge);
      px(19, 17, gold);
      for (let t = 0; t <= 6; t++) px(7 - (t >> 1), 12 + t, blade);
      px(8, 11, bladeHi);
      px(8, 18, gold);
    } else if (g === 3) {
      // follow-through — right blade swept straight forward + ember wake
      rect(19, 15, 10, 1, bladeHi);
      rect(19, 16, 10, 1, blade);
      px(29, 16, bladeEdge);
      px(18, 16, gold);
      px(14, 14, ember); px(12, 16, ember); px(13, 18, ember);
      for (let t = 0; t <= 5; t++) px(9 + t, 21 + (t >> 1), blade);
    } else if (g === 4) {
      // parry — blades crossed before the body
      for (let t = 0; t <= 7; t++) {
        px(19 + t, 11 + t, blade);
        px(19 + t, 19 - t, blade);
      }
      px(20, 12, bladeHi); px(20, 18, bladeHi); px(22, 15, coreHi);
      px(18, 13, gold); px(18, 17, gold);
      px(24, 14, ember); px(23, 17, ember);
    } else if (g === 5) {
      // dash — blades trailing behind, speed lines
      for (let t = 0; t <= 8; t++) px(10 - t, 18, blade);
      px(2, 18, bladeEdge); px(11, 18, gold);
      for (let t = 0; t <= 5; t++) px(10 - t, 21, blade);
      px(4, 14, ember); px(1, 17, ember); px(5, 22, ember);
    } else if (g === 6) {
      // plunge — both blades straight down beneath
      rect(11, 22, 1, 7, bladeHi); rect(12, 22, 1, 6, blade);
      rect(16, 22, 1, 7, blade);   rect(17, 22, 1, 6, bladeHi);
      px(11, 29, bladeEdge); px(17, 29, bladeEdge);
      px(10, 21, gold); px(18, 21, gold);
    } else if (stun) {
      // dropped blades + dizzy sparks
      for (let t = 0; t <= 5; t++) { px(4, 20 + t, blade); px(24, 20 + t, blade); }
      px(4, 26, bladeEdge); px(24, 26, bladeEdge);
      px(5, 19, gold); px(23, 19, gold);
      px(12, 5, gold); px(16, 3, gold); px(14, 1, coreHi);
    } else {
      // idle — right blade carried forward-low, left reversed behind
      for (let t = 0; t <= 7; t++) {
        px(20 + t, 20 + (t >> 1), blade);
        if (t > 1 && t < 6) px(20 + t, 19 + (t >> 1), bladeHi);
      }
      px(27, 23, bladeEdge); px(19, 19, gold);
      for (let t = 0; t <= 4; t++) px(9 - t, 20 + t, blade);
      px(4, 24, bladeEdge); px(10, 19, gold);
    }
  }

  SPR.seraph = mkPixelFrames(16, 30, 30, 2, (px, rect, i) => {
    if (i >= 8) { seraphGroundPose(px, rect, i - 8); return; }
    const ph = i < 4 ? (i / 4) * Math.PI * 2 : 0;
    const rest = i === 7;
    const ink   = '#160b06';
    const cloak = '#2c1c14', cloakHi = '#46301f', cloakRim = '#5c3f26';
    const wing  = '#b05a20', wingHi = '#e08a38', wingEdge = '#ffc86a';
    const core  = rest ? '#7a5a3a' : '#fff0c0';
    const coreHi= rest ? '#9a7850' : '#ffffff';
    const ember = '#ff9a3c';
    const mask  = '#e8e0cc', maskSh = '#b8b09a', eye = rest ? '#3a2a1a' : '#ff7828';
    const flap  = i < 4 ? Math.round(Math.sin(ph) * 2) : 0;
    const cx = 15;
    const bob = i < 4 ? Math.round(Math.sin(ph) * 1) : 0;

    // ================= wings =================
    if (i === 6) {
      // SWOOP — swept back behind the body
      for (const side of [-1, 1]) {
        for (let t = 0; t <= 10; t++) {
          const x = cx + side * (3 + t);
          const y = 16 + Math.round(t * 0.45);
          px(x, y, wing); px(x, y - 1, wingHi);
          if (t % 3 === 0) px(x, y + 1, ink);
        }
        px(cx + side * 13, 21, wingEdge);
      }
    } else if (rest) {
      // REST — wings drooped low and open (the cloak parts)
      for (const side of [-1, 1]) {
        for (let t = 0; t <= 11; t++) {
          const x = cx + side * (3 + t);
          const y = 18 + Math.round(t * 0.5);
          px(x, y, wing); px(x, y - 1, wingHi);
        }
        px(cx + side * 14, 23, wingEdge);
        for (let f = 0; f < 3; f++) px(cx + side * (5 + f * 3), 19 + f * 2, ink);
      }
    } else if (i === 4) {
      // RING TELEGRAPH — wings thrust upward
      for (const side of [-1, 1]) {
        for (let t = 0; t <= 11; t++) {
          const x = cx + side * (4 + Math.round(t * 0.4));
          const y = 14 - t;
          px(x, y, wing); px(x + side, y, wingHi);
        }
        px(cx + side * 8, 2, wingEdge);
        px(cx + side * 8, 3, ember);
      }
    } else if (i === 5) {
      // RAIN TELEGRAPH — spread wide and flat
      for (const side of [-1, 1]) {
        for (let t = 0; t <= 12; t++) {
          const x = cx + side * (3 + t);
          const y = 13 + Math.round(Math.sin(t * 0.5) * 1) + flap;
          px(x, y, wing); px(x, y - 1, wingHi);
          if (t % 4 === 2) px(x, y + 1, ember);
        }
        px(cx + side * 15, 12 + flap, wingEdge);
      }
    } else {
      // HOVER — slow powerful flaps
      for (const side of [-1, 1]) {
        for (let t = 0; t <= 10; t++) {
          const x = cx + side * (3 + t);
          const yT = 14 - Math.round(t * 0.8) + flap;
          const yB = 17 - Math.round(t * 0.35) + flap;
          for (let y = Math.min(yT, yB); y <= Math.max(yT, yB); y++) px(x, y, wing);
          px(x, yT, wingHi);
          if (t === 10) px(x, yT, wingEdge);
        }
        if (flap < 0) px(cx + side * 13, 6 + flap, ember);   // shed spark on upstroke
      }
    }

    // ================= body =================
    const ty = 10 + bob;
    // cloak torso
    rect(cx - 3, ty + 2, 7, 1, cloak);
    rect(cx - 4, ty + 3, 9, 5, cloak);
    rect(cx - 3, ty + 8, 7, 3, cloak);
    rect(cx - 2, ty + 11, 5, 2, cloak);
    px(cx - 3, ty + 3, cloakHi);
    rect(cx + 2, ty + 3, 1, 7, cloakRim);
    // heart-core (blazes; dims at rest)
    rect(cx - 1, ty + 4, 3, 3, core);
    px(cx, ty + 5, coreHi);
    px(cx - 2, ty + 5, rest ? cloakRim : ember);
    px(cx + 2, ty + 4, rest ? cloakRim : ember);
    // tail tendrils
    const ts = Math.round(Math.sin(ph + 1.2) * 1);
    rect(cx - 1 + ts, ty + 13, 1, 3, ink);
    rect(cx + 1, ty + 13, 1, 2, ink);
    px(cx - 1 + ts, ty + 16, cloakRim);

    // ================= head =================
    const hy = ty - 4;
    // horned crown — three pale horns
    px(cx - 2, hy - 2, mask); px(cx - 3, hy - 3, mask);
    px(cx + 2, hy - 2, mask); px(cx + 3, hy - 3, mask);
    px(cx, hy - 3, mask); px(cx, hy - 4, maskSh);
    // pale mask face
    rect(cx - 3, hy, 7, 1, mask);
    rect(cx - 4, hy + 1, 9, 4, mask);
    rect(cx - 3, hy + 5, 7, 1, maskSh);
    // burning eyes
    px(cx - 2, hy + 2, eye); px(cx + 2, hy + 2, eye);
    if (!rest) { px(cx - 2, hy + 1, coreHi); px(cx + 2, hy + 1, coreHi); }
    // chin shade
    px(cx - 1, hy + 5, maskSh); px(cx + 1, hy + 5, maskSh);
  });

  /* -- v1.6 : SERAPH'S OATH — the reward of the Seraph hunt -----------------
     Vertical relic icon (24×40 grid @2× → 48×80) after the reference: a LONG
     pale-gold blade, a haloed blink-eye set where guard meets grip, tiered
     white wings sweeping from the guard, and a winged pommel. ------------- */
  SPR.seraphRelic = mkPixelFrames(1, 24, 40, 2, (px, rect) => {
    const out   = '#3a2c14';
    const blade = '#f4ecd2', bladeHi = '#ffffff', bladeSh = '#d8c890';
    const gold  = '#e8c060', goldHi = '#ffe8a0', goldSh = '#a8802c';
    const wing  = '#f8f4e4', wingHi = '#ffffff', wingSh = '#cfc6a4';
    const eyeW  = '#f8f4e8', iris = '#e8b84a', pupil = '#241a08';
    const cx = 11;

    // ---- halo over the eye ----
    for (let x = cx - 5; x <= cx + 5; x++)
      px(x, 20, (x === cx - 5 || x === cx + 5) ? goldSh : gold);
    px(cx - 4, 19, goldHi); px(cx + 4, 19, goldHi);

    // ---- LONG blade (tip y=0 → y=18) ----
    px(cx, 0, bladeHi);
    px(cx - 1, 1, blade); px(cx, 1, bladeHi); px(cx + 1, 1, blade);
    for (let y = 2; y <= 18; y++) {
      px(cx - 2, y, out);
      px(cx - 1, y, bladeSh);
      px(cx,     y, bladeHi);
      px(cx + 1, y, blade);
      px(cx + 2, y, gold);
    }
    for (let y = 6; y <= 15; y++) px(cx - 1, y, blade);   // soften the shade
    px(cx, 4, bladeHi); px(cx + 1, 9, bladeHi); px(cx - 1, 13, bladeHi);

    // ---- the EYE (guard hub) ----
    rect(cx - 3, 21, 7, 4, out);
    px(cx - 2, 22, eyeW); px(cx - 1, 22, iris); px(cx, 22, pupil);
    px(cx + 1, 22, iris); px(cx + 2, 22, eyeW);
    px(cx - 1, 23, eyeW); px(cx, 23, pupil); px(cx + 1, 23, eyeW);
    px(cx - 2, 21, wingHi); px(cx + 2, 21, wingHi);

    // ---- wings (upper sweeping tier + lower feathers) ----
    px(9, 25, wingHi); px(8, 24, wing); px(7, 24, wingHi); px(6, 23, wing); px(5, 23, wing);
    px(4, 22, wingHi); px(3, 22, wing); px(2, 21, wing); px(1, 21, wingHi);
    px(6, 24, wingSh); px(4, 23, wingSh); px(2, 22, wingSh);
    px(14, 25, wingHi); px(15, 24, wing); px(16, 24, wingHi); px(17, 23, wing); px(18, 23, wing);
    px(19, 22, wingHi); px(20, 22, wing); px(21, 21, wing); px(22, 21, wingHi);
    px(17, 24, wingSh); px(19, 23, wingSh); px(21, 22, wingSh);
    px(9, 27, wing); px(8, 27, wingSh); px(7, 26, wing); px(6, 26, wingSh); px(5, 25, wing);
    px(14, 27, wing); px(15, 27, wingSh); px(16, 26, wing); px(17, 26, wingSh); px(18, 25, wing);

    // ---- grip (long, gold-wrapped) ----
    rect(cx - 2, 29, 5, 7, out);
    rect(cx - 1, 29, 3, 7, gold);
    px(cx - 1, 30, goldSh); px(cx + 1, 30, goldSh);
    px(cx - 1, 32, goldSh); px(cx + 1, 32, goldSh);
    px(cx - 1, 34, goldSh); px(cx + 1, 34, goldSh);
    px(cx - 1, 29, goldHi);

    // ---- winged pommel ----
    px(cx - 4, 36, wing); px(cx - 3, 36, wingHi); px(cx + 3, 36, wingHi); px(cx + 4, 36, wing);
    rect(cx - 2, 36, 5, 3, out);
    rect(cx - 1, 36, 3, 3, gold);
    px(cx, 36, goldHi);
    px(cx - 2, 39, goldSh); px(cx + 2, 39, goldSh);
  }).f[0];

  /* -- v2.0 : SERAPH'S OATH in-hand — SIX WINGS + FOUR-POINTED STAR.
        Horizontal pixel LONG-blade, tip right.  The rain guard bears a
        great FOUR-POINTED STAR — a gold star-boss pinned over the blade
        root, long spikes reaching up / down / ahead / behind — with one
        watchful eye at its heart that shuts on the flap's peak frame.
        Exactly SIX WINGS: three rise above the guard and three hang
        below, mirrored across the blade like a seraph's pinions — a
        steep feather nearest the steel, the GREAT middle pinion (the
        largest on each side), and a shallow feather sweeping back over
        the grip.  On the beat the upper trio snaps UP and the lower
        trio snaps DOWN — one honest up-down flap, every wing moving as
        a solid body while the roots stay planted on the hub.
        54×36 grid @2× → 108×72.  Pivot (guard hub) at (12,17). -- */
  SPR.seraphHand = mkPixelFrames(4, 54, 36, 2, (px, rect, i) => {
    const out   = '#3a2c14';
    const blade = '#f4ecd2', bladeHi = '#ffffff', bladeSh = '#d8c890';
    const gold  = '#e8c060', goldHi = '#ffe8a0', goldSh = '#a8802c';
    const wing  = '#f8f4e4', wingHi = '#ffffff', wingSh = '#cfc6a4';
    const eyeW  = '#f8f4e8', iris = '#e8b84a', pupil = '#241a08';
    const flap  = [0, 2, 4, 2][i];           // beat: rest - rise - PEAK - fall
    const blink = (i === 2);
    const shim  = (i % 2 === 0);
    const HX = 13.5, HY = 17;                // every wing roots on the hub

    // one tapered pixel feather, plotted span-by-span from the hub outward
    const feather = (deg, len, halfW, dy) => {
      const ca = Math.cos(deg * Math.PI / 180);
      const sa = Math.sin(deg * Math.PI / 180);
      for (let t = 0; t <= len; t += 0.5) {
        const cx = HX + ca * t;
        const cy = HY + sa * t + dy;
        const hw = (t >= len - 0.6) ? 0.45 : halfW * (1 - 0.62 * (t / len));
        const x0 = Math.round(cx - hw), x1 = Math.round(cx + hw);
        const lit = sa < 0;   // the upper trio catches the light
        for (let x = x0; x <= x1; x++) {
          px(x, Math.round(cy), x === x0 ? (lit ? wingHi : wingSh)
                          : (x === x1 && !lit ? wingSh : wing));
        }
      }
    };

    // ---- SIX WINGS — three per side, mirrored across the blade.
    //      nearest the steel: steep.  middle: the GREAT pinion (largest).
    //      outermost: shallow, sweeping back over the grip. ----
    feather(-82, 9, 1.5, -flap);    // upper steep
    feather(-124, 15, 2.2, -flap);  // upper GREAT middle
    feather(-163, 8.5, 1.4, -flap); // upper shallow
    feather(82, 9, 1.5, flap);      // lower steep
    feather(124, 15, 2.2, flap);    // lower GREAT middle
    feather(163, 8.5, 1.4, flap);   // lower shallow
    for (let y = 12; y <= 21; y++) { px(13, y, wing); px(14, y, wing); }   // planted root column

    // ---- pommel (x4..6) and grip (x7..11) ----
    px(4, 16, out); px(4, 17, out); px(4, 18, out);
    px(5, 15, out); px(6, 15, out); px(5, 19, out); px(6, 19, out);
    px(5, 16, gold); px(6, 16, goldHi); px(5, 17, goldHi); px(6, 17, gold);
    px(5, 18, goldSh); px(6, 18, gold);
    rect(7, 15, 5, 5, out);
    rect(8, 16, 3, 3, gold);
    px(8, 16, goldHi);
    px(9, 17, goldSh); px(10, 16, goldSh);

    // ---- guard hub (x12..14) — wings, star and steel all root here ----
    rect(12, 14, 3, 7, gold);
    px(12, 14, goldHi); px(14, 20, goldSh);

    // ---- THIN LONG blade (x15..51) ----
    for (let x = 15; x <= 48; x++) {
      px(x, 15, out);
      px(x, 16, bladeHi);
      px(x, 17, x === 15 ? gold : (shim && x % 9 === 4 ? gold : blade));
      px(x, 18, out);
    }
    for (let x = 27; x <= 47; x += 7) px(x, 17, gold);   // gilded ticks (clear of the star)
    px(49, 15, out); px(49, 16, bladeHi); px(49, 17, blade); px(49, 18, out);
    px(50, 15, out); px(50, 16, bladeHi); px(50, 17, out);
    px(51, 16, bladeHi);

    // ---- FOUR-POINTED STAR on the rain guard — a great gold star-boss
    //      pinned over the blade root.  Baked after the steel so the
    //      blade runs beneath it; long spikes reach up, down, ahead and
    //      behind, a small diamond body at the heart. ----
    for (let y = 10; y <= 24; y++) {
      for (let x = 11; x <= 25; x++) {
        const dx = Math.abs(x - 18), dy = Math.abs(y - 17);
        if (!((dx <= 1 && dy <= 7) || (dy <= 1 && dx <= 7) || (dx + dy <= 4))) continue;
        let c = gold;
        if (x < 18 && y < 17) c = goldHi;
        else if (x > 18 && y > 17) c = goldSh;
        else if (dx === 7 || dy === 7) c = (x > 18 || y > 17) ? goldSh : gold;
        px(x, y, c);
      }
    }

    // ---- one watchful eye at the star's heart — shuts on the peak ----
    if (blink) {
      px(17, 16, gold);   px(18, 16, gold);   px(19, 16, gold);
      px(17, 17, goldSh); px(18, 17, goldSh); px(19, 17, goldSh);
      px(17, 18, gold);   px(18, 18, gold);   px(19, 18, gold);
    } else {
      px(17, 16, eyeW); px(18, 16, iris);  px(19, 16, eyeW);
      px(17, 17, eyeW); px(18, 17, pupil); px(19, 17, eyeW);
      px(17, 18, eyeW); px(18, 18, eyeW);  px(19, 18, eyeW);
    }

    // ---- aura shimmer ----
    if (shim) { px(28, 12, goldHi); px(35, 12, bladeHi); px(43, 12, goldHi); }
    else      { px(31, 12, bladeHi); px(39, 12, goldHi); }
    px(29, 22, goldSh); px(36, 22, bladeHi);
  });

function zoneIndexAtPx(px) {
  const tx = Math.floor(px / TILE);
  if (tx < 60)  return 0;
  if (tx < 148) return 1;
  if (tx < 242) return 2;
  if (tx < 318) return 3;
  if (tx < 458) return 4;
  if (tx < 578) return 5;
  return 6;
}

function buildTileAtlas() {
  SPR.tiles = [];
  for (let z = 0; z < ZONES.length; z++) {
    const Z = ZONES[z];
    const variants = [];
    for (let v = 0; v < 4; v++) {
      const rng = mulberry32(1000 + z * 100 + v);
      const top = makeCanvas(TILE, TILE);
      {
        const g = top.getContext('2d');
        g.fillStyle = Z.rock;
        g.fillRect(0, 0, TILE, TILE);
        for (let i = 0; i < 26; i++) {
          g.fillStyle = rng() > 0.5 ? Z.rockHi : Z.rockLo;
          g.globalAlpha = 0.25 + rng() * 0.3;
          g.fillRect((rng() * TILE) | 0, (rng() * TILE) | 0, 2 + (rng() * 3 | 0), 1 + (rng() * 2 | 0));
        }
        g.globalAlpha = 1;
        g.fillStyle = Z.rockHi;
        g.fillRect(0, 0, TILE, 4);
        g.fillStyle = Z.moss;
        for (let i = 0; i < TILE; i += 3) {
          const hh = 2 + ((rng() * 4) | 0);
          g.globalAlpha = 0.5 + rng() * 0.5;
          g.fillRect(i, 0, 3, hh);
        }
        g.globalAlpha = 1;
        g.fillStyle = 'rgba(255,255,255,0.09)';
        g.fillRect(0, 0, TILE, 1.5);
      }
      const innr = makeCanvas(TILE, TILE);
      {
        const g = innr.getContext('2d');
        g.fillStyle = Z.rockLo;
        g.fillRect(0, 0, TILE, TILE);
        for (let i = 0; i < 30; i++) {
          g.fillStyle = rng() > 0.5 ? Z.rock : Z.rockHi;
          g.globalAlpha = 0.12 + rng() * 0.2;
          g.fillRect((rng() * TILE) | 0, (rng() * TILE) | 0, 2 + (rng() * 4 | 0), 2);
        }
        g.globalAlpha = 1;
      }
      const bott = makeCanvas(TILE, TILE);
      {
        const g = bott.getContext('2d');
        g.drawImage(innr, 0, 0);
        g.fillStyle = 'rgba(0,0,0,0.4)';
        g.fillRect(0, TILE - 3, TILE, 3);
      }
      variants.push({ top, innr, bott });
    }
    SPR.tiles.push(variants);
  }
  SPR.plank = mkFrames(1, TILE, 12, (g) => {
    g.fillStyle = '#2c2620';
    g.fillRect(0, 2, TILE, 7);
    g.fillStyle = '#4a4032';
    g.fillRect(0, 2, TILE, 2);
    g.fillStyle = 'rgba(0,0,0,0.5)';
    g.fillRect(0, 8, TILE, 1);
    g.strokeStyle = '#1a1612';
    g.lineWidth = 1;
    g.strokeRect(0.5, 2.5, TILE - 1, 6);
    g.fillStyle = '#3a3226';
    g.fillRect(3, 3, 2, 6);
    g.fillRect(TILE - 6, 3, 2, 6);
  }).f[0];
  SPR.spike = mkFrames(1, TILE, TILE, (g) => {
    const rng = mulberry32(777);
    for (let i = 0; i < 4; i++) {
      const bx = 3 + i * 7 + rng() * 3;
      const h = 14 + rng() * 12;
      g.fillStyle = '#c9c4b2';
      g.beginPath();
      g.moveTo(bx - 3.5, TILE);
      g.quadraticCurveTo(bx - 2, TILE - h * 0.6, bx, TILE - h);
      g.quadraticCurveTo(bx + 2, TILE - h * 0.6, bx + 3.5, TILE);
      g.closePath();
      g.fill();
      g.fillStyle = '#8f8a78';
      g.beginPath();
      g.moveTo(bx + 0.5, TILE - h + 2);
      g.quadraticCurveTo(bx + 2, TILE - h * 0.5, bx + 3.5, TILE);
      g.lineTo(bx + 0.5, TILE);
      g.closePath();
      g.fill();
    }
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.fillRect(0, TILE - 3, TILE, 3);
  }).f[0];
}

function buildBackgrounds() {
  SPR.bg = [];
  for (let z = 0; z < ZONES.length; z++) {
    const Z = ZONES[z];
    const layers = [];
    const rng = mulberry32(500 + z * 31);
    for (let L = 0; L < 3; L++) {
      const c = makeCanvas(1024, 560);
      const g = c.getContext('2d');
      const depth = 0.25 + L * 0.22;
      const alpha = 0.5 + L * 0.22;
      g.fillStyle = Z.rockLo;
      g.globalAlpha = alpha * 0.55;
      if (z === 0) {
        for (let i = 0; i < 9; i++) {
          const x = rng() * 1024, w = 26 + rng() * 44;
          const h = 160 + rng() * 300;
          g.fillRect(x, 560 - h, w, h);
          g.fillRect(x - 8, 560 - h, w + 16, 12);
          if (rng() > 0.5) g.fillRect(x - 8, 560 - h + 40 + rng() * 60, w + 16, 8);
        }
      } else if (z === 1) {
        for (let i = 0; i < 8; i++) {
          const x = rng() * 1024, h = 140 + rng() * 260, capW = 50 + rng() * 90;
          g.fillRect(x - 7, 560 - h, 14, h);
          g.beginPath();
          g.ellipse(x, 560 - h, capW / 2, 22 + rng() * 16, 0, Math.PI, 0);
          g.fill();
        }
        for (let i = 0; i < 14; i++) {
          const x = rng() * 1024, len = 40 + rng() * 160;
          g.save();
          g.strokeStyle = Z.rockLo;
          g.globalAlpha = alpha * 0.8;
          g.lineWidth = 2 + rng() * 3;
          g.beginPath();
          g.moveTo(x, 0);
          g.quadraticCurveTo(x + (rng() - 0.5) * 40, len / 2, x + (rng() - 0.5) * 20, len);
          g.stroke();
          g.restore();
        }
      } else if (z === 2) {
        for (let i = 0; i < 7; i++) {
          const x = rng() * 1024, w = 34 + rng() * 30, h = 240 + rng() * 300;
          g.fillRect(x, 560 - h, w, h);
          g.fillRect(x - 10, 560 - h, w + 20, 14);
          g.fillRect(x - 10, 560 - h + h * 0.4, w + 20, 10);
          g.beginPath();
          g.moveTo(x - 14, 560 - h - 14);
          g.quadraticCurveTo(x + w / 2, 560 - h - 60 - rng() * 40, x + w + 14, 560 - h - 14);
          g.lineTo(x + w + 14, 560 - h);
          g.lineTo(x - 14, 560 - h);
          g.closePath();
          g.fill();
        }
      } else if (z === 3) {
        // THE PALE COURT — pale pointed obelisks
        for (let i = 0; i < 12; i++) {
          const x = rng() * 1024, w = 18 + rng() * 20, h = 200 + rng() * 320;
          g.fillRect(x, 560 - h, w, h);
          g.beginPath();
          g.moveTo(x - 4, 560 - h);
          g.lineTo(x + w / 2, 560 - h - 26 - rng() * 30);
          g.lineTo(x + w + 4, 560 - h);
          g.closePath();
          g.fill();
        }
      } else if (z === 4) {
        // THE EMBER KILN — furnace towers with glowing hearth-windows, pipes
        for (let i = 0; i < 8; i++) {
          const x = rng() * 1024, w = 40 + rng() * 50, h = 220 + rng() * 300;
          g.fillRect(x, 560 - h, w, h);
          // flared chimney cap
          g.fillRect(x - 6, 560 - h, w + 12, 14);
          g.fillRect(x + w * 0.25, 560 - h - 30, w * 0.5, 30);
          // glowing hearth windows (brighter on nearer layers)
          g.save();
          g.fillStyle = Z.glow;
          g.globalAlpha = alpha * (0.25 + L * 0.2);
          g.fillRect(x + w * 0.2, 560 - h * 0.55, w * 0.25, 16);
          g.fillRect(x + w * 0.6, 560 - h * 0.35, w * 0.2, 12);
          g.restore();
          // connecting pipe band
          g.fillRect(x - 30, 560 - h * 0.7, w + 60, 7);
        }
      } else if (z === 5) {
        // THE HOLLOW SANCTUM — crystal spires + hanging chains
        for (let i = 0; i < 10; i++) {
          const x = rng() * 1024, w = 16 + rng() * 26, h = 180 + rng() * 320;
          g.beginPath();
          g.moveTo(x, 560);
          g.lineTo(x + w / 2, 560 - h);
          g.lineTo(x + w, 560);
          g.closePath();
          g.fill();
          // crystal facet glint
          g.save();
          g.fillStyle = Z.glow;
          g.globalAlpha = alpha * 0.16;
          g.beginPath();
          g.moveTo(x + w / 2, 560 - h);
          g.lineTo(x + w * 0.35, 560);
          g.lineTo(x + w * 0.55, 560);
          g.closePath();
          g.fill();
          g.restore();
        }
        for (let i = 0; i < 7; i++) {
          const x = rng() * 1024, len = 90 + rng() * 200;
          g.save();
          g.strokeStyle = Z.rockLo;
          g.globalAlpha = alpha * 0.85;
          g.lineWidth = 3;
          g.beginPath(); g.moveTo(x, 0); g.lineTo(x, len); g.stroke();
          g.lineWidth = 5;
          for (let s = 10; s < len; s += 22) { g.beginPath(); g.moveTo(x - 3, s); g.lineTo(x + 3, s); g.stroke(); }
          g.restore();
        }
      } else {
        // THE DREAMING THRONE — vast gothic arches + floating shards
        for (let i = 0; i < 5; i++) {
          const x = 60 + i * 210 + rng() * 30, w = 90 + rng() * 40, h = 320 + rng() * 180;
          g.fillRect(x, 560 - h, 14, h);
          g.fillRect(x + w - 14, 560 - h, 14, h);
          g.beginPath();
          g.moveTo(x, 560 - h);
          g.quadraticCurveTo(x + w / 2, 560 - h - 70 - rng() * 40, x + w, 560 - h);
          g.fill();
        }
        // distant throne silhouette
        g.fillRect(470, 180, 84, 380);
        g.beginPath();
        g.moveTo(460, 180); g.lineTo(512, 120); g.lineTo(564, 180);
        g.closePath(); g.fill();
        // floating diamond shards
        for (let i = 0; i < 9; i++) {
          const x = rng() * 1024, y = 120 + rng() * 260, s = 6 + rng() * 12;
          g.beginPath();
          g.moveTo(x, y - s); g.lineTo(x + s * 0.7, y); g.lineTo(x, y + s); g.lineTo(x - s * 0.7, y);
          g.closePath();
          g.fill();
        }
      }
      layers.push({ c: pixelateCanvas(c, 4, 0.12, true), depth });   // v1.4: pixelated trees/rocks (alpha preserved)
    }
    SPR.bg.push(layers);
  }
}
