  /* -- ILLUMINA (v1.4 redesign — pixel art after the classic winged light
        blade): vertical relic sprite shown above the open chest, in the
        inventory slot and on the title relic shelf.  Icy blue blade, wing
        crossguard sweeping up-and-out, long wrapped grip, round pommel and
        a pink soul-glint burning in the middle of the blade.
        Baked on a 28×30 virtual grid, 2× nearest-neighbour → 56×60.  ------ */
  SPR.relicIllumina = mkPixelFrames(1, 28, 30, 2, (px, rect) => {
    const out  = '#3f5a78',   // deep ice outline
          shade= '#7aa8cc',   // blade shadow edge
          mid  = '#b8dcf0',   // blade body
          hi   = '#eaf6ff',   // blade edge glint
          core = '#ffffff',   // white-hot core
          wing = '#a8cce8', wingHi = '#dceefc', wingOut = '#5a82a8',
          grip = '#5a6a88', gripDk = '#3e4c66', gripHi = '#8296b4',
          pom  = '#b8d4ec', pomLo = '#8fb0d0',
          pink = '#f2c4f0', pinkDk = '#d892dc';
    const cx = 14;
    // ---- blade (tip at top, y=1 → y=18) ----
    px(cx, 1, core);
    px(cx - 1, 2, shade); px(cx, 2, core); px(cx + 1, 2, hi);
    for (let y = 3; y <= 18; y++) {
      px(cx - 2, y, out);      // left outline
      px(cx - 1, y, mid);      // body
      px(cx,     y, core);     // white core
      px(cx + 1, y, mid);      // body
      px(cx + 2, y, hi);       // bright right edge
    }
    // pink soul-glint burning at the centre of the blade
    px(cx, 10, pink); px(cx + 1, 11, pinkDk); px(cx - 1, 11, pink);
    px(cx, 12, pinkDk); px(cx + 1, 10, pink);
    // ---- wing crossguard (sweeps up-and-out like the classic Illumina) ----
    // centre hub
    rect(cx - 2, 19, 5, 3, wingHi);
    px(cx - 2, 19, core); px(cx + 2, 19, core);
    px(cx - 2, 21, wingOut); px(cx + 2, 21, wingOut);
    // left wing — rises and tapers to a point
    px(11, 20, wingHi); px(10, 20, wing); px(9, 20, wing);
    px(8, 19, wingHi); px(7, 19, wing); px(6, 18, wing);
    px(5, 18, wingHi); px(4, 17, wing); px(3, 17, wing);
    px(2, 16, wingHi); px(1, 16, wing);              // wing tip
    px(3, 18, wingOut); px(6, 19, wingOut);          // under-shadow
    px(10, 21, wing); px(9, 22, wing); px(8, 22, wingOut);  // small lower feather
    // right wing — mirror
    px(17, 20, wingHi); px(18, 20, wing); px(19, 20, wing);
    px(20, 19, wingHi); px(21, 19, wing); px(22, 18, wing);
    px(23, 18, wingHi); px(24, 17, wing); px(25, 17, wing);
    px(26, 16, wingHi); px(27, 16, wing);            // wing tip
    px(24, 18, wingOut); px(21, 19, wingOut);
    px(18, 21, wing); px(19, 22, wing); px(20, 22, wingOut);
    // ---- grip (long, wrapped) ----
    rect(cx - 1, 22, 3, 5, grip);
    px(cx - 1, 23, gripDk); px(cx + 1, 23, gripDk);
    px(cx - 1, 25, gripDk); px(cx + 1, 25, gripDk);
    px(cx - 1, 22, gripHi);
    // ---- pommel (round knob) ----
    rect(cx - 1, 27, 3, 1, pom);
    px(cx - 2, 27, pomLo); px(cx + 2, 27, pomLo);
    px(cx, 28, pomLo); px(cx - 1, 28, pom); px(cx + 1, 28, pom);
    px(cx, 27, hi);
  }).f[0];

  /* -- ILLUMINA in-hand sprite (v1.4) — horizontal pixel blade, tip right.
        Baked on a 32×14 virtual grid, 2× → 64×28.  Pivot (grip) sits at
        grid (4,7) = real (8,14); drawNail draws it at (-8,-14).  --------- */
  SPR.illuminaHand = mkPixelFrames(1, 32, 14, 2, (px, rect) => {
    const shade= '#7aa8cc', mid = '#b8dcf0', hi = '#eaf6ff', core = '#ffffff',
          wing = '#a8cce8', wingHi = '#dceefc', wingOut = '#5a82a8',
          grip = '#5a6a88', gripDk = '#3e4c66', gripHi = '#8296b4',
          pom  = '#b8d4ec', pomLo = '#8fb0d0',
          pink = '#f2c4f0', pinkDk = '#d892dc';
    // pommel (left end)
    rect(1, 6, 2, 3, pom);
    px(1, 6, hi); px(2, 8, pomLo);
    // grip
    rect(3, 6, 5, 3, grip);
    px(4, 6, gripDk); px(6, 6, gripDk); px(4, 8, gripDk); px(6, 8, gripDk);
    px(3, 6, gripHi);
    // wing guard — sweeps up-and-back like the relic
    rect(8, 5, 2, 5, wingHi);                    // guard hub
    px(8, 4, wing); px(9, 3, wing); px(10, 2, wingHi); px(11, 1, wing);   // upper wing
    px(10, 3, wingHi); px(11, 2, wingHi);
    px(9, 4, wingOut); px(10, 3, wingOut);
    px(8, 10, wing); px(9, 11, wingOut);         // small lower feather
    px(9, 10, wingHi);
    // blade — 3px tall, white core, icy edges, tapering tip
    for (let x = 10; x <= 26; x++) {
      px(x, 6, x % 7 === 0 ? mid : hi);          // faint band play on the edge
      px(x, 7, core);
      px(x, 8, x > 24 ? hi : mid);
    }
    px(27, 6, hi); px(27, 7, core); px(27, 8, hi);
    px(28, 7, core); px(29, 7, core);            // needle tip
    px(29, 6, hi);
    for (let x = 11; x <= 25; x++) px(x, 9, shade);   // under-shadow line
    // pink soul-glint mid-blade
    px(18, 6, pink); px(19, 7, pinkDk); px(18, 8, pink); px(20, 7, pink);
    // tip glint
    px(29, 7, core); px(28, 6, hi);
  }).f[0];

  SPR.door = mkFrames(1, 90, 130, (g) => {
    g.save();
    g.translate(45, 128);
    g.fillStyle = 'rgba(235,230,210,0.14)';
    g.beginPath();
    g.moveTo(-26, 0);
    g.lineTo(-26, -84);
    g.quadraticCurveTo(-26, -118, 0, -118);
    g.quadraticCurveTo(26, -118, 26, -84);
    g.lineTo(26, 0);
    g.closePath();
    g.fill();
    g.fillStyle = 'rgba(235,230,210,0.28)';
    g.beginPath();
    g.moveTo(-16, 0);
    g.lineTo(-16, -80);
    g.quadraticCurveTo(-16, -106, 0, -106);
    g.quadraticCurveTo(16, -106, 16, -80);
    g.lineTo(16, 0);
    g.closePath();
    g.fill();
    g.strokeStyle = 'rgba(235,230,210,0.5)';
    g.lineWidth = 2;
    g.stroke();
    g.restore();
  }).f[0];
}

// Cached prop canvases — generated once per (kind,size,zone).
const propCache = {};
function getVine(len, z) {
  const k = 'v' + z + '_' + len;
  return propCache[k] || (propCache[k] = SPR.vine(len, z));
}
function getMush(sc, z) {
  const k = 'm' + z + '_' + sc;
  return propCache[k] || (propCache[k] = SPR.mushroom(sc, z));
}

/* --------------------------------------------------------------------------
   PIXEL NAIL SLASH — procedurally generated pixel-art slash frames.
   Each direction is a 7-frame sweep baked at low resolution (56×56 virtual
   pixels) and upscaled 3× with nearest-neighbour at draw time, so every
   pixel stays a hard square. Palette, dithering, sparks and flecks are all
   chosen per-pixel from the pixel's angle/radius relative to the sweeping
   crescent.
   -------------------------------------------------------------------------- */

const SL_GRID = 56;      // virtual pixel grid (square)
const SL_PIX  = 3;       // real pixels per virtual pixel
const SL_N    = 7;       // frames per swing

/* v1.6: palettes for every wielder — the slash generator reads these so the
   same sweeping crescent can burn gold for the Seraph, pale bone for the
   Warden, holy white-gold for SERAPH'S OATH, or icy yellow for Illumina. */
const PAL_STEEL  = { core:'#ffffff', hot:'#ffffff', mid:'#eae6d8', low:'#a9b6bd', dimm:'#5b6a74', echo:'#5b6a74', outer:'#a9b6bd', spark:'#eae6d8', fleck:'#a9b6bd' };
const PAL_ILLUM  = { core:'#ffffff', hot:'#ffffff', mid:'#fff4c0', low:'#ffe070', dimm:'#c9a030', echo:'#ffe070', outer:'#fff4c0', spark:'#fff4c0', fleck:'#c9a030' };
const PAL_WARDEN = { core:'#ffffff', hot:'#f4eedd', mid:'#d8d2be', low:'#b8b09a', dimm:'#8a8470', echo:'#b8b09a', outer:'#d8d2be', spark:'#f4eedd', fleck:'#b8b09a' };
const PAL_SERAPH = { core:'#ffffff', hot:'#fff4c0', mid:'#ffd870', low:'#ff9a3c', dimm:'#e06a20', echo:'#ff9a3c', outer:'#ffd870', spark:'#fff4c0', fleck:'#ff9a3c' };
const PAL_OATH   = { core:'#ffffff', hot:'#fffbe0', mid:'#fff0b0', low:'#ffd870', dimm:'#d8a840', echo:'#ffd870', outer:'#fff0b0', spark:'#fffbe0', fleck:'#e8c060' };

const SLASH_DEFS = [
  // a0→a1: sweep of the crescent's centre (canvas radians, 0 = +x, cw+)
  { key: 'side', seed: 11, a0: -0.95, a1:  0.95, span: 2.0, r0: 13, rGrow: 5, cy: 28, pal: PAL_STEEL },
  { key: 'up',   seed: 23, a0: -2.00, a1: -0.85, span: 2.0, r0: 13, rGrow: 5, cy: 30, pal: PAL_STEEL },
  { key: 'down', seed: 37, a0:  0.85, a1:  2.10, span: 2.0, r0: 13, rGrow: 5, cy: 26, pal: PAL_STEEL },
  // Illumina variants — white/yellow palette, slightly wider radius
  { key: 'illumSide', seed: 51, a0: -1.10, a1:  1.10, span: 2.2, r0: 15, rGrow: 6, cy: 28, pal: PAL_ILLUM },
  { key: 'illumUp',   seed: 63, a0: -2.10, a1: -0.80, span: 2.2, r0: 15, rGrow: 6, cy: 30, pal: PAL_ILLUM },
  { key: 'illumDown', seed: 77, a0:  0.80, a1:  2.20, span: 2.2, r0: 15, rGrow: 6, cy: 26, pal: PAL_ILLUM },
  // v1.6 — THE PALE WARDEN: pale bone-and-gold arcs for his blade
  { key: 'wardenSide', seed: 91,  a0: -1.05, a1:  1.05, span: 2.3, r0: 16, rGrow: 7, cy: 28, pal: PAL_WARDEN },
  { key: 'wardenUp',   seed: 92,  a0: -2.05, a1: -0.90, span: 2.3, r0: 16, rGrow: 7, cy: 30, pal: PAL_WARDEN },
  // v1.6 — THE ASHEN SERAPH: burning gold arcs for the twin blades
  { key: 'seraphSide', seed: 113, a0: -1.05, a1:  1.05, span: 2.4, r0: 16, rGrow: 7, cy: 28, pal: PAL_SERAPH },
  { key: 'seraphUp',   seed: 114, a0: -2.05, a1: -0.90, span: 2.4, r0: 16, rGrow: 7, cy: 30, pal: PAL_SERAPH },
  // v1.6 — SERAPH'S OATH (player): holy white-gold
  { key: 'oathSide', seed: 131, a0: -1.10, a1:  1.10, span: 2.2, r0: 15, rGrow: 6, cy: 28, pal: PAL_OATH },
  { key: 'oathUp',   seed: 143, a0: -2.10, a1: -0.80, span: 2.2, r0: 15, rGrow: 6, cy: 30, pal: PAL_OATH },
  { key: 'oathDown', seed: 157, a0:  0.80, a1:  2.20, span: 2.2, r0: 15, rGrow: 6, cy: 26, pal: PAL_OATH },
];

function buildSlashSprites() {
  SPR.slash = {};
  for (const def of SLASH_DEFS) {
    const frames = [];
    for (let f = 0; f < SL_N; f++) frames.push(genSlashFrame(def, f));
    SPR.slash[def.key] = frames;
  }
}

function genSlashFrame(def, f) {
  const G = SL_GRID, PIXS = SL_PIX;
  const P = def.pal || PAL_STEEL;               // v1.6: wielder palette
  const canvas = makeCanvas(G * PIXS, G * PIXS);
  const g = canvas.getContext('2d');
  const rng = mulberry32(4000 + def.seed * 97 + f * 13);
  const p = f / (SL_N - 1);
  const e = 1 - (1 - p) * (1 - p);            // easeOutQuad — snaps out, then drifts
  const cAng = lerp(def.a0, def.a1, e);
  const span = def.span * (1 - 0.22 * p);     // arc shortens as it dissipates
  const hi = cAng + span / 2;                 // leading edge (direction of travel)
  const lo = cAng - span / 2;                 // trailing edge (dissolves)
  const r = def.r0 + def.rGrow * e;           // radius grows through the swing
  const ccx = G / 2, ccy = def.cy;

  const px = (x, y, col) => {
    x = Math.floor(x); y = Math.floor(y);
    if (x < 0 || y < 0 || x >= G || y >= G) return;
    g.fillStyle = col;
    g.fillRect(x * PIXS, y * PIXS, PIXS, PIXS);
  };

  for (let y = 0; y < G; y++) {
    for (let x = 0; x < G; x++) {
      const dx = x + 0.5 - ccx, dy = y + 0.5 - ccy;
      const d = Math.sqrt(dx * dx + dy * dy);
      const ang = Math.atan2(dy, dx);
      if (ang < lo - 0.04 || ang > hi + 0.04) continue;
      const t = (ang - lo) / span;              // 0 = trailing tip, 1 = leading edge
      // deterministic per-pixel hash → stable dithering per frame
      const hsh = Math.abs(Math.sin(x * 127.1 + y * 311.7 + f * 74.7) * 43758.5453) % 1;

      // ---- primary crescent band ----
      let th = 3.6 * Math.pow(Math.sin(clamp(t, 0, 1) * Math.PI), 0.6);
      th *= 0.55 + 0.65 * t;                    // swells toward the leading edge
      if (t < 0.1) th *= 0.5;                   // needle-thin trailing tip
      const dr = d - r;
      const edge = 1 - Math.abs(dr) / th;
      if (edge > 0) {
        let b = (0.22 + 0.78 * Math.pow(t, 1.25)) * (0.3 + 0.7 * edge);
        b *= 0.85 + hsh * 0.3;                  // granular texture
        if (b > 0.16 + hsh * 0.34) {            // dithered dissolve along the trail
          const core = Math.abs(dr) < 1.2 && t > 0.55;
          // v1.6: colour comes from the wielder's palette
          const col = core ? P.core
            : b > 0.86 ? P.hot
            : b > 0.60 ? P.mid
            : b > 0.38 ? P.low
            : P.dimm;
          px(x, y, col);
        }
      }
      // ---- inner echo (motion ghost) ----
      const edge2 = 1 - Math.abs(d - (r - 5.5)) / 1.5;
      if (edge2 > 0 && t > 0.3 && t < 0.98 && hsh > 0.35)
        px(x, y, P.echo);
      // ---- outer shimmer hint ----
      const edge3 = 1 - Math.abs(d - (r + 4.5)) / 1.2;
      if (edge3 > 0 && t > 0.72 && hsh > 0.5)
        px(x, y, P.outer);
    }
  }

  // ---- spark ticks stabbing off the leading edge ----
  for (let k = 0; k < 3; k++) {
    const ta = hi - 0.14 - k * 0.3;
    const len = 3 - k;
    for (let s = 0; s < len; s++) {
      const dd = r + 1 + s;
      px(ccx + Math.cos(ta) * dd, ccy + Math.sin(ta) * dd,
         s === 0 ? P.core : P.spark);
    }
  }
  // ---- stray sparks hugging the arc ----
  const nSpark = 5 + ((rng() * 3) | 0);
  for (let i = 0; i < nSpark; i++) {
    const ta = hi - rng() * span * 0.55;
    const dd = r + 2.5 + rng() * 4;
    px(ccx + Math.cos(ta) * dd, ccy + Math.sin(ta) * dd,
       rng() > 0.5 ? P.core : P.outer);
  }
  // ---- dissolving flecks on the follow-through ----
  if (p > 0.45) {
    const nFleck = 6 + ((rng() * 5) | 0);
    for (let i = 0; i < nFleck; i++) {
      const ta = lo + rng() * span;
      const dd = r + 4 + rng() * 6 * p;
      const col = rng() > 0.6 ? P.fleck : P.dimm;
      px(ccx + Math.cos(ta) * dd, ccy + Math.sin(ta) * dd, col);
      if (rng() > 0.7) px(ccx + Math.cos(ta) * dd + 1, ccy + Math.sin(ta) * dd, col);
    }
  }

  return canvas;
}

// v1.6: draw a named slash frame set — used by the player AND by the bosses
// (warden/seraph blade arcs).  Glow pass (scaled, smoothed, additive) then
// the crisp nearest-neighbour pass so the pixels stay razor sharp.
function drawSlashSet(setKey, cx, cy, dir, prog, flip, scale = 1, alpha = 1) {
  const set = SPR.slash[setKey];
  if (!set) return;
  const idx = clamp(Math.floor(prog * SL_N), 0, SL_N - 1);
  const img = set[idx];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(Math.round(cx), Math.round(cy));
  if (flip) ctx.scale(-1, 1);
  if (scale !== 1) ctx.scale(scale, scale);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha * 0.5;
  ctx.imageSmoothingEnabled = true;
  const s = img.width * 1.08;
  ctx.drawImage(img, -s / 2, -s / 2, s, s);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
}

// Draw: pick the directional frame set for the player's weapon, advance by
// swing progress.
function drawSlash(cx, cy, dir, prog, flip) {
  const w = player.weapon;
  let key;
  if (w === 'seraph')       key = dir === 1 ? 'oathUp'   : dir === 2 ? 'oathDown'   : 'oathSide';
  else if (w === 'illumina') key = dir === 1 ? 'illumUp' : dir === 2 ? 'illumDown'  : 'illumSide';
  else                       key = dir === 1 ? 'up'      : dir === 2 ? 'down'       : 'side';
  drawSlashSet(key, cx, cy, dir, prog, flip);
}

/* ==========================================================================
   SECTION 4 — WORLD DATA & BUILDER
   Convention: benchAt/tabletAt/totemAt/pickup take the tile row the prop
   STANDS ON (the solid/plank row). spawnE takes the solid row too.
   ========================================================================== */

const grid = new Uint8Array(GW * GH);
const decor = [];
const enemySpawns = [];
const pickupsDef = [];
const benchDefs = [];
const tabletDefs = [];
const totemDefs = [];

function T(x, y) { return y * GW + x; }
function tileGet(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= GW || ty >= GH) return 1;
  return grid[T(tx, ty)];
}
function tileSet(tx, ty, v) {
  if (tx < 0 || ty < 0 || tx >= GW || ty >= GH) return;
  grid[T(tx, ty)] = v;
}
function fillRectT(x, y, w, h, v) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      tileSet(i, j, v);
}
const carve   = (x, y, w, h) => fillRectT(x, y, w, h, 0);
const solid   = (x, y, w, h) => fillRectT(x, y, w, h, 1);
const spikesT = (x, y, w)    => fillRectT(x, y, w, 1, 2);
const oneway  = (x, y, w)    => fillRectT(x, y, w, 1, 3);

function addDecor(type, tx, ty, extra) {
  decor.push(Object.assign({ type, x: tx * TILE, y: ty * TILE }, extra || {}));
}
function spawnE(type, tx, ty) { enemySpawns.push({ type, x: tx * TILE, y: ty * TILE }); }
function pickup(type, tx, ty, extra) { pickupsDef.push(Object.assign({ type, x: tx * TILE, y: ty * TILE }, extra || {})); }
function benchAt(tx, ty, id)  { benchDefs.push({ id, x: tx * TILE, y: ty * TILE }); }
function tabletAt(tx, ty, text) { tabletDefs.push({ x: tx * TILE, y: ty * TILE, text }); }
function totemAt(tx, ty)      { totemDefs.push({ x: tx * TILE, y: ty * TILE }); }

/* -- v1.5 zone mechanics: timed hazards -------------------------------------
   Geyser  — a floor vent that telegraphs, then erupts a column of fire.
   Curtain — a full-height sanctum seal that phases on/off; pass while dark.
   Both are driven purely by game.frame, so they need no per-instance state.
   -------------------------------------------------------------------------- */
const hazardDefs = { geysers: [], curtains: [] };
function geyserAt(tx, ty, period, off) {
  hazardDefs.geysers.push({ tx, ty, period, off: off || 0 });
}
function curtainAt(tx, ty0, ty1, period, off) {
  hazardDefs.curtains.push({ tx, ty0, ty1, period, off: off || 0 });
}
function geyserState(g) {
  const c = (game.frame + g.off) % g.period;
  if (c < 26)          return { on: false, tele: true,  c };
  if (c < 26 + 64)     return { on: true,  tele: false, c };
  return { on: false, tele: false, c };
}
function curtainOn(cu) {
  return ((game.frame + cu.off) % cu.period) < 55;
}
function curtainTele(cu) {
  const c = (game.frame + cu.off) % cu.period;
  return c >= cu.period - 26;
}

/* ==========================================================================
   SECTION 5 — PHYSICS HELPERS
   ========================================================================== */

function isSolidTile(tx, ty) { return tileGet(tx, ty) === 1; }

/* -- v1.7: cheap tile raycast — true when nothing solid blocks the sight
   line between two world points.  Used to keep monsters from sensing,
   shooting or blinking at the knight through walls and floors. ---------- */
function losClear(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const d  = Math.sqrt(dx * dx + dy * dy) || 1;
  const n  = Math.min(40, Math.max(1, Math.ceil(d / 14)));
  for (let i = 1; i < n; i++) {
    const t = i / n;
    if (isSolidTile(Math.floor((x0 + dx * t) / TILE), Math.floor((y0 + dy * t) / TILE))) return false;
  }
  return true;
}

function moveX(e, dx) {
  e.hitWall = 0;
  let nx = e.x + dx;
  const ys = [];
  const n = Math.max(2, Math.ceil(e.h / TILE) + 1);
  for (let i = 0; i <= n; i++) ys.push(e.y + 1 + (e.h - 2) * (i / n));
  if (dx > 0) {
    const edge = nx + e.w;
    const tx = Math.floor(edge / TILE);
    for (const py of ys) {
      if (isSolidTile(tx, Math.floor(py / TILE))) {
        nx = tx * TILE - e.w - 0.01;
        e.hitWall = 1;
        break;
      }
    }
  } else if (dx < 0) {
    const tx = Math.floor(nx / TILE);
    for (const py of ys) {
      if (isSolidTile(tx, Math.floor(py / TILE))) {
        nx = (tx + 1) * TILE + 0.01;
        e.hitWall = 1;
        break;
      }
    }
  }
  e.x = nx;
}

function moveY(e, dy) {
  e.hitFloor = 0; e.hitCeil = 0;
  const prevBottom = e.y + e.h;
  let ny = e.y + dy;
  const xs = [];
  const n = Math.max(2, Math.ceil(e.w / TILE) + 1);
  for (let i = 0; i <= n; i++) xs.push(e.x + 1 + (e.w - 2) * (i / n));
  if (dy > 0) {
    const bottom = ny + e.h;
    const ty = Math.floor(bottom / TILE);
    for (const px of xs) {
      const tx = Math.floor(px / TILE);
      const t = tileGet(tx, ty);
      if (t === 1) {
        ny = ty * TILE - e.h - 0.01;
        e.hitFloor = 1;
        break;
      } else if (t === 3 && !e.dropThru && prevBottom <= ty * TILE + 6) {
        ny = ty * TILE - e.h - 0.01;
        e.hitFloor = 2;
        break;
      }
    }
  } else if (dy < 0) {
    const ty = Math.floor(ny / TILE);
    for (const px of xs) {
      if (isSolidTile(Math.floor(px / TILE), ty)) {
        ny = (ty + 1) * TILE + 0.01;
        e.hitCeil = 1;
        break;
      }
    }
  }
  e.y = ny;
}

function touchingSpike(e) {
  const pts = [
    [e.x + 3, e.y + e.h - 2], [e.x + e.w - 3, e.y + e.h - 2],
    [e.x + e.w / 2, e.y + e.h / 2], [e.x + e.w / 2, e.y + 3],
    [e.x + 3, e.y + 3], [e.x + e.w - 3, e.y + 3],
  ];
  for (const [px, py] of pts) {
    if (tileGet(Math.floor(px / TILE), Math.floor(py / TILE)) === 2) return true;
  }
  return false;
}

function probeGroundAhead(e, dir) {
  const px = dir > 0 ? e.x + e.w + 4 : e.x - 4;
  const py = e.y + e.h + 6;
  const t = tileGet(Math.floor(px / TILE), Math.floor(py / TILE));
  return t === 1 || t === 3;
}

      rot: rndr(0, 6.28), vr: rndr(-0.2, 0.2),
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t++;
    if (p.seek === 'player') {
      const dx = (player.x + player.w / 2) - p.x;
      const dy = (player.y + player.h / 2) - p.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      p.vx += (dx / d) * 0.35;
      p.vy += (dy / d) * 0.35;
    }
    p.vy += p.grav;
    p.vx *= p.drag; p.vy *= p.drag;
    p.x += p.vx; p.y += p.vy;
    if (p.type === 'shard') p.rot += p.vr;
    if (p.t >= p.life) particles.splice(i, 1);
  }
}

function renderParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    if (p.type === 'px') {
      // v1.4: hard pixel-square particle with stepped retro fade
      ctx.globalAlpha = Math.max(0.25, Math.ceil(a * 3) / 3);
      const s = Math.max(1, Math.round(p.size));
      ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    } else if (p.type === 'shard') {
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.moveTo(0, -p.size);
      ctx.lineTo(p.size * 0.6, p.size);
      ctx.lineTo(-p.size * 0.6, p.size * 0.6);
      ctx.closePath();
      ctx.fill();
    } else if (p.type === 'ring') {
      ctx.strokeStyle = p.col;
      ctx.lineWidth = 2 * a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size + p.t * 1.6, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* -- player update --------------------------------------------------------- */

function updatePlayer() {
  const p = player;
  p.anim += 1;

  if (p.dead) {
    p.deadT++;
    if (p.deadT === 100) {
      game.state = 'dead';
      game.deadT = 0;
    }
    return;
  }

  if (p.sit) {
    p.state = 'sit';
    if (Input.hit('jump') || Input.hit('left') || Input.hit('right') || Input.hit('dash')) {
      p.sit = false;
      p.sitBench = null;
      p.vy = -1;
    }
    return;
  }

  if (game.reading) return;

  if (p.hazardFade > 0) {
    p.hazardFade--;
    if (p.hazardFade === 0) {
      p.x = p.lastSafeX; p.y = p.lastSafeY;
      p.vx = 0; p.vy = 0;
      p.invT = 60;
      p.hazardFade = -1;
    }
    return;
  }
  if (p.hazardFade === -1) { game.fadeDir = -1; p.hazardFade = 0; }

  const left  = Input.down('left');
  const right = Input.down('right');
  const up    = Input.down('up');
  const down  = Input.down('down');
  const jumpP = Input.hit('jump');
  const atkP  = Input.hit('attack');
  const dashP = Input.hit('dash');
  const focusHeld = Input.down('focus');

  if (p.invT > 0) p.invT--;
  if (p.hurtT > 0) p.hurtT--;
  if (p.attackCD > 0) p.attackCD--;
  if (p.dashCD > 0) p.dashCD--;
  if (p.skillBCD > 0) p.skillBCD--;      // v1.6: Oath Dash cooldown
  if (p.coyote > 0) p.coyote--;
  if (p.jbuf > 0) p.jbuf--;
  if (p.dropThru > 0) p.dropThru--;

  // ------- focus / heal --------------------------------------------------
  p.focusing = false;
  if (focusHeld && p.grounded && p.dashT <= 0 && p.attackT <= 0 &&
      p.soul >= 33 && p.hp < p.maxHp && p.hurtT <= 0 && !left && !right) {
    p.focusing = true;
    p.focusT++;
    p.vx = 0;
    if (p.focusT % 8 === 0) {
      SND.focusLoop();
      const a = rndr(0, Math.PI * 2), r = rndr(24, 40);
      addP({
        x: p.x + p.w / 2 + Math.cos(a) * r, y: p.y + p.h / 2 + Math.sin(a) * r,
        vx: 0, vy: 0, life: 20, size: 2.5, col: 'rgba(235,240,245,0.9)',
        seek: 'player', drag: 1,
      });
    }
    if (p.focusT >= 52) {
      p.focusT = 0;
      p.soul -= 33;
      p.hp++;
      SND.heal();
      addP({ x: p.x + p.w / 2, y: p.y + p.h / 2, life: 26, size: 10, col: 'rgba(240,242,238,0.9)', type: 'ring' });
      burstSoul(p.x + p.w / 2, p.y, 8);
    }
  } else {
    p.focusT = 0;
  }

  const canAct = !p.focusing && p.hurtT <= 0;

  // ------- horizontal movement ------------------------------------------
  let move = 0;
  if (canAct) {
    if (left) move -= 1;
    if (right) move += 1;
  }
  if (move !== 0 && p.dashT <= 0) p.face = move;

  if (p.dashT > 0) {
    p.dashT--;
    p.vx = p.dashDirX * 11;
    p.vy = p.dashDirY * 4;
    if (p.dashT % 2 === 0) {
      addP({
        x: p.x + p.w / 2, y: p.y + p.h / 2 + rndr(-8, 8),
        vx: -p.dashDirX * 1.5, vy: 0, life: 14, size: rndr(2, 4),
        col: 'rgba(200,200,210,0.4)', drag: 0.9,
      });
    }
  } else if (p.oathT > 0) {
    // v1.6: OATH DASH — ride the cursor, sword forward, cutting through all
    updateOathDash(p);
  } else if (canAct) {
    const target = move * 3.4;
    p.vx = lerp(p.vx, target, p.grounded ? 0.3 : 0.18);
    if (move === 0 && Math.abs(p.vx) < 0.2) p.vx = 0;
  } else if (p.hurtT > 0) {
    p.vx *= 0.9;
  }

  // ------- jump ----------------------------------------------------------
  if (jumpP && canAct) p.jbuf = 7;
  if (p.jbuf > 0) {
    if (p.grounded && down && p.onPlank) {
      // drop through the plank without hopping
      p.dropThru = 22;
      p.jbuf = 0;
    } else if (p.grounded || p.coyote > 0) {
      p.vy = -11;
      p.jbuf = 0; p.coyote = 0;
      p.grounded = false;
      p.onPlank = false;
      p.jumpsUsed = 0;
      SND.jump();
      burstDust(p.x + p.w / 2, p.y + p.h, 5, 8);
    } else if (p.wallSlide && p.abilities.claws) {
      p.vy = -10;
      p.vx = -p.wallDir * 5.2;
      p.face = -p.wallDir;
      p.jbuf = 0;
      p.hurtT = Math.max(p.hurtT, 7);
      SND.jump();
      burstDust(p.x + (p.wallDir > 0 ? p.w : 0), p.y + p.h * 0.6, 6, 5);
    } else if (p.abilities.wings && p.jumpsUsed < 1) {
      p.vy = -10;
      p.jumpsUsed++;
      p.jbuf = 0;
      SND.flap();
      for (let i = 0; i < 6; i++) {
        addP({
          x: p.x + p.w / 2 + rndr(-12, 12), y: p.y + p.h - 4 + rndr(-4, 2),
          vx: rndr(-1, 1), vy: rndr(0.5, 1.5), life: 18, size: rndr(2, 4),
          col: 'rgba(225,232,238,0.6)', drag: 0.93,
        });
      }
    }
  }
  if (p.vy < -4 && !Input.down('jump')) p.vy = -4;

  // ------- dash ----------------------------------------------------------
  if (dashP && canAct && p.abilities.dash && p.dashCD <= 0 && p.dashT <= 0) {
    p.dashT = 9;
    p.dashCD = 14;
    p.dashDirX = p.face;
    p.dashDirY = up ? -0.6 : (down && !p.grounded ? 0.6 : 0);
    if (p.dashDirY !== 0) p.dashDirX = move !== 0 ? move : p.face;
    const dl = Math.sqrt(p.dashDirX * p.dashDirX + p.dashDirY * p.dashDirY);
    p.dashDirX /= dl; p.dashDirY /= dl;
    SND.dash();
  }

  // ------- attack (3-hit combo with the light blades) -------------------
  // Combo timer counts down; if it hits 0 the combo resets.
  if (p.comboTimer > 0) {
    p.comboTimer--;
    if (p.comboTimer === 0) p.comboCount = 0;
  }
  if (atkP && canAct && p.attackCD <= 0 && p.dashT <= 0 && p.oathT <= 0) {
    if (p.weapon === 'bound') {
      // v2.0: BOUND — the attack IS the throw; hands stay empty while it flies
      if (!p.boundOut) throwBoundSword(p);
    } else {
    p.attackT = 11;
    p.attackCD = (p.weapon === 'nail') ? 14 : 11;
    p.swingId++;
    p.attackDir = up ? 1 : (down && !p.grounded ? 2 : 0);
    // Advance the combo counter.  3rd hit (comboCount reaches 2 → fires wave)
    p.comboCount++;
    p.comboTimer = 38;   // ~0.63s window to chain the next hit
    // record which swing variant (1=overhead, 2=backhand, 3=power)
    p.comboStep = p.comboCount;
    if (p.comboCount >= 3) p.comboCount = 0;  // wrap after the 3rd
    SND.swing();
    // Illumina & Seraph's Oath — every 3rd swing releases a slash wave
    if (p.weapon !== 'nail' && p.comboCount === 0 && p.attackDir === 0) {
      fireSlashWave(p);
    }
    }
  }
  if (p.attackT > 0) {
    p.attackT--;
    if (p.weapon !== 'bound') {   // v2.0: a thrown blade has no melee box
      const box = nailBox();
      if (box) resolveNailHits(box);
    }
  }

  // ------- skill: Vengeful Shade / Light Beam / Judgement --------------
  if (p.skillCD > 0) p.skillCD--;
  const skillP = Input.hit('skill');
  const skillCost = (p.weapon === 'illumina' || p.weapon === 'seraph') ? BEAM_COST : SKILL_COST;
  if (skillP && canAct && p.skillCD <= 0 && p.soul >= skillCost && p.dashT <= 0 && p.oathT <= 0) {
    if (p.weapon === 'seraph')        fireJudgement(p);      // v1.6
    else if (p.weapon === 'illumina') fireLightBeam(p);
    else                              fireSkill(p);
  }

  // ------- v1.6: B — the OATH DASH (Seraph's Oath only) -----------------
  if (Input.hit('skillB') && p.weapon === 'seraph' && canAct &&
      p.skillBCD <= 0 && p.soul >= OATH_COST && p.dashT <= 0 && p.oathT <= 0 && p.attackT <= 0) {
    fireOathDash(p);
  }

  // ------- Illumina embers — the blade constantly sheds light (v1.4) -----
  if (p.weapon === 'illumina') emitIlluminaEmbers(p);
  else if (p.weapon === 'seraph') emitSeraphEmbers(p);   // v1.6: holy motes

  // ------- physics --------------------------------------------------------
  if (p.dashT <= 0 && p.oathT <= 0) {
    p.vy += 0.42;
    const maxFall = p.wallSlide ? 2.2 : 10;
    if (p.vy > maxFall) p.vy = maxFall;
  }

  p.wasGrounded = p.grounded;
  p.grounded = false;

  moveX(p, p.vx);
  moveY(p, p.vy);
  p.onPlank = p.hitFloor === 2;

  if (p.hitFloor) {
    if (!p.wasGrounded && p.vy > 3) {
      SND.land();
      burstDust(p.x + p.w / 2, p.y + p.h, 6, 10);
    }
    p.grounded = true;
    p.coyote = 6;
    p.jumpsUsed = 0;
    p.vy = 0;
  }
  if (p.hitCeil) p.vy = Math.max(p.vy, 0);

  // wall slide
  p.wallSlide = false;
  p.wallDir = 0;
  if (!p.grounded && p.vy > 0 && p.abilities.claws && p.dashT <= 0) {
    if (touchingWallSide(p, -1) && left) { p.wallSlide = true; p.wallDir = -1; }
    else if (touchingWallSide(p, 1) && right) { p.wallSlide = true; p.wallDir = 1; }
    if (p.wallSlide) {
      p.face = -p.wallDir;
      if (p.anim % 6 === 0) {
        addP({
          x: p.x + (p.wallDir > 0 ? p.w : 0), y: p.y + rndr(4, p.h - 4),
          vx: -p.wallDir * 0.3, vy: rndr(-0.5, 0.5), life: 14, size: 2,
          col: 'rgba(190,185,165,0.5)', drag: 0.92,
        });
      }
    }
  }

  // hazards
  if (p.invT <= 0 && touchingSpike(p) && p.hazardFade === 0) {
    hazardHit();
    return;
  }

  // record last safe ground
  if (p.grounded) {
    const footT = tileGet(Math.floor((p.x + p.w / 2) / TILE), Math.floor((p.y + p.h + 4) / TILE));
    if (footT === 1 && !touchingSpike({ x: p.x - 8, y: p.y, w: p.w + 16, h: p.h + 8 })) {
      p.lastSafeX = p.x;
      p.lastSafeY = p.y;
    }
  }

  // ------- animation state -------------------------------------------------
  if (p.dashT > 0 || p.oathT > 0) p.state = 'dash';
  else if (p.hurtT > 14) p.state = 'hurt';
  else if (p.focusing) p.state = 'focus';
  else if (p.wallSlide) p.state = 'wall';
  else if (!p.grounded) p.state = p.vy < 0 ? 'jump' : 'fall';
  else if (Math.abs(p.vx) > 0.6) p.state = 'run';
  else p.state = 'idle';

  // ------- interactions ----------------------------------------------------
  const pr = { x: p.x - 8, y: p.y - 8, w: p.w + 16, h: p.h + 16 };
  game.nearInteract = null;
  if (p.grounded) {
    for (const b of benches) {
      if (rectsOverlap(pr, b)) { game.nearInteract = { kind: 'bench', o: b }; break; }
    }
    if (!game.nearInteract) {
      for (const c of chests) {
        if (!c.opened && rectsOverlap(pr, c)) { game.nearInteract = { kind: 'chest', o: c }; break; }
      }
    }
    if (!game.nearInteract) {
      for (const t of tablets) {
        if (rectsOverlap(pr, t)) { game.nearInteract = { kind: 'tablet', o: t }; break; }
      }
    }
  }
  if (game.nearInteract && Input.hit('inter') && canAct) {
    if (game.nearInteract.kind === 'bench') {
      p.sit = true;
      p.sitBench = game.nearInteract.o;
      p.x = game.nearInteract.o.ax - p.w / 2;
      p.y = game.nearInteract.o.ay - p.h - 14;
      p.hp = p.maxHp;
      p.respawnX = p.x; p.respawnY = p.y;
      p.lastSafeX = p.x; p.lastSafeY = p.y;
      saveGame();
      SND.bench();
      showMsg('Rest complete — journey saved');
    } else if (game.nearInteract.kind === 'chest') {
      // open the chest and grant its loot
      const c = game.nearInteract.o;
      c.opened = true;
      c.openT = 1;
      SND.pickup();
      collectRelic({ type: c.loot, x: c.x + c.w / 2, y: c.y, taken: false });
      cam.shake = 5;
    } else {
      game.reading = game.nearInteract.o.text;
      SND.select();
    }
  }

  // pickups
  for (const pk of pickups) {
    if (pk.taken) continue;
    if (rectsOverlap(pr, { x: pk.x - 15, y: pk.y - 15, w: 30, h: 30 })) {
      collectRelic(pk);
    }
  }

  // ending door (v1.5: gated on the SECOND boss)
  if (endingDoor && game.boss2Dead && rectsOverlap(pr, endingDoor)) {
    startEnding();
  }

  // zone tracking
  const z = zoneIndexAtPx(p.x);
  if (!game.visited[z]) {
    game.visited[z] = true;
    game.zoneCard = 260;
    game.zoneCardText = ZONES[z].name;
    SND.setZone(z);
  } else {
    const cz = game.currentZone;
    if (cz !== z) SND.setZone(z);
  }
  game.currentZone = z;

  // boss triggers (v1.5: one lord per end-of-map arena)
  if (!game.bossDead && !game.bossActive && zoneIndexAtPx(p.x) === 3 && p.x > 254 * TILE) {
    startBoss('warden');
  }
  if (!game.boss2Dead && !game.bossActive && zoneIndexAtPx(p.x) === 6 && p.x > 602 * TILE) {
    startBoss('seraph');
  }
}

function touchingWallSide(p, dir) {
  const px = dir > 0 ? p.x + p.w + 2 : p.x - 2;
  const ty0 = Math.floor((p.y + 4) / TILE);
  const ty1 = Math.floor((p.y + p.h - 4) / TILE);
  const tx = Math.floor(px / TILE);
  return isSolidTile(tx, ty0) || isSolidTile(tx, ty1);
}

function nailBox() {
  const p = player;
  if (p.attackT < 4) return null;
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  if (p.attackDir === 1) return Rect(cx - 20, p.y - 40, 40, 42);
  if (p.attackDir === 2) return Rect(cx - 16, p.y + p.h - 4, 32, 40);
  return Rect(p.face > 0 ? p.x + p.w - 4 : p.x - 34, cy - 16, 38, 34);
}

function resolveNailHits(box) {
  const p = player;
  let pogoed = false;

  for (const e of enemies) {
    if (e.dead || e.hitSwing === p.swingId) continue;
    if (rectsOverlap(box, e)) {
      e.hitSwing = p.swingId;
      hurtEnemy(e, p.nailDmg, sign(e.x + e.w / 2 - (p.x + p.w / 2)) || p.face);
      gainSoul(11);
      pogoed = pogoed || hitResponse(box);
    }
  }
  if (boss && !boss.dead && boss.hitSwing !== p.swingId) {
    if (rectsOverlap(box, boss) && boss.vulnT <= 0) {
      boss.hitSwing = p.swingId;
      hurtBoss(p.nailDmg);
      gainSoul(11);
      pogoed = pogoed || hitResponse(box);
    }
  }
  if (shade && shade.hitSwing !== p.swingId && rectsOverlap(box, shade)) {
    shade.hitSwing = p.swingId;
    reclaimShade();
    pogoed = pogoed || hitResponse(box);
  }
  for (const t of totems) {
    if (t.used) continue;
    if (rectsOverlap(box, t)) {
      t.used = true;
      gainSoul(40);
      SND.soul();
      burstSoul(t.ax, t.ay - 46, 16);
      addP({ x: t.ax, y: t.ay - 46, life: 24, size: 8, col: 'rgba(225,232,240,0.8)', type: 'ring' });
      pogoed = pogoed || hitResponse(box);
    }
  }
  if (p.attackDir === 2 && !pogoed) {
    const tipY = p.y + p.h + 10;
    const cx = p.x + p.w / 2;
    if (tileGet(Math.floor(cx / TILE), Math.floor(tipY / TILE)) === 2) {
      pogoed = true;
    }
  }
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    if (rectsOverlap(box, pr)) {
      projectiles.splice(i, 1);
      burstHit(pr.x, pr.y);
      SND.clank();
      pogoed = pogoed || hitResponse(box);
    }
  }
  if (pogoed && p.attackDir === 2) {
    p.vy = -10.5;
    p.attackT = Math.min(p.attackT, 4);
    p.dashCD = 0;
    p.jumpsUsed = 0;
  }
}

function hitResponse(box) {
  const p = player;
  game.hitstop = Math.max(game.hitstop, 2);
  cam.shake = Math.max(cam.shake, 4);
  if (p.attackDir === 0) {
    p.vx = -p.face * 3;
  }
  if (p.attackDir === 2) return true;
  return false;
}

function gainSoul(n) {
  player.soul = Math.min(player.soulMax, player.soul + n);
  SND.soul();
}

/* -- Vengeful Shade skill ---------------------------------------------------
   Fires a homing soul projectile forward.  Pierces enemies, costs 33 soul,
   28-frame cooldown.  The bolt gently steers toward the nearest living enemy
   within a seek radius, giving it a satisfying "shade that hunts" feel.
   -------------------------------------------------------------------------- */
const SKILL_COST = 33;
const SKILL_CD   = 18;
const SHADE_SPEED = 6.2;
const SHADE_LIFE  = 90;
const SHADE_DMG   = 2;           // double the nail's base damage
const SHADE_SEEK_R = 320;        // homing radius in px

function fireSkill(p) {
  p.soul -= SKILL_COST;
  p.skillCD = SKILL_CD;
  const cx = p.x + p.w / 2;
  const cy = p.y + p.h / 2;
  const up = Input.down('up');
  const down = Input.down('down');
  const dir = up ? -1 : (down && !p.grounded ? 1 : 0);
  let vx, vy;
  if (dir === -1)      { vx = 0;             vy = -SHADE_SPEED; }
  else if (dir === 1)  { vx = 0;             vy =  SHADE_SPEED; }
  else                 { vx = p.face * SHADE_SPEED; vy = 0; }
  projectiles.push({
    x: cx - 10, y: cy - 10, w: 20, h: 20,
    vx, vy, grav: 0, t: 0, life: SHADE_LIFE,
    kind: 'shadeBolt', face: p.face,
    hits: {},           // enemy ids already pierced (prevents multi-hit per foe)
    dmg: SHADE_DMG,
  });
  SND.shadeCast();
  // spawn cast particles
  for (let i = 0; i < 8; i++) {
    const a = rndr(0, Math.PI * 2), s = rndr(0.5, 2.5);
    addP({
      x: cx, y: cy,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rndr(14, 26), size: rndr(1.5, 3),
      col: 'rgba(180,170,210,0.7)', drag: 0.92,
    });
  }
  // mild recoil opposite to fire direction
  if (dir === 0) p.vx -= p.face * 1.2;
  cam.shake = Math.max(cam.shake, 3);
}

function updateShadeBolt(p) {
  // homing: steer toward nearest enemy within seek radius
  let target = null, td2 = SHADE_SEEK_R * SHADE_SEEK_R;
  for (const e of enemies) {
    if (e.dead) continue;
    const d2 = dist2(p.x + 10, p.y + 10, e.x + e.w / 2, e.y + e.h / 2);
    if (d2 < td2) { td2 = d2; target = e; }
  }
  if (boss && !boss.dead) {
    const d2 = dist2(p.x + 10, p.y + 10, boss.x + boss.w / 2, boss.y + boss.h / 2);
    if (d2 < td2) { td2 = d2; target = boss; }
  }
  if (target) {
    const dx = (target.x + target.w / 2) - (p.x + 10);
    const dy = (target.y + target.h / 2) - (p.y + 10);
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    // gentle steer — blend current velocity with homing direction
    const homX = (dx / d) * SHADE_SPEED;
    const homY = (dy / d) * SHADE_SPEED;
    p.vx = p.vx * 0.82 + homX * 0.18;
    p.vy = p.vy * 0.82 + homY * 0.18;
    // face for sprite flip
    if (Math.abs(p.vx) > 0.5) p.face = p.vx > 0 ? 1 : -1;
  }
  // trail particles
  if (p.t % 2 === 0) {
    addP({
      x: p.x + 10 + rndr(-3, 3), y: p.y + 10 + rndr(-3, 3),
      vx: -p.vx * 0.1 + rndr(-0.4, 0.4),
      vy: -p.vy * 0.1 + rndr(-0.4, 0.4),
      life: rndr(10, 20), size: rndr(1.5, 3),
      col: rndr(0, 1) > 0.4 ? 'rgba(180,170,210,0.6)' : 'rgba(140,150,180,0.5)',
      drag: 0.93,
    });
  }
  // damage enemies (piercing — each enemy hit once via p.hits map)
  const boltRect = { x: p.x + 3, y: p.y + 3, w: 14, h: 14 };
  for (const e of enemies) {
    if (e.dead) continue;
    const eid = enemies.indexOf(e);
    if (p.hits[eid]) continue;
    if (rectsOverlap(boltRect, e)) {
      p.hits[eid] = true;
      hurtEnemy(e, p.dmg, sign(p.vx) || 1);
      SND.shadeHit();
      burstHit(e.x + e.w / 2, e.y + e.h / 2);
      cam.shake = Math.max(cam.shake, 3);
    }
  }
  // damage boss
  if (boss && !boss.dead && !p.hits.boss && rectsOverlap(boltRect, boss) && boss.vulnT <= 0) {
    p.hits.boss = true;
    hurtBoss(p.dmg);
    SND.shadeHit();
    cam.shake = Math.max(cam.shake, 4);
  }
}

/* -- Illumina sword: Light Beam skill (REWORKED v1.4) ----------------------
   Summons a tall pillar of light from the sky that LOCKS ONTO THE NEAREST
   ENEMY IN FRONT of the player (regular foes and the Warden both count;
   flyers included).  If no foe stands ahead, the pillar falls back to the
   player's own position.  The beam starts narrow (1× player width) with
   HUGE damage, then widens over 3 seconds up to ~3× player width while
   the damage shrinks.  A pixel-explosion impact plays on the ground.
   Cost: 99 soul.  Cooldown: 60 frames.
   -------------------------------------------------------------------------- */
const BEAM_COST      = 99;
const BEAM_CD        = 60;
const BEAM_DURATION  = 180;      // 3 seconds at 60fps
const BEAM_W_START   = 18;       // starting width (narrow)
const BEAM_W_MAX     = 54;       // max width (~3× player's 18px)
const BEAM_DMG_START = 12;       // huge opening damage
const BEAM_DMG_END   = 2;        // low trailing damage
const BEAM_HEIGHT    = 1400;     // tall enough to come from "really high up"
const BEAM_MAX_RANGE = 620;      // how far ahead a locked target may be (px)

/* -- Illumina: yellow/white pixel embers shed by the blade (v1.4) ----------
   While the living-light sword is equipped it constantly smoulders —
   hard square sparks drift off the blade and rise like motes.  Swinging
   the blade throws a denser fan of embers along the arc.
   -------------------------------------------------------------------------- */
const EMBER_COLS = ['#ffffff', '#fffbe0', '#fff4c0', '#ffe070', '#ffd23e'];

function emitIlluminaEmbers(p) {
  const hx = p.x + p.w / 2 + p.face * 4;      // hand / grip position
  const hy = p.y + p.h * 0.45;
  const attacking = p.attackT > 0;
  const n = attacking ? 3 : (game.frame % 4 === 0 ? 1 : 0);
  for (let i = 0; i < n; i++) {
    const along = rndr(0.15, 1);              // where on the blade
    addP({
      x: hx + p.face * (6 + along * 42),
      y: hy + rndr(-5, 5) * (attacking ? 1.7 : 1),
      vx: p.face * rndr(-0.2, 0.6) + (attacking ? p.face * rndr(0.5, 1.8) : 0),
      vy: rndr(-0.9, -0.25),
      life: rndr(14, 30), size: rndr(2, 3.6),
      col: EMBER_COLS[(rnd(0, EMBER_COLS.length)) | 0],
      drag: 0.97, grav: attacking ? 0.04 : -0.008,
      type: 'px',
    });
  }
  // an occasional bright mote rising off the wing-guard
  if (!attacking && game.frame % 23 === 0) {
    addP({
      x: hx + p.face * 10, y: hy - 8,
      vx: rndr(-0.3, 0.3), vy: rndr(-1.3, -0.6),
      life: rndr(26, 44), size: 3,
      col: '#fffbe0', drag: 0.98, grav: -0.006, type: 'px',
    });
  }
}

// v1.4: lock-on — nearest living enemy ahead of the player (or the boss).
// Returns { cx, groundY } for the beam strike point; falls back to the
// player's own position when nothing stands in front.
function findBeamTarget(p) {
  const pcx = p.x + p.w / 2;
  let best = null, bestD2 = BEAM_MAX_RANGE * BEAM_MAX_RANGE;
  for (const e of enemies) {
    if (e.dead) continue;
    const ecx = e.x + e.w / 2;
    const ahead = (ecx - pcx) * p.face;
    if (ahead < 6) continue;                       // must be genuinely in front
    const d2 = dist2(pcx, p.y + p.h / 2, ecx, e.y + e.h / 2);
    if (d2 < bestD2) { bestD2 = d2; best = e; }
  }
  if (boss && !boss.dead && boss.vulnT <= 0) {
    const bcx = boss.x + boss.w / 2;
    const ahead = (bcx - pcx) * p.face;
    if (ahead >= 6) {
      const d2 = dist2(pcx, p.y + p.h / 2, bcx, boss.y + boss.h / 2);
      if (d2 < bestD2) { best = boss; }
    }
  }
  if (best) {
    return { cx: best.x + best.w / 2, groundY: best.y + best.h, target: best };
  }
  return { cx: pcx, groundY: p.y + p.h, target: null };
}

function fireLightBeam(p) {
  p.soul -= BEAM_COST;
  p.skillCD = BEAM_CD;
  // v1.4: the pillar falls on the nearest enemy in FRONT of the player
  const lock = findBeamTarget(p);
  const cx = lock.cx;
  const groundY = lock.groundY;      // strikes the ground at the target's feet
  projectiles.push({
    x: cx - BEAM_W_START / 2,
    y: groundY - BEAM_HEIGHT,      // top of the beam (high in the sky)
    w: BEAM_W_START,
    h: BEAM_HEIGHT,
    vx: 0, vy: 0, grav: 0,
    t: 0, life: BEAM_DURATION,
    kind: 'lightBeam', face: p.face,
    cx: cx,                         // centre X (fixed)
    groundY: groundY,
    curW: BEAM_W_START,
    curDmg: BEAM_DMG_START,
    hits: {},                       // enemies already hit this tick (cleared each frame)
    hitTicks: {},                   // enemies hit at least once ever (for damage scaling log)
  });
  SND.shadeCast();
  // opening flash — big burst at the ground strike point
  for (let i = 0; i < 30; i++) {
    const a = rndr(0, Math.PI * 2), s = rndr(2, 7);
    addP({
      x: cx, y: groundY,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
      life: rndr(16, 32), size: rndr(2, 5),
      col: 'rgba(255,250,210,0.9)', drag: 0.9, grav: 0.1,
    });
  }
  // sky streaks — particles falling from above
  for (let i = 0; i < 12; i++) {
    addP({
      x: cx + rndr(-8, 8), y: groundY - rndr(200, 600),
      vx: 0, vy: rndr(8, 16),
      life: rndr(20, 40), size: rndr(2, 4),
      col: 'rgba(255,250,210,0.7)', drag: 1,
    });
  }
  cam.shake = Math.max(cam.shake, 10);
  game.hitstop = Math.max(game.hitstop, 6);
}

function updateLightBeam(p) {
  // progress 0..1 over the beam's life
  const prog = p.t / p.life;
  // width eases out: narrow for first ~0.5s, then widens
  const widenT = clamp((prog - 0.15) / 0.85, 0, 1);   // start widening at 15%
  p.curW = BEAM_W_START + (BEAM_W_MAX - BEAM_W_START) * widenT;
  // damage scales from huge → small (easeIn — drops fast at the start)
  const dmgT = clamp(prog * 1.3, 0, 1);
  p.curDmg = Math.round(BEAM_DMG_START + (BEAM_DMG_END - BEAM_DMG_START) * dmgT);
  // update the beam's rect
  p.x = p.cx - p.curW / 2;
  p.w = p.curW;
  // clear per-tick hits so enemies take damage every frame they're inside
  p.hits = {};

  // damage enemies overlapping the beam's ground footprint
  const groundRect = { x: p.x, y: p.groundY - 20, w: p.w, h: 40 };
  for (const e of enemies) {
    if (e.dead) continue;
    const eid = enemies.indexOf(e);
    if (p.hits[eid]) continue;
    if (rectsOverlap(groundRect, e)) {
      p.hits[eid] = true;
      hurtEnemy(e, p.curDmg, p.face);
      SND.shadeHit();
      burstHit(e.x + e.w / 2, e.y + e.h / 2);
      cam.shake = Math.max(cam.shake, 3);
    }
  }
  // boss
  if (boss && !boss.dead && !p.hits.boss && rectsOverlap(groundRect, boss) && boss.vulnT <= 0) {
    p.hits.boss = true;
    hurtBoss(p.curDmg);
    SND.shadeHit();
    cam.shake = Math.max(cam.shake, 5);
  }

  // ground impact explosion — spawn pixel particles bursting outward
  if (p.t % 3 === 0 && p.t < p.life - 10) {
    const burstN = 4 + Math.floor(p.curW / 8);
    for (let i = 0; i < burstN; i++) {
      const a = rndr(-Math.PI, 0);   // upward hemisphere
      const sp = rndr(2, 6);
      addP({
        x: p.cx + rndr(-p.curW / 2, p.curW / 2),
        y: p.groundY,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rndr(14, 28), size: rndr(2, 4),
        col: rndr(0, 1) > 0.4 ? 'rgba(255,250,210,0.9)' : 'rgba(255,240,180,0.7)',
        drag: 0.92, grav: 0.15,
        type: 'shard', rot: rndr(0, 6.28), vr: rndr(-0.3, 0.3),
      });
    }
  }

  // continuous sparkle rain inside the beam
  for (let i = 0; i < 3; i++) {
    addP({
      x: p.cx + rndr(-p.curW / 2, p.curW / 2),
      y: p.groundY - rndr(0, 300),
      vx: rndr(-0.5, 0.5), vy: rndr(3, 8),
      life: rndr(8, 16), size: rndr(1.5, 3),
      col: 'rgba(255,255,240,0.8)', drag: 0.96,
    });
  }

  // expanding impact ring on the ground (shockwave)
  if (p.t % 8 === 0) {
    addP({
      x: p.cx, y: p.groundY,
      life: 20, size: p.curW * 0.5,
      col: 'rgba(255,250,210,0.6)', type: 'ring',
    });
  }
}

/* -- Illumina sword: Slash Wave (3rd combo hit) -----------------------------
   A forward-moving crescent of light.  Lower damage than the beam but
   travels further and pierces.
   -------------------------------------------------------------------------- */
const WAVE_DMG  = 2;
const WAVE_LIFE = 50;
const WAVE_SPEED = 7;

function fireSlashWave(p) {
  const cx = p.x + p.w / 2;
  const cy = p.y + p.h / 2;
  projectiles.push({
    x: cx + p.face * 20 - 12, y: cy - 14, w: 24, h: 28,
    vx: p.face * WAVE_SPEED, vy: 0, grav: 0, t: 0, life: WAVE_LIFE,
    kind: 'slashWave', face: p.face,
    dmg: WAVE_DMG, hits: {},
  });
  SND.swing();
  // crescent particles
  for (let i = 0; i < 8; i++) {
    addP({
      x: cx + p.face * 16, y: cy + rndr(-10, 10),
      vx: p.face * rndr(1, 3), vy: rndr(-1, 1),
      life: rndr(10, 20), size: rndr(2, 4),
      col: 'rgba(240,245,255,0.8)', drag: 0.93,
    });
  }
}

function updateSlashWave(p) {
  const r = { x: p.x + 2, y: p.y + 2, w: p.w - 4, h: p.h - 4 };
  for (const e of enemies) {
    if (e.dead) continue;
    const eid = enemies.indexOf(e);
    if (p.hits[eid]) continue;
    if (rectsOverlap(r, e)) {
      p.hits[eid] = true;
      hurtEnemy(e, p.dmg, p.face);
      SND.shadeHit();
    }
  }
  if (boss && !boss.dead && !p.hits.boss && rectsOverlap(r, boss) && boss.vulnT <= 0) {
    p.hits.boss = true;
    hurtBoss(p.dmg);
    SND.shadeHit();
  }
  // trailing crescent particles — warm white/gold to match the blade
  if (p.t % 2 === 0) {
    addP({
      x: p.x + p.w / 2 - p.face * 6, y: p.y + p.h / 2 + rndr(-8, 8),
      vx: -p.face * 0.5, vy: rndr(-0.5, 0.5),
      life: rndr(8, 14), size: rndr(1.5, 3), type: 'px',
      col: rndr(0, 1) > 0.5 ? 'rgba(255,244,192,0.9)' : 'rgba(255,224,112,0.8)', drag: 0.94,
    });
  }
}

/* ==========================================================================
   v1.6 — SERAPH'S OATH: JUDGEMENT & THE OATH DASH
   JUDGEMENT (V/L, 99 soul)  — holy beams rain instantly on EVERY living foe
   (regular enemies and the boss alike), each blast dealing 3x blade damage.
   OATH DASH (B, 33 soul)    — the knight becomes a golden spear, dashing
   wherever the cursor points (any angle, sky included), blade forward,
   cutting every foe along the path for 2x blade damage.
   ========================================================================== */
const OATH_COST = 33;
const OATH_CD   = 45;
const OATH_COLS = ['#ffffff', '#fffbe0', '#fff0b0', '#ffd870', '#e8c060'];

function fireJudgement(p) {
  p.soul -= BEAM_COST;
  p.skillCD = BEAM_CD;
  const dmg = p.nailDmg * 3;                    // 3x the sword damage
  const targets = [];
  for (const e of enemies) { if (!e.dead && targets.length < 12) targets.push(e); }
  if (boss && !boss.dead && boss.vulnT <= 0) targets.push(boss);

  SND.holyBeam();
  if (targets.length === 0) {
    // nothing to judge — the light falls at the vessel's feet
    const cx = p.x + p.w / 2, gy = p.y + p.h;
    projectiles.push({ kind: 'judgeBeam', cx, groundY: gy, t: 0, life: 30, wCur: 24 });
  }
  for (const t of targets) {
    const cx = t.x + t.w / 2;
    const gy = t.y + t.h;
    projectiles.push({ kind: 'judgeBeam', cx, groundY: gy, t: 0, life: 36, wCur: 30 });
    // instant blast — no travel, no mercy
    if (t === boss) {
      hurtBoss(dmg);
      cam.shake = Math.max(cam.shake, 6);
    } else {
      hurtEnemy(t, dmg, sign(t.x + t.w / 2 - (p.x + p.w / 2)) || p.face);
    }
    // ground impact burst
    for (let i = 0; i < 18; i++) {
      const a = rndr(-Math.PI, 0), s = rndr(2, 6);
      addP({
        x: cx + rndr(-10, 10), y: gy,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rndr(14, 30), size: rndr(2, 4), type: 'px',
        col: OATH_COLS[(rnd(0, OATH_COLS.length)) | 0], drag: 0.92, grav: 0.12,
      });
    }
    addP({ x: cx, y: gy, life: 20, size: 12, col: 'rgba(255,240,180,0.7)', type: 'ring' });
  }
  game.hitstop = Math.max(game.hitstop, 7);
  cam.shake = Math.max(cam.shake, 9);
  // the caster is wreathed in light
  for (let i = 0; i < 14; i++) {
    addP({
      x: p.x + p.w / 2 + rndr(-10, 10), y: p.y + p.h / 2 + rndr(-14, 14),
      vx: rndr(-1, 1), vy: rndr(-1.6, -0.2), life: rndr(16, 30), size: rndr(2, 3.5),
      type: 'px', col: OATH_COLS[(rnd(0, OATH_COLS.length)) | 0], drag: 0.96,
    });
  }
}

function fireOathDash(p) {
  p.soul -= OATH_COST;
  p.skillBCD = OATH_CD;
  // aim where the cursor points — any angle, sky included
  const wx = Mouse.x + cam.x, wy = Mouse.y + cam.y;
  let dx = wx - (p.x + p.w / 2), dy = wy - (p.y + p.h / 2);
  let d = Math.sqrt(dx * dx + dy * dy);
  if (d < 14) { dx = p.face; dy = 0; d = 1; }
  p.oathDirX = dx / d;
  p.oathDirY = dy / d;
  p.oathT = 14;
  p.oathId++;
  if (Math.abs(dx) > 2) p.face = dx > 0 ? 1 : -1;
  SND.dash();
  SND.holyBeam();
  // launch burst
  for (let i = 0; i < 12; i++) {
    addP({
      x: p.x + p.w / 2, y: p.y + p.h / 2,
      vx: -p.oathDirX * rndr(1, 3) + rndr(-0.6, 0.6),
      vy: -p.oathDirY * rndr(1, 3) + rndr(-0.6, 0.6),
      life: rndr(12, 26), size: rndr(2, 3.5), type: 'px',
      col: OATH_COLS[(rnd(0, OATH_COLS.length)) | 0], drag: 0.93,
    });
  }
}

function updateOathDash(p) {
  p.oathT--;
  p.vx = p.oathDirX * 12.5;
  p.vy = p.oathDirY * 12.5;
  // golden streak trail
  addP({
    x: p.x + p.w / 2 + rndr(-4, 4), y: p.y + p.h / 2 + rndr(-8, 8),
    vx: -p.oathDirX * 1.2, vy: -p.oathDirY * 1.2,
    life: rndr(10, 20), size: rndr(2, 3.5), type: 'px',
    col: OATH_COLS[(rnd(0, OATH_COLS.length)) | 0], drag: 0.92,
  });
  // cut everything along the path — 2x the sword damage
  const hb = { x: p.x - 12, y: p.y - 10, w: p.w + 24, h: p.h + 20 };
  for (const e of enemies) {
    if (e.dead || e.oathHit === p.oathId) continue;
    if (rectsOverlap(hb, e)) {
      e.oathHit = p.oathId;
      hurtEnemy(e, p.nailDmg * 2, sign(p.oathDirX) || p.face);
      SND.shadeHit();
      burstHit(e.x + e.w / 2, e.y + e.h / 2);
      game.hitstop = Math.max(game.hitstop, 2);
    }
  }
  if (boss && !boss.dead && boss.oathHit !== p.oathId && rectsOverlap(hb, boss) && boss.vulnT <= 0) {
    boss.oathHit = p.oathId;
    hurtBoss(p.nailDmg * 2);
    SND.bossHit();
    burstHit(boss.x + boss.w / 2, boss.y + boss.h * 0.4);
    cam.shake = Math.max(cam.shake, 5);
  }
  // shear hostile projectiles out of the air
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    if (pr.kind === 'shadeBolt' || pr.kind === 'lightBeam' || pr.kind === 'judgeBeam' || pr.kind === 'sBeam') continue;
    if (rectsOverlap(hb, pr)) {
      projectiles.splice(i, 1);
      burstHit(pr.x + 8, pr.y + 8);
      SND.clank();
    }
  }
  if (p.oathT <= 0) { p.vx *= 0.3; p.vy *= 0.35; }
}

/* -- v2.0 : BOUND — the void-forged thrower.  X hurls the blade like a
   boomerang: it flies out, slows, hangs, then howls home to the
   wielder's hand — cutting on the way out AND the way back.  The
   knight's hands stay empty until it is caught. -------------------------- */
const BOUND_OUT_FRAMES = 24;    // outward deceleration phase
const BOUND_SPEED      = 10.5;  // launch speed
const BOUND_RETURN_MAX = 12.5;  // top homing speed

function throwBoundSword(p) {
  p.attackT = 10;                       // arm-flick pose (no melee box)
  p.attackCD = 20;
  p.swingId++;
  let dx = p.face, dy = 0;
  if (p.attackDir === 1) { dx = 0; dy = -1; }
  else if (p.attackDir === 2 && !p.grounded) { dx = 0; dy = 1; }
  p.boundOut = true;
  p.boundId++;
  projectiles.push({
    kind: 'boundFly',
    x: p.x + p.w / 2 + dx * 10,
    y: p.y + p.h * 0.42 + dy * 10,
    dx, dy,
    t: 0, out: BOUND_OUT_FRAMES, phase: 0, id: p.boundId,
  });
  SND.swing();
  for (let k = 0; k < 8; k++) {
    addP({
      x: p.x + p.w / 2 + dx * 8 + rndr(-4, 4), y: p.y + p.h * 0.42 + dy * 8 + rndr(-6, 6),
      vx: dx * rndr(0.5, 2) + rndr(-0.5, 0.5), vy: dy * rndr(0.5, 2) + rndr(-0.5, 0.5),
      life: rndr(10, 20), size: rndr(1.5, 3), type: 'px',
      col: rndr(0, 1) > 0.5 ? 'rgba(190,160,255,0.85)' : 'rgba(20,121,117,0.85)', drag: 0.93,
    });
  }
}

function boundRecall(p) {
  p.boundOut = false;
  p.attackCD = Math.min(p.attackCD, 8);
  SND.clank();
}

function updateBoundFly(pr, idx) {
  const p = player;
  // NOTE: the shared projectile loop already bumps pr.t once per frame
  const tag = pr.id * 2 + pr.phase;     // each foe, once per phase

  // ---- cut everything the blade crosses, either phase ----
  const hb = { x: pr.x - 10, y: pr.y - 10, w: 20, h: 20 };
  for (const e of enemies) {
    if (e.dead || e.boundHit === tag) continue;
    if (rectsOverlap(hb, e)) {
      e.boundHit = tag;
      hurtEnemy(e, p.nailDmg, pr.phase === 0 ? (sign(pr.dx) || p.face)
                                             : (sign(p.x + p.w / 2 - pr.x) || p.face));
      gainSoul(6);
      burstHit(pr.x, pr.y);
      game.hitstop = Math.max(game.hitstop, 2);
    }
  }
  if (boss && !boss.dead && boss.vulnT <= 0 && boss.boundHit !== tag && rectsOverlap(hb, boss)) {
    boss.boundHit = tag;
    hurtBoss(p.nailDmg);
    gainSoul(6);
    burstHit(pr.x, pr.y);
    SND.bossHit();
  }

  if (pr.phase === 0) {
    // ---- outward: steady deceleration along the throw line ----
    const sp = BOUND_SPEED * Math.max(0, 1 - pr.t / pr.out);
    pr.x += pr.dx * sp;
    pr.y += pr.dy * sp;
    if (isSolidTile(Math.floor(pr.x / TILE), Math.floor(pr.y / TILE))) {
      pr.x -= pr.dx * sp; pr.y -= pr.dy * sp;   // a wall knocks it home early
      pr.phase = 1;
      burstHit(pr.x, pr.y);
      SND.clank();
    } else if (pr.t >= pr.out) {
      pr.phase = 1;                             // hang, then come howling back
    }
  } else {
    // ---- recall: accelerate home, through anything ----
    const tx = p.x + p.w / 2, ty = p.y + p.h * 0.45;
    const ddx = tx - pr.x, ddy = ty - pr.y;
    const d = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
    const sp = Math.min(BOUND_RETURN_MAX, 4 + (pr.t - pr.out) * 0.45);
    pr.x += (ddx / d) * sp;
    pr.y += (ddy / d) * sp;
    if (d < 26 || pr.t > 300) {                 // caught (or safety recall)
      const fx = pr.x, fy = pr.y;
      projectiles.splice(idx, 1);
      boundRecall(p);
      for (let k = 0; k < 10; k++) {
        addP({
          x: fx + rndr(-6, 6), y: fy + rndr(-6, 6),
          vx: rndr(-1.4, 1.4), vy: rndr(-1.6, 0.6),
          life: rndr(8, 18), size: rndr(1.5, 3), type: 'px',
          col: rndr(0, 1) > 0.5 ? 'rgba(190,160,255,0.9)' : 'rgba(229,232,241,0.9)', drag: 0.93,
        });
      }
      return;
    }
  }

  // ---- void trail ----
  if (pr.t % 2 === 0) {
    addP({
      x: pr.x + rndr(-4, 4), y: pr.y + rndr(-4, 4),
      vx: rndr(-0.3, 0.3), vy: rndr(-0.4, 0.1),
      life: rndr(7, 14), size: rndr(1.5, 2.5), type: 'px',
      col: rndr(0, 1) > 0.5 ? 'rgba(160,130,240,0.75)' : 'rgba(20,121,117,0.7)', drag: 0.94,
    });
  }
}

/* -- v1.6: SERAPH'S OATH idle embers — holy motes + stray feathers --------- */
function emitSeraphEmbers(p) {
  const hx = p.x + p.w / 2 + p.face * 4;
  const hy = p.y + p.h * 0.45;
  const attacking = p.attackT > 0;
  const n = attacking ? 3 : (game.frame % 5 === 0 ? 1 : 0);
  for (let i = 0; i < n; i++) {
    const along = rndr(0.15, 1);
    addP({
      x: hx + p.face * (8 + along * 48),
      y: hy + rndr(-6, 6) * (attacking ? 1.7 : 1),
      vx: p.face * rndr(-0.2, 0.6) + (attacking ? p.face * rndr(0.5, 1.8) : 0),
      vy: rndr(-0.9, -0.25),
      life: rndr(14, 30), size: rndr(2, 3.4),
      col: OATH_COLS[(rnd(0, OATH_COLS.length)) | 0],
      drag: 0.97, grav: attacking ? 0.04 : -0.008,
      type: 'px',
    });
  }
  // a drifting feather mote rises off the winged guard
  if (!attacking && game.frame % 17 === 0) {
    addP({
      x: hx + p.face * 18, y: hy - 10,
      vx: rndr(-0.4, 0.4), vy: rndr(-1.1, -0.5),
      life: rndr(30, 50), size: 2, col: '#fffbe0', type: 'px', drag: 0.98, grav: -0.004,
    });
  }
}

function hazardHit() {
  const p = player;
  p.hp -= 1;
  SND.hurt();
  cam.shake = 8;
  game.hitstop = 4;
  burstMaskShards(p.x + p.w / 2, p.y + p.h / 2);
  if (p.hp <= 0) {
    killPlayer();
  } else {
    p.hazardFade = 26;
    game.fadeDir = 1;
    p.invT = 200;
  }
}

/* -- v1.6: PARRY — strike the instant a boss blow lands to deflect it -------
   When a parryable melee blow would connect and the vessel's own swing is
   still in its opening arc (attackT in the first frames of the swing) and
   the blade faces the blow, the hit is turned: no damage, a quarter of the
   sword's damage chips back, and the attacker is STUNNED (see onParry).
   Returns true when the blow was parried. ---------------------------------- */
function hurtPlayer(dmg, srcX, opts) {
  const p = player;
  if (p.invT > 0 || p.dead || p.dashT > 0 || p.hazardFade !== 0) return false;
  if (p.oathT > 0) return false;                     // the oath carries you through
  const o = opts || {};
  if (o.parryable && p.attackT >= 7) {
    const pcx2 = p.x + p.w / 2;
    const toward = sign(srcX - pcx2);
    if (toward === p.face || p.attackDir === 1) {
      // — PARRY! —
      p.attackT = Math.min(p.attackT, 4);
      p.comboCount = 0;
      p.vx = -toward * 2.2;
      game.hitstop = Math.max(game.hitstop, 9);
      game.slowmo = Math.max(game.slowmo, 26);
      game.parryFlash = 10;
      cam.shake = 7;
      gainSoul(12);
      SND.parry();
      const px2 = pcx2 + toward * 16, py2 = p.y + p.h * 0.45;
      // gold cross-burst of deflected steel
      for (let i = 0; i < 24; i++) {
        const a = rndr(0, Math.PI * 2), s = rndr(1.5, 5);
        addP({
          x: px2, y: py2 + rndr(-4, 4),
          vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
          life: rndr(12, 30), size: rndr(2, 3.5), type: 'px',
          col: rndr(0, 1) > 0.4 ? '#fffbe0' : (rndr(0, 1) > 0.5 ? '#ffd870' : '#ffffff'),
          drag: 0.9, grav: 0.08,
        });
      }
      addP({ x: px2, y: py2, life: 18, size: 6, col: 'rgba(255,232,150,0.9)', type: 'ring' });
      if (o.onParry) o.onParry();
      return true;
    }
  }
  p.hp -= dmg;
  SND.hurt();
  cam.shake = 9;
  game.hitstop = 5;
  p.invT = 90;
  p.focusT = 0;
  const dir = sign(p.x + p.w / 2 - srcX) || 1;
  p.vx = dir * 4.5;
  p.vy = -4;
  p.hurtT = 18;
  burstMaskShards(p.x + p.w / 2, p.y + p.h / 2);
  if (p.hp <= 0) killPlayer();
  return false;
}

function killPlayer() {
  const p = player;
  p.dead = true;
  p.deadT = 0;
  p.hp = 0;
  game.deaths++;
  game.deadT = 0;
  SND.shatter();
  SND.roar();
  cam.shake = 12;
  burstVoid(p.x + p.w / 2, p.y + p.h / 2, 30);
  burstMaskShards(p.x + p.w / 2, p.y + p.h / 2);
  shade = {
    x: p.x - 8, y: p.y - 10, w: 34, h: 50,
    vx: 0, vy: 0, t: 0, hitSwing: -1,
    geo: p.geo, baseY: p.y,
  };
  p.geo = 0;
}

function reclaimShade() {
  if (!shade) return;
  player.geo += shade.geo;
  SND.pickup();
  burstVoid(shade.x + 17, shade.y + 25, 20);
  burstSoul(shade.x + 17, shade.y + 25, 10);
  showMsg(shade.geo > 0 ? 'Reclaimed ' + shade.geo + ' geo' : 'The echo rests');
  shade = null;
}

function collectRelic(pk) {
  pk.taken = true;
  SND.pickup();
  cam.shake = 4;
  switch (pk.type) {
    case 'wings':
      player.abilities.wings = true;
      showMsg('MOTH WINGS — press Jump again in the air');
      burstSoul(pk.x, pk.y, 14);
      break;
    case 'claws':
      player.abilities.claws = true;
      showMsg('TALON CLAWS — slide down walls and press Jump');
      burstSoul(pk.x, pk.y, 14);
      break;
    case 'mask':
      player.maxHp++;
      player.hp = player.maxHp;
      showMsg('MASK OF VIGOR — your shell grows by one');
      burstMaskShards(pk.x, pk.y);
      break;
    case 'vessel':
      player.soulMax = 132;
      player.soul = Math.min(player.soul, player.soulMax);
      showMsg('SOUL VESSEL — you may hold deeper reserves');
      burstSoul(pk.x, pk.y, 14);
      break;
    case 'illumina':
      // v1.5: the sword is NOT auto-equipped — it waits in the VESSEL until
      // the vessel itself swaps it in (revolver-style, from the inventory).
      player.hasIllumina = true;
      showMsg('ILLUMINA — a blade of living light rests in your pack. Open the VESSEL (I) to wield it.');
      burstSoul(pk.x, pk.y, 20);
      burstMaskShards(pk.x, pk.y);
      break;
    case 'seraph':
      // v1.6: the Seraph's trophy — a long winged blade of judgement
      player.hasSeraph = true;
      showMsg("SERAPH'S OATH — the winged long-blade is yours. V: Judgement · B: Oath Dash. Open the VESSEL (I) to wield it.");
      burstSoul(pk.x, pk.y, 26);
      burstMaskShards(pk.x, pk.y);
      for (let i = 0; i < 16; i++) {
        const a = rndr(0, Math.PI * 2), s = rndr(1.5, 4);
        addP({
          x: pk.x, y: pk.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
          life: rndr(20, 46), size: rndr(2, 4), type: 'px',
          col: rndr(0, 1) > 0.5 ? '#fffbe0' : '#ffd870', drag: 0.94, grav: 0.04,
        });
      }
      cam.shake = 6;
      game.slowmo = Math.max(game.slowmo, 30);
      break;
  }
  saveGame();
}

function showMsg(text) {
  game.msg = text;
  game.msgT = 220;
}

/* ==========================================================================
   SECTION 8 — ENEMIES
   ========================================================================== */

function makeEnemy(type, x, y) {
  const base = {
    type, x: x - 10, y: y - 20, w: 20, h: 20,
    vx: 0, vy: 0, face: -1, t: rnd(0, 100),
    hp: 2, maxhp: 2, dead: false, deadT: 0,
    flash: 0, hitSwing: -1, hitWall: 0, hitFloor: 0, dropThru: 0,
    state: 'idle', stateT: 0, anchored: false,
  };
  switch (type) {
    case 'mite':
      Object.assign(base, { w: 30, h: 18, hp: 2, maxhp: 2, drop: 3 });
      base.y = y - 18;
      break;
    case 'gloom':
      Object.assign(base, { w: 24, h: 24, hp: 2, maxhp: 2, anchored: true, fly: true, drop: 6 });
      base.x = x - 12; base.y = y - 12;
      break;
    case 'spore':
      Object.assign(base, { w: 26, h: 30, hp: 3, maxhp: 3, anchored: true, root: true, drop: 8, cd: rnd(60, 160) });
      base.y = y - 30;
      break;
    case 'sentry':
      Object.assign(base, { w: 26, h: 44, hp: 5, maxhp: 5, drop: 14 });
      base.y = y - 44;
      break;
    case 'beetle':
      Object.assign(base, { w: 48, h: 32, hp: 8, maxhp: 8, drop: 22 });
      base.x = x - 24; base.y = y - 32;
      break;
    case 'wisp':                        // v1.5: ember wisp — hovering flame that dashes
      Object.assign(base, { w: 26, h: 22, hp: 2, maxhp: 2, anchored: true, fly: true, drop: 5 });
      base.x = x - 13; base.y = y - 11;
      break;
    case 'veil':                        // v1.5: veil wraith — blinks near, fires a pale orb
      Object.assign(base, { w: 26, h: 32, hp: 3, maxhp: 3, anchored: true, fly: true, drop: 9 });
      base.x = x - 13; base.y = y - 16;
      break;
  }
  // v1.7: remember the spawn post — leashed monsters drift back to it when
  // they lose the knight, so nothing wanders across the world.
  base.sx = base.x + base.w / 2;
  base.sy = base.y + base.h / 2;
  return base;
}

function hurtEnemy(e, dmg, kdir) {
  e.hp -= dmg;
  e.flash = 6;
  SND.hitEnemy();
  burstHit(e.x + e.w / 2, e.y + e.h / 2);
  if (!e.fly && !e.root) e.vx += kdir * 2.2;
  if (e.hp <= 0) {
    e.dead = true;
    e.deadT = 0;
    SND.enemyDie();
    burstVoid(e.x + e.w / 2, e.y + e.h / 2, 14);
    dropGeo(e.x + e.w / 2, e.y + e.h / 2, e.drop);
  }
}

function dropGeo(x, y, n) {
  for (let i = 0; i < n; i++) {
    geos.push({
      x: x - 5, y: y - 5, w: 10, h: 10,
      vx: rndr(-2.5, 2.5), vy: rndr(-5, -2),
      t: 0, grounded: false,
    });
  }
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t++;
    if (e.flash > 0) e.flash--;

    if (e.dead) {
      e.deadT++;
      if (e.deadT > 30) enemies.splice(i, 1);
      continue;
    }

    const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
    const ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
    const d2 = dist2(pcx, pcy, ecx, ecy);

    // v1.7: DISTANT MONSTERS SLEEP — anything far beyond the view never
    // thinks, drifts or hunts, so deep-zone beasts can never leak toward
    // the early rooms and chew on the knight from off-screen.
    if (d2 > 660 * 660) continue;

    switch (e.type) {
      case 'mite': {
        e.vx = e.face * 1.1;
        e.vy += 0.42;
        if (e.vy > 9) e.vy = 9;
        moveX(e, e.vx);
        if (e.hitWall) e.face *= -1;
        moveY(e, e.vy);
        if (e.hitFloor) e.vy = 0;
        if (e.hitFloor && !probeGroundAhead(e, e.face)) e.face *= -1;
        break;
      }
      case 'gloom': {
        // v1.7: SIGHT-GATED — a gloom only gives chase inside a short radius,
        // never through walls or across floors, and drifts back to its spawn
        // post once the knight breaks away (was: 260px homing, any direction).
        const homeD2 = dist2(e.sx, e.sy, ecx, ecy);
        if (d2 < 200 * 200 && Math.abs(pcy - ecy) < 120 &&
            losClear(ecx, ecy, pcx, pcy)) {
          const d = Math.sqrt(d2) || 1;
          e.vx += ((pcx - ecx) / d) * 0.09;
          e.vy += ((pcy - ecy) / d) * 0.09;
          const sp = Math.sqrt(e.vx * e.vx + e.vy * e.vy);
          if (sp > 2.1) { e.vx = e.vx / sp * 2.1; e.vy = e.vy / sp * 2.1; }
          e.face = sign(e.vx) || e.face;
        } else if (homeD2 > 48 * 48) {
          // lost the knight — float home
          const hd = Math.sqrt(homeD2) || 1;
          e.vx += ((e.sx - ecx) / hd) * 0.05;
          e.vy += ((e.sy - ecy) / hd) * 0.05;
          const sp = Math.sqrt(e.vx * e.vx + e.vy * e.vy);
          if (sp > 1.3) { e.vx = e.vx / sp * 1.3; e.vy = e.vy / sp * 1.3; }
        } else {
          e.vx *= 0.96;
          e.vy = Math.sin(e.t * 0.05) * 0.4;
        }
        e.x += e.vx; e.y += e.vy;
        break;
      }
      case 'spore': {
        e.cd--;
        // v1.7: the plant only lobs at close range with a clear sight line
        // (was: 420px — lobbing spores across half the zone)
        if (e.cd <= 0 && d2 < 230 * 230 && Math.abs(pcy - ecy) < 150 &&
            losClear(ecx, e.y - 6, pcx, pcy)) {
          e.cd = 150 + rnd(0, 60);
          const dx = pcx - ecx, dy = pcy - ecy;
          const t = 46;
          const vx = dx / t;
          const vy = dy / t - 0.5 * 0.16 * t;
          projectiles.push({
            x: ecx - 8, y: e.y - 6, w: 16, h: 16,
            vx, vy, grav: 0.16, t: 0, life: 150, kind: 'spore',
          });
          SND.swing();
        }
        break;
      }
      case 'sentry': {
        // single moveX per frame (idle used to move at double speed)
        e.stateT++;
        e.vy += 0.42;
        if (e.vy > 9) e.vy = 9;
        if (e.state === 'idle') {
          e.vx = e.face * 1.0;
          if (d2 < 190 * 190 && Math.abs(pcy - ecy) < 60) {
            e.state = 'tele'; e.stateT = 0;
            e.face = sign(pcx - ecx) || e.face;
          }
        } else if (e.state === 'tele') {
          e.vx = 0;
          if (e.stateT > 28) { e.state = 'lunge'; e.stateT = 0; SND.dash(); }
        } else if (e.state === 'lunge') {
          e.vx = e.face * 6;
          if (e.stateT > 18) { e.state = 'rest'; e.stateT = 0; }
        } else {
          e.vx *= 0.8;
          if (e.stateT > 26) { e.state = 'idle'; e.stateT = 0; }
        }
        moveX(e, e.vx);
        if (e.hitWall) {
          if (e.state === 'lunge') { e.state = 'rest'; e.stateT = 0; cam.shake = 3; }
          else e.face *= -1;
        }
        moveY(e, e.vy);
        if (e.hitFloor) e.vy = 0;
        break;
      }
      case 'beetle': {
        // single moveX per frame (idle used to move at double speed)
        e.stateT++;
        e.vy += 0.42;
        if (e.vy > 9) e.vy = 9;
        if (e.state === 'idle') {
          e.vx = e.face * 0.6;
          if (d2 < 240 * 240 && Math.abs(pcy - ecy) < 70 &&
              sign(pcx - ecx) === e.face) {
            e.state = 'tele'; e.stateT = 0;
          }
        } else if (e.state === 'tele') {
          e.vx = 0;
          if (e.stateT > 34) { e.state = 'charge'; e.stateT = 0; SND.dash(); }
        } else if (e.state === 'charge') {
          e.vx = e.face * 6.4;
        } else {
          e.vx *= 0.8;
          if (e.stateT > 50) e.state = 'idle';
        }
        moveX(e, e.vx);
        if (e.state === 'charge') {
          if (e.hitWall) {
            e.state = 'stun'; e.stateT = 0;
            cam.shake = 6; SND.clank();
            burstDust(e.x + (e.face > 0 ? e.w : 0), e.y + e.h / 2, 10, 8);
          } else if (e.stateT > 90) {
            e.state = 'idle';
          }
        } else if (e.hitWall && e.state === 'idle') {
          e.face *= -1;
        }
        moveY(e, e.vy);
        if (e.hitFloor) e.vy = 0;
        break;
      }
      case 'wisp': {
        // v1.5: drifts on the kiln heat, then flares and dashes at the player
        e.stateT++;
        if (e.state === 'idle') {
          e.vx = Math.sin(e.t * 0.04) * 0.8;
          e.vy = Math.cos(e.t * 0.031) * 0.6;
          if (e.stateT > 120 && d2 < 210 * 210) { e.state = 'tele'; e.stateT = 0; }
        } else if (e.state === 'tele') {
          e.vx *= 0.8; e.vy *= 0.8;
          if (e.stateT > 26) {
            const d = Math.sqrt(d2) || 1;
            e.state = 'dash'; e.stateT = 0;
            e.vx = (pcx - ecx) / d * 7;
            e.vy = (pcy - ecy) / d * 7;
            SND.dash();
          }
        } else {                           // dash
          if (e.stateT % 2 === 0) {
            addP({
              x: ecx + rndr(-4, 4), y: ecy + rndr(-4, 4),
              vx: rndr(-0.5, 0.5), vy: rndr(-0.5, 0.5),
              life: 12, size: 2.5, col: 'rgba(255,170,80,0.7)', type: 'px', drag: 0.94,
            });
          }
          if (e.stateT > 16) { e.state = 'idle'; e.stateT = 0; }
        }
        e.x += e.vx; e.y += e.vy;
        break;
      }
      case 'veil': {
        // v1.5: a patient wraith — fades out, blinks to the player's flank,
        // fades back in and releases a slow pale orb.
        // v1.7: LEASHED — it only stalks inside its haunting ground (220px),
        // drifts home when left behind, and never blinks through walls
        // (was: unbounded drift + a 380px blink from anywhere).
        e.stateT++;
        if (e.state === 'idle') {
          if (d2 < 220 * 220) {
            e.vx = (pcx - ecx) * 0.002;
            e.vy = (pcy - ecy - 50) * 0.002;
          } else {
            e.vx *= 0.9;
            e.vy = Math.sin(e.t * 0.04) * 0.25;
            const homeD2 = dist2(e.sx, e.sy, ecx, ecy);
            if (homeD2 > 90 * 90) {
              const hd = Math.sqrt(homeD2) || 1;
              e.x += (e.sx - ecx) / hd * 0.4;
              e.y += (e.sy - ecy) / hd * 0.4;
            }
          }
          e.x += e.vx; e.y += e.vy;
          if (e.stateT > 140 && d2 < 250 * 250 &&
              losClear(ecx, ecy, pcx, pcy)) { e.state = 'fade'; e.stateT = 0; }
        } else if (e.state === 'fade') {
          if (e.stateT > 30) {
            e.state = 'appear'; e.stateT = 0;
            const oldX = e.x, oldY = e.y;
            e.x = pcx - e.w / 2 + (rndr(-1, 1) > 0 ? 110 : -110);
            e.y = pcy - 70 - rndr(0, 40);
            // never blink inside stone — nudge up, then give up and stay
            if (isSolidTile(Math.floor((e.x + e.w / 2) / TILE), Math.floor((e.y + e.h / 2) / TILE))) {
              e.y = pcy - 110;
              if (isSolidTile(Math.floor((e.x + e.w / 2) / TILE), Math.floor((e.y + e.h / 2) / TILE))) {
                e.x = oldX; e.y = oldY;
              }
            }
            SND.shadeCast();
          }
        } else {                            // appear
          if (e.stateT === 20) {
            const d = Math.sqrt(d2) || 1;
            projectiles.push({
              x: ecx - 8, y: ecy - 8, w: 16, h: 16,
              vx: (pcx - ecx) / d * 2.6, vy: (pcy - ecy) / d * 2.6,
              grav: 0, t: 0, life: 170, kind: 'pale',
            });
            SND.swing();
          }
          if (e.stateT > 60) { e.state = 'idle'; e.stateT = 0; }
        }
        break;
      }
    }

    if (!e.dead && rectsOverlap(player, e)) {
      // v1.6: the sentry's lunge is a true sword-blow — it can be PARRIED
      if (e.type === 'sentry' && e.state === 'lunge') {
        hurtPlayer(1, e.x + e.w / 2, {
          parryable: true,
          onParry: function () {
            e.hp -= Math.max(1, Math.round(player.nailDmg / 4));
            e.flash = 10;
            e.state = 'rest'; e.stateT = 0;
            SND.stunRing();
            burstHit(e.x + e.w / 2, e.y + e.h / 2);
            if (e.hp <= 0) hurtEnemy(e, 0, 1);
          },
        });
      } else {
        hurtPlayer(1, e.x + e.w / 2);
      }
    }
  }
}

function renderEnemy(e) {
  const ecx = e.x + e.w / 2, bottom = e.y + e.h;
  let spr = null, idx = 0;
  const alpha = e.dead ? Math.max(0, 1 - e.deadT / 25) : 1;
  switch (e.type) {
    case 'mite':
      spr = SPR.mite; idx = Math.floor(e.t / 5);
      drawSpr(spr, idx, ecx, bottom, e.face < 0, alpha);
      break;
    case 'gloom':
      spr = SPR.gloom; idx = Math.floor(e.t / 4);
      drawSpr(spr, idx, ecx, bottom + 8, e.face < 0, alpha);
      break;
    case 'spore':
      spr = SPR.spore; idx = (e.cd < 30) ? 3 : Math.floor(e.t / 14) % 3;
      drawSpr(spr, idx, ecx, bottom, e.face < 0, alpha);
      break;
    case 'sentry':
      spr = SPR.sentry;
      idx = e.state === 'tele' ? 6 : (e.state === 'lunge' ? 7 : Math.floor(e.t / 6));
      drawSpr(spr, idx, ecx, bottom, e.face < 0, alpha);
      break;
    case 'beetle':
      spr = SPR.beetle;
      idx = e.state === 'tele' ? 0 : (e.state === 'stun' ? 2 : Math.floor(e.t / 6));
      drawSpr(spr, idx, ecx, bottom, e.face < 0, alpha);
      break;
    case 'wisp': {
      spr = SPR.wisp;
      idx = e.state === 'tele' ? 4 : Math.floor(e.t / 5) % 4;
      const wa = e.state === 'fade' ? 0.5 : alpha;
      drawSpr(spr, idx, ecx, bottom + 6, e.vx < 0, wa);
      // constant faint ember trail
      if (!e.dead && e.t % 5 === 0) {
        addP({
          x: ecx + rndr(-4, 4), y: ecy + rndr(-2, 6),
          vx: rndr(-0.3, 0.3), vy: rndr(-0.8, -0.2),
          life: rndr(10, 20), size: 2, type: 'px',
          col: rndr(0, 1) > 0.5 ? 'rgba(255,180,90,0.8)' : 'rgba(255,230,160,0.8)',
          drag: 0.95,
        });
      }
      break;
    }
    case 'veil': {
      spr = SPR.veil;
      idx = Math.floor(e.t / 7) % 6;
      let va = alpha;
      if (e.state === 'fade')   va = Math.max(0, 1 - e.stateT / 30);
      if (e.state === 'appear') va = Math.min(1, e.stateT / 30);
      drawSpr(spr, idx, ecx, bottom + 8, e.vx < 0, va * 0.95);
      break;
    }
  }
  if (e.flash > 0 && !e.dead) {
    drawSprWhite(spr, idx, ecx, bottom, e.face < 0);
  }
}

/* ==========================================================================
   SECTION 9 — BOSSES : THE PALE WARDEN & THE ASHEN SERAPH (v1.5)
   Two lords of the deep, two entirely different fights:
     · WARDEN — a grounded duellist.  Always vulnerable; the danger is his
       blade.  Falls at x≈280 in the Pale Court.
     · SERAPH — an aerial pyre.  Its cloak of embers turns every blow while
       it hunts; only when it settles to REST does the cloak part and the
       heart-core lie bare.  Rain, rings and swoops keep you moving.
   ========================================================================== */

const WARDEN_ARENA = { gateTx: 248, floorRow: 105, spawnTx: 280 };
const SERAPH_ARENA = { gateTx: 600, floorRow: 105, spawnTx: 624,
