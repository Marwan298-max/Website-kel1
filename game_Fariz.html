  ctx.fillStyle = enoughSoul
    ? (mode === 'shade' ? 'rgba(180,170,210,0.7)' : 'rgba(255,236,150,0.7)')
    : 'rgba(233,228,216,0.25)';
  ctx.font = 'italic 9px "Cormorant Garamond", serif';
  ctx.fillText(cost + ' soul', 0, r + 32);

  // key hint
  ctx.fillStyle = 'rgba(233,228,216,0.45)';
  ctx.font = 'italic 10px "Cormorant Garamond", serif';
  ctx.fillText(keyHint, 0, -r - 12);

  ctx.restore();
}

function drawHUD() {
  const p = player;
  ctx.save();

  const sx = 64, sy = 68, sr = 30;
  const fill = p.soul / p.soulMax;
  ctx.fillStyle = 'rgba(10,12,14,0.75)';
  ctx.beginPath(); ctx.arc(sx, sy, sr + 6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(233,228,216,0.8)';
  ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(sx, sy, sr + 6, 0, Math.PI * 2); ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = 'rgba(235,238,240,0.16)';
  ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
  ctx.fillStyle = 'rgba(240,244,246,0.92)';
  const fh = sr * 2 * fill;
  ctx.beginPath();
  ctx.moveTo(sx - sr, sy + sr - fh);
  ctx.quadraticCurveTo(sx, sy + sr - fh + Math.sin(game.frame * 0.06) * 3, sx + sr, sy + sr - fh);
  ctx.lineTo(sx + sr, sy + sr);
  ctx.lineTo(sx - sr, sy + sr);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(233,228,216,0.5)';
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
    ctx.beginPath();
    ctx.moveTo(sx + Math.cos(a) * (sr + 8), sy + Math.sin(a) * (sr + 8));
    ctx.lineTo(sx + Math.cos(a) * (sr + 13), sy + Math.sin(a) * (sr + 13));
    ctx.stroke();
  }

  for (let i = 0; i < p.maxHp; i++) {
    drawMaskIcon(112 + i * 30, 52, i < p.hp);
  }

  ctx.save();
  ctx.translate(118, 84);
  ctx.scale(0.9, 0.9);
  ctx.drawImage(SPR.geo.f[0], -9, -9);
  ctx.restore();
  ctx.fillStyle = '#d8d2be';
  ctx.font = '600 20px Cinzel, serif';
  ctx.textAlign = 'left';
  ctx.fillText(String(p.geo), 134, 91);

  // Vengeful Shade / Light Beam / Judgement + Oath Dash indicators (v1.6)
  if (p.weapon === 'seraph') {
    drawSkillIcon(40, VIEW_H - 56, p, 'judge');
    drawSkillIcon(134, VIEW_H - 56, p, 'oath');
  } else {
    drawSkillIcon(64, VIEW_H - 56, p, p.weapon === 'illumina' ? 'beam' : 'shade');
  }

  // Attack combo counter (only shows when a combo is active)
  if (p.comboCount > 0 && p.weapon !== 'nail') {
    const cx2 = 112 + p.maxHp * 30 + 30;
    const cy2 = 56;
    ctx.save();
    ctx.fillStyle = 'rgba(255,245,180,0.9)';
    ctx.font = '600 18px Cinzel, serif';
    ctx.textAlign = 'left';
    ctx.fillText('x' + (p.comboCount), cx2, cy2);
    // combo timer bar
    const barW = 40;
    const frac = p.comboTimer / 38;
    ctx.fillStyle = 'rgba(40,40,50,0.7)';
    ctx.fillRect(cx2, cy2 + 4, barW, 4);
    ctx.fillStyle = frac > 0.3 ? 'rgba(255,245,180,0.9)' : 'rgba(255,180,120,0.9)';
    ctx.fillRect(cx2, cy2 + 4, barW * frac, 4);
    ctx.restore();
  }

  if (game.bossActive && boss && !boss.dead) {
    const bw = 480, bx = VIEW_W / 2 - bw / 2, by = VIEW_H - 56;
    ctx.fillStyle = 'rgba(10,10,12,0.7)';
    ctx.fillRect(bx - 4, by - 4, bw + 8, 16);
    ctx.strokeStyle = 'rgba(233,228,216,0.7)';
    ctx.lineWidth = 1.4;
    ctx.strokeRect(bx - 4, by - 4, bw + 8, 16);
    ctx.fillStyle = boss.kind === 'seraph' ? 'rgba(255,180,100,0.9)' : 'rgba(233,228,216,0.85)';
    ctx.fillRect(bx, by, bw * (boss.hp / boss.maxhp), 8);
    ctx.font = '600 15px Cinzel, serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e9e4d8';
    ctx.fillText(boss.kind === 'seraph' ? 'T H E   A S H E N   S E R A P H' : 'T H E   P A L E   W A R D E N', VIEW_W / 2, by - 12);
    // v1.6: the stage callout
    if (boss.kind === 'seraph') {
      ctx.font = 'italic 12px "Cormorant Garamond", serif';
      if (boss.state === 'stunned') {
        ctx.fillStyle = 'rgba(255,236,150,0.95)';
        ctx.fillText('— STUNNED — unleash everything —', VIEW_W / 2, by + 24);
      } else if (boss.cycle === 'ground') {
        ctx.fillStyle = 'rgba(255,220,150,0.85)';
        ctx.fillText('blades bared — it can be hurt, but it will not stop', VIEW_W / 2, by + 24);
      } else {
        ctx.fillStyle = 'rgba(255,190,130,0.7)';
        ctx.fillText('the cloak burns — endure the sky', VIEW_W / 2, by + 24);
      }
    }
  }

  if (game.zoneCard > 0) {
    game.zoneCard--;
    const t = game.zoneCard;
    let a = 1;
    if (t > 220) a = (260 - t) / 40;
    if (t < 50) a = t / 50;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#e9e4d8';
    ctx.font = '600 40px Cinzel, serif';
    ctx.textAlign = 'center';
    ctx.fillText(game.zoneCardText.split('').join(' '), VIEW_W / 2, 150);
    ctx.globalAlpha = a * 0.6;
    ctx.font = 'italic 18px "Cormorant Garamond", serif';
    ctx.fillText('— ' + (game.currentZone + 1) + ' —', VIEW_W / 2, 180);
    ctx.globalAlpha = 1;
  }

  if (game.msgT > 0) {
    game.msgT--;
    const a = Math.min(1, game.msgT / 40);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(10,12,14,0.8)';
    ctx.fillRect(VIEW_W / 2 - 240, VIEW_H - 130, 480, 40);
    ctx.fillStyle = '#e9e4d8';
    ctx.font = 'italic 19px "Cormorant Garamond", serif';
    ctx.textAlign = 'center';
    ctx.fillText(game.msg, VIEW_W / 2, VIEW_H - 104);
    ctx.globalAlpha = 1;
  }

  if (game.nearInteract && !player.sit) {
    const label = game.nearInteract.kind === 'bench' ? 'Rest'
                : game.nearInteract.kind === 'chest' ? 'Open'
                : 'Read';
    ctx.fillStyle = 'rgba(233,228,216,0.9)';
    ctx.font = 'italic 18px "Cormorant Garamond", serif';
    ctx.textAlign = 'center';
    ctx.beginPath();
    ctx.moveTo(VIEW_W / 2 - 4, VIEW_H / 2 + 46);
    ctx.lineTo(VIEW_W / 2 + 4, VIEW_H / 2 + 46);
    ctx.lineTo(VIEW_W / 2, VIEW_H / 2 + 38);
    ctx.closePath();
    ctx.fill();
    ctx.fillText(label, VIEW_W / 2, VIEW_H / 2 + 66);
  }

  // v1.6: the cursor mark — SERAPH'S OATH aims wherever you point
  if (p.weapon === 'seraph' && !game.invOpen) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,232,160,0.75)';
    ctx.lineWidth = 2;
    const mx = Math.round(Mouse.x) + 0.5, my = Math.round(Mouse.y) + 0.5;
    ctx.beginPath();
    ctx.moveTo(mx - 10, my); ctx.lineTo(mx - 4, my);
    ctx.moveTo(mx + 4, my);  ctx.lineTo(mx + 10, my);
    ctx.moveTo(mx, my - 10); ctx.lineTo(mx, my - 4);
    ctx.moveTo(mx, my + 4);  ctx.lineTo(mx, my + 10);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,244,190,0.9)';
    ctx.fillRect(mx - 1, my - 1, 2, 2);
    ctx.restore();
  }

  // v1.6: the gold kiss of a parry
  if (game.parryFlash > 0) {
    const a = game.parryFlash / 10;
    ctx.fillStyle = 'rgba(255,232,150,' + (a * 0.2) + ')';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  ctx.restore();
}

/* -- THE VESSEL (v1.5) ------------------------------------------------------
   The VESSEL lists ONLY what you truly carry — unknown gifts and relics
   never appear until they are found.  No more "???" placeholders.

   WEAPONS: one large equipped frame; other owned blades wait beside it in
   "chambers".  Click a chambered blade and it swaps in revolver-style:
   the current weapon slides out to the left, the new one arcs home into
   the frame and locks in as equipped.  (Opening the chest does NOT equip
   the sword — the vessel must choose to wield it here.)

   Hotspots are shared between the update pass (hit-testing) and the draw
   pass (hover glow), so they can never drift apart.
   -------------------------------------------------------------------------- */

const WEAPON_INFO = {
  nail:     { name: 'OLD NAIL', dmg: 1, cap: 'dmg 1 · steady, honest swings' },
  illumina: { name: 'ILLUMINA', dmg: 2, cap: 'dmg 2 · light combo' },
  seraph:   { name: "SERAPH'S OATH", dmg: 3, cap: 'dmg 3 · wings of judgement' },
  bound:    { name: 'BOUND', dmg: 2, cap: 'dmg 2 · thrown — it always returns' },
};

const SWAP_T = 46;   // frames for the revolver swap animation

function ownedWeapons() {
  const w = ['nail'];
  if (player.hasIllumina) w.push('illumina');
  if (player.hasSeraph) w.push('seraph');
  if (player.hasBound) w.push('bound');
  return w;
}

function weaponIcon(id) {
  // iconNail is a frame-set; relicIllumina / seraphRelic are plain canvases
  if (id === 'illumina') return SPR.relicIllumina || null;
  if (id === 'seraph')   return SPR.seraphRelic || null;
  if (id === 'bound')    return SPR.boundRelic || null;
  const set = SPR.iconNail;
  return set && set.f ? set.f[0] : null;
}

// Draw a weapon icon upright, aspect preserved, th pixels tall, centred.
function drawWeaponIcon(id, cx, cy, th, alpha = 1) {
  const img = weaponIcon(id);
  if (!img || !img.width) return;
  const s = th / img.height;
  const w = img.width * s;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, Math.round(cx - w / 2), Math.round(cy - th / 2), Math.round(w), Math.round(th));
  ctx.restore();
}

function invLayout() {
  const p = player;
  const frame = { x: 210, y: 186, w: 140, h: 140 };
  const chambers = [];
  if (!game.invSwap) {
    for (const id of ownedWeapons()) {
      if (id === p.weapon) continue;
      chambers.push({ id, x: 420 + chambers.length * 118, y: 206, w: 100, h: 100 });
    }
  }
  const gifts = [];
  if (p.abilities.dash)  gifts.push({ id: 'gift_dash',  name: 'Shade Dash',  desc: 'C / K / Shift' });
  if (p.abilities.wings) gifts.push({ id: 'gift_wings', name: 'Moth Wings',  desc: 'double-jump' });
  if (p.abilities.claws) gifts.push({ id: 'gift_claws', name: 'Talon Claws', desc: 'wall-slide + wall-jump' });
  const relics = [];
  if (p.maxHp > 5)    relics.push({ id: 'relic_mask',   name: 'Mask of Vigor' });
  if (p.soulMax > 99) relics.push({ id: 'relic_vessel', name: 'Soul Vessel' });
  return { frame, chambers, gifts, relics };
}

function invHotspots() {
  const L = invLayout();
  const h = [
    { id: 'equipframe', x: L.frame.x, y: L.frame.y, w: L.frame.w, h: L.frame.h, clickable: false },
  ];
  for (const c of L.chambers) {
    h.push({ id: 'chamber_' + c.id, x: c.x, y: c.y, w: c.w, h: c.h, clickable: true });
  }
  L.gifts.forEach((g, i) => h.push({ id: g.id, x: 706, y: 192 + i * 40, w: 300, h: 38, clickable: false }));
  L.relics.forEach((r, i) => h.push({ id: r.id, x: 706, y: 366 + i * 30, w: 300, h: 30, clickable: false }));
  h.push({ id: 'skill', x: 706, y: 482, w: 330, h: 84, clickable: false });
  h.push({ id: 'close', x: VIEW_W / 2 - 80, y: VIEW_H - 66, w: 160, h: 36, clickable: true });
  return h;
}

        'dmg 2 · X throws it like a boomerang;',

  switch (id) {

        'The second leap rides the dust of wings.',
      ] };
    case 'gift_claws':
      return { title: 'TALON CLAWS', accent: gold, lines: [

          'living foe at once — 3x blade damage each. 99 soul.',

        ] };
      }

          'Cost 99 soul · brief cooldown.',
        ] };
      }
      return { title: 'VENGEFUL SHADE', accent: 'rgba(180,170,210,0.9)', lines: [
        'V / L — a homing bolt of wrathful soul.',
        'Cost 33 soul.',
      ] };
    case 'close':
      return { title: 'CLOSE', accent: gold, lines: ['Return to the descent.'] };
  }
  return null;
}

// v1.5: per-tick inventory logic — hover tracking, cursor, clicks, swap.
function updateInventory() {
  let hover = null;
  for (const h of invHotspots()) {
    if (Mouse.x >= h.x && Mouse.x < h.x + h.w &&
        Mouse.y >= h.y && Mouse.y < h.y + h.h) { hover = h; break; }
  }
  game.invHover = hover ? hover.id : null;
  const wantCursor = (hover && hover.clickable) ? 'pointer' : 'default';
  if (canvas.style.cursor !== wantCursor) canvas.style.cursor = wantCursor;

  // advance the revolver swap
  if (game.invSwap) {
    const s = game.invSwap;
    s.t++;
    if (s.t === 30) SND.confirmS();
    if (s.t >= SWAP_T) {
      player.weapon = s.to;
      player.nailDmg = WEAPON_INFO[s.to].dmg;
      // v2.0: swapping away while BOUND is in the air recalls it instantly
      if (player.boundOut) {
        for (let bi = projectiles.length - 1; bi >= 0; bi--) {
          if (projectiles[bi].kind === 'boundFly') projectiles.splice(bi, 1);
        }
        player.boundOut = false;
      }
      showMsg(s.to === 'illumina'
        ? 'ILLUMINA — light returns to your hand'
        : s.to === 'seraph'
        ? "SERAPH'S OATH — the sky remembers its promise"
        : s.to === 'bound'
        ? 'BOUND — cast it into the dark; it returns to your hand'
        : 'OLD NAIL — humbler, but it still bites');
      saveGame();
      game.invSwap = null;
    }
    return;   // the cylinder is turning — no clicks
  }

  if (Mouse.clicked) {
    Mouse.clicked = false;
    if (hover && hover.clickable) {
      if (hover.id.indexOf('chamber_') === 0) {
        const target = hover.id.slice(8);
        if (target !== player.weapon) {
          game.invSwap = { t: 0, from: player.weapon, to: target };
          SND.clank();
          SND.select();
        } else {
          SND.select();
        }
      } else if (hover.id === 'close') {
        game.invOpen = false;
        game.invHover = null;
        canvas.style.cursor = 'default';
        SND.select();
      } else {
        SND.select();
      }
    }
  }
}

function drawInvTooltip(mx, my, tip) {
  const padX = 14, padY = 12, lineH = 19, titleH = 24;
  ctx.save();
  ctx.font = '600 16px Cinzel, serif';
  let w = ctx.measureText(tip.title).width;
  ctx.font = 'italic 14px "Cormorant Garamond", serif';
  for (const ln of tip.lines) w = Math.max(w, ctx.measureText(ln).width);
  w += padX * 2;
  const h = padY * 2 + titleH + tip.lines.length * lineH;
  let bx = mx + 24, by = my + 20;
  if (bx + w > VIEW_W - 12) bx = mx - w - 24;
  if (by + h > VIEW_H - 12) by = VIEW_H - h - 12;
  if (bx < 12) bx = 12;
  if (by < 12) by = 12;
  ctx.fillStyle = 'rgba(7,9,13,0.95)';
  ctx.fillRect(bx, by, w, h);
  ctx.strokeStyle = tip.accent;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(bx + 0.5, by + 0.5, w - 1, h - 1);
  // pixel corner ticks
  ctx.fillStyle = tip.accent;
  ctx.fillRect(bx, by, 7, 2);  ctx.fillRect(bx, by, 2, 7);
  ctx.fillRect(bx + w - 7, by + h - 2, 7, 2);
  ctx.fillRect(bx + w - 2, by + h - 7, 2, 7);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#efe9da';
  ctx.font = '600 16px Cinzel, serif';
  ctx.fillText(tip.title, bx + padX, by + padY + 14);
  ctx.font = 'italic 14px "Cormorant Garamond", serif';
  ctx.fillStyle = 'rgba(220,214,196,0.85)';
  for (let i = 0; i < tip.lines.length; i++) {
    ctx.fillText(tip.lines[i], bx + padX, by + padY + titleH + 4 + i * lineH);
  }
  ctx.restore();
}

function drawInventory() {
  const p = player;
  const hoverId = game.invHover || null;
  const L = invLayout();

  ctx.fillStyle = 'rgba(5,6,8,0.92)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // --- title ---
  ctx.fillStyle = '#e9e4d8';
  ctx.font = '600 38px Cinzel, serif';
  ctx.textAlign = 'center';
  ctx.fillText('VESSEL', VIEW_W / 2, 80);
  ctx.fillStyle = 'rgba(184,168,106,0.85)';
  ctx.font = 'italic 18px "Cormorant Garamond", serif';
  ctx.fillText('— what you carry into the deep —', VIEW_W / 2, 110);

  /* ============ LEFT — the weapon frame + chambers (click to swap) ==== */
  const F = L.frame;
  ctx.fillStyle = 'rgba(233,228,216,0.6)';
  ctx.font = '600 16px Cinzel, serif';
  ctx.textAlign = 'left';
  ctx.fillText('WEAPON  —  the frame holds your blade', F.x, 170);

  const swap = game.invSwap;
  const hov = hoverId === 'equipframe';

  // frame box
  ctx.fillStyle = hov ? 'rgba(22,26,30,0.85)' : 'rgba(10,12,14,0.6)';
  ctx.fillRect(F.x, F.y, F.w, F.h);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = hov ? 'rgba(233,228,216,0.85)' : 'rgba(233,228,216,0.28)';
  ctx.strokeRect(F.x, F.y, F.w, F.h);

  if (!swap) {
    // -------- the equipped blade, upright and aspect-true ----------
    if (p.weapon === 'illumina' || p.weapon === 'seraph') {
      // soft breathing halo behind the light blade
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const pulse = 0.16 + Math.sin(game.frame * 0.06) * 0.07;
      const haloCol = p.weapon === 'seraph' ? '255,240,190' : '255,250,220';
      const gr = ctx.createRadialGradient(F.x + F.w / 2, F.y + F.h / 2, 4, F.x + F.w / 2, F.y + F.h / 2, 56);
      gr.addColorStop(0, 'rgba(' + haloCol + ',' + pulse + ')');
      gr.addColorStop(1, 'rgba(' + haloCol + ',0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(F.x + F.w / 2, F.y + F.h / 2, 56, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    drawWeaponIcon(p.weapon, F.x + F.w / 2, F.y + F.h / 2 + 4, 104);
    // EQUIPPED banner
    ctx.fillStyle = 'rgba(184,168,106,0.92)';
    ctx.fillRect(F.x + F.w / 2 - 44, F.y - 8, 88, 15);
    ctx.fillStyle = '#14130f';
    ctx.font = '700 9px Cinzel, serif';
    ctx.textAlign = 'center';
    ctx.fillText('EQUIPPED', F.x + F.w / 2, F.y + 3);
    // caption
    const wi = WEAPON_INFO[p.weapon];
    ctx.fillStyle = p.weapon === 'nail' ? 'rgba(233,228,216,0.95)' : 'rgba(255,245,180,0.95)';
    ctx.font = '600 14px Cinzel, serif';
    ctx.fillText(wi.name, F.x + F.w / 2, F.y + F.h + 22);
    ctx.fillStyle = 'rgba(233,228,216,0.45)';
    ctx.font = 'italic 12px "Cormorant Garamond", serif';
    ctx.fillText(wi.cap, F.x + F.w / 2, F.y + F.h + 40);
  } else {
    // -------- revolver swap: out to the left, home into the frame ------
    const s = swap;
    const pulse = 0.25 + Math.sin(s.t * 0.4) * 0.12;
    ctx.strokeStyle = 'rgba(255,245,180,' + pulse + ')';
    ctx.lineWidth = 2;
    ctx.strokeRect(F.x + 2, F.y + 2, F.w - 4, F.h - 4);

    // phase 1 — the old blade slides out left, tilting away
    if (s.t <= 18) {
      const q = s.t / 18;
      const e2 = q * q;
      ctx.save();
      ctx.translate(F.x + F.w / 2 - e2 * 190, F.y + F.h / 2 + 4);
      ctx.rotate(-e2 * 0.5);
      drawWeaponIcon(s.from, 0, 0, 104, 1 - e2);
      ctx.restore();
    }
    // phase 2 — the new blade arcs in from its chamber
    if (s.t >= 12 && s.t <= 40) {
      const q = clamp((s.t - 12) / 26, 0, 1);
      const ease = 1 - Math.pow(1 - q, 3);
      const sx = 470, sy = 256;                       // chamber centre
      const dx = F.x + F.w / 2, dy = F.y + F.h / 2 + 4;
      const ix = lerp(sx, dx, ease);
      const iy = lerp(sy, dy, ease) - Math.sin(q * Math.PI) * 46;
      const th = 104 * lerp(0.62, 1, ease);
      drawWeaponIcon(s.to, ix, iy, th, 0.35 + 0.65 * q);
      // pixel sparks trailing the travelling blade
      ctx.fillStyle = 'rgba(255,245,180,0.8)';
      ctx.fillRect(ix - 1 + rndr(-8, 8), iy - 1 + rndr(-8, 8), 3, 3);
    }
    // phase 3 — lock-in: spark burst + banner snap
    if (s.t >= 36) {
      const q = clamp((s.t - 36) / (SWAP_T - 36), 0, 1);
      ctx.save();
      ctx.globalAlpha = 1 - q;
      ctx.fillStyle = 'rgba(255,245,180,0.9)';
      for (let k = 0; k < 8; k++) {
        const a = k * Math.PI / 4 + q * 2;
        const rr2 = 26 + q * 36;
        ctx.fillRect(F.x + F.w / 2 + Math.cos(a) * rr2 - 2,
                     F.y + F.h / 2 + Math.sin(a) * rr2 - 2, 4, 4);
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(184,168,106,' + q + ')';
      ctx.fillRect(F.x + F.w / 2 - 44, F.y - 8, 88, 15);
      ctx.fillStyle = '#14130f';
      ctx.font = '700 9px Cinzel, serif';
      ctx.textAlign = 'center';
      if (q > 0.4) ctx.fillText('EQUIPPED', F.x + F.w / 2, F.y + 3);
    }
    // caption — what is arriving
    const wi = WEAPON_INFO[s.to];
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,245,180,0.85)';
    ctx.font = '600 14px Cinzel, serif';
    ctx.fillText(wi.name + '  ·  ' + Math.round(clamp(s.t / SWAP_T, 0, 1) * 100) + '%', F.x + F.w / 2, F.y + F.h + 22);
  }

  // chambers — blades waiting to be swapped in
  for (const c of L.chambers) {
    const chov = hoverId === 'chamber_' + c.id;
    ctx.fillStyle = chov ? 'rgba(22,26,30,0.85)' : 'rgba(10,12,14,0.6)';
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.lineWidth = chov ? 2 : 1.5;
    ctx.strokeStyle = chov ? 'rgba(255,245,180,0.9)' : 'rgba(233,228,216,0.35)';
    ctx.strokeRect(c.x, c.y, c.w, c.h);
    if (chov) {
      ctx.fillStyle = 'rgba(255,245,180,0.9)';
      ctx.fillRect(c.x - 1, c.y - 1, 7, 2); ctx.fillRect(c.x - 1, c.y - 1, 2, 7);
      ctx.fillRect(c.x + c.w - 6, c.y + c.h - 1, 7, 2);
      ctx.fillRect(c.x + c.w - 1, c.y + c.h - 6, 2, 7);
    }
    drawWeaponIcon(c.id, c.x + c.w / 2, c.y + c.h / 2, 64, chov ? 1 : 0.85);
    ctx.textAlign = 'center';
    ctx.fillStyle = chov ? 'rgba(255,245,180,0.9)' : 'rgba(233,228,216,0.55)';
    ctx.font = '600 11px Cinzel, serif';
    ctx.fillText('CLICK TO SWAP IN', c.x + c.w / 2, c.y + c.h + 16);
  }
  if (L.chambers.length === 0 && !p.hasIllumina && !game.invSwap) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(233,228,216,0.3)';
    ctx.font = 'italic 13px "Cormorant Garamond", serif';
    ctx.fillText('a second blade may yet sleep in the deep…', 530, 256);
  }

  // --- shell stats ---
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(233,228,216,0.6)';
  ctx.font = '600 16px Cinzel, serif';
  ctx.fillText('SHELL', F.x, 412);
  ctx.fillStyle = 'rgba(233,228,216,0.8)';
  ctx.font = 'italic 18px "Cormorant Garamond", serif';
  ctx.fillText('Masks: ' + p.hp + ' / ' + p.maxHp, F.x, 438);
  ctx.fillText('Soul:  ' + Math.floor(p.soul) + ' / ' + p.soulMax, F.x, 464);
  ctx.fillText('Geo:   ' + p.geo, F.x, 490);
  ctx.fillText('Deaths: ' + game.deaths, F.x, 516);

  /* ============ RIGHT — GIFTS / RELICS / SKILL (owned only) =========== */
  const rx = 706;
  ctx.fillStyle = 'rgba(233,228,216,0.6)';
  ctx.font = '600 16px Cinzel, serif';
  ctx.fillText('GIFTS', rx, 170);

  for (let i = 0; i < L.gifts.length; i++) {
    const g = L.gifts[i];
    const gy = 192 + i * 40;
    if (hoverId === g.id) {
      ctx.fillStyle = 'rgba(233,228,216,0.06)';
      ctx.fillRect(rx - 10, gy - 20, 320, 38);
    }
    ctx.fillStyle = 'rgba(233,228,216,0.85)';
    ctx.font = '600 18px Cinzel, serif';
    ctx.fillText('◆', rx, gy);
    ctx.fillText(g.name, rx + 24, gy);
    ctx.fillStyle = 'rgba(184,168,106,0.7)';
    ctx.font = 'italic 13px "Cormorant Garamond", serif';
    ctx.fillText(g.desc, rx + 24, gy + 16);
  }

  // relics — listed only once found
  ctx.fillStyle = 'rgba(233,228,216,0.6)';
  ctx.font = '600 16px Cinzel, serif';
  ctx.fillText('RELICS', rx, 344);
  if (L.relics.length === 0) {
    ctx.fillStyle = 'rgba(233,228,216,0.28)';
    ctx.font = 'italic 14px "Cormorant Garamond", serif';
    ctx.fillText('— nothing found yet —', rx, 372);
  } else {
    for (let i = 0; i < L.relics.length; i++) {
      const r = L.relics[i];
      const gy = 366 + i * 30;
      if (hoverId === r.id) {
        ctx.fillStyle = 'rgba(233,228,216,0.06)';
        ctx.fillRect(rx - 10, gy - 18, 320, 30);
      }
      ctx.fillStyle = 'rgba(233,228,216,0.85)';
      ctx.font = '600 16px Cinzel, serif';
      ctx.fillText('◆', rx, gy);
      ctx.fillText(r.name, rx + 24, gy);
    }
  }

  // skill summary (hover for details)
  const skHov = hoverId === 'skill';
  if (skHov) {
    ctx.fillStyle = 'rgba(233,228,216,0.06)';
    ctx.fillRect(rx - 10, 478, 350, 92);
  }
  ctx.fillStyle = 'rgba(233,228,216,0.6)';
  ctx.font = '600 16px Cinzel, serif';
  ctx.fillText('SKILL', rx, 474);
  ctx.fillStyle = p.weapon === 'nail' ? 'rgba(180,170,210,0.9)' : 'rgba(255,245,180,0.9)';
  ctx.font = '600 18px Cinzel, serif';
  ctx.fillText(p.weapon === 'seraph' ? 'Judgement · Oath Dash'
    : p.weapon === 'illumina' ? 'Light Beam' : 'Vengeful Shade', rx, 500);
  ctx.fillStyle = 'rgba(233,228,216,0.5)';
  ctx.font = 'italic 13px "Cormorant Garamond", serif';
  ctx.fillText(p.weapon === 'seraph'
    ? 'Beams on every foe (V) · cursor dash (B)'
    : p.weapon === 'illumina'
    ? 'Falls on the nearest foe ahead · 99 soul'
    : 'Homing soul bolt · 33 soul.', rx, 522);
  ctx.fillStyle = 'rgba(233,228,216,0.35)';
  ctx.fillText(skHov ? '—' : 'hover for details', rx, 546);

  /* ================= tooltip + footer ================= */
  if (hoverId) {
    const tip = invTooltipFor(hoverId);
    if (tip) drawInvTooltip(Mouse.x, Mouse.y, tip);
  }

  // close button
  const cb = invHotspots().find(h => h.id === 'close');
  const cHov = hoverId === 'close';
  ctx.fillStyle = cHov ? 'rgba(30,34,38,0.95)' : 'rgba(16,18,22,0.85)';
  ctx.fillRect(cb.x, cb.y, cb.w, cb.h);
  ctx.strokeStyle = cHov ? 'rgba(255,245,180,0.9)' : 'rgba(233,228,216,0.4)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(cb.x + 0.5, cb.y + 0.5, cb.w - 1, cb.h - 1);
  ctx.fillStyle = cHov ? '#fff4c0' : 'rgba(233,228,216,0.75)';
  ctx.font = '600 15px Cinzel, serif';
  ctx.textAlign = 'center';
  ctx.fillText('CLOSE', VIEW_W / 2, cb.y + 24);
  ctx.fillStyle = 'rgba(233,228,216,0.35)';
  ctx.font = 'italic 14px "Cormorant Garamond", serif';
  ctx.fillText('I or Tab — close', VIEW_W / 2, VIEW_H - 14);
}

  for (let i = 0; i < 4; i++) {
    const fx = ((game.frame * (0.2 + i * 0.12) + i * 400) % (VIEW_W + 700)) - 350;
    const g = ctx.createRadialGradient(fx, 380 + i * 70, 10, fx, 380 + i * 70, 320);

  ctx.drawImage(SPR.knight.sit.f[Math.floor(game.frame / 16) % 4], -28, -74);

  ctx.save();
  for (const m of titleMotes) {
    m.y -= m.sp;
    if (m.y < -10) m.y = VIEW_H + 10;

    ctx.fillStyle = '#b8cfc0';
    ctx.beginPath();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#e9e4d8';
  ctx.font = '700 74px Cinzel, serif';

  const items = [];

  const sel = clamp(game.titleSel, 0, items.length - 1);
  ctx.font = '600 24px Cinzel, serif';
  for (let i = 0; i < items.length; i++) {
    const y = 420 + i * 46;
    if (i === sel) {
      ctx.fillStyle = '#e9e4d8';
      ctx.fillText('·  ' + items[i] + '  ·', VIEW_W / 2, y);
    } else {
      ctx.fillStyle = 'rgba(233,228,216,0.45)';
      ctx.fillText(items[i], VIEW_W / 2, y);
    }
  }
  ctx.fillStyle = 'rgba(233,228,216,0.35)';
  ctx.font = 'italic 15px "Cormorant Garamond", serif';
  ctx.fillText('arrows to move · Z to confirm', VIEW_W / 2, VIEW_H - 36);

  game.titleItems = items;
}

function updateTitle() {
  const items = game.titleItems || ['New Descent', 'Controls'];
  if (Input.hit('down')) { game.titleSel = (game.titleSel + 1) % items.length; SND.select(); }
  if (Input.hit('up')) { game.titleSel = (game.titleSel - 1 + items.length) % items.length; SND.select(); }
  if (Input.hit('confirm')) {
    SND.confirmS();
    const choice = items[game.titleSel];
    if (choice === 'New Descent') startNewGame();
    else if (choice === 'Continue') startContinue();
    else if (choice === 'Controls') { game.returnToPause = false; game.state = 'controls'; }
  }
}

/* -- v1.6c: controls screen — grouped, scrollable litany -------------------
   Sections keep related verbs together; the list scrolls with the wheel or
   arrow keys, a scrollbar tracks position, and ESC / the RETURN button leave. */
const CTRL_TOP = 140, CTRL_AREA_H = 478, CTRL_HEAD_H = 44, CTRL_ROW_H = 33;
const CTRL_SECTIONS = [
  { head: 'MOVEMENT', rows: [
    ['Move', 'Arrow Keys / A D'],
    ['Jump — again in air with Moth Wings', 'Z / Space'],
    ['Dash', 'C / K / Shift'],
    ['Drop through planks', 'Down + Jump'],
  ]},
  { head: 'COMBAT', rows: [
    ['Strike nail — hold Up or Down to aim', 'X / J'],
    ['Parry — swing the instant a boss blow lands', 'X (timed)'],
    ['Focus — hold to mend a mask (33 soul)', 'F (hold)'],
  ]},
  { head: 'SKILLS & THE OATH', rows: [
    ['Vengeful Shade (33) / Light Beam (99)', 'V / L'],
    ["Judgement — strikes every foe at once (3x dmg)", 'V · Oath'],
    ['Oath Dash — ride your cursor, blade forward (2x)', 'B · Oath'],
    ['Light Beam falls on the nearest foe ahead', '—'],
  ]},
  { head: 'EXPLORATION', rows: [
    ['Interact — benches, tablets, doors, chests', 'Up / E'],
    ['Inventory — click a chambered blade to swap it in', 'I / Tab'],
    ['Kiln vents & Sanctum curtains — cross while they rest', '—'],
  ]},
  { head: 'SYSTEM', rows: [
    ['Pause', 'Esc / P'],
    ['Mute', 'M'],
  ]},
];
function controlsContentH() {
  let h = 24;
  for (const s of CTRL_SECTIONS) h += CTRL_HEAD_H + s.rows.length * CTRL_ROW_H;
  return h;
}
function ctrlBackRect() { return { x: VIEW_W / 2 - 110, y: 654, w: 220, h: 46 }; }

function renderControls() {
  ctx.fillStyle = '#0a0c0e';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // -- header --
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e9e4d8';
  ctx.font = '600 34px Cinzel, serif';
  ctx.fillText('THE OLD WORDS', VIEW_W / 2, 70);
  ctx.font = 'italic 18px "Cormorant Garamond", serif';
  ctx.fillStyle = 'rgba(184,168,106,0.85)';
  ctx.fillText('how the knight listens — scroll the litany', VIEW_W / 2, 98);

  const max = Math.max(0, controlsContentH() - CTRL_AREA_H);
  const scroll = clamp(game.ctrlScroll || 0, 0, max);

  // -- scrolling content --
  ctx.save();
  ctx.beginPath();
  ctx.rect(100, CTRL_TOP - 10, VIEW_W - 220, CTRL_AREA_H + 20);
  ctx.clip();
  ctx.translate(0, -scroll);

  let y = CTRL_TOP;
  for (const s of CTRL_SECTIONS) {
    // section header + rule
    ctx.textAlign = 'left';
    ctx.font = '600 19px Cinzel, serif';
    ctx.fillStyle = 'rgba(184,168,106,0.95)';
    ctx.fillText(s.head, 180, y + 22);
    ctx.strokeStyle = 'rgba(184,168,106,0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(180, y + 31); ctx.lineTo(VIEW_W - 240, y + 31); ctx.stroke();

    for (let i = 0; i < s.rows.length; i++) {
      const ry = y + CTRL_HEAD_H + i * CTRL_ROW_H + 14;
      // label
      ctx.textAlign = 'left';
      ctx.font = 'italic 21px "Cormorant Garamond", serif';
      ctx.fillStyle = 'rgba(233,228,216,0.82)';
      ctx.fillText(s.rows[i][0], 180, ry);
      // key badge
      const kt = s.rows[i][1];
      ctx.font = '600 16px Cinzel, serif';
      const kw = ctx.measureText(kt).width;
      const bw = Math.max(46, kw + 36);
      const bx = 1090 - bw, by = ry - 19;
      ctx.fillStyle = 'rgba(24,26,30,0.75)';
      ctx.fillRect(bx, by, bw, 27);
      ctx.strokeStyle = 'rgba(184,168,106,0.55)';
      ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, 26);
      ctx.fillStyle = '#b8a86a';
      ctx.fillRect(bx, by, 6, 2); ctx.fillRect(bx, by, 2, 6);
      ctx.fillRect(bx + bw - 8, by + 25, 6, 2); ctx.fillRect(bx + bw - 2, by + 21, 2, 6);
      ctx.textAlign = 'center';
      ctx.fillText(kt, bx + bw / 2, ry);
    }
    y += CTRL_HEAD_H + s.rows.length * CTRL_ROW_H;
  }
  ctx.restore();

  // -- scrollbar --
  const trackX = VIEW_W - 46, trackY = CTRL_TOP, trackH = CTRL_AREA_H;
  ctx.fillStyle = 'rgba(233,228,216,0.08)';
  ctx.fillRect(trackX, trackY, 6, trackH);
  if (max > 0) {
    const th = Math.max(34, trackH * (trackH / controlsContentH()));
    const ty = trackY + (trackH - th) * (scroll / max);
    ctx.fillStyle = 'rgba(184,168,106,0.55)';
    ctx.fillRect(trackX, ty, 6, th);
  }

  // -- scroll hint --
  ctx.textAlign = 'left';
  ctx.font = 'italic 16px "Cormorant Garamond", serif';
  ctx.fillStyle = 'rgba(233,228,216,0.35)';
  ctx.fillText('wheel · arrow keys — scroll', 180, 686);

  // -- return button --
  const b = ctrlBackRect();
  const hov = Mouse.x >= b.x && Mouse.x < b.x + b.w && Mouse.y >= b.y && Mouse.y < b.y + b.h;
  ctx.fillStyle = hov ? 'rgba(184,168,106,0.18)' : 'rgba(24,26,30,0.7)';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = hov ? 'rgba(220,204,140,0.9)' : 'rgba(184,168,106,0.6)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
  ctx.fillStyle = '#b8a86a';
  ctx.fillRect(b.x, b.y, 8, 2); ctx.fillRect(b.x, b.y, 2, 8);
  ctx.fillRect(b.x + b.w - 8, b.y + b.h - 2, 8, 2); ctx.fillRect(b.x + b.w - 2, b.y + b.h - 8, 2, 8);
  ctx.textAlign = 'center';
  ctx.font = '600 19px Cinzel, serif';
  ctx.fillStyle = hov ? '#efe6c4' : '#b8a86a';
  ctx.fillText('ESC — RETURN', VIEW_W / 2, b.y + 30);
}

function updateControlsState() {
  if (game.ctrlScroll === undefined) game.ctrlScroll = 0;
  // wheel scroll
  if (Mouse.wheelY) { game.ctrlScroll += Mouse.wheelY * 0.55; Mouse.wheelY = 0; }
  // keyboard scroll (arrows or W/S)
  if (Input.hit('down')) game.ctrlScroll += 44;
  if (Input.hit('up'))   game.ctrlScroll -= 44;
  const max = Math.max(0, controlsContentH() - CTRL_AREA_H);
  game.ctrlScroll = clamp(game.ctrlScroll, 0, max);

  // leave: Esc / Backspace, or click the RETURN button
  const b = ctrlBackRect();
  const hov = Mouse.x >= b.x && Mouse.x < b.x + b.w && Mouse.y >= b.y && Mouse.y < b.y + b.h;
  canvas.style.cursor = hov ? 'pointer' : 'default';
  if (Input.pressed['Escape'] || Input.pressed['Backspace'] || (Mouse.clicked && hov)) {
    Mouse.clicked = false;
    game.state = game.returnToPause ? 'pause' : 'title';
    game.returnToPause = false;
    game.ctrlScroll = 0;
    canvas.style.cursor = 'default';
    SND.select();
  }
}

function renderPause() {
  ctx.fillStyle = 'rgba(5,6,8,0.86)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = '#e9e4d8';
  ctx.textAlign = 'center';
  ctx.font = '600 44px Cinzel, serif';
  ctx.fillText('A MOMENT OF QUIET', VIEW_W / 2, 170);

  const items = ['Resume', 'Controls', 'Abandon to Title'];
  ctx.font = '600 24px Cinzel, serif';
  for (let i = 0; i < items.length; i++) {
    const y = 280 + i * 48;
    if (i === game.pauseSel) {
      ctx.fillStyle = '#e9e4d8';
      ctx.fillText('·  ' + items[i] + '  ·', VIEW_W / 2, y);
    } else {
      ctx.fillStyle = 'rgba(233,228,216,0.45)';
      ctx.fillText(items[i], VIEW_W / 2, y);
    }
  }

  ctx.font = 'italic 19px "Cormorant Garamond", serif';
  ctx.fillStyle = 'rgba(184,168,106,0.9)';
  const ab = [];
  if (player.abilities.dash) ab.push('Shade Dash');
  if (player.abilities.wings) ab.push('Moth Wings');
  if (player.abilities.claws) ab.push('Talon Claws');
  ctx.fillText('Gifts: ' + (ab.join(' · ') || 'none yet'), VIEW_W / 2, 470);
  ctx.fillStyle = 'rgba(233,228,216,0.5)';
  ctx.fillText('Masks: ' + player.maxHp + '   Vessel: ' + player.soulMax, VIEW_W / 2, 500);
}

function renderDeathOverlay() {
  ctx.fillStyle = 'rgba(3,3,5,0.9)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = 'rgba(233,228,216,0.9)';
  ctx.textAlign = 'center';
  ctx.font = '600 52px Cinzel, serif';
  ctx.globalAlpha = clamp(game.deadT / 50, 0, 1);
  ctx.fillText('THE SHELL BREAKS', VIEW_W / 2, VIEW_H / 2 - 10);
  ctx.font = 'italic 22px "Cormorant Garamond", serif';
  ctx.fillStyle = 'rgba(233,228,216,0.55)';
  ctx.fillText('an echo remains where you fell', VIEW_W / 2, VIEW_H / 2 + 40);
  ctx.globalAlpha = 1;
}

function startEnding() {
  game.state = 'ending';
  game.endT = 0;
  SND.setBoss(false);
  SND.confirmS();
}

function renderEnding() {
  game.endT++;
  ctx.fillStyle = '#08090b';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  const a = clamp(game.endT / 120, 0, 1);
  ctx.globalAlpha = a;
  ctx.fillStyle = '#e9e4d8';
  ctx.textAlign = 'center';
  ctx.font = '600 48px Cinzel, serif';
  ctx.fillText('THE COURT IS SILENT', VIEW_W / 2, 240);
  ctx.font = 'italic 24px "Cormorant Garamond", serif';
  ctx.fillStyle = 'rgba(233,228,216,0.7)';
  const mins = Math.floor(game.time / 3600);
  const secs = Math.floor((game.time / 60) % 60);
  ctx.fillText('The Warden kneels. The Seraph gutters out. The deep belongs to the small once more.', VIEW_W / 2, 310);
  ctx.fillText('Time below — ' + mins + 'm ' + secs + 's    ·    Deaths — ' + game.deaths + '    ·    Geo — ' + player.geo, VIEW_W / 2, 370);
  if (game.endT > 240) {
    ctx.fillStyle = 'rgba(233,228,216,0.45)';
    ctx.fillText('press Z to return to the surface', VIEW_W / 2, 480);
    if (Input.hit('confirm')) {
      localStorage.removeItem('hollowmere_save');
      game.state = 'title';
      game.titleSel = 0;
      SND.setZone(0);
    }
  }
  ctx.globalAlpha = 1;
}

/* ==========================================================================
   SECTION 14 — SAVE / LOAD
   ========================================================================== */

function saveGame() {
  const data = {
    bench: player.sitBench ? player.sitBench.id : 'crossing',
    geo: player.geo,
    maxHp: player.maxHp,
    soulMax: player.soulMax,
    abilities: player.abilities,
    weapon: player.weapon,
    hasIllumina: !!player.hasIllumina,
    hasSeraph: !!player.hasSeraph,
    hasBound: !!player.hasBound,
    nailDmg: player.nailDmg,
    bossDead: game.bossDead,
    boss2Dead: !!game.boss2Dead,
    visited: game.visited,
    totemsUsed: totems.map(t => t.used),
    chestsOpened: chests.map(c => c.opened),
    deaths: game.deaths,
    time: game.time,
    relinks: pickups.map((p, i) => p.taken ? i : -1).filter(i => i >= 0),
  };
  try { localStorage.setItem('hollowmere_save', JSON.stringify(data)); } catch (e) {}
}

function loadSaveData() {
  try { return JSON.parse(localStorage.getItem('hollowmere_save')); } catch (e) { return null; }
}

/* ==========================================================================
   SECTION 15 — GAME FLOW & MAIN LOOP
   ========================================================================== */

function startNewGame() {
  buildWorldReset();
  game.state = 'play';
  game.fade = 1; game.fadeDir = -1;
  game.deaths = 0;
  game.time = 0;
  game.bossDead = false;
  game.boss2Dead = false;
  game.bossActive = false;
  game.gateClosed = false;
  game.gateRect = null;
  game.visited = new Array(7).fill(false);
  game.currentZone = 0;
  showMsg('Beneath the town, something pale still dreams...');
  SND.setZone(0);
}

function startContinue() {
  buildWorldReset();
  const d = loadSaveData();
  if (d) {
    player.geo = d.geo || 0;
    player.maxHp = d.maxHp || 5;
    player.hp = player.maxHp;
    player.soulMax = d.soulMax || 99;
    player.abilities = d.abilities || { dash: true, wings: false, claws: false };
    player.weapon = d.weapon || 'nail';
    player.hasIllumina = !!d.hasIllumina || d.weapon === 'illumina';
    player.hasSeraph = true;   // v1.6b: granted from the start (covers old saves)
    player.hasBound = true;    // v2.0: granted from the start (covers old saves)
    player.nailDmg = WEAPON_INFO[player.weapon] ? WEAPON_INFO[player.weapon].dmg : 1;
    game.bossDead = !!d.bossDead;
    game.boss2Dead = !!d.boss2Dead;
    game.visited = (d.visited && d.visited.length) ? d.visited.slice(0, 7) : [true];
    while (game.visited.length < 7) game.visited.push(false);
    game.deaths = d.deaths || 0;
    game.time = d.time || 0;
    if (d.totemsUsed) for (let i = 0; i < d.totemsUsed.length && i < totems.length; i++) totems[i].used = d.totemsUsed[i];
    if (d.chestsOpened) for (let i = 0; i < d.chestsOpened.length && i < chests.length; i++) {
      chests[i].opened = d.chestsOpened[i];
      if (chests[i].opened) chests[i].openT = 1;
    }
    if (d.relinks) for (const i of d.relinks) if (pickups[i]) pickups[i].taken = true;
    // v1.5: a fallen Warden has already unsealed the way east
    if (game.bossDead) carve(316, 94, 2, 11);
    placePlayerAtBench(d.bench || 'crossing');
    game.currentZone = zoneIndexAtPx(player.x);
    game.visited[game.currentZone] = true;
  }
  game.state = 'play';
  game.fade = 1; game.fadeDir = -1;
  SND.setZone(game.currentZone);
}

function buildWorldReset() {
  grid.fill(1);
  decor.length = 0;
  buildWorld();
  resetWorldEntities();
  player.maxHp = 5; player.hp = 5;
  player.soul = 0; player.soulMax = 99;
  player.geo = 0;
  player.abilities = { dash: true, wings: false, claws: false };
  player.weapon = 'nail';
  player.hasIllumina = false;
  player.hasSeraph = true;    // v1.6b: the OATH rests in the pack from the start
  player.hasBound = true;     // v2.0: BOUND rests beside it from the start
  player.boundOut = false;
  player.boundId = 0;
  player.nailDmg = 1;
  player.comboCount = 0;
  player.comboTimer = 0;
  player.skillCD = 0;
  player.skillBCD = 0;
  player.oathT = 0;
  player.oathId = 0;
  player.dead = false;
  player.sit = false;
  player.dropThru = 0;
  player.onPlank = false;
  placePlayerAtBench('crossing');
  cam.x = clamp(player.x - VIEW_W / 2, 0, GW * TILE - VIEW_W);
  cam.y = clamp(player.y - VIEW_H / 2, 0, GH * TILE - VIEW_H);
}

function updatePlay() {
  game.time++;
  SND.tickMusic();

  if (game.reading) {
    if (Input.anyKey) game.reading = null;
    return;
  }
  if (Input.hit('inv')) {
    game.invOpen = !game.invOpen;
    game.invHover = null;
    canvas.style.cursor = 'default';
    SND.select();
  }
  if (game.invOpen) { updateInventory(); return; }

  if (Input.hit('pause')) {
    game.state = 'pause';
    game.pauseSel = 0;
    SND.select();
    return;
  }
  if (Input.hit('mute')) {
    SND.setMuted(!SND.muted);
    showMsg(SND.muted ? 'sound sealed' : 'sound restored');
  }

  if (game.hitstop > 0) { game.hitstop--; return; }

  if (game.slowmo > 0) game.slowmo--;
  if (game.parryFlash > 0) game.parryFlash--;    // v1.6

  updatePlayer();
  if (!player.dead) {
    updateEnemies();
    updateBoss();
    updateProjectiles();
    updateGeos();
    updateHazards();     // v1.5: kiln geysers + sanctum curtains
  }
  updateParticles();
  updateBossFx();                                 // v1.6: boss slash arcs

  // sparkles rising from a just-opened Illumina chest (relic reveal)
  for (const c of chests) {
    if (c.opened && c.openT < 1 && game.frame % 3 === 0) {
      addP({
        x: c.x + c.w / 2 + rndr(-16, 16), y: c.y - rndr(4, 36),
        vx: rndr(-0.3, 0.3), vy: rndr(-1.4, -0.5),
        life: rndr(20, 36), size: rndr(2, 3), type: 'px',
        col: rndr(0, 1) > 0.66 ? '#ffffff' : (rndr(0, 1) > 0.5 ? '#fff4c0' : '#e2aef0'),
        drag: 0.97, grav: -0.005,
      });
    }
  }

  updateCamera();

  if (game.fadeDir === -1 && game.fade > 0) game.fade = Math.max(0, game.fade - 0.03);
  if (game.fadeDir === 1 && game.fade < 1) game.fade = Math.min(1, game.fade + 0.08);
  if (player.hazardFade === 0 && game.fade >= 1 && game.fadeDir === 1) game.fadeDir = -1;
}

function updatePause() {
  if (Input.hit('pause')) { game.state = 'play'; SND.select(); return; }
  if (Input.hit('down')) { game.pauseSel = (game.pauseSel + 1) % 3; SND.select(); }
  if (Input.hit('up')) { game.pauseSel = (game.pauseSel + 2) % 3; SND.select(); }
  if (Input.hit('confirm')) {
    SND.confirmS();
    if (game.pauseSel === 0) game.state = 'play';
    else if (game.pauseSel === 1) { game.returnToPause = true; game.state = 'controls'; }
    else {
      game.state = 'title';
      game.titleSel = 0;
    }
  }
}

function updateDeadState() {
  game.deadT++;
  if (game.deadT > 110 && (game.deadT > 320 || Input.hit('confirm'))) {
    player.dead = false;
    player.deadT = 0;
    player.hp = player.maxHp;
    player.soul = 0;
    player.vx = 0; player.vy = 0;
    player.invT = 60;
    player.x = player.respawnX;
    player.y = player.respawnY;
    player.lastSafeX = player.x;
    player.lastSafeY = player.y;
    if (game.gateRect) {
      carve(game.gateRect.x, game.gateRect.y, game.gateRect.w, game.gateRect.h);
      game.gateRect = null;
    }
    game.gateClosed = false;
    if (boss) {
      boss.hp = boss.maxhp;
      boss.phase = 1;
      boss.state = boss.kind === 'seraph' ? 'intro' : 'idle';
      boss.stateT = 0;
      boss.summoned = false;
      boss.stunT = 0;              // v1.6: clear any parry stun
      boss.parrySuccess = false;
      if (boss.kind === 'seraph') {
        boss.x = SERAPH_ARENA.spawnTx * TILE;
        boss.y = SERAPH_ARENA.floorRow * TILE - 420;
        boss.vulnT = 90;
        // v1.6: restart the stage cycle fresh
        boss.cycle = 'air';
        boss.airLeft = 5;
        boss.groundLeft = 5;
      } else {
        boss.x = WARDEN_ARENA.spawnTx * TILE;
        boss.y = WARDEN_ARENA.floorRow * TILE - 110;
        boss.vulnT = 60;
      }
      // clear every minion the fight summoned from either arena
      enemies = enemies.filter(e =>
        !((e.x > 244 * TILE && e.x < 316 * TILE) || (e.x > 578 * TILE && e.x < 657 * TILE)));
      projectiles = [];
    }
    game.bossActive = false;
    SND.setBoss(false);
    game.state = 'play';
    game.fade = 1; game.fadeDir = -1;
    game.deadT = 0;
  }
}

let acc = 0;
let lastT = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(100, now - lastT);
  lastT = now;

  while (acc >= STEP) {
    game.frame++;
    // Track hitstop BEFORE updatePlay runs so we know whether to preserve
    // input.  When hitstop is active the game logic is frozen, so we must
    // NOT clear the pressed-key buffer — otherwise a jump or attack pressed
    // during the freeze is silently eaten.
    const hitstopActive = (game.state === 'play' && game.hitstop > 0);
    switch (game.state) {
      case 'title': updateTitle(); break;
      case 'controls': updateControlsState(); break;
      case 'play': updatePlay(); break;
      case 'pause': updatePause(); break;
      case 'dead': updateDeadState(); break;
      case 'ending': break;
    }
    acc -= STEP;
    if (game.slowmo > 0) acc -= STEP * 0.65;
    // Only clear the per-frame input buffer when the game actually advanced.
    // If no fixed step ran this rAF (high-refresh monitors), keep the buffer
    // so the next step can still see the keypress.
    if (!hitstopActive) Input.clearFrame();
  }

  switch (game.state) {
    case 'title':
      renderTitle();
      break;
    case 'controls':
      renderControls();
      break;
    case 'play':
    case 'dead':
    case 'pause':
      renderWorld();
      drawHUD();
      if (game.invOpen) drawInventory();
      if (game.reading) drawReading();
      if (game.state === 'pause') renderPause();
      if (game.state === 'dead') renderDeathOverlay();
      if (game.fade > 0) {
        ctx.fillStyle = 'rgba(3,3,5,' + game.fade + ')';
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      }
      break;
    case 'ending':
      renderEnding();
      break;
  }
}

/* ==========================================================================
   SECTION 16 — BOOT
   ========================================================================== */

function boot() {
  buildKnightSprites();
  buildEnemySprites();
  buildBossSprites();
  buildTileAtlas();
  buildBackgrounds();
  buildProps();
  buildSlashSprites();   // PIXEL SLASH — bake the 21 slash frames
  buildWorld();
  resetWorldEntities();
  placePlayerAtBench('crossing');
  cam.x = clamp(player.x - VIEW_W / 2, 0, GW * TILE - VIEW_W);
  cam.y = clamp(player.y - VIEW_H / 2, 0, GH * TILE - VIEW_H);
  requestAnimationFrame(frame);
}

const bootEl = document.getElementById('boot');
function begin() {
  bootEl.style.opacity = '0';
  setTimeout(() => bootEl.remove(), 1300);
  AudioBoot.ensure();
  boot();
}
bootEl.addEventListener('click', begin);
window.addEventListener('keydown', function once(e) {
  if (bootEl.isConnected) { window.removeEventListener('keydown', once); begin(); }
});
</script>
