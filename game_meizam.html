<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake.io Arena Fullscreen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1b1e23;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #242830;
    }

    /* Floating UI Elements */
    .dashboard {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 15px;
      background: rgba(42, 46, 53, 0.85);
      padding: 12px 24px;
      border-radius: 12px;
      border: 2px solid rgba(58, 63, 71, 0.8);
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 10;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #a0a5b5;
      text-transform: uppercase;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffffff;
    }

    .leaderboard {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 220px;
      background: rgba(42, 46, 53, 0.85);
      padding: 15px;
      border-radius: 12px;
      border: 2px solid rgba(58, 63, 71, 0.8);
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 10;
    }

    .leaderboard h3 {
      font-size: 0.95rem;
      color: #4caf50;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-align: center;
      border-bottom: 1px solid #3a3f47;
      padding-bottom: 5px;
    }

    .leaderboard-list {
      list-style: none;
      font-size: 0.85rem;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: #d1d5db;
    }

    .leaderboard-item.player {
      color: #4caf50;
      font-weight: bold;
    }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(20, 22, 26, 0.6);
      padding: 8px 18px;
      border-radius: 20px;
      backdrop-filter: blur(3px);
      z-index: 10;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(20, 22, 26, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(6px);
      z-index: 20;
    }

    .overlay.hidden {
      display: none;
    }

    .overlay h2 {
      font-size: 3rem;
      color: #ff5252;
      margin-bottom: 10px;
    }

    .overlay p {
      color: #d1d5db;
      margin-bottom: 25px;
      font-size: 1.2rem;
    }

    .btn {
      background: linear-gradient(135deg, #4caf50, #2e7d32);
      border: none;
      color: #fff;
      padding: 14px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #66bb6a, #388e3c);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="stat-box">
      <span class="stat-label">Panjang</span>
      <span id="score" class="stat-value">10</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Tertinggi</span>
      <span id="highScore" class="stat-value">10</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Makan Bot</span>
      <span id="kills" class="stat-value">0</span>
    </div>
  </div>

  <div class="leaderboard">
    <h3>Peringkat Arena</h3>
    <ul id="leaderboardList" class="leaderboard-list"></ul>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="startScreen" class="overlay">
    <h2 style="color: #4caf50;">SNAKE.IO ARENA</h2>
    <p>Arahkan dengan WASD / Panah | Tahan Shift / Spasi untuk Boost</p>
    <button id="startBtn" class="btn">MAIN NOW</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h2>GAME OVER</h2>
    <p id="finalScoreText">Panjang Akhir: 0</p>
    <button id="restartBtn" class="btn">MAIN LAGI</button>
  </div>

  <div class="controls-hint">
    [WASD / Panah] Kemudi | [Shift / Spasi] Boost Kecepatan
  </div>

  <script>
    class SoundEngine {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }

      playEat() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playDead() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
    }

    class Food {
      constructor(x, y, radius, color, points) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        this.points = points;
        this.pulse = Math.random() * Math.PI;
      }

      draw(ctx) {
        this.pulse += 0.05;
        const currentRadius = this.radius + Math.sin(this.pulse) * 0.8;
        
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(1, currentRadius), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class Snake {
      constructor(x, y, color, name = 'Bot', isBot = false) {
        this.name = name;
        this.color = color;
        this.isBot = isBot;
        this.baseRadius = 9;
        this.radius = 9;
        this.speed = 3;
        this.angle = Math.random() * Math.PI * 2;
        this.targetAngle = this.angle;
        
        this.body = [];
        this.length = 15;
        
        for (let i = 0; i < this.length; i++) {
          this.body.push({ x: x - i * 3, y: y });
        }
      }

      update(targetAngle, isBoosting) {
        // Radius bertambah secara elastis seiring bertambah panjang (semakin besar)
        this.radius = this.baseRadius + Math.floor(this.length / 40);

        const currentSpeed = isBoosting && this.length > 10 ? this.speed * 1.7 : this.speed;

        if (isBoosting && this.length > 10 && Math.random() < 0.1) {
          this.length -= 0.15;
        }

        const head = this.body[0];
        
        // Pemulusan rotasi sudut berbelok (dinamis berdasarkan besar/radius tubuh)
        let diff = targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        
        const turnSpeed = Math.max(0.05, 0.18 - (this.radius * 0.002));
        this.angle += diff * turnSpeed;

        const newHead = {
          x: head.x + Math.cos(this.angle) * currentSpeed,
          y: head.y + Math.sin(this.angle) * currentSpeed
        };

        this.body.unshift(newHead);

        // Pertumbuhan panjang tubuh yang luwes
        while (this.body.length > Math.floor(this.length * 1.5)) {
          this.body.pop();
        }
      }

      draw(ctx) {
        const step = Math.max(1, Math.floor(this.radius / 3));

        // Gambar Tubuh Ular secara bertahap & halus
        for (let i = this.body.length - 1; i >= 0; i -= step) {
          const segment = this.body[i];
          const ratio = i / this.body.length;
          const currentRadius = this.radius * (1 - ratio * 0.25);

          ctx.save();
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(segment.x, segment.y, Math.max(2, currentRadius), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Gambar Mata di Kepala Ular
        const head = this.body[0];
        ctx.save();
        ctx.fillStyle = "#ffffff";
        
        const eyeOffset = this.radius * 0.5;
        const eyeRadius = Math.max(2.5, this.radius * 0.28);
        const pupilRadius = eyeRadius * 0.45;

        const eyeX1 = head.x + Math.cos(this.angle + 0.5) * eyeOffset;
        const eyeY1 = head.y + Math.sin(this.angle + 0.5) * eyeOffset;
        const eyeX2 = head.x + Math.cos(this.angle - 0.5) * eyeOffset;
        const eyeY2 = head.y + Math.sin(this.angle - 0.5) * eyeOffset;

        ctx.beginPath();
        ctx.arc(eyeX1, eyeY1, eyeRadius, 0, Math.PI * 2);
        ctx.arc(eyeX2, eyeY2, eyeRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(eyeX1, eyeY1, pupilRadius, 0, Math.PI * 2);
        ctx.arc(eyeX2, eyeY2, pupilRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class GameEngine {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        
        this.sound = new SoundEngine();
        this.foods = [];
        this.bots = [];
        this.player = null;

        this.keys = {};
        this.playerAngle = 0;
        this.isBoosting = false;

        this.score = 10;
        this.highScore = localStorage.getItem('snakeio_highscore') || 10;
        this.kills = 0;

        this.isRunning = false;
        this.colors = ['#ff9800', '#2196f3', '#e91e63', '#9c27b0', '#00bcd4', '#ffeb3b', '#ff5722'];
        this.botNames = ['Viper', 'Python', 'Cobra', 'Anaconda', 'Slayer', 'Shadow', 'Apex', 'Venom'];

        this.resizeCanvas();
        this.initUI();
        this.bindEvents();
      }

      resizeCanvas() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      initUI() {
        this.scoreEl = document.getElementById('score');
        this.highScoreEl = document.getElementById('highScore');
        this.killsEl = document.getElementById('kills');
        this.leaderboardListEl = document.getElementById('leaderboardList');
        this.startScreen = document.getElementById('startScreen');
        this.gameOverScreen = document.getElementById('gameOverScreen');
        this.finalScoreText = document.getElementById('finalScoreText');

        document.getElementById('startBtn').addEventListener('click', () => this.start());
        document.getElementById('restartBtn').addEventListener('click', () => this.start());
      }

      bindEvents() {
        window.addEventListener('resize', () => this.resizeCanvas());

        window.addEventListener('keydown', (e) => {
          this.keys[e.code] = true;
        });

        window.addEventListener('keyup', (e) => {
          this.keys[e.code] = false;
        });
      }

      handleInput() {
        let moveX = 0;
        let moveY = 0;

        if (this.keys['KeyW'] || this.keys['ArrowUp']) moveY -= 1;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) moveY += 1;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) moveX -= 1;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) moveX += 1;

        if (moveX !== 0 || moveY !== 0) {
          this.playerAngle = Math.atan2(moveY, moveX);
        }

        this.isBoosting = !!(this.keys['Space'] || this.keys['ShiftLeft'] || this.keys['ShiftRight']);
      }

      start() {
        this.player = new Snake(this.canvas.width / 2, this.canvas.height / 2, '#4caf50', 'Anda (Player)');
        this.foods = [];
        this.bots = [];
        this.kills = 0;
        this.score = 10;
        this.playerAngle = 0;

        // Spawn Makanan awal dalam jumlah besar
        const foodCount = Math.floor((this.canvas.width * this.canvas.height) / 7000);
        for (let i = 0; i < foodCount; i++) {
          this.spawnFood();
        }

        // Spawn Bot Ular
        for (let i = 0; i < 8; i++) {
          this.spawnBot();
        }

        this.startScreen.classList.add('hidden');
        this.gameOverScreen.classList.add('hidden');
        this.isRunning = true;

        requestAnimationFrame(() => this.loop());
      }

      spawnFood() {
        const x = Math.random() * this.canvas.width;
        const y = Math.random() * this.canvas.height;
        const radius = Math.random() * 2.5 + 3;
        const color = this.colors[Math.floor(Math.random() * this.colors.length)];
        this.foods.push(new Food(x, y, radius, color, 1));
      }

      spawnBot() {
        const x = Math.random() * this.canvas.width;
        const y = Math.random() * this.canvas.height;
        const color = this.colors[Math.floor(Math.random() * this.colors.length)];
        const name = this.botNames[Math.floor(Math.random() * this.botNames.length)];
        const bot = new Snake(x, y, color, name, true);
        
        // Membangun panjang acak awal bot
        bot.length = Math.floor(Math.random() * 25) + 12;
        bot.targetAngle = Math.random() * Math.PI * 2;
        this.bots.push(bot);
      }

      loop() {
        if (!this.isRunning) return;

        this.handleInput();
        this.update();
        this.draw();

        requestAnimationFrame(() => this.loop());
      }

      update() {
        // Update Player
        this.player.update(this.playerAngle, this.isBoosting);
        this.score = Math.floor(this.player.length);

        // Cek Batas Dinding Player
        const head = this.player.body[0];
        if (head.x < 0 || head.x > this.canvas.width || head.y < 0 || head.y > this.canvas.height) {
          this.gameOver();
          return;
        }

        // Update Bot AI
        this.bots.forEach(bot => {
          const bHead = bot.body[0];
          
          if (Math.random() < 0.02) {
            bot.targetAngle = Math.random() * Math.PI * 2;
          }

          // Pantulan Batas Dinding Bot
          if (bHead.x < 30 || bHead.x > this.canvas.width - 30 || bHead.y < 30 || bHead.y > this.canvas.height - 30) {
            bot.targetAngle = Math.atan2(this.canvas.height / 2 - bHead.y, this.canvas.width / 2 - bHead.x);
          }
          
          bot.update(bot.targetAngle, Math.random() < 0.05);
        });

        // Interaksi Makanan (Player & Bot)
        [this.player, ...this.bots].forEach(snake => {
          const sHead = snake.body[0];
          for (let i = this.foods.length - 1; i >= 0; i--) {
            const f = this.foods[i];
            const dist = Math.hypot(sHead.x - f.x, sHead.y - f.y);
            if (dist < snake.radius + f.radius) {
              snake.length += f.points * 0.45;
              if (snake === this.player) this.sound.playEat();
              this.foods.splice(i, 1);
              this.spawnFood();
            }
          }
        });

        // Tabrakan Player dengan Tubuh Bot
        for (let bot of this.bots) {
          for (let i = 0; i < bot.body.length; i += 2) {
            const seg = bot.body[i];
            const dist = Math.hypot(head.x - seg.x, head.y - seg.y);
            if (dist < this.player.radius + bot.radius * 0.8) {
              this.gameOver();
              return;
            }
          }
        }

        // Tabrakan Bot dengan Tubuh Player (Kills)
        for (let bIndex = this.bots.length - 1; bIndex >= 0; bIndex--) {
          const bot = this.bots[bIndex];
          const bHead = bot.body[0];
          let botDead = false;

          for (let i = 0; i < this.player.body.length; i += 2) {
            const seg = this.player.body[i];
            const dist = Math.hypot(bHead.x - seg.x, bHead.y - seg.y);
            if (dist < bot.radius + this.player.radius * 0.8) {
              botDead = true;
              break;
            }
          }

          if (botDead) {
            // Drop makanan besar dari bangkai Bot
            bot.body.forEach((seg, idx) => {
              if (idx % 2 === 0) {
                this.foods.push(new Food(seg.x, seg.y, Math.random() * 2 + 4, bot.color, 2));
              }
            });
            this.bots.splice(bIndex, 1);
            this.kills++;
            this.spawnBot();
          }
        }

        this.updateUI();
      }

      gameOver() {
        this.sound.playDead();
        this.isRunning = false;

        if (this.score > this.highScore) {
          this.highScore = this.score;
          localStorage.setItem('snakeio_highscore', this.highScore);
        }

        this.finalScoreText.textContent = `Panjang Akhir: ${this.score}`;
        this.gameOverScreen.classList.remove('hidden');
      }

      updateUI() {
        this.scoreEl.textContent = this.score;
        this.highScoreEl.textContent = this.highScore;
        this.killsEl.textContent = this.kills;

        // Update Leaderboard
        const allSnakes = [this.player, ...this.bots].filter(Boolean);
        allSnakes.sort((a, b) => b.length - a.length);

        this.leaderboardListEl.innerHTML = '';
        allSnakes.slice(0, 5).forEach((snake, idx) => {
          const li = document.createElement('li');
          li.className = `leaderboard-item ${snake === this.player ? 'player' : ''}`;
          li.innerHTML = `<span>#${idx + 1} ${snake.name}</span> <span>${Math.floor(snake.length)}</span>`;
          this.leaderboardListEl.appendChild(li);
        });
      }

      draw() {
        // Clear Background Grid
        this.ctx.fillStyle = '#242830';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        const tileSize = 50;
        this.ctx.fillStyle = '#20242b';
        for (let x = 0; x < this.canvas.width; x += tileSize) {
          for (let y = (Math.floor(x / tileSize)) % 2 === 0 ? 0 : tileSize; y < this.canvas.height; y += tileSize * 2) {
            this.ctx.fillRect(x, y, tileSize, tileSize);
          }
        }

        // Render Makanan
        this.foods.forEach(food => food.draw(this.ctx));

        // Render Bot Ular
        this.bots.forEach(bot => bot.draw(this.ctx));

        // Render Ular Player
        if (this.player) this.player.draw(this.ctx);
      }
    }

    /* INITIALIZATION */
    window.addEventListener('DOMContentLoaded', () => {
      new GameEngine();
    });
  </script>
</body>
</html>
