<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Anggota & Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 1px;
    }

    p.subtitle {
      color: #94a3b8;
      margin-bottom: 40px;
      text-align: center;
      font-size: 0.95rem;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      max-width: 1000px;
      width: 100%;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: #3b82f6;
      box-shadow: 0 15px 30px rgba(59, 130, 246, 0.25);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 16px;
      border: 3px solid #3b82f6;
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .card p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .btn-game {
      margin-top: auto;
      display: inline-block;
      width: 100%;
      padding: 10px 16px;
      background: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .btn-game:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <h1>SQUAD GAME KAMI</h1>
  <p class="subtitle">Pilih anggota di bawah untuk masuk ke game masing-masing</p>

  <div class="container">
    <!-- Anggota 1 -->
    <div class="card">
      <div class="avatar">🎮</div>
      <h3>Anggota 1</h3>
      <p>Player / Nickname</p>
      <!-- Ganti href di bawah dengan link game Anggota 1 -->
      <a href="https://example.com/game1" class="btn-game" target="_blank">Buka Game</a>
    </div>

    <!-- Anggota 2 -->
    <div class="card">
      <div class="avatar">🕹️</div>
      <h3>Anggota 2</h3>
      <p>Player / Nickname</p>
      <!-- Ganti href di bawah dengan link game Anggota 2 -->
      <a href="https://example.com/game2" class="btn-game" target="_blank">Buka Game</a>
    </div>

    <!-- Anggota 3 -->
    <div class="card">
      <div class="avatar">🎯</div>
      <h3>Anggota 3</h3>
      <p>Player / Nickname</p>
      <!-- Ganti href di bawah dengan link game Anggota 3 -->
      <a href="https://example.com/game3" class="btn-game" target="_blank">Buka Game</a>
    </div>

    <!-- Anggota 4 -->
    <div class="card">
      <div class="avatar">👾</div>
      <h3>Anggota 4</h3>
      <p>Player / Nickname</p>
      <!-- Ganti href di bawah dengan link game Anggota 4 -->
      <a href="https://example.com/game4" class="btn-game" target="_blank">Buka Game</a>
    </div>
  </div>

</body>
</html>
